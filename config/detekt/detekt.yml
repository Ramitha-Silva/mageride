# MageRide — detekt rule deltas (C011 kmp-module-scaffold).
#
# shared/kmp/build.gradle.kts sets `buildUponDefaultConfig = true`, so this file carries only
# what differs from detekt's shipped defaults. Every entry names why. Keep it that way: a
# copied-out full default config silently freezes the ruleset at the version it was copied
# from.
#
# `config.validation` is on, so an unknown key here fails the build rather than being ignored.
# When a wave-4a component needs a Compose-specific rule, add it here — this file is shared by
# every Gradle module that applies detekt.
#
# Test source-set names follow AGP 9's Kotlin-Multiplatform library plugin: `androidHostTest`
# (local JVM unit tests) and `androidDeviceTest` (instrumented), not the variant-era
# `androidUnitTest` / `androidInstrumentedTest`. The **application** modules (`apps/*-android`,
# C067/C076) are on `com.android.application`, which does have build variants, so their local
# unit tests are the conventional `src/test` — every test exclusion below names both spellings.

config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    # Matches .editorconfig `max_line_length = 120` and ktlint. Three tools, one number.
    maxLineLength: 120
  MagicNumber:
    # A test's whole job is to name a concrete value; forcing every one into a constant makes
    # the expectation harder to read, not easier. `src/test` is the AGP application-module
    # spelling of the same thing (C067) — that plugin has build variants, so its local unit
    # tests live in `src/test`, not `androidHostTest`.
    #
    # `ui/theme` is the D2' §0.2 token table transcribed. Every number in it is the spec's and
    # the property name IS the token name — `val Primary = Color(0xFFFF6D00)`. Hoisting each
    # hex to a `const` above the property it names would double the file and put the token one
    # line further from its value, which is the opposite of what this rule is for. C067.
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/iosTest/**'
      - '**/src/test/**'
      - '**/ui/theme/**'
    # An enum entry's argument is already named — by the entry. `NMEA_MQTT(4)` is the wire code
    # of a `SMALLINT CHECK (source BETWEEN 0 AND 4)` column (C006); hoisting it to a constant
    # would put the number one line further from the name it belongs to. C012.
    ignoreEnums: true

naming:
  FunctionNaming:
    # KMP factory functions read as the type they build — `platformInfo()`, `Settings()`.
    # detekt's default pattern rejects the capitalised form.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
    # Test names are sentences: `an_absent_field_and_an_explicit_null_mean_the_same_thing`.
    # No camelCase spelling of that is more readable in a failure report.
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/iosTest/**'
      - '**/src/test/**'

complexity:
  LongMethod:
    # A `@Composable` screen function IS the screen's layout tree — the wireframe's app bar,
    # its six controls and its CTA, in the order they are drawn. Splitting one at sixty lines
    # produces a `ScreenTop` and a `ScreenBottom` whose only relationship is that they used to
    # be adjacent, which is strictly harder to compare against `specs/wireframes/*.html` than
    # the whole screen in one place. Non-composable functions still obey the default. (C068)
    ignoreAnnotated: ['Composable']
  LongParameterList:
    # A wire DTO's constructor *is* the contract's field list — `RideDetail` has eighteen
    # properties because `ride.yaml#/components/schemas/RideDetail` has eighteen. Splitting one
    # to satisfy a threshold would stop it round-tripping against the contract, which is the
    # whole point of the type (C012).
    #
    # The same argument covers `data/api` (C013): a client function's parameter list *is* the
    # operation's parameter list — `estimateFare` takes six because `GET /v1/fare/estimate`
    # declares six query parameters, and `apiRequest` takes ten because that is every
    # cross-cutting convention D3' §0 applies to a request. Grouping them into invented holder
    # types would put a layer between the signature and the contract it has to match.
    # Everything else in `:shared` still obeys the default.
    #
    # `@Composable` is the third case (C068): a Compose component's parameter list is `value`,
    # `onValueChange`, `modifier` and one slot per optional piece of the control — `modifier`
    # alone is a convention every M3 component carries. Folding them into a holder type makes
    # the one control in the app that does not read like the M3 component it wraps.
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/data/models/**'
      - '**/data/api/**'
  LargeClass:
    # `ApiOperations` (C019) is 176 one-line rows because `backend/contracts` declares 176
    # operations — the fake backend needs a compile-time serializer per operation and commonTest
    # cannot read a YAML file, so the table is Kotlin. Splitting it by service would produce
    # sixteen files whose combined size is identical and whose join is a `+`. Same argument
    # LongParameterList and TooManyFunctions make below: the count is the contract's, not a
    # design choice. Test sources only — nothing in a main source set is exempt.
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/iosTest/**'
      - '**/src/test/**'
  TooManyFunctions:
    # A repository interface's function count IS the operation set of the table behind it:
    # `OutboxStore` declares thirteen because `mobile_db_schema.md` §1.4's write path needs
    # thirteen statements, and `GpsBufferStore` fifteen because §1.5 plus §4.3's three eviction
    # rules need fifteen. Splitting either into a reader and a writer would move the number
    # without removing a single query, and would put a seam between two halves of one table.
    # Same argument LongParameterList makes above for `data/models` and `data/api` (C018).
    #
    # Test sources are excluded outright: a test class's function count is its assertion count,
    # and merging two tests to get under a threshold is strictly worse than having two.
    excludes:
      - '**/db/**'
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/androidDeviceTest/**'
      - '**/iosTest/**'
      - '**/src/test/**'

exceptions:
  TooGenericExceptionCaught:
    # A shared client that is about to surface a D3' problem+details error to four apps has to
    # catch whatever the platform threw; the rule fires on the boundary, which is the one place
    # the broad catch is correct.
    excludes:
      - '**/commonTest/**'
      - '**/androidHostTest/**'
      - '**/src/test/**'
