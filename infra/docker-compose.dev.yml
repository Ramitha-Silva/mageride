# =====================================================================================
# MageRide — FULL dev stack (C009)
#
# D7' §3 "Docker Compose — Full Local Dev": the infrastructure from
# docker-compose.dev.slim.yml plus the five application containers of the canonical
# layout (D7' §2.1, lightweight-production-replica.md Containers 1, 6-9), with the API
# gateway in front of them.
#
#   docker compose -f infra/docker-compose.dev.yml config
#   bash infra/scripts/dev-up.sh full
#   bash infra/scripts/dev-down.sh full
#
# The infrastructure is `include`d rather than copied, so there is exactly one definition
# of Postgres, Redis, Redpanda, EMQX and MinIO and the two stacks cannot drift. Both files
# declare the same project (`mageride`), network and volumes, so the full stack is
# genuinely the slim stack plus applications — bringing it up over a running slim stack
# adds containers instead of starting a second database.
#
# --- NOT YET BUILDABLE ---------------------------------------------------------------
# Only `api-gateway` (C008) has a Dockerfile today. `app-services`, `hot-path`, `fanout`
# and `tcp-adapter` are Wave 2 components — this file is `docker compose config`-clean and
# is the contract those components build against, but `up` on the full stack does not
# succeed until they land. Each build below names the component that lands it, and
# `infra/scripts/dev-up.sh full` checks for the Dockerfiles and says which are missing
# rather than letting docker fail with a bare "cannot read dockerfile".
#
# Startup order (D7' §3): infra healthy -> `migrate` completes -> hot-path, app-services,
# fanout, tcp-adapter -> haproxy. Enforced by healthchecks and depends_on, never by sleeps.
# =====================================================================================

name: mageride

include:
  - path: docker-compose.dev.slim.yml

services:

  # -----------------------------------------------------------------------------------
  # NO `emqx:` BLOCK HERE, and there must not be one.
  #
  # This file used to carry `emqx: ports: !override` to take 8883/8084 off the broker so
  # HAProxy could own them on the host. **`include:` does not permit overriding an imported
  # service.** Docker Compose v2 rejects the whole file with
  #
  #     services.emqx conflicts with imported resource
  #
  # so `docker compose -f infra/docker-compose.dev.yml config` has been exiting 1 on every CI
  # runner — which took eight of slim-verify.sh's checks with it, including all five MQTT ACL
  # assertions, because they report "refused" when there is no broker to refuse them. It passed
  # on the build host only because Compose v5.3.1 relaxed that rule. Found in C124's CI repair.
  #
  # The clash is resolved where it belongs instead: HAProxy's MQTTS/WSS defaults below move
  # aside rather than the broker's, which is what `${VAR:-default}` on every published port is
  # for (infra/CLAUDE.md). The slim stack keeps 8883/8084 on the broker; nothing asserts either
  # number, every port here is loopback-only, and the replica (C125, its own file) still
  # publishes the real 8883 as the public edge.
  # -----------------------------------------------------------------------------------

  # -----------------------------------------------------------------------------------
  # Container 6 — hot-path: mqtt-bridge + position-processor + persistence-writer +
  # fleet-health in one process (T-01, T-05, T-06, D-18).
  # Lands with C038 / C039 / C040 / C044.
  #
  # No *published* port — nothing here is reached from the host. It does listen, though:
  # fleet-health-svc (C044) serves `GET /v1/fleets/{fleetId}/health` (US-3.13) and the
  # gateway's `fleet-health-svc` cluster points at `http://hot-path:5000/` over this
  # network, so the combined host has to expose Kestrel on 5000. The other three are
  # consumers only.
  # -----------------------------------------------------------------------------------
  hot-path:
    build:
      context: ..
      dockerfile: backend/src/HotPath/Dockerfile
    image: mageride/hot-path:dev
    env_file:
      - path: env/.env.common.example
        required: true
      - path: env/.env.common
        required: false
      - path: env/.env.app.example
        required: true
      - path: env/.env.app
        required: false
    environment:
      Mqtt__ServiceUsername: svc-mqtt-bridge
    depends_on:
      redpanda: { condition: service_healthy }
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
      emqx:     { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    mem_limit: 2g
    cpus: 1.0
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # Container 7 — app-services: the 22 domain services as class libraries in one process
  # (replica Container 7), plus provisioning-svc's embedded step-ca on the
  # `provisioning-ca-data` volume (T-02).
  # Lands with C026-C066. Reaches Postgres through PgBouncer, never :5432 directly.
  # -----------------------------------------------------------------------------------
  app-services:
    build:
      context: ..
      dockerfile: backend/src/AppServices/Dockerfile
    image: mageride/app-services:dev
    env_file:
      - path: env/.env.common.example
        required: true
      - path: env/.env.common
        required: false
      - path: env/.env.app.example
        required: true
      - path: env/.env.app
        required: false
    volumes:
      # C030: the device CA, in step-ca's layout. A bind mount rather than the named volume
      # this used to be, because the EMQX container has to read the same certs/ca_chain.crt
      # as its 8883 cacertfile and it is generated on the host by dev-up.sh — EMQX reads it
      # at listener start, long before this container exists.
      - ./deploy/device-ca:/var/step
    ports:
      - "127.0.0.1:${APP_SERVICES_PORT:-5100}:5000"
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis:     { condition: service_healthy }
      redpanda:  { condition: service_healthy }
      emqx:      { condition: service_healthy }
      migrate:   { condition: service_completed_successfully }
    healthcheck:
      # D7' §5.1: /health/ready pings DB + Redis + Kafka. 15 s interval, threshold 6.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/ready > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: 3g
    cpus: 1.5
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # api-gateway (C008) — the edge. D7' §5's Ingress names it as its own backend service;
  # the replica co-locates it in front of `app-services`, so all 20 HTTP clusters resolve
  # to that one container and `fanout-svc` resolves to the SignalR container.
  #
  # D7' §4.2 has no api-gateway row (C008 gap (d)); the topology lives here and the rest
  # of the gateway's settings are in env/.env.app.example.
  # -----------------------------------------------------------------------------------
  api-gateway:
    build:
      context: ..
      dockerfile: backend/src/ApiGateway/Dockerfile
    image: mageride/api-gateway:dev
    env_file:
      - path: env/.env.common.example
        required: true
      - path: env/.env.common
        required: false
      - path: env/.env.app.example
        required: true
      - path: env/.env.app
        required: false
    environment:
      # 22 domain clusters -> the co-located app-services process.
      ReverseProxy__Clusters__iam-svc__Destinations__primary__Address:          http://app-services:5000/
      ReverseProxy__Clusters__registry-svc__Destinations__primary__Address:     http://app-services:5000/
      # AL-58's payout plane (C133), added with the gateway cluster in C124's CI repair.
      ReverseProxy__Clusters__payout-svc__Destinations__primary__Address:       http://app-services:5000/
      ReverseProxy__Clusters__provisioning-svc__Destinations__primary__Address: http://app-services:5000/
      ReverseProxy__Clusters__query-svc__Destinations__primary__Address:        http://app-services:5000/
      ReverseProxy__Clusters__trip-state-svc__Destinations__primary__Address:   http://app-services:5000/
      ReverseProxy__Clusters__ride-svc__Destinations__primary__Address:         http://app-services:5000/
      ReverseProxy__Clusters__dispatch-svc__Destinations__primary__Address:     http://app-services:5000/
      ReverseProxy__Clusters__reputation-svc__Destinations__primary__Address:   http://app-services:5000/
      ReverseProxy__Clusters__fare-svc__Destinations__primary__Address:         http://app-services:5000/
      ReverseProxy__Clusters__wallet-svc__Destinations__primary__Address:       http://app-services:5000/
      ReverseProxy__Clusters__subscription-svc__Destinations__primary__Address: http://app-services:5000/
      ReverseProxy__Clusters__notification-svc__Destinations__primary__Address: http://app-services:5000/
      ReverseProxy__Clusters__safety-svc__Destinations__primary__Address:       http://app-services:5000/
      ReverseProxy__Clusters__support-svc__Destinations__primary__Address:      http://app-services:5000/
      ReverseProxy__Clusters__content-svc__Destinations__primary__Address:      http://app-services:5000/
      ReverseProxy__Clusters__transit-svc__Destinations__primary__Address:      http://app-services:5000/
      ReverseProxy__Clusters__fleet-svc__Destinations__primary__Address:        http://app-services:5000/
      # C060. fleet-billing-svc has a cluster of its own because two of its operations sit under
      # /v1/fleets, which fleet-svc otherwise owns; in this stack both processes are the same
      # container.
      ReverseProxy__Clusters__fleet-billing-svc__Destinations__primary__Address: http://app-services:5000/
      ReverseProxy__Clusters__voip-svc__Destinations__primary__Address:         http://app-services:5000/
      ReverseProxy__Clusters__admin-bff__Destinations__primary__Address:        http://app-services:5000/
      ReverseProxy__Clusters__public-bff__Destinations__primary__Address:       http://app-services:5000/
      # The 22nd is the SignalR container, on its own port.
      ReverseProxy__Clusters__fanout-svc__Destinations__primary__Address:       http://fanout:5001/
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5000}:5000"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/ready > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    cpus: 0.5
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # Container 8 — fanout: SignalR WebSocket fan-out, Redis backplane (R-06, D-23).
  # Lands with C041.
  # -----------------------------------------------------------------------------------
  fanout:
    build:
      context: ..
      dockerfile: backend/src/Fanout/Dockerfile
    image: mageride/fanout:dev
    env_file:
      - path: env/.env.common.example
        required: true
      - path: env/.env.common
        required: false
      - path: env/.env.app.example
        required: true
      - path: env/.env.app
        required: false
    environment:
      ASPNETCORE_URLS: http://+:5001
    ports:
      - "127.0.0.1:${FANOUT_PORT:-5001}:5001"
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      # D7' §5.1: fanout-svc, 10 s interval, threshold 6.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health/ready > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    mem_limit: 2g
    cpus: 1.0
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # Container 9 — tcp-adapter: GT06 / JT808 / H02 / NMEA-UDP (T-01, T-03, T-05, T-08).
  # Lands with C043. `runtime:10.0-alpine`, not `aspnet` — it has no HTTP surface, which
  # is why D7' §5.1 gives it a TCP-socket liveness probe instead of /health/live.
  #
  # 5023-5025 stay inside the network and are published by HAProxy. 5026/UDP is published
  # HERE because HAProxy has no UDP forwarder — see the header of infra/deploy/haproxy.cfg.
  # -----------------------------------------------------------------------------------
  tcp-adapter:
    build:
      context: ..
      dockerfile: backend/src/TcpAdapter/Dockerfile
    image: mageride/tcp-adapter:dev
    env_file:
      - path: env/.env.common.example
        required: true
      - path: env/.env.common
        required: false
      - path: env/.env.app.example
        required: true
      - path: env/.env.app
        required: false
    environment:
      # Bare name; the `svc-` prefix acl.conf grants `veh/#` to is added by the service
      # (MqttSessionTokenIssuer.IssueForService), so this must stay `tcp-adapter` unless
      # infra/scripts/slim-verify.sh changes with it.
      Adapter__ServiceName: tcp-adapter
      # provisioning-svc and trip-state-svc both live in app-services in this stack.
      Adapter__ProvisioningBaseUrl: http://app-services:5000
      Adapter__TripStateBaseUrl: http://app-services:5000
      # The PSK signing key provisioning-svc's embedded CA writes (D6' §4.2) —
      # secrets/psk_signing_key under the same directory that service gets as
      # StepCa:RootKeyPath.
      Adapter__PskKeyDirectory: /var/step
    volumes:
      # The same bind mount app-services and emqx use (C030): generated on the host by
      # dev-up.sh, so it exists before any container starts. Read-only here — the adapter
      # verifies a presented PSK token and never mints one.
      - ./deploy/device-ca:/var/step:ro
    ports:
      - "127.0.0.1:${ADAPTER_NMEA_UDP_PORT:-5026}:5026/udp"
    depends_on:
      emqx:  { condition: service_healthy }
      redis: { condition: service_healthy }
      # Δ C043: T-11 reads registry.vehicles.mode and the canonical sample carries the
      # vehicle's type, so this container has a read-only Postgres dependency D7' §2.1's
      # Container 9 row does not list. Recorded as a micro-change-set in the C043 handoff.
      postgres: { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    healthcheck:
      # D7' §5.1: "TCP socket on 5023", 10 s interval, threshold 5. The alpine runtime
      # image has busybox nc; -z is a connect-and-close probe.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5023"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # Container 1 — haproxy: the only public edge (D7' §2.1, replica Container 1).
  #
  # Host ports are bound to 127.0.0.1 in dev. The replica (C125) publishes the same set
  # on the public interface with a real certificate; that is the one difference.
  # -----------------------------------------------------------------------------------
  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Generated by infra/scripts/dev-up.sh; gitignored. HAProxy loads every PEM in the
      # directory, so an empty one makes it exit at boot.
      - ./deploy/certs:/usr/local/etc/haproxy/certs:ro
    ports:
      - "127.0.0.1:${HAPROXY_HTTPS_PORT:-443}:443"
      # 18883/18084, not 8883/8084: the broker publishes those in the slim file this one
      # includes, and two containers cannot bind one host port. See the note where the
      # `emqx:` override used to be. Set HAPROXY_MQTTS_PORT=8883 to put it back if the
      # broker's own publication is moved aside instead.
      - "127.0.0.1:${HAPROXY_MQTTS_PORT:-18883}:8883"
      - "127.0.0.1:${HAPROXY_MQTT_WSS_PORT:-18084}:8084"
      - "127.0.0.1:${HAPROXY_GT06_PORT:-5023}:5023"
      - "127.0.0.1:${HAPROXY_JT808_PORT:-5024}:5024"
      - "127.0.0.1:${HAPROXY_H02_PORT:-5025}:5025"
    depends_on:
      emqx: { condition: service_healthy }
    healthcheck:
      # `monitor-uri /healthz` on the internal stats frontend. The alpine image has
      # busybox wget.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8404/healthz > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m
    cpus: 0.25
    networks: [mr]
    restart: unless-stopped

  # -----------------------------------------------------------------------------------
  # Container 11 — the VoIP media plane (C055, D-24, D6' §6). Two containers, and the
  # split matters: `livekit` is the SFU that carries a call, `coturn` is the relay for the
  # handsets that cannot reach it directly.
  #
  # BOTH ARE ON HOST NETWORKING, and D6' §6 is why: "TURN media relay (coturn) on host UDP
  # range (3478 + 50000-50100), NOT via HAProxy/L7 (HAProxy cannot relay UDP)." An L7 proxy
  # has nothing to proxy here — the media is UDP to ports it has never heard of — and the
  # failure mode of getting this wrong is not a startup error. It is one-way audio, on the
  # subset of calls whose ICE happened to need a relay.
  #
  # What DOES go through the proxy is the signalling websocket alone (7880), which is
  # ordinary HTTP upgrade traffic. voip-svc itself is inside `app-services` and is reached
  # through the gateway like every other service.
  # -----------------------------------------------------------------------------------
  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # The HS256 signing key for every token voip-svc mints. `key: secret`, and it must
      # equal Voip__LiveKit__ApiKey / Voip__LiveKit__ApiSecret in env/.env.app.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-change-me}"
    # host, not the `mr` bridge: the RTC port range has to be reachable as itself. Publishing
    # 100 UDP ports through docker-proxy also costs a userland hop per packet on a media path.
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7880/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./deploy/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      # coturn cannot infer the address it tells peers to send to; a wrong one is silent
      # one-way audio rather than a failure. Set per deployment.
      DETECT_EXTERNAL_IP: "yes"
    # Same reason as livekit above, and the one D6' §6 states outright.
    network_mode: host
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

# -------------------------------------------------------------------------------------
# Optional containers, deliberately NOT declared here.
#
# D7' §3 ends with "# optional: voip (network_mode: host for UDP 50000-50100),
# admin-portal (3001), fleet-portal (3002), monitoring (9090/3000)" — a comment, not
# services, and every one of them belongs to a component that has not run yet:
#
#   admin-portal   C104  Next.js, Node 24-alpine, 3001, admin.mageride.lk   (AL-02)
#   fleet-portal   C111  Next.js, Node 24-alpine, 3002, fleet.mageride.lk   (AL-03)
#   nominatim      C056  8 GB — hosted on a SEPARATE VPS, never co-located (D-14)
#
# `monitoring` (9090 / 3000) LANDED as C119 and is deliberately not here either: it is
# `infra/observability/docker-compose.yml`, a file of its own on the same project and the
# same `mageride_mr` network. Separate because observability has to be able to come up
# against a running stack, against the lightweight production replica, or against nothing
# at all — a scrape target that is absent is a target that is DOWN, which is the correct
# reading and is what its `up` alerts fire on.
#
#   bash infra/scripts/observability-up.sh    ·    observability-down.sh [--volumes]
#
# Point a service at it with `Otel__Endpoint=http://otel-collector:4317` (D7' §4.1).
# **Take it down BEFORE this stack** — compose will not remove a network that still has
# endpoints attached.
#
# infra/deploy/haproxy.cfg already carries the admin./fleet. vhost backends and starts
# cleanly while they are absent, so adding a portal container needs no HAProxy change.
# -------------------------------------------------------------------------------------

# --- No top-level `volumes:` key here, and it must stay absent -------------------------
# C030 replaced the `provisioning-ca-data` named volume with a bind mount of
# infra/deploy/device-ca (gitignored): EMQX loads the same CA as its 8883 cacertfile and
# a named volume is not readable by the host script that has to create it first. See the
# app-services `volumes:` block above and infra/scripts/dev-up.sh. The five volumes this
# stack does use are declared in docker-compose.dev.slim.yml, which this file `include`s.
#
# The KEY was left here with only comments under it, which makes its YAML value `null`
# rather than a map. Docker Compose v5.3.1 then PANICS in the include loader
# (`importResource`: "interface conversion: interface {} is nil, not
# map[string]interface {}") — a hard crash, not a validation error, so
# `docker compose -f infra/docker-compose.dev.yml config` exited 2 and took eight of
# slim-verify.sh's checks down with it: the project-name comparison, wait-healthy, "emqx is
# healthy", and all five MQTT ACL assertions, which reported "refused" because there was no
# broker rather than because the ACL denied anything. Found in C124's CI repair; an older
# Compose tolerated the null and this one does not.
