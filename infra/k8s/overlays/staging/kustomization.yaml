# =====================================================================================
# staging — DigitalOcean Kubernetes (D7' §8's "Prod P1-P2" substrate, a smaller node pool).
#
# THE ONLY ENVIRONMENT A COMMIT REACHES WITHOUT A HUMAN. `.github/workflows/cd.yml` promotes
# every green commit on `main` into `overlays/staging/images/` and ArgoCD syncs it
# automatically (platform/argocd/applications/staging.yaml). Production is the same manifests
# with a manual sync and an environment approval.
#
# This is the overlay the C124 verify builds:
#   kubectl apply --dry-run=client -k infra/k8s/overlays/staging
#
# Same shape as production, deliberately: staging is only useful if the thing it proves is the
# thing that ships. The differences are the hostnames, the node pool's size and the fact that
# its data is disposable.
# =====================================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mageride

resources:
  - ../../base
  # The L4 edge. MQTT and the tracker protocols are not HTTP and never touch the Ingress.
  - loadbalancers.yaml

components:
  - images
  # D7' §8's launch topology — Patroni 1P+2R and a Redis Sentinel group, the same two
  # components production uses and in the same order. Staging runs them at a smaller size and
  # not at a smaller SHAPE: a failover drill against a single-instance staging would prove
  # nothing about production, and the Sentinel connection string is a platform-wide change
  # that has to be exercised somewhere before it is exercised on paying customers.
  - ../../components/retire-single-instance-data
  - ../../components/launch-topology

commonAnnotations:
  mageride.lk/environment: staging

patches:
  # --- storage class ---------------------------------------------------------------
  # DOKS's CSI. Named rather than left to the cluster default, because the default is
  # whatever the cluster was created with and a StatefulSet's
  # `volumeClaimTemplates[].storageClassName` is immutable after the first apply — the wrong
  # value here is a delete-and-restore, not an edit.
  # Selected by label, not by kind: tcp-adapter is a StatefulSet with NO volumeClaimTemplates
  # (it is one for stable identity, not for storage — see the catalog), and a JSON patch
  # against a path that does not exist fails the whole build.
  - target:
      kind: StatefulSet
      labelSelector: app.kubernetes.io/component=data
    patch: |
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: do-block-storage

  # --- the launch topology, at staging's size ---------------------------------------
  # The four D7' §8 rows that are only a number. These were production-only until C132 and
  # that made staging the wrong shape to prove anything with: a 1-node EMQX does not
  # distribute E-08's shared subscription, a 1-node Redpanda cannot have RF=3, and a failover
  # drill against either proves nothing about the cluster that ships. This overlay's own
  # header is the argument — "staging is only useful if the thing it proves is the thing that
  # ships". The SIZE stays smaller; the SHAPE does not.
  - target: { kind: StatefulSet, name: emqx }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
  - target: { kind: StatefulSet, name: redpanda }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Job, name: redpanda-topics }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "3"
      # Six partitions, as production: a consumer group cannot have more useful members than
      # partitions, so a staging run of the HPA against three would hit a ceiling production
      # does not have.
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "6"

  # Three Postgres members and three Redis members, because that is the shape under test.
  # A third of production's memory and half its disk, because what staging holds is a
  # synthetic dataset and a week of it.
  - target: { kind: StatefulSet, name: postgres }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: { cpu: 500m, memory: 3Gi }
      # 4 Gi and not less: `shared_buffers` is 1 GB and it is a cluster-wide DCS parameter,
      # so it is the same number here as in production. patroni.yml says which direction that
      # asymmetry was resolved in and why.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits
        value: { cpu: "1", memory: 4Gi }
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 40Gi

  # --- hostnames -------------------------------------------------------------------
  - target: { kind: Ingress, name: mr-ingress }
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging-dns
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.mageride.lk
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.mageride.lk
  - target: { kind: Ingress, name: mr-ingress-hubs }
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging-dns
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.staging.mageride.lk
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.mageride.lk
  - target: { kind: Ingress, name: mr-ingress-portals }
    patch: |
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging-dns
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.staging.mageride.lk
      - op: replace
        path: /spec/tls/1/hosts/0
        value: fleet.staging.mageride.lk
      - op: replace
        path: /spec/tls/2/hosts/0
        value: passenger.staging.mageride.lk
      - op: replace
        path: /spec/rules/0/host
        value: admin.staging.mageride.lk
      - op: replace
        path: /spec/rules/1/host
        value: fleet.staging.mageride.lk
      - op: replace
        path: /spec/rules/2/host
        value: passenger.staging.mageride.lk

  # --- configuration deltas --------------------------------------------------------
  - target: { kind: ConfigMap, name: common-config }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: common-config
      data:
        # Cloudflare R2 (D7' §8), virtual-hosted addressing. A SEPARATE bucket set from
        # production's — the same credentials against the same buckets would let a staging
        # test delete a real driver's identity document.
        Storage__S3__Endpoint: https://mageride-staging.r2.cloudflarestorage.com
        Storage__S3__ForcePathStyle: "false"
        Storage__S3__Region: auto
        Jwt__Issuer: https://iam.staging.mageride.lk
        # The OTLP collector, in its own namespace. C119 built the collector for the compose
        # stack; a Kubernetes deployment of it is not in these manifests, so this stays
        # EMPTY until one exists — an endpoint pointed at nothing makes every exporter retry
        # on a timeout, which shows up as start-up latency in services that have nothing to
        # do with telemetry. When it lands:
        #   Otel__Endpoint: http://otel-collector.observability.svc.cluster.local:4317
        Otel__Endpoint: ""
  - target: { kind: ConfigMap, name: portal-config }
    patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: portal-config
      data:
        NEXT_PUBLIC_API_BASE_URL: https://api.staging.mageride.lk
        NEXT_PUBLIC_HUB_URL: wss://api.staging.mageride.lk/hubs
