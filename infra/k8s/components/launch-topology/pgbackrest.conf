# =====================================================================================
# pgBackRest — continuous WAL archiving and the base backup (ADD §15, D7' §8's Backups row).
#
# Mounted at /etc/pgbackrest/pgbackrest.conf. The S3 KEY AND SECRET ARE NOT IN THIS FILE:
# pgBackRest reads every *.conf in /etc/pgbackrest/conf.d/, and `pgbackrest-s3` — an
# ExternalSecret, Vault -> ESO — is mounted there. This file is therefore safe to read,
# review and diff, which is the point of splitting it.
#
# ADD §15 asks for "pgBackRest continuous WAL -> S3, daily base backup, RPO 5 min, RTO 30 min".
# D7' §8 names Wasabi. The three settings that actually produce the RPO are:
#
#   archive_timeout = 60      (patroni.yml) a WAL segment is closed and pushed every minute
#                             even on an idle platform, so the worst case is 60 s of writes.
#   archive-async = y         the PUT happens off the COMMIT path, through the spool.
#   NO archive-push-queue-max — see below. This is the setting that decides whether a
#                             failing S3 costs you availability or costs you your RPO.
# =====================================================================================

[global]
repo1-type=s3
# Wasabi, Singapore — the same region as the DOKS cluster, chosen so a continuous
# archive-push is a same-region PUT rather than an intercontinental one.
#
# THE CONSEQUENCE, STATED RATHER THAN DISCOVERED: a repository in the region the cluster is in
# does not survive the loss of that region. ADD §14's "Region failure" row for P1-P2 is
# "Manual restore from backup" and §19 puts warm cross-region DR in Phase 3, so this is the
# phase's intended posture — but it is a posture, not an oversight. The remedy when it is
# wanted is `repo2-*` pointing at a second Wasabi region; pgBackRest pushes WAL to both and
# `--repo=2` restores from either. docs/runbooks/dr-restore.md §7.
repo1-s3-endpoint=s3.ap-southeast-1.wasabisys.com
repo1-s3-region=ap-southeast-1
repo1-s3-bucket=mageride-production-pgbackrest
repo1-s3-uri-style=path
repo1-path=/mageride

# Two full backups retained, and the WAL needed to recover from the older of them. That is
# ~48 h of point-in-time recovery on the nightly schedule below, which is the window in which
# a logical fault (a bad migration, a mistaken bulk update) is actually noticed. The nightly
# `pg_dump` D7' §8 names is the LONGER tail and is a different artefact with a different
# retention — infra/k8s/jobs/pg-dump-wasabi.yaml.
repo1-retention-full=2
repo1-retention-full-type=count
repo1-retention-archive=2
repo1-retention-archive-type=full

# Bundling and block incrementals. `telemetry.positions` is a Timescale hypertable of many
# small chunk files; without bundling, a base backup is hundreds of thousands of individual
# S3 PUTs, and Wasabi bills per request.
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3

# --- the archive path ------------------------------------------------------------------
archive-async=y
spool-path=/var/spool/pgbackrest
# Two processes, not more: this runs INSIDE the Postgres container, and archiving that
# competes with the postmaster for the pod's 2 vCPU limit turns a WAL burst into query latency.
process-max=2

# archive-push-queue-max IS DELIBERATELY UNSET, and this is the most consequential line in the
# file. When the queue maximum is exceeded pgBackRest DROPS the WAL segment and returns
# SUCCESS — archiving continues, Postgres is happy, and the backup silently stops being
# recoverable from that moment on. Unset, a persistently failing S3 makes pg_wal grow until
# the volume fills, which is an outage — loud, alertable long in advance
# (`PostgresWalVolumeFilling`), and recoverable with the data intact.
#
# An outage you can see beats an RPO you have lost and cannot see. If this is ever set,
# `PostgresWalArchiveFailing` stops being sufficient and the runbook has to change with it.

# --- backup behaviour -------------------------------------------------------------------
# Request an immediate checkpoint instead of waiting for the next scheduled one; on a platform
# with `checkpoint_completion_target = 0.9` the polite form can delay the backup by minutes.
start-fast=y
# A restore reuses whatever is already on the volume and copies only what differs. This is
# what makes a replica rebuild (create_replica_methods: pgbackrest) proportional to the
# divergence rather than to the database.
delta=y

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=info

[mageride]
pg1-path=/home/postgres/pgdata/data
pg1-port=5432
# The unix socket, so pgBackRest authenticates by peer as `postgres` and no password exists
# anywhere in the container's filesystem for it to read.
pg1-socket-path=/var/run/postgresql
pg1-user=postgres
