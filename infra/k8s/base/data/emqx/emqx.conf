# =====================================================================================
# EMQX 5.8 — MageRide Kubernetes broker configuration (C124).
#
# The Kubernetes counterpart of infra/deploy/emqx/emqx.conf. THE POLICY IS THE SAME FILE'S
# POLICY — same JWT authenticator shape, same `no_match = deny`, same three listeners, same
# D-17 rate limit, same sticky shared-subscription strategy — and acl.conf beside this one
# is a byte-for-byte copy of the dev file, which infra/scripts/k8s-verify.sh asserts with
# `cmp`. The topic tree is D6' §3.1 and does not depend on the substrate.
#
# What differs, and only this:
#
#   1. `node` and `cluster` are NOT here. EMQX_* env beats this file, and in Kubernetes the
#      node name has to be the pod's own address and discovery has to be DNS over the
#      headless Service — both are set in the StatefulSet, which is the only place that
#      knows them. Writing them here as well would be dead configuration that looks live.
#   2. The TLS material comes from mounted Secrets rather than from a generated dev
#      directory: /opt/emqx/etc/tls (server certificate) and /opt/emqx/etc/device-ca
#      (provisioning-svc's issuing chain, T-02).
#   3. The dashboard listener binds 18083 but no Service publishes it. `kubectl port-forward`
#      is the access path; an operator credential on the public edge is not.
#
# Precedence, from the stock header:
#     etc/base.hocon < data/configs/cluster.hocon < etc/emqx.conf < EMQX_* env
# So this file beats anything a previous run persisted through the dashboard, and the
# StatefulSet's env beats this file for the two things it owns.
# =====================================================================================

dashboard {
  listeners.http.bind = 18083
}

# -------------------------------------------------------------------------------------
# Authentication — MQTT session JWT (D6' §3.2, E-02, D-21)
#
# HMAC, and that is a finding rather than a choice. D-21 and the commented block in the dev
# file both describe an RS256/JWKS authenticator, and NOTHING IMPLEMENTS IT:
# MageRide.Shared.Mqtt.MqttSessionTokens signs with `SecurityAlgorithms.HmacSha256`, and no
# service serves an MQTT JWKS document. iam-svc mints the mobile session token and
# mqtt-bridge-svc / tcp-adapter / fanout-svc / fleet-health-svc each mint their own service
# token from the same shared secret — which is this secret. So it is a production
# credential: it lives in Vault, it is on the 90-day rotation, and rotating it touches the
# broker and five services at once (docs/runbooks/secret-rotation.md §4).
#
# The secret itself arrives as EMQX_AUTHENTICATION__1__SECRET from `emqx-auth`, which reads
# the SAME Vault property as every service's `Mqtt__SessionTokenSecret`. One value, two
# names: a broker validating a secret nobody mints with is a platform where no device can
# connect, and it is not detectable from either side alone.
#
# `verify_claims` is the binding D6' §3.1 asks for. The device connects with MQTT username =
# its vehicleId and presents the JWT as the password; EMQX refuses CONNECT unless the
# token's `vehicleId` claim equals that username, so acl.conf's `veh/${username}/*` rules
# are written against a claim the broker has verified rather than a self-asserted string.
# -------------------------------------------------------------------------------------
authentication = [
  {
    mechanism             = jwt
    from                  = password
    use_jwks              = false
    algorithm             = "hmac-based"
    secret                = "replace-me-via-EMQX_AUTHENTICATION__1__SECRET"
    secret_base64_encoded = false
    acl_claim_name          = "acl"
    verify_claims           = { vehicleId = "${username}" }
    disconnect_after_expire = true
  }
]

# -------------------------------------------------------------------------------------
# Authorization — topic ACL (D6' §3.1)
#
# `no_match = deny` is mandatory: EMQX's shipped default is allow, which would make every
# rule in acl.conf advisory. `deny_action = disconnect` rather than `ignore` because an
# MQTT 3.1.1 device gets no error code for a refused publish — silently dropping it would
# leave a misprovisioned tracker publishing into a void for its whole 90-day credential.
# -------------------------------------------------------------------------------------
authorization {
  no_match     = deny
  deny_action  = disconnect
  cache { enable = true, max_size = 1024, ttl = "1m" }
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/mageride-acl.conf" }
  ]
}

# -------------------------------------------------------------------------------------
# Listeners
#
#   1883  plain MQTT, in-cluster only — the ClusterIP Service. Never in a LoadBalancer.
#   8883  MQTTS for hardware trackers  — LoadBalancer, L4. NEVER through the Ingress or the
#         API gateway (infra/CLAUDE.md): there is nothing for an L7 proxy to proxy.
#   8084  MQTT over WSS for mobile     — LoadBalancer, L4, same reason.
#  18083  dashboard                    — no Service at all.
#
# `messages_rate = "5/s"` is D-17's per-vehicle publish ceiling. §3.3 specifies it as a
# rule-engine counter keyed on vehicleId; a listener limit is per-connection, and since a
# connection is authenticated as exactly one vehicleId the two agree for every case the
# broker can see. The rule-engine form additionally emits `mqtt.rate_violation` onto
# audit.events, which this cannot.
#
# --- AND IT IS NOT ON 1883, WHICH IS WHY THE PLATFORM CARRIED 5 MESSAGES A SECOND ------
# The reasoning above holds for a listener DEVICES connect to. It is false for this one, and
# it is more obviously false here than in the compose file: 1883 is the ClusterIP Service and
# `overlays/*/loadbalancers.yaml` publishes 8883 and 8084 and nothing else. What connects to
# 1883 is the PLATFORM — `Mqtt__Port: "1883"` in base/config/common-config.yaml is every
# service, including mqtt-bridge-svc holding E-08's shared subscription for the whole fleet.
#
# So a 5/s per-connection limit here enforced D-17 for nobody and capped the ENTIRE FLEET'S
# INGEST AT ONE VEHICLE'S PUBLISH RATE — the ~10 msg/s ceiling C129 measured against a
# 1,200 msg/s launch target, with nine of every ten positions discarded inside the broker and
# every publisher acknowledged. Measured against the deployed configuration, 24 vehicles ×
# 10 samples, with a plain subscriber and no bridge in the picture:
#
#                          messages_rate = "5/s"      messages_rate = "10000/s"
#     QoS 1, manual ack           3.6 msg/s                   913 msg/s
#     QoS 1, auto ack             5.0 msg/s                 1,005 msg/s
#     QoS 0                      89.4 msg/s                   700 msg/s
#
# The limiter is charged for QoS-1 DELIVERY, not only for inbound publishes — which is why
# C129's control subscriber (QoS 0, the one column it does not govern) exonerated the broker.
# infra/deploy/emqx/emqx.conf carries the same change and the same numbers.
#
# D-17 is unaffected and still enforced where devices are: 8883 and 8084 below.
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# The platform's own zone (C132, item 5a) — the QoS-1 delivery window mqtt-bridge-svc needs
#
# `max_inflight` is the number of unacknowledged QoS-1 messages EMQX will have in flight to
# ONE session, and a QoS-1 subscriber's throughput is exactly `max_inflight / ack-latency`.
# EMQX 5.8 defaults it to 32. mqtt-bridge-svc acknowledges only after Redpanda's delivery
# report (that ordering is E-08's whole guarantee and must not change), which measures at
# 8-31 ms — so 32 in flight is ~1,000 msg/s of theoretical headroom per replica and rather
# less in practice. 512 is C129 §1.5's second recommendation, and it is the lever that was
# left after the `messages_rate` cap came off 1883.
#
# ON A ZONE, NOT GLOBALLY, and the distinction is about the other 10,000 sessions: a window
# is a maximum rather than an allocation, so a device holding two pending commands still
# uses two slots — but `max_inflight` is also what bounds per-session memory under a burst,
# and there is no reason to widen it for handsets that subscribe to one low-volume command
# topic. The bridge is on 1883; devices are on 8883 and 8084 and keep EMQX's defaults.
#
# `max_mqueue_len` IS DELIBERATELY LEFT AT ITS DEFAULT (1000). It is tempting to raise the
# queue alongside the window, and it would be the wrong trade for telemetry: a bigger queue
# converts loss into LATENCY, and C129's 33.6 s p95 was exactly that — samples waiting
# behind a slow drain. A position that arrives thirty seconds late is not a position. If the
# queue still fills after this, that is a real capacity signal and it belongs in
# `delivery.dropped.queue_full` where `EmqxMessagesDropped` can page on it, not hidden as a
# slower live map.
#
# `retry_interval` is C129 §1.5's third recommendation. EMQX 5.8 defaults it to `infinity`,
# so an acknowledgement lost for any reason costs that inflight slot permanently and the
# ceiling decays over a session's life. A redelivery is safe here: position-processor-svc
# discards `seq <= watermark` (T-05/R-17), so a duplicate sample is absorbed by the same
# gate that absorbs a device's own replay.
# -------------------------------------------------------------------------------------
zones.services.mqtt {
  max_inflight   = 512
  retry_interval = 30s
}

listeners.tcp.default {
  bind          = "0.0.0.0:1883"
  zone          = services                    # the QoS-1 delivery window, above
  max_conn_rate = "500/s"                     # R-09 reconnect-storm control
  # A ceiling, but a FLEET-scale one — not D-17's per-vehicle 5/s. This listener carries the
  # platform, so a per-connection message limit on it is a per-fleet limit on ingest. 20,000/s
  # is above ADD §3.2's 15,000 msg/s burst budget, so it bounds a runaway service without ever
  # binding on legitimate traffic, and "every live listener carries a ceiling" stays true —
  # which is the property tests/Security/AntiSpoof/Mqtt/BrokerPolicyTests asserts, and the one
  # worth keeping if 1883 is ever exposed by mistake.
  messages_rate = "20000/s"
}

# --- Hardware-tracker zone — T-02 device mTLS ----------------------------------------
# `peer_cert_as_username = cn` makes the certificate's CN (the vehicleId) the MQTT
# username, so acl.conf confines the device to its own topics without a new rule — the
# certificate IS the topic grant. It is an `mqtt` setting rather than a listener field:
# EMQX 5.8 rejects it on `listeners.ssl.default` outright, and a zone is how a listener
# takes an `mqtt` override.
zones.trackers.mqtt {
  peer_cert_as_username = cn
}

listeners.ssl.default {
  bind          = "0.0.0.0:8883"
  max_conn_rate = "500/s"
  messages_rate = "5/s"
  zone          = trackers

  # The mutual TLS handshake IS the authentication on this listener, so the JWT chain is
  # switched off for it: a hardware tracker has no session token to present as a password,
  # and leaving the chain on refuses every device with CONNACK 5. Nothing is weakened —
  # `verify_peer` + `fail_if_no_peer_cert` mean a client that cannot produce a certificate
  # signed by the device CA never reaches this point.
  enable_authn  = false

  ssl_options {
    # provisioning-svc's issuing chain, from the `emqx-device-ca` Secret. EMQX reads this
    # when the LISTENER STARTS, so a missing chain does not degrade the listener — it stops
    # the broker booting. The chain is copied into Vault once after provisioning-svc's first
    # boot (docs/runbooks/deploy.md §5), which is the same bootstrap step as tcp-adapter's
    # PSK key and for the same reason: the CA volume is ReadWriteOnce.
    cacertfile = "/opt/emqx/etc/device-ca/ca_chain.crt"
    certfile   = "/opt/emqx/etc/tls/tls.crt"
    keyfile    = "/opt/emqx/etc/tls/tls.key"

    verify               = verify_peer
    fail_if_no_peer_cert = true

    # --- T-12 revocation ---------------------------------------------------------------
    # Turn this on together with `StepCa:CrlDistributionPoint`, never separately. EMQX
    # refuses a certificate whose CRL it cannot fetch, so a broker that starts before
    # provisioning-svc can serve /v1/internal/trackers/crl.pem refuses EVERY tracker — and
    # the broker usually starts first. Where both are set, a revoked certificate stops
    # completing a handshake within `crl_cache.refresh_interval`, which is what puts the
    # number on T-12's 60 s for the MQTT path.
    # enable_crl_check = true
  }
}

# crl_cache.refresh_interval = 60s

listeners.wss.default {
  bind          = "0.0.0.0:8084"
  max_conn_rate = "500/s"
  messages_rate = "5/s"
  websocket.mqtt_path = "/mqtt"
  ssl_options {
    certfile = "/opt/emqx/etc/tls/tls.crt"
    keyfile  = "/opt/emqx/etc/tls/tls.key"
    verify   = verify_none
  }
}

# Plaintext websocket stays off: only the WSS path is published, and an open plaintext
# websocket on the same broker is a bypass of it.
listeners.ws.default { enable = false }

# -------------------------------------------------------------------------------------
# Sessions
# -------------------------------------------------------------------------------------
mqtt {
  session_expiry_interval = 2h                # persistent sessions across a tunnel drop
  max_qos_allowed         = 1                 # D6' §3.1 — every topic in the tree is QoS 1
  retain_available        = true              # veh/{vehicleId}/status LWT is retained (T-04)

  # E-08 + per-vehicle ordering (C038). EMQX 5.8 defaults to `round_robin`, which picks the
  # next member of the group for EVERY message: two mqtt-bridge replicas then take a
  # vehicle's samples alternately and race each other to `telemetry.raw`, so "each message
  # to exactly one replica" still holds but the per-vehicle ordering ADD §7.3 promises end
  # to end does not. `sticky` binds a publishing session to one member until that member
  # goes away, so one vehicle's stream reaches one bridge replica in order.
  #
  # This matters MORE here than in compose: the HPA on mqtt-bridge-svc means the group
  # membership changes on its own.
  shared_subscription_strategy = sticky
}
