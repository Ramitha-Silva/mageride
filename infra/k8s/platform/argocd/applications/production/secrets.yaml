# =====================================================================================
# production: the credentials, as their own Application at app-of-apps wave 0.
#
# FIRST, and the ordering is not a nicety. A Deployment that `envFrom`s a Secret which does not
# exist yet does not start with an empty credential — kubelet holds the container in
# `CreateContainerConfigError` and retries. So a workload sync that raced the secrets sync
# would look like a stuck rollout with no useful message, on a first deploy, when nobody yet
# knows what normal looks like. Modelling the secrets as a separate Application at a lower wave
# is how "the credentials converge first" is expressed to ArgoCD.
#
# It also keeps the custom resources OUT of infra/k8s/overlays/, which is what lets the C124
# verify (`kubectl apply --dry-run=client -k infra/k8s/overlays/production`) run against a cluster
# that has never had the External Secrets Operator installed.
# =====================================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mageride-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    # Deleting this Application deletes the ExternalSecrets it owns, in order, rather than
    # orphaning them. The Secrets themselves survive: every ExternalSecret sets
    # `deletionPolicy: Retain`, so a mistaken `argocd app delete` does not take the running
    # pods' credentials with it.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mageride
  source:
    repoURL: https://github.com/Ramitha-Silva/mageride.git
    targetRevision: main
    path: infra/k8s/platform/external-secrets/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: mageride
  syncPolicy:
    automated:
      prune: true
      # selfHeal on the secrets Application means a hand-edited Secret is put back. That is
      # the point of Vault being the source of truth: an incident fix applied with
      # `kubectl edit secret` is invisible, survives nothing, and diverges the environments.
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # ESO writes `status` on the ExternalSecret and stamps the Secret it created; neither is
    # desired state, and diffing them makes every Application permanently OutOfSync.
    - group: external-secrets.io
      kind: ExternalSecret
      jsonPointers:
        - /status
  revisionHistoryLimit: 10
