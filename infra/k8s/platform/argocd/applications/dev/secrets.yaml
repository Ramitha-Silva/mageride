# =====================================================================================
# dev: the credentials, as SealedSecrets — D7' §13's "sealed-secrets at K3s/MVP".
#
# The one place the three environments genuinely differ. staging and production sync
# ExternalSecrets and let the operator pull from Vault; a single-node K3s cluster that exists to
# prove the manifests should not need a Vault server, a Kubernetes auth mount and a per-cluster
# policy in order to come up. So its credentials are asymmetric ciphertext committed to this
# repository, which only the sealing key inside that cluster can open.
#
# `infra/k8s/platform/sealed-secrets/dev/` is EMPTY until somebody runs `seal.sh` — the
# ciphertext cannot exist before the cluster whose key it is encrypted to. An Application over
# an empty kustomization is Synced and Healthy with zero resources, which is the honest state:
# the wiring is in place and the values have not been provided yet. The pods then wait in
# `CreateContainerConfigError`, which is the correct failure — a pod that started with empty
# credentials would look healthy and answer 401 to everything.
#
# Still wave 0 and still `selfHeal`, for the same reasons as the other two: the credentials have
# to converge before the workloads, and a hand-edited Secret has to be put back.
# =====================================================================================
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mageride-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: mageride
  source:
    repoURL: https://github.com/Ramitha-Silva/mageride.git
    targetRevision: main
    path: infra/k8s/platform/sealed-secrets/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: mageride
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Empty IS the expected state before the first `seal.sh` run, so an empty manifest set
      # must not be refused here — unlike production, where it can only mean a bad revision.
      allowEmpty: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # The controller writes the decrypted Secret's ownership and a `status` block onto the
    # SealedSecret. Neither is desired state.
    - group: bitnami.com
      kind: SealedSecret
      jsonPointers:
        - /status
  revisionHistoryLimit: 10
