# =====================================================================================
# The Vault -> Kubernetes bridge for PRODUCTION (D7' §13: "K8s External Secrets Operator syncs
# Vault -> K8s Secret").
#
# ONE ClusterSecretStore per cluster, always named `mageride-vault`, and the per-environment
# difference is the KV MOUNT it points at. That is what lets every ExternalSecret under
# ../../base be byte-identical across environments — `remoteRef.key: ride-svc` means
# `mageride-production/ride-svc` here and `mageride-production/ride-svc` there, with no
# environment name anywhere in the manifests and therefore no way to point production at
# production's credentials by copying a file.
#
# --- Authentication: Kubernetes auth, not a token -------------------------------------
# `VAULT_TOKEN` appears in D7' §13's CI/CD list and is right for a pipeline. It is wrong for a
# cluster: a token in a Secret has to be created by somebody, rotated by somebody, and is a
# bearer credential for the whole Vault mount if it leaks. Kubernetes auth instead has ESO
# present its own ServiceAccount's projected token; Vault verifies it with the cluster's own
# TokenReview API and issues a short-lived lease bound to that identity. Nothing to rotate and
# nothing to leak, and the audit trail in Vault names the ServiceAccount.
#
# The role (`mageride-production`) is bound in Vault to this ServiceAccount in this namespace, and
# its policy grants READ on this mount only — so the staging cluster's role cannot read this
# mount, which is the property that makes one Vault server acceptable for both environments.
#
# This is the mount that holds real passenger-facing credentials: the OnePay merchant key, the
# ComBank IPG webhook secret, the FCM service account, the RS256 signing key every token in the
# platform is validated against. `SYNTHETIC DATA ONLY` applies to the replica (C125); it does
# not apply here, and nothing in staging should ever be pointed at this mount to "test the real
# thing".
# =====================================================================================
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: mageride-vault
spec:
  provider:
    vault:
      server: https://vault.mageride.lk
      # The KV v2 mount for this environment. `path` is the mount, not a prefix inside it —
      # ESO adds the `data/` segment KV v2 needs.
      path: mageride-production
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-production
          role: mageride-production
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
