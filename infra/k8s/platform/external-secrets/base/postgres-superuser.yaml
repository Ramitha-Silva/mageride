# =====================================================================================
# `postgres-superuser` — the raw password, for the two workloads that need it as a password
# rather than as a DSN: the Postgres container's own `POSTGRES_PASSWORD` and PgBouncer's
# `DB_PASSWORD`.
#
# Reads the SAME Vault property `common-secret` renders its DSNs from. That is the whole
# reason this is a separate ExternalSecret and not a second copy of the value: rotate
# `common/postgres_superuser_password` and all three — the server, the pooler and every
# service's connection string — follow from one write.
#
# --- Why the superuser at all ---------------------------------------------------------
# Migration 1804 needs CREATEROLE and `COMMENT ON ROLE` needs superuser, so the migration
# runner cannot be de-privileged without splitting that script out (C006 handoff). The
# services then inherit it, which is more privilege than any of them uses.
#
# THAT INHERITANCE IS C127-01, A HIGH FINDING, AND IT IS STILL OPEN. `audit.events` is
# mutable by the credential that appends to it and every RLS policy is inert under a
# superuser. Migration 2001 has already created `mageride_app`, `mageride_migrate` and
# `mageride_readonly` as NOLOGIN group roles; what is left is a deployment-time cutover —
# a login role per environment, its password in Vault, `Username=mageride_app` in
# `common-secret`'s template, and PgBouncer's `AUTH_USER`. The procedure is
# docs/runbooks/database-roles.md §3 and it is item 4 of docs/production/go-live-checklist.md,
# due BEFORE THE FIRST PRODUCTION WRITE. It is not performed here because a half-applied
# credential change is how a platform ends up with half its services unable to connect, and
# there is no production cluster to apply it to yet.
#
# --- The two roles Patroni creates at bootstrap ----------------------------------------
# `replicator` streams WAL to the replicas; `rewind` is what lets a demoted primary rejoin
# with pg_rewind instead of a full basebackup. Both are Patroni's own
# (PATRONI_REPLICATION_*/PATRONI_REWIND_*), both are created when the cluster is initialised,
# and both live here rather than in Vault under another name because rotating them is the
# same operation as rotating the superuser: write Vault, roll the StatefulSet.
# =====================================================================================
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-superuser
  labels:
    app: postgres
    app.kubernetes.io/name: postgres-superuser
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: mageride
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mageride-vault
    kind: ClusterSecretStore
  target:
    name: postgres-superuser
    creationPolicy: Owner
    # Retain matters more here than anywhere else: this Secret is what the Postgres container
    # reads on boot. Losing it while the volume still holds a database initialised with the
    # old password is a StatefulSet that cannot start and a `pg_hba` reset to recover from.
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef: { key: common, property: postgres_superuser_password }
    - secretKey: replication-password
      remoteRef: { key: common, property: postgres_replication_password }
    - secretKey: rewind-password
      remoteRef: { key: common, property: postgres_rewind_password }
