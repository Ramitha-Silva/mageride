# =====================================================================================
# `common-secret` — the credentials every service reads (D7' §4.1's Secret column, plus the
# object-store keys and the MQTT session secret).
#
# --- THE DSNs ARE ASSEMBLED HERE, NOT STORED IN VAULT ---------------------------------
# Vault holds ONE value: the Postgres password. The two connection strings are rendered from
# it by ESO's template engine. That is deliberate on three counts:
#
#   1. One credential, one place. A stored DSN plus a stored password is the same secret
#      twice, and a rotation that updates one of them leaves a platform where half the
#      services can connect.
#   2. The host, port, pool size and pooling mode stay IN THE MANIFEST, where they are
#      reviewable. `Maximum Pool Size=20` through PgBouncer and `=5` on the direct
#      connection is a capacity decision (500 client connections onto 25 server
#      connections); buried inside a Vault string, nobody would ever see it again.
#   3. `PostgresDirect` bypasses PgBouncer on purpose — E-09's outbox LISTEN is
#      session-scoped and transaction pooling drops it at COMMIT (C002). Two DSNs that
#      differ in exactly one hostname and one pool size are much easier to keep correct
#      side by side than as two opaque strings.
#
# `engineVersion: v2` is the Go template engine; `{{ .pgPassword }}` refers to a key fetched
# in `data` below. A fetched key that is not referenced by the template is DROPPED from the
# rendered Secret, which is why every one of them appears in `template.data`.
# =====================================================================================
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: common-secret
  labels:
    app.kubernetes.io/name: common-secret
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: mageride
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mageride-vault
    kind: ClusterSecretStore
  target:
    name: common-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ConnectionStrings__Postgres: >-
          Host=pgbouncer;Port=6432;Database=mageride;Username=postgres;Password={{ .pgPassword }};Pooling=true;Maximum Pool Size=20
        ConnectionStrings__PostgresDirect: >-
          Host=postgres;Port=5432;Database=mageride;Username=postgres;Password={{ .pgPassword }};Pooling=true;Maximum Pool Size=5
        Storage__S3__AccessKey: "{{ .s3AccessKey }}"
        Storage__S3__SecretKey: "{{ .s3SecretKey }}"
        # The broker validates the same value as `emqx-auth`'s `session_token_secret`. See the
        # note on `commonSecrets` in service-catalog.yaml: the RS256/JWKS form D-21 describes
        # is not implemented, so this is a production credential rather than a dev shortcut.
        Mqtt__SessionTokenSecret: "{{ .mqttSessionTokenSecret }}"
  data:
    - secretKey: pgPassword
      remoteRef: { key: common, property: postgres_superuser_password }
    - secretKey: s3AccessKey
      remoteRef: { key: common, property: s3_access_key }
    - secretKey: s3SecretKey
      remoteRef: { key: common, property: s3_secret_key }
    - secretKey: mqttSessionTokenSecret
      remoteRef: { key: common, property: mqtt_session_token_secret }
