  # fare-svc holds it, ride-svc verifies with it. Both resolve to fare-svc's property so a
  # rotation cannot land on one side only.
  Fare__EstimateTokenKey: { path: fare-svc, property: Fare__EstimateTokenKey }

# Every service reads these, so they are one ExternalSecret (`common-secret`) rather than a
# copy per service. Hand-written: platform/external-secrets/base/common-secret.yaml.
commonSecrets:
  - ConnectionStrings__Postgres
  - ConnectionStrings__PostgresDirect
  - Storage__S3__AccessKey
  - Storage__S3__SecretKey
  # PRODUCTION NEEDS THIS, and infra/CLAUDE.md says it should not.
  #
  # "The replica and production use JWKS instead (D-21)" is the intent, and the RS256/JWKS
  # authenticator is written out — commented — in infra/deploy/emqx/emqx.conf. But nothing
  # implements it: MageRide.Shared.Mqtt.MqttSessionTokens signs with
  # `SecurityAlgorithms.HmacSha256` and no service serves an MQTT JWKS document. iam-svc
  # mints the mobile session token and mqtt-bridge-svc, tcp-adapter, fanout-svc and
  # fleet-health-svc each mint their own service token from the SAME shared secret, which is
  # also what the broker validates with. So it is a production credential today, it is held
  # in Vault, it is on the 90-day rotation, and rotating it is the one procedure that touches
  # the broker and five services at once (docs/runbooks/secret-rotation.md §4). Raised as a
  # gap in the C124 handoff; closing it is a code change, not a manifest change.
  - Mqtt__SessionTokenSecret

# =====================================================================================
# Secret-shaped keys in infra/env/*.example that are DELIBERATELY not wired.
#
# infra/scripts/k8s-verify.sh reads both env templates, and every credential in them must
# be either granted to a service above or listed here with a reason. A secret that is
# simply forgotten is the failure mode this list exists to prevent — the symptom of a
# missing internal key is a 401 or a 404 in one direction of one call, which is exactly the
# kind of thing that reaches production.
# =====================================================================================
unwiredSecrets:
  Subscription__OnepayWebhookSecret: >-
    AL-59 removed OnePay from Mode B — it would have landed subscriber money in MageRide's
    account. subscription.yaml no longer declares the route and subscription-svc still
    serves it (C118 drift finding 12); giving it a live secret would arm a payment rail the
    platform decided not to have. The route is what needs deleting, not the secret wiring.
  Gemini__ApiKey: >-
    C009's §4.2-verbatim spelling, superseded by `Ocr__Gemini__ApiKey` when C054 landed the
    options class. Nothing binds it.
  LiveKit__ApiKey: >-
    Same: superseded by `Voip__LiveKit__ApiKey` (C055). Nothing binds it.
  LiveKit__Secret: >-
    Same: superseded by `Voip__LiveKit__ApiSecret` (C055). Nothing binds it.
