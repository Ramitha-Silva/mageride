# =====================================================================================
# MageRide — coturn TURN/STUN configuration (C055, D-24, D6' §6)
#
# Mounted at /etc/coturn/turnserver.conf in the `coturn` container.
#
# WHY THIS IS A SEPARATE CONTAINER ON HOST NETWORKING, and the one line of D6' §6 that
# decides it:
#
#   "TURN media relay (coturn) on host UDP range (3478 + 50000-50100), NOT via HAProxy/L7
#    (HAProxy cannot relay UDP)."
#
# A TURN relay allocates a fresh UDP port per candidate and tells the peer to send to it.
# An L7 proxy in front of that has nothing to proxy: HAProxy terminates TCP, and the
# relayed media is UDP to a port HAProxy has never heard of. So coturn publishes on the
# host and the reverse proxy carries the SIGNALLING websocket only.
#
# TURN is not the common path — most calls connect peer-to-peer or through the SFU
# directly. It is the path for the handsets behind a symmetric NAT, which on Sri Lankan
# mobile carriers is a large minority of them, and a call that cannot relay is a call that
# rings and then has no audio.
# =====================================================================================

listening-port=3478
# TLS on 5349 for networks that block plain STUN/TURN. The certificate is the platform's,
# mounted from infra/deploy/certs.
tls-listening-port=5349

# The relay port range. Must match `rtc.port_range_start`/`end` in livekit.yaml and must be
# published on the host — see the header.
min-port=50000
max-port=50100

# The address peers are told to send relayed media to. Set per environment
# (EXTERNAL_IP in compose, the node's external address in DOKS); coturn cannot infer it
# behind NAT and a wrong value here is silent one-way audio.
# external-ip=<set by the deployment>

# ---- credentials --------------------------------------------------------------------
# Long-term credentials with a shared secret, so a TURN username is a timestamp signed by
# the platform rather than an account. LiveKit mints them; nothing is stored here and there
# are no static users.
use-auth-secret
# static-auth-secret is supplied by the environment (TURN_SECRET), never written into this
# file — it is a credential for the platform's own media relay.
realm=voip.mageride.lk

# ---- what this relay refuses --------------------------------------------------------
# A TURN server with no denied peers is an open proxy into whatever network it sits in: an
# allocation can be pointed at 127.0.0.1 or at a private range and used to reach the
# cluster's own services from the outside. These are the ranges a media relay never has a
# legitimate reason to send to.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No CLI and no admin web page. Both are credentialled surfaces on a container that is, by
# design, reachable from the public internet on a wide UDP range.
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# One relayed voice call is ~64 kbps each way. The quota is a guard against an allocation
# being used as a general-purpose tunnel, not a capacity plan.
user-quota=12
total-quota=1200
max-bps=128000

# Voice is small and constant; a relay that logs every allocation at verbose level on a
# 500-call target writes more than the calls themselves.
simple-log
log-file=stdout
no-stdout-log=false
