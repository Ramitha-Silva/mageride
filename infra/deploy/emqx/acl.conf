%%-------------------------------------------------------------------------------------
%% MageRide MQTT topic ACL — D6' §3.1 topic tree, ADD §7.2/§7.7
%%
%% Mounted at /opt/emqx/etc/mageride-acl.conf and named by
%% `authorization.sources[].path` in emqx.conf. Erlang-term format, one rule per line,
%% each terminated by a dot. Rules are evaluated top to bottom and the first match wins,
%% so the two catch-alls must stay last.
%%
%% Identity model: MQTT username = the principal.
%%   * a device connects as its vehicleId, and emqx.conf's `verify_claims` refuses the
%%     CONNECT unless the session JWT's vehicleId claim equals it — so ${username} below
%%     is always a claim the broker has verified, not a self-asserted string;
%%   * a platform component connects as `svc-<name>` (mqtt-bridge, tcp-adapter).
%%
%% D6' §3.1:
%%   veh/{vehicleId}/pos/live     device -> broker  QoS1 retain-last   device PUB own only
%%   veh/{vehicleId}/pos/replay   device -> broker  QoS1               device PUB own; rate-limited
%%   veh/{vehicleId}/cmd          broker -> device  QoS1               device SUB own only
%%   veh/{vehicleId}/status       broker (LWT)      QoS1 retained      system
%%   fleet/{operatorId}/+/pos/live broker -> consumer                  operator-scoped SUB
%%   sys/diag/{vehicleId}         device -> broker  QoS0               device PUB own
%%-------------------------------------------------------------------------------------

%% --- Platform components (E-08 shared subscriptions, T-04 LWT emulation) --------------
%% mqtt-bridge-svc consumes $share/posGroup/veh/+/pos/live; tcp-adapter publishes on
%% behalf of hardware trackers that speak GT06/JT808/H02/NMEA rather than MQTT, and
%% publishes the retained status=offline that emulates LWT on socket half-close (T-04).
{allow, {username, {re, "^svc-"}}, all, ["veh/#", "fleet/#", "sys/#", "$share/#"]}.

%% --- Devices: publish only under their own vehicleId ----------------------------------
%% `status` is included because an MQTT last-will is authorised against the connecting
%% client at CONNECT time: without it EMQX refuses the CONNECT of every device that sets
%% the LWT R-15/T-04 depend on. The broker is still the only thing that publishes it.
{allow, all, publish, ["veh/${username}/pos/live",
                       "veh/${username}/pos/replay",
                       "veh/${username}/status",
                       "sys/diag/${username}"]}.

%% --- Devices: subscribe only to their own downlink command topic ----------------------
%% §7.7.5 commands: setPosRate, pingNow, reboot, setGeofence, revokeCredential.
{allow, all, subscribe, ["veh/${username}/cmd"]}.

%% --- Nobody reaches the broker's own tree ---------------------------------------------
{deny, all, all, ["$SYS/#", {eq, "#"}, {eq, "+/#"}]}.

%% --- Default deny ---------------------------------------------------------------------
%% Belt and braces with `authorization.no_match = deny` in emqx.conf: a future source
%% inserted ahead of this file must not be able to turn the fallthrough back into allow.
%% Fleet-operator subscriptions to fleet/{operatorId}/+/pos/live are deliberately NOT
%% granted here — fleet scoping is enforced in the database (C006's security-barrier
%% views) and served through query-svc, not by handing operators a broker credential.
{deny, all}.
