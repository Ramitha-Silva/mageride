# =====================================================================================
# EMQX 5.8 — MageRide dev broker configuration (C009)
#
# Spec: D6' §3 (topic tree, ACL, auth, rate-limit, LWT), ADD §7.2/§7.7,
#       lightweight-production-replica.md "Container 2 — emqx", D7' §2.1/§3.
#
# Precedence (from the stock etc/emqx.conf header):
#     etc/base.hocon  <  data/configs/cluster.hocon  <  etc/emqx.conf  <  EMQX_* env vars
# This file therefore beats anything a previous run persisted through the dashboard, and
# the compose file overrides the one secret it needs through EMQX_AUTHENTICATION__1__SECRET.
#
# Mounted read-only at /opt/emqx/etc/emqx.conf. The ACL rules live beside it in acl.conf,
# mounted at /opt/emqx/etc/mageride-acl.conf — the image's own etc/acl.conf is left alone
# so it is always obvious which file is ours.
# =====================================================================================

node {
  name      = "emqx@127.0.0.1"
  cookie    = "mageride-dev-cookie"
  data_dir  = "data"
}

cluster {
  name               = mageride
  discovery_strategy = manual                 # single node in dev and in the replica
}

dashboard {
  listeners.http.bind = 18083
}

# -------------------------------------------------------------------------------------
# Authentication — MQTT session JWT (D6' §3.2, E-02, D-21)
#
# The MQTT session JWT is NOT the API JWT (E-02). It is minted by provisioning-svc with
# TTL = max(active-ride + 2h, 4h) and is bound to (vehicleId, deviceId, rideId?).
#
# `verify_claims` is the binding D6' §3.1 asks for: "EMQX binds the vehicleId JWT/X.509
# claim". The device connects with MQTT username = its vehicleId and presents the JWT as
# the MQTT password; EMQX refuses CONNECT unless the token's `vehicleId` claim equals that
# username. The acl.conf rules are then written in terms of ${username}, so a token minted
# for one vehicle can never authorise a publish to another vehicle's topic.
#
# Service accounts (mqtt-bridge, tcp-adapter) use the same shape with a `svc-*` username
# and a matching `vehicleId` claim; acl.conf grants that prefix the wildcard subscriptions
# E-08 needs.
#
# Dev uses a shared HMAC secret so the stack is self-contained before iam-svc (C026) and
# provisioning-svc (C030) exist. The replica and production use the RS256 JWKS block below
# — D-21 requires the 15-minute JWKS cache with JIT lookup on miss, which is
# `refresh_interval` here.
# -------------------------------------------------------------------------------------
authentication = [
  {
    mechanism             = jwt
    from                  = password
    use_jwks              = false
    algorithm             = "hmac-based"
    # Overridden by EMQX_AUTHENTICATION__1__SECRET from the compose file. Never a real
    # secret in git — infra/CLAUDE.md.
    secret                = "replace-me-via-EMQX_AUTHENTICATION__1__SECRET"
    secret_base64_encoded = false
    # A token may additionally carry an `acl` claim; when present EMQX applies it before
    # the file source below. provisioning-svc does not mint one today — the file rules are
    # the whole policy — but leaving the claim name configured means a future per-device
    # narrowing needs no broker restart.
    acl_claim_name          = "acl"
    verify_claims           = { vehicleId = "${username}" }
    disconnect_after_expire = true
  }
]

# --- Replica / production form (C125): RS256 over provisioning-svc's JWKS, D-21 ---------
# authentication = [
#   {
#     mechanism        = jwt
#     from             = password
#     use_jwks         = true
#     endpoint         = "http://app-services:5000/v1/internal/provisioning/.well-known/jwks.json"
#     refresh_interval = 900                  # 15-min cache + JIT lookup on miss (D-21)
#     acl_claim_name   = "acl"
