# =====================================================================================
# EMQX 5.8 — MageRide dev broker configuration (C009)
#
# Spec: D6' §3 (topic tree, ACL, auth, rate-limit, LWT), ADD §7.2/§7.7,
#       lightweight-production-replica.md "Container 2 — emqx", D7' §2.1/§3.
#
# Precedence (from the stock etc/emqx.conf header):
#     etc/base.hocon  <  data/configs/cluster.hocon  <  etc/emqx.conf  <  EMQX_* env vars
# This file therefore beats anything a previous run persisted through the dashboard, and
# the compose file overrides the one secret it needs through EMQX_AUTHENTICATION__1__SECRET.
#
# Mounted read-only at /opt/emqx/etc/emqx.conf. The ACL rules live beside it in acl.conf,
# mounted at /opt/emqx/etc/mageride-acl.conf — the image's own etc/acl.conf is left alone
# so it is always obvious which file is ours.
# =====================================================================================

node {
  name      = "emqx@127.0.0.1"
  cookie    = "mageride-dev-cookie"
  data_dir  = "data"
}

cluster {
  name               = mageride
  discovery_strategy = manual                 # single node in dev and in the replica
}

dashboard {
  listeners.http.bind = 18083
}

# -------------------------------------------------------------------------------------
# Authentication — MQTT session JWT (D6' §3.2, E-02, D-21)
#
# The MQTT session JWT is NOT the API JWT (E-02). It is minted by provisioning-svc with
# TTL = max(active-ride + 2h, 4h) and is bound to (vehicleId, deviceId, rideId?).
#
# `verify_claims` is the binding D6' §3.1 asks for: "EMQX binds the vehicleId JWT/X.509
# claim". The device connects with MQTT username = its vehicleId and presents the JWT as
# the MQTT password; EMQX refuses CONNECT unless the token's `vehicleId` claim equals that
# username. The acl.conf rules are then written in terms of ${username}, so a token minted
# for one vehicle can never authorise a publish to another vehicle's topic.
#
# Service accounts (mqtt-bridge, tcp-adapter) use the same shape with a `svc-*` username
# and a matching `vehicleId` claim; acl.conf grants that prefix the wildcard subscriptions
# E-08 needs.
#
# Dev uses a shared HMAC secret so the stack is self-contained before iam-svc (C026) and
# provisioning-svc (C030) exist. The replica and production use the RS256 JWKS block below
# — D-21 requires the 15-minute JWKS cache with JIT lookup on miss, which is
# `refresh_interval` here.
# -------------------------------------------------------------------------------------
authentication = [
  {
    mechanism             = jwt
    from                  = password
    use_jwks              = false
    algorithm             = "hmac-based"
    # Overridden by EMQX_AUTHENTICATION__1__SECRET from the compose file. Never a real
    # secret in git — infra/CLAUDE.md.
    secret                = "replace-me-via-EMQX_AUTHENTICATION__1__SECRET"
    secret_base64_encoded = false
    # A token may additionally carry an `acl` claim; when present EMQX applies it before
    # the file source below. provisioning-svc does not mint one today — the file rules are
    # the whole policy — but leaving the claim name configured means a future per-device
    # narrowing needs no broker restart.
    acl_claim_name          = "acl"
    verify_claims           = { vehicleId = "${username}" }
    disconnect_after_expire = true
  }
]

# --- Replica / production form (C125): RS256 over provisioning-svc's JWKS, D-21 ---------
# authentication = [
#   {
#     mechanism        = jwt
#     from             = password
#     use_jwks         = true
#     endpoint         = "http://app-services:5000/v1/internal/provisioning/.well-known/jwks.json"
#     refresh_interval = 900                  # 15-min cache + JIT lookup on miss (D-21)
#     acl_claim_name   = "acl"
#     verify_claims    = { vehicleId = "${username}" }
#     disconnect_after_expire = true
#     ssl { enable = false }
#   }
# ]

# -------------------------------------------------------------------------------------
# Authorization — topic ACL (D6' §3.1)
#
# `no_match = deny` is mandatory: EMQX's shipped default is allow, which would make every
# rule in acl.conf advisory. `deny_action = disconnect` rather than `ignore` because an
# MQTT 3.1.1 device gets no error code for a refused publish — silently dropping it would
# leave a misprovisioned tracker publishing into a void for its whole 90-day credential.
# -------------------------------------------------------------------------------------
authorization {
  no_match     = deny
  deny_action  = disconnect
  cache { enable = true, max_size = 1024, ttl = "1m" }
  sources = [
    { type = file, enable = true, path = "/opt/emqx/etc/mageride-acl.conf" }
  ]
}

# -------------------------------------------------------------------------------------
# Listeners (lightweight-production-replica.md Container 2)
#
#   1883  plain MQTT, in-cluster only — never published to the host or through HAProxy
#   8883  MQTTS for hardware trackers   — HAProxy L4 passthrough
#   8084  MQTT over WSS for mobile      — HAProxy L4 passthrough
#  18083  dashboard                     — never published past the docker network
#
# ws:default (8083, plaintext websocket) is disabled: the replica exposes only the WSS
# path and an open plaintext websocket on the same broker is a bypass of it.
#
# `messages_rate = "5/s"` is D-17's per-vehicle publish ceiling. D6' §3.3 specifies it as
# a rule-engine counter keyed on vehicleId; a listener limit is per-connection, and since
# a connection is authenticated as exactly one vehicleId the two agree for every case the
# broker can see. The rule-engine form additionally emits `mqtt.rate_violation` onto
# audit.events, which this cannot — that stays C038/C125 work.
#
# --- AND IT IS NOT ON 1883, WHICH IS WHY THE PLATFORM CARRIED 5 MESSAGES A SECOND ------
# The reasoning above holds for a listener DEVICES connect to. It is false for this one.
#
# 1883 is in-cluster only. No device reaches it — the production LoadBalancer publishes
# 8883 and 8084 and names 1883 only as a TCP health-check target
# (k8s/overlays/production/loadbalancers.yaml), and HAProxy passes through the same two.
# What connects here is the PLATFORM: mqtt-bridge-svc holding E-08's shared subscription
# for the whole fleet, and the three LWT consumers. `Mqtt__Port=1883` in
# `.env.common.example` and in `base/config/common-config.yaml` is every service.
#
# So a 5/s per-connection limit on this listener enforced D-17 for nobody and capped the
# ENTIRE FLEET'S INGEST AT ONE VEHICLE'S PUBLISH RATE. It is the ~10 msg/s ceiling C129
# measured against a 1,200 msg/s launch target, and the reason nine of every ten positions
# were discarded inside the broker with every publisher acknowledged.
#
# Measured, on the deployed configuration, with a plain MQTTnet subscriber and no bridge in
# the picture at all — 24 vehicles × 10 samples:
#
#                          messages_rate = "5/s"      messages_rate = "10000/s"
#     QoS 1, manual ack           3.6 msg/s                   913 msg/s
#     QoS 1, auto ack             5.0 msg/s                 1,005 msg/s
#     QoS 0                      89.4 msg/s                   700 msg/s
#
# **The limiter is charged for QoS-1 DELIVERY, not only for inbound publishes**, which is
# the fact that hid it: C129's control subscriber was QoS 0 — the one column the limiter
# does not govern — so the broker was exonerated and the search moved into the bridge's
# acknowledgement path, where nothing was wrong. Stage timings inside
# `TelemetryForwarder.CompleteAsync` under load: produce 8-31 ms, offset record 0 ms,
# PUBACK 0-36 ms, and the forwarder's own in-flight count sitting at 1-12 against a window
# of 32 — starved, not saturated.
#
# D-17 is unaffected and still enforced where devices actually are: `messages_rate = "5/s"`
# remains on 8883 (trackers) and 8084 (mobile) below. `max_conn_rate` stays here, because
# R-09's reconnect-storm control is about connections and a service reconnecting in a loop
# is exactly what it is for.
# -------------------------------------------------------------------------------------
# -------------------------------------------------------------------------------------
# The platform's own zone (C132, item 5a) — the QoS-1 delivery window mqtt-bridge-svc needs
#
# `max_inflight` is the number of unacknowledged QoS-1 messages EMQX will have in flight to
# ONE session, and a QoS-1 subscriber's throughput is exactly `max_inflight / ack-latency`.
# EMQX 5.8 defaults it to 32. mqtt-bridge-svc acknowledges only after Redpanda's delivery
# report (that ordering is E-08's whole guarantee and must not change), which measures at
# 8-31 ms — so 32 in flight is ~1,000 msg/s of theoretical headroom per replica and rather
# less in practice. 512 is C129 §1.5's second recommendation, and it is the lever that was
# left after the `messages_rate` cap came off 1883.
#
# ON A ZONE, NOT GLOBALLY, and the distinction is about the other 10,000 sessions: a window
# is a maximum rather than an allocation, so a device holding two pending commands still
# uses two slots — but `max_inflight` is also what bounds per-session memory under a burst,
# and there is no reason to widen it for handsets that subscribe to one low-volume command
# topic. The bridge is on 1883; devices are on 8883 and 8084 and keep EMQX's defaults.
#
# `max_mqueue_len` IS DELIBERATELY LEFT AT ITS DEFAULT (1000). It is tempting to raise the
# queue alongside the window, and it would be the wrong trade for telemetry: a bigger queue
# converts loss into LATENCY, and C129's 33.6 s p95 was exactly that — samples waiting
# behind a slow drain. A position that arrives thirty seconds late is not a position. If the
# queue still fills after this, that is a real capacity signal and it belongs in
# `delivery.dropped.queue_full` where `EmqxMessagesDropped` can page on it, not hidden as a
# slower live map.
#
# `retry_interval` is C129 §1.5's third recommendation. EMQX 5.8 defaults it to `infinity`,
# so an acknowledgement lost for any reason costs that inflight slot permanently and the
# ceiling decays over a session's life. A redelivery is safe here: position-processor-svc
# discards `seq <= watermark` (T-05/R-17), so a duplicate sample is absorbed by the same
# gate that absorbs a device's own replay.
# -------------------------------------------------------------------------------------
zones.services.mqtt {
  max_inflight   = 512
  retry_interval = 30s
}

listeners.tcp.default {
  bind          = "0.0.0.0:1883"
  zone          = services                    # the QoS-1 delivery window, above
  max_conn_rate = "500/s"                     # R-09 reconnect-storm control
  # A ceiling, but a FLEET-scale one — not D-17's per-vehicle 5/s. This listener carries the
  # platform, so a per-connection message limit on it is a per-fleet limit on ingest. 20,000/s
  # is above ADD §3.2's 15,000 msg/s burst budget, so it bounds a runaway service without ever
  # binding on legitimate traffic, and "every live listener carries a ceiling" stays true —
  # which is the property tests/Security/AntiSpoof/Mqtt/BrokerPolicyTests asserts, and the one
  # worth keeping if 1883 is ever exposed by mistake.
  messages_rate = "20000/s"
}

# -------------------------------------------------------------------------------------
# Hardware-tracker zone — T-02 device mTLS (C030)
#
# A tracker presents the X.509 client certificate provisioning-svc minted for it, whose
# CN is the vehicleId. `peer_cert_as_username = cn` makes that CN the MQTT username, so
# acl.conf's `veh/${username}/*` rules confine the device to its own vehicle's topics
# without a single new rule — the certificate IS the topic grant.
#
# `peer_cert_as_username` is an `mqtt` setting, not a listener field: EMQX 5.8 rejects it
# on `listeners.ssl.default` outright ("unknown_fields"). A zone is how a listener takes
# an `mqtt` override, so it goes here and the listener references it.
# -------------------------------------------------------------------------------------
zones.trackers.mqtt {
  peer_cert_as_username = cn
}

listeners.ssl.default {
  bind          = "0.0.0.0:8883"
  max_conn_rate = "500/s"
  messages_rate = "5/s"
  zone          = trackers

  # The mutual TLS handshake IS the authentication on this listener, so the JWT chain above
  # is switched off for it: a hardware tracker has no session token to present as a
  # password, and leaving the chain on refuses every device with CONNACK 5. Nothing is
  # weakened — `verify_peer` + `fail_if_no_peer_cert` mean a client that cannot produce a
  # certificate signed by the device CA never reaches this point. The mobile plane keeps the
  # JWT authenticator on 8084/1883 (E-02, D-21).
  enable_authn  = false

  ssl_options {
    # provisioning-svc's issuing chain (T-02). dev-up.sh generates it before the stack comes
    # up and both this container and app-services mount the same volume, because EMQX reads
    # this file when the listener starts and a service cannot create it in time.
    cacertfile = "${EMQX_ETC_DIR}/device-ca/certs/ca_chain.crt"

    # The server half is still the self-signed pair shipped in the image; C125 replaces it
    # with the platform certificate. A tracker verifies the broker against its own trust
    # store, which is a device-fleet concern rather than a broker one.
    certfile   = "${EMQX_ETC_DIR}/certs/cert.pem"
    keyfile    = "${EMQX_ETC_DIR}/certs/key.pem"

    verify               = verify_peer
    fail_if_no_peer_cert = true

    # --- T-12 revocation, replica and production form ---------------------------------
    # Turn this on together with `StepCa:CrlDistributionPoint`, never separately. EMQX
    # refuses a certificate whose CRL it cannot fetch, so a broker that starts before
    # provisioning-svc can serve /v1/internal/trackers/crl.pem refuses every tracker — and
    # in dev the broker always starts first. Where both are set, a revoked certificate stops
    # completing a handshake within `crl_cache.refresh_interval`, which is what puts the
    # number on T-12's 60 s for the MQTT path. The TCP path does not need it: the adapter
    # re-validates through provisioning-svc and force-closes on the Redis pub/sub message.
    # enable_crl_check = true
  }
}

# crl_cache.refresh_interval = 60s

listeners.wss.default {
  bind          = "0.0.0.0:8084"
  max_conn_rate = "500/s"
  messages_rate = "5/s"
  websocket.mqtt_path = "/mqtt"
  ssl_options {
    cacertfile = "${EMQX_ETC_DIR}/certs/cacert.pem"
    certfile   = "${EMQX_ETC_DIR}/certs/cert.pem"
    keyfile    = "${EMQX_ETC_DIR}/certs/key.pem"
    verify     = verify_none
  }
}

listeners.ws.default { enable = false }

# -------------------------------------------------------------------------------------
# Sessions (lightweight-production-replica.md "Durability & Backpressure")
# -------------------------------------------------------------------------------------
mqtt {
  session_expiry_interval = 2h                # persistent sessions across a tunnel drop
  max_qos_allowed         = 1                 # D6' §3.1 — every topic in the tree is QoS 1
  retain_available        = true              # veh/{vehicleId}/status LWT is retained (T-04)

  # ---------------------------------------------------------------------------------
  # Shared-subscription dispatch (E-08 + per-vehicle ordering) — set by C038
  #
  # EMQX 5.8 defaults to `round_robin`, which picks the next member of the group for
  # EVERY message. Two mqtt-bridge replicas then take a vehicle's samples alternately
  # and race each other to `telemetry.raw`: E-08's "each message to exactly one
  # replica" still holds, but the per-vehicle ordering ADD §7.3 and D6' §2.1 promise
  # end to end does not — the Redpanda partition key can only keep samples in the
  # order they were produced in, and under round_robin that order is a coin toss.
  #
  # `sticky` binds a publishing session to one member of the group and keeps it there
  # until that member goes away, so one vehicle's stream reaches one bridge replica in
  # order and is produced in order. Load balancing is unchanged in substance — it is
  # per device rather than per message, which is how a fleet actually distributes —
  # and `shared_subscription_initial_sticky_pick = random` (the default) is what keeps
  # the first pick from crowding one replica.
  #
  # On replica loss the sticky pick is invalidated and re-picked, which is ADD §7.3's
  # "EMQX redistributes ownership within seconds". Messages still unacknowledged by a
  # terminating session are redispatched to the rest of the group (unconditional in
  # EMQX 5.x; `broker.shared_dispatch_ack_enabled` was deprecated in 5.1 for exactly
  # this reason), which is what makes leaving unacknowledged the right response to a
  # produce failure.
  # ---------------------------------------------------------------------------------
  shared_subscription_strategy = sticky
}
