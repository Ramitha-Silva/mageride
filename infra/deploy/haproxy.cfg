# =====================================================================================
# HAProxy 2.9 — MageRide edge (C009, dev)
#
# Spec: D7' §2.1 "Container | haproxy | 443, 8883, 8084, 5023-5026",
#       lightweight-production-replica.md "Container 1 — haproxy", ADD §12.2.
#
# Role: TLS termination for HTTPS/WSS on 443; L4 TCP passthrough for MQTT (8883, 8084)
# and the per-protocol hardware-tracker ports (5023-5025). One instance in dev and in the
# replica — SPOF accepted; production is 2x HAProxy + Keepalived VRRP (D7' §8).
#
# --- 5026/UDP is NOT here, and cannot be ---------------------------------------------
# The replica's Container 1 table lists `5026 (NMEA UDP)` among HAProxy's ports and calls
# the tracker ports "L4 passthrough". HAProxy has no UDP forwarder — its only UDP support
# is for syslog and DNS resolution — so the NMEA-UDP adapter port is published straight
# off the `tcp-adapter` container instead (see docker-compose.dev.yml). The same document
# already states this constraint for TURN media: "HAProxy is L4/L7 TCP/HTTP and cannot
# relay UDP media efficiently".
# =====================================================================================

global
    log stdout format raw local0 info
    maxconn 20000
    # Dev certificate, generated by infra/scripts/dev-up.sh into infra/deploy/certs/.
    # Never committed. C125 replaces it with the real mageride.lk certificate.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Docker's embedded DNS. Without a resolver HAProxy caches the IP a backend had at
# startup, so a `docker compose restart app-services` silently blackholes the edge.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold nx    1s
    hold other 1s

# -------------------------------------------------------------------------------------
# Operator surface — internal only. Never published to the host in either compose file.
# -------------------------------------------------------------------------------------
frontend stats
    bind 0.0.0.0:8404
    mode http
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 10s

# =====================================================================================
# 443 — HTTPS + WSS (REST API, SignalR, both portals)
# =====================================================================================
frontend https
    bind 0.0.0.0:443 ssl crt /usr/local/etc/haproxy/certs/ alpn h2,http/1.1
    mode http
    option httplog
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    # HSTS. Dev uses a self-signed cert, so this only ever affects a browser that has
    # already accepted it.
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- Never publish the internal operator endpoints (C008 handoff) -----------------
    # MageRide.Shared maps /health/live, /health/ready and /metrics anonymously on every
    # service, which is right for an internal service and wrong for the public edge:
    # /health/ready names every dependency it probes, and /metrics is the whole internal
    # topology. 404 rather than 403 — a 403 confirms the path exists.
    http-request deny deny_status 404 if { path -i -m beg /health/ /metrics }
    http-request deny deny_status 404 if { path -i /health }

    # --- /v1/internal/** is mTLS-only (D3' §0) ----------------------------------------
    # The gateway refuses these too (C008 decision 3); refusing at the edge as well means
    # a misconfigured gateway route cannot expose them.
    http-request deny deny_status 404 if { path -i -m beg /v1/internal/ }

    acl host_admin hdr(host) -i -m beg admin.
    acl host_fleet hdr(host) -i -m beg fleet.
    acl host_s3    hdr(host) -i -m beg s3.
    acl is_hub     path -i -m beg /hubs/

    use_backend admin_portal if host_admin
    use_backend fleet_portal if host_fleet
    use_backend object_store if host_s3
    use_backend fanout       if is_hub
    default_backend api_gateway

# --- REST API -------------------------------------------------------------------------
backend api_gateway
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    # `init-addr none` rather than the usual `last,libc,none`: a dev box routinely runs
    # with some of these containers absent, and `libc` blocks on a synchronous getaddrinfo
    # per unresolvable name — six missing backends cost ~30 s before HAProxy binds a single
    # port. With `none` the server starts DOWN at 0.0.0.0 and the `docker` resolver above
    # brings it up within a second of the container appearing, which is also what makes a
    # `docker compose restart` transparent.
    server gw api-gateway:5000 check resolvers docker init-addr none

# --- SignalR (R-06 geocell groups, Mode B entitlement, proxy booking) -----------------
backend fanout
    mode http
    balance roundrobin
    # A live-map socket is quiet between position pushes; the default 60s server timeout
    # would drop it. `timeout tunnel` governs the connection once it has been upgraded.
    timeout tunnel 1h
    option httpchk GET /health/ready
    http-check expect status 200
    server fanout fanout:5001 check resolvers docker init-addr none

# --- Admin Portal (AL-02) — optional container ----------------------------------------
backend admin_portal
    mode http
    server admin admin-portal:3001 check resolvers docker init-addr none

# --- Fleet Portal (AL-03) — optional container ----------------------------------------
backend fleet_portal
    mode http
    server fleet fleet-portal:3002 check resolvers docker init-addr none

# --- MinIO / S3 -----------------------------------------------------------------------
# The replica's Container 10 says MinIO's API port is "behind HAProxy passthrough" but
# Container 1's port list has no entry for it. Resolved as a vhost on 443 rather than a
# new port: pre-signed upload and download URLs for driver documents and proof-of-delivery
# photos are handed to a phone, so the object store has to be reachable from outside the
# docker network or the whole docs flow only works from inside it. Production swaps this
# backend for Cloudflare R2 and the vhost disappears.
backend object_store
    mode http
    server minio minio:9000 check resolvers docker init-addr none

# =====================================================================================
# 8883 — MQTTS, L4 passthrough to EMQX (hardware trackers; EMQX terminates TLS)
# =====================================================================================
frontend mqtts
    bind 0.0.0.0:8883
    mode tcp
    option tcplog
    # A tracker on a rural GSM link can idle far longer than a browser.
    timeout client 4h
    default_backend emqx_mqtts

backend emqx_mqtts
    mode tcp
    timeout server 4h
    server emqx emqx:8883 check resolvers docker init-addr none

# =====================================================================================
# 8084 — MQTT over WSS for mobile, L4 passthrough to EMQX
#
# The replica chooses a dedicated 8084 rather than multiplexing MQTT-WSS onto 443 by
# ALPN/SNI, "for simpler routing" (Container 1 note).
# =====================================================================================
frontend mqtt_wss
    bind 0.0.0.0:8084
    mode tcp
    option tcplog
    timeout client 1h
    default_backend emqx_wss

backend emqx_wss
    mode tcp
    timeout server 1h
    server emqx emqx:8084 check resolvers docker init-addr none

# =====================================================================================
# 5023-5025 — hardware tracker protocol ports, L4 passthrough to tcp-adapter (T-01)
#
# 5026 (NMEA/UDP) is published directly by the tcp-adapter container — see the header.
# Long client timeouts: these are persistent device sockets, not request/response.
# =====================================================================================
frontend tracker_gt06
    bind 0.0.0.0:5023
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_gt06

backend adapter_gt06
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5023 check resolvers docker init-addr none

frontend tracker_jt808
    bind 0.0.0.0:5024
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_jt808

backend adapter_jt808
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5024 check resolvers docker init-addr none

frontend tracker_h02
    bind 0.0.0.0:5025
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_h02

backend adapter_h02
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5025 check resolvers docker init-addr none
