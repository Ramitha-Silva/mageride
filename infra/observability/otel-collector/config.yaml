# =====================================================================================
# MageRide — OpenTelemetry Collector (C119). ADD §13.1's "Collector" row.
#
# The single OTLP door. `Otel__Endpoint=http://otel-collector:4317` (D7' §4.1) is what
# every .NET service sends to; C002's `AddMageRideTelemetry` exports traces, metrics AND
# logs over it.
#
# Three legs out:
#   traces  -> Tempo
#   logs    -> Loki (OTLP native; Loki 3 accepts OTLP on /otlp/v1/logs)
#   metrics -> a Prometheus exposition on :8889 that Prometheus scrapes
#
# The metrics leg is not redundant with each service's own /metrics. It is the ONLY path
# for tcp-adapter, which runs on `runtime:10.0-alpine` and has no HTTP surface to scrape
# (D7' §5.1 gives it a TCP-socket liveness probe for that reason), and it is the path for
# any service deployed with `Otel__PrometheusEnabled=false`.
# =====================================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Bounded batching. Without it every span is its own export and the collector becomes
  # the latency it is supposed to measure.
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # A hard ceiling before the runtime's, so the collector sheds load instead of being
  # OOM-killed — a collector that dies takes the evidence of whatever killed it with it.
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 96

  # `deployment.environment` is set by the service (C002 reads ASPNETCORE_ENVIRONMENT);
  # the collector adds where it was collected, which the service cannot know.
  resource:
    attributes:
      - key: collector.name
        value: mageride-otel-collector
        action: upsert

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
    retry_on_failure:
      enabled: true

  prometheus:
    endpoint: 0.0.0.0:8889
    # Turns the OTLP resource attributes into labels, which is what gives the
    # `otel-forwarded` scrape job a `service_name` to relabel into `service`
    # (see prometheus.yml). Without it every pushed metric is anonymous.
    resource_to_telemetry_conversion:
      enabled: true
    # Counters must not be reset to zero when a service restarts and reconnects — a reset
    # looks like a counter going backwards, which `rate()` reads as a rollover.
    enable_open_metrics: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]

  telemetry:
    logs:
      level: warn
    metrics:
      # The collector's own golden signals, scraped by the `otel-collector` job.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/tempo]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlphttp/loki]
