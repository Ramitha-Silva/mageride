# =====================================================================================
# MageRide — Tempo (C119). ADD §13.1's traces pillar (its "Scale Tool" column; D7' §12
# names Tempo outright).
#
# One trace is one ride's journey across services. ADD §13.1: "Trace IDs propagate across
# MQTT payloads (as a header field), stream messages, and HTTP calls" — so a span from
# fanout-svc and a span from ride-svc belong to the same trace, and the reason to run a
# trace store at all is to see them together.
# =====================================================================================

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: warn

distributor:
  receivers:
    # OTLP only, and only from the collector. A service that wrote here directly would
    # bypass the collector's batching, sampling and resource enrichment — all three of
    # which are why the collector exists.
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  # Short, because this is dev and the replica. A trace is looked at within minutes of the
  # alert that produced it.
  max_block_duration: 5m

compactor:
  compaction:
    # 7 days, matching Loki. A trace whose logs have been compacted away is half a story.
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Span metrics and service graphs, written back into Prometheus over remote-write.
#
# This is what makes a trace answer an SLO question: `traces_spanmetrics_latency` gives a
# per-operation latency histogram for every span in the platform without any service
# instrumenting one, and the service graph draws who calls whom — which is the picture
# ADD §6's service table describes and nothing else verifies.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics

usage_report:
  reporting_enabled: false
