# =====================================================================================
# MageRide — coturn TURN/STUN, SINGAPORE (C131)
#
# `infra/deploy/coturn/turnserver.conf` with the four changes C131 measured or observed the
# need for. The dev file is C055's and is left alone; the defects are findings with an owner
# in `acceptance/sg/report.md`.
#
# THE CAPACITY ARITHMETIC THIS FILE IS THE ANSWER TO
# ------------------------------------------------------------------------------------
# One TURN allocation consumes one relayed port. A call in which both parties are relayed —
# the case on carrier-grade NAT, which is the common case here — consumes two. D6' §6 pins
# the range at 50000-50100, which is 101 ports:
#
#     101 ports / 2 allocations per call = 50 concurrent relayed calls
#
# against ADD §3.2's and D-24's **500 concurrent calls**. C131 demonstrated this rather than
# deriving it: against a 101-port coturn, the 51st call's allocation was refused
# `508 Cannot create socket` and the 50 that had allocated carried on unaffected. The
# shortfall is 10x and the failure mode is a refused allocation, so the call falls back to
# a direct dial rather than failing silently — which is the one merciful thing about it.
#
# Widening the range is the change below. It is a DEVIATION FROM D6' §6's stated range and
# is recorded as such: the spec's parenthetical "(3478 + 50000-50100)" is a hundred ports
# against a five-hundred-call target, and no document in `specs/` reconciles the two.
# =====================================================================================

listening-port=3478
tls-listening-port=5349

# ---- CHANGE 1: the relay range, sized for the target -------------------------------
# 1200 ports = 600 concurrent relayed calls, which clears D-24's 500 with headroom for the
# allocations that outlive their call by up to the refresh lifetime.
min-port=50000
max-port=51200

# ---- CHANGE 2: the advertised address, explicitly ----------------------------------
# coturn cannot infer the address it tells peers to send to, and a wrong one is SILENT
# one-way audio rather than a failure. The dev compose sets `DETECT_EXTERNAL_IP: "yes"`,
# which is the image's entrypoint guessing from an interface — on a cloud host behind a
# load balancer it guesses the private one.
external-ip=${TURN_PUBLIC_IP}
listening-ip=${TURN_LISTEN_IP}
relay-ip=${TURN_LISTEN_IP}

# ---- CHANGE 3: the TLS listener has a certificate ----------------------------------
# `tls-listening-port=5349` is set in the dev file, its comment says "The certificate is the
# platform's, mounted from infra/deploy/certs", and there is no `cert=`/`pkey=` line and no
# certificate mounted. coturn says so on every start-up and nobody was reading:
#
#     WARNING: cannot find certificate file: turn_server_cert.pem
#     WARNING: cannot start TLS and DTLS listeners because certificate file is not set properly
#
# So 5349 — the port that exists for the carriers which block plain UDP 3478 — has never
# listened, in any environment. The fallback the file was written to provide is absent.
cert=/etc/coturn/certs/tls.crt
pkey=/etc/coturn/certs/tls.key

# ---- CHANGE 4: the shared secret is supplied ---------------------------------------
# `use-auth-secret` selects the ephemeral-credential scheme and needs a secret to verify
# against. `TURN_SECRET` is named in the dev file's comment and is set in NO compose file,
# NO environment file and NO k8s overlay — so `use-auth-secret` has nothing to authenticate
# with. Here it is read from a file rather than an environment variable, because a secret in
# `docker inspect` output is a secret in every operator's terminal history.
use-auth-secret
static-auth-secret-file=/run/secrets/turn_shared_secret
realm=voip.mageride.lk

# ---- unchanged: what this relay refuses --------------------------------------------
# A TURN server with no denied peers is an open proxy into whatever network it sits in: an
# allocation pointed at 169.254.169.254 reads the cluster's metadata endpoint from outside.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# ---- quotas ------------------------------------------------------------------------
# `user-quota` counts allocations PER USERNAME. Under `use-auth-secret` the username is an
# expiry timestamp, so every client whose credential was minted in the same second shares
# one quota — at the dev file's 12, a burst of calls starting together would be refused from
# the thirteenth allocation on. LiveKit mints a distinct username per participant
# (`livekit.sg.yaml`'s `turn_servers[].secret_file`), which is what makes a per-user quota
# meaningful; it is raised to 4 anyway so one participant cannot hold more than its call
# needs, and the platform ceiling moves to `total-quota`.
user-quota=4
total-quota=1200
max-bps=128000

simple-log
log-file=stdout
no-stdout-log=false
