# =====================================================================================
# MageRide — lightweight production replica (C125).
#
# `specs/lightweight-production-replica.md` §"Container Layout" and §"Resource Summary", on one
# VPS. Eleven core containers carrying 27+ logical services, plus five optional ones behind compose
# profiles.
#
#   bash infra/replica/deploy.sh            # guardrails, then up
#   bash infra/replica/deploy.sh --dry-run  # every check, nothing started
#   bash infra/replica/down.sh              # stop; add --volumes to discard the data
#
# ------------------------------------------------------------------------------------
# SYNTHETIC DATA ONLY. NEVER PRODUCTION DATA.
# ------------------------------------------------------------------------------------
# This stack exists for testing, CI and demos (root CLAUDE.md, D7' §8). Everything in it is
# generated by `infra/replica/seed.sh`. It runs one Postgres with no replica, one Redpanda broker at
# RF=1, one HAProxy with no VRRP peer, and self-signed TLS — a single-point-of-failure stack by
# design. Restoring a production dump into it would put real riders' phone numbers and real drivers'
# documents on a box whose edge is publicly reachable with a certificate nothing trusts.
#
# ------------------------------------------------------------------------------------
# THIS BOX ALSO HOSTS THE BUILD, AND THE TWO DO NOT FIT TOGETHER.
# ------------------------------------------------------------------------------------
# The root CLAUDE.md says it outright: ~19 GB of replica plus a `dotnet build` does not fit in 24 GB.
# `infra/replica/guardrail.sh` refuses to start while a heavy build is running and is what
# `deploy.sh` calls first — it is not advisory.
#
# ------------------------------------------------------------------------------------
# ITS OWN COMPOSE PROJECT, DELIBERATELY.
# ------------------------------------------------------------------------------------
# `mageride-replica`, not `mageride`. All three dev stacks (slim, full, observability) share the
# `mageride` project and its volumes, which is why `infra/CLAUDE.md` warns that
# `--remove-orphans` on any one of them deletes the others' containers. A separate project means the
# replica cannot be caught by that, cannot collide with a dev Postgres on the same volume, and can be
# torn down without touching anything a developer is using.
#
# ------------------------------------------------------------------------------------
# ONLY THE EDGE PUBLISHES A PORT.
# ------------------------------------------------------------------------------------
# HAProxy publishes; every other container is reachable only on the internal network. The spec's
# tables list "Ports exposed" for `haproxy` alone and internal ports for the rest, and this box has a
# public IP — publishing Postgres, Redis, EMQX's dashboard or MinIO's console on it would be a
# different decision than the one the spec made. `REPLICA_EDGE_BIND` closes even the edge
# (`REPLICA_EDGE_BIND=127.0.0.1`) for a run that only needs the smoke suite.
# =====================================================================================

name: mageride-replica

# -------------------------------------------------------------------------------------
# Anchors. The replica's env layering is the dev stack's, deliberately: the example files ARE the
# default configuration layer and the real files (gitignored, absent by default) override them.
# Nothing copies one to the other — a copy made once would shadow every later edit.
# -------------------------------------------------------------------------------------
x-app-env: &app-env
  env_file:
    - path: ../env/.env.common.example
      required: true
    - path: ../env/.env.common
      required: false
    - path: ../env/.env.app.example
      required: true
    - path: ../env/.env.app
      required: false
    # Replica-only overrides, last so they win. Gitignored; `deploy.sh` writes it from
    # `.env.replica.example` on first run.
    - path: .env.replica
      required: false

x-restart: &restart
  restart: unless-stopped

services:

  # ===================================================================================
  # Container 5 — postgres (System of Record + TimescaleDB)   4 GB / 1.0 vCPU
  # ===================================================================================
  postgres:
    <<: *restart
    image: timescale/timescaledb-ha:pg16
    # `timescaledb` only. PostGIS has no preloadable library and the postmaster refuses to start if
    # it is named here — the deviation is recorded in infra/CLAUDE.md and is load-bearing.
    command:
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mageride_replica}
      POSTGRES_DB: ${PG_DATABASE:-mageride}
      POSTGRES_USER: ${PG_USER:-mageride}
    volumes:
      # `/home/postgres/pgdata`, which is timescaledb-ha's PGDATA. The spec's
      # /var/lib/postgresql/data is the official postgres image's path and makes first boot fail.
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mageride} -d ${PG_DATABASE:-mageride}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 4G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # pgbouncer — transaction-mode pooler (M-5)                 128 MB / 0.25 vCPU
  # Every service reaches Postgres through this, never :5432 directly.
  # ===================================================================================
  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${PG_USER:-mageride}
      DB_PASSWORD: ${PG_PASSWORD:-mageride_replica}
      DB_NAME: ${PG_DATABASE:-mageride}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${PG_USER:-mageride}
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    networks: [internal]

  # ===================================================================================
  # Container 4 — redis (Live State + Geo Index)              1.5 GB / 0.5 vCPU
  # ===================================================================================
  redis:
    <<: *restart
    image: redis:7-alpine
    # `noeviction` on purpose: geo:live and the dispatch locks are not a cache, and silently
    # evicting a ride lock is worse than refusing a write. `notify-keyspace-events Ex` is what the
    # expiry listeners need.
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
       "--maxmemory", "1200mb", "--maxmemory-policy", "noeviction",
       "--notify-keyspace-events", "Ex"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "0.5" }
    networks: [internal]

  # ===================================================================================
  # Container 3 — redpanda (Event Backbone, single broker RF=1)  1 GB / 0.5 vCPU
  # ===================================================================================
  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v24.2.26
    # `rpk redpanda mode production` BEFORE start: the image ships developer_mode: true and rpk
    # then adds --unsafe-bypass-fsync, which is not what "production replica" should mean.
    # The ENTRYPOINT OVERRIDE is what makes the command below a script rather than rpk's arguments,
    # and it is not optional. The image's own /entrypoint.sh ends in `exec /usr/bin/rpk $@` —
    # unquoted — so anything passed as `command` is word-split into rpk arguments, the first of which
    # here would be the literal word `rpk`. rpk then prints its help and the container restarts for
    # ever, naming neither the cause nor the file. infra/docker-compose.dev.slim.yml has always set
    # this; copying its `command` without its `entrypoint` is the mistake this comment exists to stop
    # the next person repeating.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # Seastar gets 1G and the CONTAINER is given 1280M — a deliberate, recorded deviation from the
        # spec's 1 GB row, because the two cannot both be satisfied:
        #
        #   `rpk redpanda mode production` turns OFF developer mode, and redpanda's syschecks then
        #   refuse to start below a 1 GiB floor: "Memory: '939524096' below recommended:
        #   '1073741824'". `--check=false` does not relax it. But seastar allocates its arena up front
        #   against the CGROUP, so a container limited to exactly 1 GiB cannot hand the process 1 GiB
        #   — the first attempt died with "insufficient physical memory: needed 1073741824 available
        #   1004535808".
        #
        # So: 1 GB container + production mode is impossible. The dev slim file asks for 1G and gets
        # away with it only because it sets NO memory limit and seastar sizes against the host's
        # 24 GB. Dropping production mode would be the other way out and is worse — the image ships
        # developer_mode: true and rpk then adds --unsafe-bypass-fsync, which is not what a
        # "production replica" should mean, and the spec asks for fsync explicitly.
        #
        # The 256 MiB is declared in infra/replica/budget.py's ACCEPTED_DEVIATIONS so the guardrail
        # reports it every run instead of drifting silently.
        rpk redpanda mode production
        exec /usr/bin/rpk redpanda start \
          --smp=1 \
          --overprovisioned \
          --node-id=0 \
          --memory=1G \
          --reserve-memory=0M \
          --check=false \
          --kafka-addr=internal://0.0.0.0:9092 \
          --advertise-kafka-addr=internal://redpanda:9092 \
          --rpc-addr=redpanda:33145 \
          --advertise-rpc-addr=redpanda:33145 \
          --set redpanda.auto_create_topics_enabled=true
    volumes:
      - redpandadata:/var/lib/redpanda/data
      - ../deploy/redpanda/bootstrap-topics.sh:/opt/mageride/bootstrap-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1280M, cpus: "0.5" }
    networks: [internal]

  redpanda-init:
    image: redpandadata/redpanda:v24.2.26
    entrypoint: ["/bin/sh", "/opt/mageride/bootstrap-topics.sh"]
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_PARTITIONS: "3"
      REDPANDA_REPLICAS: "1"
    volumes:
      - ../deploy/redpanda/bootstrap-topics.sh:/opt/mageride/bootstrap-topics.sh:ro
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # Container 2 — emqx (MQTT Broker)                          2 GB / 1.0 vCPU
  # ===================================================================================
  emqx:
    <<: *restart
    image: emqx/emqx:5.8
    environment:
      # The whole authenticator is in deploy/emqx/emqx.conf; only the secret comes from here. The
      # key is MECHANISM, not TYPE — D7' §4.2's spelling does not work and the deviation is
      # recorded in infra/CLAUDE.md.
      EMQX_AUTHENTICATION__1__SECRET: ${MQTT_JWT_SECRET:?the replica needs an MQTT JWT secret}

      # --- the platform certificate on both TLS listeners (AL-63) -----------------------
      # HAProxy passes 8883 and 8084 through at L4, so EMQX terminates that TLS itself and
      # was doing it with the self-signed pair in its image (`O=EMQ, CN=Server`). A mobile
      # client refuses that outright — untrusted issuer AND hostname mismatch, no
      # click-through — so no handset could ever use 8084, which is the mobile plane.
      #
      # AN ENV OVERRIDE, NOT A PATH IN emqx.conf. That file is mounted into the dev slim
      # stack and into MageRide.TestKit's EMQX fixture as well, and neither has a Let's
      # Encrypt certificate: pointing the config itself at one fails both with `no_cert`,
      # which is exactly what CI caught. The override belongs where the certificate exists.
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/platform-certs/platform-cert.pem
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/platform-certs/platform-key.pem
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__CERTFILE: /opt/emqx/etc/platform-certs/platform-cert.pem
      EMQX_LISTENERS__WSS__DEFAULT__SSL_OPTIONS__KEYFILE: /opt/emqx/etc/platform-certs/platform-key.pem
    volumes:
      - emqxdata:/opt/emqx/data
      - ../deploy/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      # The platform certificate for 8883 and 8084. HAProxy passes both through at L4, so
      # EMQX terminates that TLS itself and needs its own copy — read-only, and the key is
      # 600 owned by uid 1000 (`emqx`), written by the Let's Encrypt deploy hook.
      - ../deploy/certs:/opt/emqx/etc/platform-certs:ro
      - ../deploy/emqx/acl.conf:/opt/emqx/etc/mageride-acl.conf:ro
      # The device CA chain, generated on the host by infra/scripts/ensure-device-ca.sh. EMQX reads
      # certs/ca_chain.crt as its 8883 cacertfile at listener start, so it must exist before this
      # container does — deploy.sh calls that script.
      - ../deploy/device-ca:/opt/emqx/etc/device-ca:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 10 — minio (S3-compatible object storage)       256 MB / 0.25 vCPU
  # ===================================================================================
  minio:
    <<: *restart
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mageride_replica}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?the replica needs a MinIO root password}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?the replica needs a MinIO KMS key for SSE}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }
    networks: [internal]

  minio-init:
    image: minio/minio:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for b in mageride-documents mageride-proofs mageride-profile mageride-screenshots mageride-backups; do
          mc mb --ignore-existing "local/$$b"
        done
        mc ls local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mageride_replica}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # WHERE THE SEVEN BUILT IMAGES COME FROM (Δ MCS-10)
  #
  # Every `image:` below reads `${REPLICA_REGISTRY:-mageride}/<name>:${REPLICA_TAG:-replica}`.
  # UNSET, that is exactly what it was before — `mageride/app-services:replica`, built on this
  # box by `deploy.sh`'s `docker compose build`. Nothing about the manual path changes.
  #
  # SET, the same compose file pulls a CI-built image instead:
  #   REPLICA_REGISTRY=ghcr.io/ramitha-silva REPLICA_TAG=sha-<7>
  #
  # This is what wires the replica into cd.yml. It was never in it: cd builds the ~24 PER-SERVICE
  # images the DOKS split needs (service-catalog.yaml §"Why per-service"), and this box runs seven
  # COMPOSED ones — `app-services` alone carries 22 services, ocr-svc among them. The two sets are
  # disjoint, so there was no tag here for a deploy job to move, and the only thing that ever
  # updated this box was somebody running deploy.sh on it. That is how the replica came to be 96
  # commits and four days behind while every `deploy(dev)` commit reported success (MCS-07).
  #
  # `build:` is deliberately KEPT on all seven. A pull needs a registry and a network; a box with
  # neither still has to be able to bring the replica up from source.
  # ===================================================================================

  # ===================================================================================
  # migrate — the one-shot schema apply. Everything below waits for it to COMPLETE.
  # ===================================================================================
  migrate:
    build:
      context: ../..
      dockerfile: backend/src/MageRide.Migrations/Dockerfile
    image: ${REPLICA_REGISTRY:-mageride}/migrate:${REPLICA_TAG:-replica}
    environment:
      # Straight to :5432, not through the pooler: DbUp takes an advisory lock for the run and a
      # transaction-mode pooler can hand the next statement to a different backend.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${PG_DATABASE:-mageride};Username=${PG_USER:-mageride};Password=${PG_PASSWORD:-mageride_replica}"
      MIGRATE_WAIT_SECONDS: "120"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # Container 6 — hot-path                                    2 GB / 1.0 vCPU
  # mqtt-bridge + position-processor + persistence-writer + fleet-health, one process.
  # No ports: internal consumers only.
  # ===================================================================================
  hot-path:
    <<: [*restart, *app-env]
    build:
      context: ../..
      # Dockerfile.SERVICE, not Dockerfile.worker. All four co-located services are
      # `Microsoft.NET.Sdk.Web` projects — they expose /health/live and /health/ready like every other
      # service — so they need Microsoft.AspNetCore.App. Dockerfile.worker publishes onto
      # `runtime:10.0-alpine`, which does not carry it, and the container dies at launch with
      # "No frameworks were found ... framework=Microsoft.AspNetCore.App". The BUILD succeeds, which
      # is why CI's container-template step has been building that image happily without ever running
      # it. infra/docker-compose.skeleton.yml already carries the same conclusion in a comment.
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: HotPath
    image: ${REPLICA_REGISTRY:-mageride}/hot-path:${REPLICA_TAG:-replica}
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      emqx: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      # persistence-writer is the first service in the list and therefore owns 5200. Any of the four
      # answering proves the umbrella host got past start-up; CoLocatedHost exits non-zero if any of
      # them failed, so a running container means all four started.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5200/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 7 — app-services                                3 GB / 1.5 vCPU
  # YARP gateway + the 22 domain services, one process, one published port (5000).
  # ===================================================================================
  app-services:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.appservices
    image: ${REPLICA_REGISTRY:-mageride}/app-services:${REPLICA_TAG:-replica}
    environment:
      # The three clusters that are NOT in this container. Everything co-located here is pointed at
      # its own loopback port by the host itself — see backend/src/AppServices/Container7.cs.
      ReverseProxy__Clusters__fanout-svc__Destinations__primary__Address: http://fanout:5001/
      # Δ C126 — fleet-health-svc's override is GONE, not corrected. It said `:5203`; the service
      # listens on 5000 (HotPath/Program.cs publishes it there deliberately) and that is already
      # gateway-routes.json's default, so the right number of places to say it is one. The old value
      # was unreachable twice over — wrong port, and the service was bound to loopback.
      ReverseProxy__Clusters__voip-svc__Destinations__primary__Address: http://voip:5000/
      # Δ C129 — dispatch-svc's own call to ride-svc, which is NOT a gateway cluster and which
      # `Container7` therefore does not rewrite. `.env.app.example` ships the deliberate
      # placeholder `http://dispatch-needs-ride-svc:8080`, and nothing here overrode it: the name
      # is NXDOMAIN, so every attempt to place an offer failed, the `ride.events` consumer never
      # committed an offset, and **every Mode C ride on this replica stayed in `Requested` for
      # ever**. `POST /v1/rides/request` still answers 202 and `GET .../state` still answers 200,
      # which is why the wave-5 contract sweep is green over a dispatch plane that dispatches
      # nothing — C129 found it by waiting for an offer that never came.
      #
      # 5106 is ride-svc's loopback port in this container: `Container7.FirstServicePort` is 5101
      # and ride-svc is sixth in `Container7.Services`. It is a position in a list, so it moves if
      # that list is reordered — `Container7Tests` is what makes such a move a failing test rather
      # than a silent 502, and the same reordering would move this line.
      Dispatch__RideServiceBaseUrl: http://127.0.0.1:5106
      # Δ MCS-07 — the same defect as the line above, one service along. `.env.app.example` ships
      # `Registry__OcrBaseUrl=http://ocr-svc:5000/` and `Fleet__OcrBaseUrl=http://app-services:8080`,
      # and **neither address exists on this network**: C054 planned ocr-svc as its own container
      # (`Dockerfile.ocr`), C125 instead folded it into THIS one — `Dockerfile.appservices` is
      # Debian and carries tesseract + opencv-data for exactly that reason — so there is no
      # `ocr-svc` host to resolve, and nothing listens on `app-services:8080` either. Every
      # extraction therefore died in `OcrDocumentExtractionClient`'s catch, came back
      # `DocumentExtraction.Unavailable`, and registry-svc wrote each required key with a NULL
      # value: the driver app drew the extract card with every row blank, on both Profile Setup
      # and the Mode-C wizard, and every vehicle needed a Verification Officer.
      #
      # The gateway port (5000) would NOT have worked either. ocr-svc is co-located but has **no
      # gateway cluster** (`Container7.ClustersElsewhere`'s remark says so), and C008 refuses the
      # `/v1/internal/**` prefix at the edge regardless — so the address has to be the service's
      # own loopback port, not the container's published one.
      #
      # 5118 is that port: `Container7.FirstServicePort` is 5101 and ocr-svc is EIGHTEENTH in
      # `Container7.Services`. A position in a list, exactly like ride-svc's above — `Container7Tests`
      # is what turns a reordering into a failing test rather than a silent 404.
      Registry__OcrBaseUrl: http://127.0.0.1:5118/
      Fleet__OcrBaseUrl: http://127.0.0.1:5118/
    volumes:
      # provisioning-svc's embedded step-ca (T-02). A bind mount rather than a named volume because
      # EMQX reads the same certs/ca_chain.crt as its 8883 cacertfile.
      - ../deploy/device-ca:/var/step
      # Δ C126 — the filesystem root every service writes bytes to when object storage is not the
      # destination. `Transit__Gtfs__StorageRoot=/var/lib/mageride/gtfs` is the one that has to
      # survive a container recreate: a ROLLBACK re-imports from the archived version's stored zip
      # (BR-32.3), so a lost zip is a version that can no longer be rolled back to — and on the
      # writable layer the next `deploy.sh` loses every one of them silently. Mounted at the ROOT
      # rather than at `…/gtfs` because the root is what `Dockerfile.appservices` creates as
      # `app:app`, and a volume mounted onto a path the image does not have is created root-owned
      # and unwritable by a non-root container (C125's defect #6, one layer down).
      - gtfsdata:/var/lib/mageride
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      emqx: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redpanda-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      # 23 pipelines compose here, not one.
      start_period: 180s
      retries: 10
    deploy:
      resources:
        limits: { memory: 3G, cpus: "1.5" }
    networks: [internal]

  # ===================================================================================
  # Container 8 — fanout (SignalR WebSocket server)           2 GB / 1.0 vCPU
  # ===================================================================================
  fanout:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args:
        # backend/src/Fanout/Dockerfile does not exist — docker-compose.dev.yml names it and nothing
        # ever created it. The C124 catalog builds fanout-svc from the shared template, so this does.
        SERVICE: Fanout.Api
    image: ${REPLICA_REGISTRY:-mageride}/fanout:${REPLICA_TAG:-replica}
    environment:
      # 5001, overriding Dockerfile.service's ASPNETCORE_URLS=http://+:5000. Three things already
      #name 5001 — this container's healthcheck, haproxy.replica.cfg's `fanout` backend, and the
      # gateway's fanout-svc cluster address — and docker-compose.dev.yml sets the same override.
      # Without it fanout listens on 5000, every one of those three points at a closed port, and the
      # container is reported unhealthy while the service itself is fine.
      ASPNETCORE_URLS: http://+:5001
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 9 — tcp-adapter (hardware tracker ingest)       512 MB / 0.5 vCPU
  # GT06/JT808/H02 arrive through HAProxy; NMEA is UDP and HAProxy has no UDP forwarder, so 5026
  # is published here directly (infra/CLAUDE.md records that deviation).
  # ===================================================================================
  tcp-adapter:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: backend/src/TcpAdapter/Dockerfile
    image: ${REPLICA_REGISTRY:-mageride}/tcp-adapter:${REPLICA_TAG:-replica}
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${ADAPTER_NMEA_UDP_PORT:-5026}:5026/udp"
    volumes:
      - ../deploy/device-ca:/var/step:ro
    depends_on:
      emqx: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # `nc -z` on the GT06 port, NOT an HTTP probe. tcp-adapter has no HTTP surface at all — its own
      # Dockerfile and docker-compose.dev.yml both healthcheck it this way, and the service's remarks
      # explain why the LISTENER is the right liveness signal: a device that connects while EMQX is
      # away is still served. My first version probed :5000/health/ready and reported the container
      # unhealthy while all four protocol listeners were up and working.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5023 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    networks: [internal]

  # ===================================================================================
  # Container 1 — haproxy (Edge)                              256 MB / 0.25 vCPU
  # The only container that publishes. TLS termination on 443; L4 passthrough for MQTTS (8883),
  # MQTT-over-WSS (8084) and the three TCP tracker protocols.
  # ===================================================================================
  haproxy:
    <<: *restart
    image: haproxy:2.9-alpine
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_HTTPS_PORT:-443}:443"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_MQTTS_PORT:-8883}:8883"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_MQTT_WSS_PORT:-8084}:8084"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_GT06_PORT:-5023}:5023"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_JT808_PORT:-5024}:5024"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_H02_PORT:-5025}:5025"
    volumes:
      - ./haproxy.replica.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../deploy/certs:/usr/local/etc/haproxy/certs:ro
    depends_on:
      emqx: { condition: service_healthy }
      app-services: { condition: service_healthy }
      fanout: { condition: service_started }
      tcp-adapter: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }
    networks: [internal]

  # ===================================================================================
  # OPTIONAL CONTAINERS — compose profiles, not part of the core budget.
  # `--profile voip --profile portals --profile monitoring`
  # ===================================================================================

  # Optional — voip: LiveKit SFU + coturn.                    1 GB / 0.5 vCPU
  # TURN media does NOT go through HAProxy: it is UDP, and HAProxy is L4/L7 TCP/HTTP. 3478/UDP and
  # the relay range are published on the host directly (the spec's own TIP).
  voip:
    <<: *restart
    profiles: [voip]
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${REPLICA_PUBLIC_IP:-127.0.0.1}"]
    volumes:
      - ./livekit.replica.yaml:/etc/livekit.yaml:ro
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:3478:3478/udp"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:50000-50100:50000-50100/udp"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1280M, cpus: "0.5" }
    networks: [internal]

  # Optional — admin-portal (admin.mageride.lk, AL-02).       512 MB / 0.25 vCPU
  admin-portal:
    <<: *restart
    profiles: [portals]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
      args:
        PORTAL: admin
        PORT: "3001"
    image: ${REPLICA_REGISTRY:-mageride}/admin-portal:${REPLICA_TAG:-replica}
    environment:
      # `MAGERIDE_API_BASE_URL`, and NOT a `NEXT_PUBLIC_*` name: the portal reads this on the
      # SERVER and `portals/admin/test/fences.test.ts` fails the build if any source file reads a
      # `NEXT_PUBLIC_` variable at all — the browser never learns where the gateway lives. It is
      # also REQUIRED: `src/config/env.ts` throws `MissingConfigurationError` when it is absent and
      # every request answers 503, which is a portal that starts, renders /login and can do nothing.
      #
      # `app-services:5000`, not `api-gateway:8080` as portals/*/.env.example shows: that is the
      # per-service dev shape, and the replica co-locates the YARP gateway with the domain services
      # in one process (spec Container 7). Same value, same reason, as haproxy.replica.cfg's
      # `backend api_gateway`. Internal hostname over plain HTTP — this call never leaves the
      # bridge network, so it neither needs the edge's self-signed cert nor public DNS.
      MAGERIDE_API_BASE_URL: http://app-services:5000
    depends_on:
      app-services: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.25" }
    networks: [internal]

  # Optional — fleet-portal (fleet.mageride.lk, AL-03).       512 MB / 0.25 vCPU
  fleet-portal:
    <<: *restart
    profiles: [portals]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
      args:
        PORTAL: fleet
        PORT: "3002"
    image: ${REPLICA_REGISTRY:-mageride}/fleet-portal:${REPLICA_TAG:-replica}
    environment:
      # Same as admin-portal above, and for the same two reasons: server-read name (no
      # `NEXT_PUBLIC_*`, enforced by the portal's own fence test) and Container 7's co-located
      # gateway rather than the per-service dev address in portals/fleet/.env.example.
      MAGERIDE_API_BASE_URL: http://app-services:5000
      # D-14's `tile-cdn`. A MapLibre STYLE DOCUMENT, not the `.pmtiles` archive: the native
      # apps bundle their style as an app resource and fetch only the archive, while a browser
      # fetches the style over HTTP and follows it. The style's own source URL is
      # `pmtiles://https://tiles.mageride.lk/lk.pmtiles`, which the `pmtiles` npm Protocol
      # resolves with range requests — same archive the apps read, same cartography.
      #
      # Public https, not an internal hostname: this one is fetched by the OPERATOR'S BROWSER,
      # not by the Next server, so a container-network address would be unreachable.
      # Unset, `mapStyleUrl()` returns null and SCR-FP-007 draws vehicles on an empty canvas.
      FLEET_PORTAL_MAP_STYLE_URL: https://tiles.mageride.lk/style.json
    depends_on:
      app-services: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.25" }
    networks: [internal]

  # Optional — www-site (www.mageride.lk, MCS-34 / C134).      384 MB / 0.25 vCPU
  www-site:
    <<: *restart
    profiles: [portals]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
      args:
        PORTAL: www
        PORT: "3004"
    image: ${REPLICA_REGISTRY:-mageride}/www-site:${REPLICA_TAG:-replica}
    # NO `environment:` block at all, and the absence is the point rather than an omission.
    #
    # No `MAGERIDE_API_BASE_URL`: this surface makes no request at render time (MCS-34's fourth
    # negative), so it has no gateway to name. The two portals above both REQUIRE that variable
    # and answer 503 without it; this one would have nothing to do with it, and giving it one
    # is the first step to breaking the promise. Its own fences refuse to read *any* environment
    # variable — `portals/www/test/fences.test.ts` fails on `process.env.` anywhere in the
    # source, and `scripts/check-bundle.mjs` fails if the public prefix reaches a client chunk.
    # The Dockerfile already sets NODE_ENV, TZ, PORT and the telemetry flag.
    #
    # No `depends_on: app-services` either, for the same reason — **this is the one container in
    # this file that is healthy while the platform is down**, which is exactly what it is for.
    # `smoke.sh` §9 stops `app-services` and asserts the site still answers 200 through the edge.
    #
    # 384 MB rather than the portals' 512: it holds no session, opens no upstream connection and
    # renders no map. The same number as the DOKS manifest's limit, from the same catalog entry.
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.25" }
    #
    # NO `healthcheck:` OVERRIDE HERE, and it is worth saying why not, because there was one.
    #
    # This is the container with no `depends_on`, so compose starts it in the FIRST wave —
    # alongside postgres, redpanda, emqx, minio and app-services' 22 services all booting at
    # once. It was therefore the first portal to exhaust its retries and abort `up --wait`,
    # which made the too-tight probe look like a www-site problem. It is not: measured on a
    # warm, idle, correctly-serving container, that probe takes 6.9s on fleet-portal, 12.8s
    # on admin-portal and 14.5s here, because `cpus: "0.25"` gives each of them a hard
    # quarter core and `node -e` is a cold start of a whole JavaScript runtime on it.
    #
    # So the fix belongs to all four portals and lives in `infra/docker/Dockerfile.portal`,
    # which now sets `--timeout=15s --start-period=90s`. A local override here would only
    # have hidden the same failure one container along, which is exactly what happened:
    # www-site went healthy and fleet-portal took its place.
    #
    # **Do not fix this by giving www-site a `depends_on`.** Starting it after the platform
    # would contradict the negative it exists to demonstrate, which `smoke.sh` §11 asserts
    # by stopping app-services and requiring the site to keep answering 200.
    networks: [internal]

  # ===================================================================================
  # NOT HERE, and named rather than stubbed:
  #
  #   nominatim   — 8 GB, "Host on separate VPS" (the spec's own instruction). It is deployed by
  #                 infra/replica/nominatim/deploy-nominatim.sh onto its own box at
  #                 http://45.77.37.208:8080 (a bare IP — that host has no domain name), and
  #                 QUERY-SVC reaches it over the network through Query__NominatimBaseUrl. Not
  #                 transit-svc, and not Transit__NominatimBaseUrl, which does not exist in the code:
  #                 transit-svc's /v1/geo/parse-maps-link resolves a Google-Maps short link and
  #                 touches no geocoder at all.
  #   osm-pipeline — a weekly one-shot, not steady state. `infra/replica/osm-refresh.sh`.
  #   monitoring   — C119 already owns the whole stack (Prometheus, Alertmanager, Loki, Promtail,
  #                 Tempo, Grafana, OTel Collector, exporters) in infra/observability/. Repeating it
  #                 here would be a second opinion about the same scrape config. `deploy.sh
  #                 --with-monitoring` brings that stack up against this one and counts its ~1.6 GB
  #                 toward the guardrail's budget.
  # ===================================================================================

volumes:
  pgdata:
  redisdata:
  redpandadata:
  emqxdata:
  miniodata:
  # Δ C126 — /var/lib/mageride inside app-services: the stored GTFS feed zips a rollback re-imports
  # from (BR-32.3's ≥ 12-month retention), plus whatever else lands on the filesystem fallback.
  gtfsdata:

networks:
  # One bridge network, as the spec's service map says. No container is on the host network.
  internal:
    driver: bridge
