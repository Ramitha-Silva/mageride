# =====================================================================================
# MageRide — lightweight production replica (C125).
#
# `specs/lightweight-production-replica.md` §"Container Layout" and §"Resource Summary", on one
# VPS. Eleven core containers carrying 27+ logical services, plus five optional ones behind compose
# profiles.
#
#   bash infra/replica/deploy.sh            # guardrails, then up
#   bash infra/replica/deploy.sh --dry-run  # every check, nothing started
#   bash infra/replica/down.sh              # stop; add --volumes to discard the data
#
# ------------------------------------------------------------------------------------
# SYNTHETIC DATA ONLY. NEVER PRODUCTION DATA.
# ------------------------------------------------------------------------------------
# This stack exists for testing, CI and demos (root CLAUDE.md, D7' §8). Everything in it is
# generated by `infra/replica/seed.sh`. It runs one Postgres with no replica, one Redpanda broker at
# RF=1, one HAProxy with no VRRP peer, and self-signed TLS — a single-point-of-failure stack by
# design. Restoring a production dump into it would put real riders' phone numbers and real drivers'
# documents on a box whose edge is publicly reachable with a certificate nothing trusts.
#
# ------------------------------------------------------------------------------------
# THIS BOX ALSO HOSTS THE BUILD, AND THE TWO DO NOT FIT TOGETHER.
# ------------------------------------------------------------------------------------
# The root CLAUDE.md says it outright: ~19 GB of replica plus a `dotnet build` does not fit in 24 GB.
# `infra/replica/guardrail.sh` refuses to start while a heavy build is running and is what
# `deploy.sh` calls first — it is not advisory.
#
# ------------------------------------------------------------------------------------
# ITS OWN COMPOSE PROJECT, DELIBERATELY.
# ------------------------------------------------------------------------------------
# `mageride-replica`, not `mageride`. All three dev stacks (slim, full, observability) share the
# `mageride` project and its volumes, which is why `infra/CLAUDE.md` warns that
# `--remove-orphans` on any one of them deletes the others' containers. A separate project means the
# replica cannot be caught by that, cannot collide with a dev Postgres on the same volume, and can be
# torn down without touching anything a developer is using.
#
# ------------------------------------------------------------------------------------
# ONLY THE EDGE PUBLISHES A PORT.
# ------------------------------------------------------------------------------------
# HAProxy publishes; every other container is reachable only on the internal network. The spec's
# tables list "Ports exposed" for `haproxy` alone and internal ports for the rest, and this box has a
# public IP — publishing Postgres, Redis, EMQX's dashboard or MinIO's console on it would be a
# different decision than the one the spec made. `REPLICA_EDGE_BIND` closes even the edge
# (`REPLICA_EDGE_BIND=127.0.0.1`) for a run that only needs the smoke suite.
# =====================================================================================

name: mageride-replica

# -------------------------------------------------------------------------------------
# Anchors. The replica's env layering is the dev stack's, deliberately: the example files ARE the
# default configuration layer and the real files (gitignored, absent by default) override them.
# Nothing copies one to the other — a copy made once would shadow every later edit.
# -------------------------------------------------------------------------------------
x-app-env: &app-env
  env_file:
    - path: ../env/.env.common.example
      required: true
    - path: ../env/.env.common
      required: false
    - path: ../env/.env.app.example
      required: true
    - path: ../env/.env.app
      required: false
    # Replica-only overrides, last so they win. Gitignored; `deploy.sh` writes it from
    # `.env.replica.example` on first run.
    - path: .env.replica
      required: false

x-restart: &restart
  restart: unless-stopped

services:

  # ===================================================================================
  # Container 5 — postgres (System of Record + TimescaleDB)   4 GB / 1.0 vCPU
  # ===================================================================================
  postgres:
    <<: *restart
    image: timescale/timescaledb-ha:pg16
    # `timescaledb` only. PostGIS has no preloadable library and the postmaster refuses to start if
    # it is named here — the deviation is recorded in infra/CLAUDE.md and is load-bearing.
    command:
      - "-c"
      - "shared_preload_libraries=timescaledb"
      - "-c"
      - "max_connections=200"
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mageride_replica}
      POSTGRES_DB: ${PG_DATABASE:-mageride}
      POSTGRES_USER: ${PG_USER:-postgres}
    volumes:
      # `/home/postgres/pgdata`, which is timescaledb-ha's PGDATA. The spec's
      # /var/lib/postgresql/data is the official postgres image's path and makes first boot fail.
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-mageride}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 4G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # pgbouncer — transaction-mode pooler (M-5)                 128 MB / 0.25 vCPU
  # Every service reaches Postgres through this, never :5432 directly.
  # ===================================================================================
  pgbouncer:
    <<: *restart
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${PG_USER:-postgres}
      DB_PASSWORD: ${PG_PASSWORD:-mageride_replica}
      DB_NAME: ${PG_DATABASE:-mageride}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: ${PG_USER:-postgres}
      LISTEN_PORT: "6432"
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "25"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    networks: [internal]

  # ===================================================================================
  # Container 4 — redis (Live State + Geo Index)              1.5 GB / 0.5 vCPU
  # ===================================================================================
  redis:
    <<: *restart
    image: redis:7-alpine
    # `noeviction` on purpose: geo:live and the dispatch locks are not a cache, and silently
    # evicting a ride lock is worse than refusing a write. `notify-keyspace-events Ex` is what the
    # expiry listeners need.
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
       "--maxmemory", "1200mb", "--maxmemory-policy", "noeviction",
       "--notify-keyspace-events", "Ex"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 1536M, cpus: "0.5" }
    networks: [internal]

  # ===================================================================================
  # Container 3 — redpanda (Event Backbone, single broker RF=1)  1 GB / 0.5 vCPU
  # ===================================================================================
  redpanda:
    <<: *restart
    image: redpandadata/redpanda:v24.2.26
    # `rpk redpanda mode production` BEFORE start: the image ships developer_mode: true and rpk
    # then adds --unsafe-bypass-fsync, which is not what "production replica" should mean.
    command:
      - /bin/sh
      - -c
      - |
        rpk redpanda mode production
        exec /usr/bin/rpk redpanda start \
          --smp=1 \
          --overprovisioned \
          --node-id=0 \
          --memory=1G \
          --reserve-memory=0M \
          --check=false \
          --kafka-addr=internal://0.0.0.0:9092 \
          --advertise-kafka-addr=internal://redpanda:9092
    volumes:
      - redpandadata:/var/lib/redpanda/data
      - ../deploy/redpanda/bootstrap-topics.sh:/opt/mageride/bootstrap-topics.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1G, cpus: "0.5" }
    networks: [internal]

  redpanda-init:
    image: redpandadata/redpanda:v24.2.26
    entrypoint: ["/bin/sh", "/opt/mageride/bootstrap-topics.sh"]
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_PARTITIONS: "3"
      REDPANDA_REPLICAS: "1"
    volumes:
      - ../deploy/redpanda/bootstrap-topics.sh:/opt/mageride/bootstrap-topics.sh:ro
    depends_on:
      redpanda: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # Container 2 — emqx (MQTT Broker)                          2 GB / 1.0 vCPU
  # ===================================================================================
  emqx:
    <<: *restart
    image: emqx/emqx:5.8
    environment:
      # The whole authenticator is in deploy/emqx/emqx.conf; only the secret comes from here. The
      # key is MECHANISM, not TYPE — D7' §4.2's spelling does not work and the deviation is
      # recorded in infra/CLAUDE.md.
      EMQX_AUTHENTICATION__1__SECRET: ${MQTT_JWT_SECRET:?the replica needs an MQTT JWT secret}
    volumes:
      - emqxdata:/opt/emqx/data
      - ../deploy/emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ../deploy/emqx/acl.conf:/opt/emqx/etc/mageride-acl.conf:ro
      # The device CA chain, generated on the host by infra/scripts/ensure-device-ca.sh. EMQX reads
      # certs/ca_chain.crt as its 8883 cacertfile at listener start, so it must exist before this
      # container does — deploy.sh calls that script.
      - ../deploy/device-ca:/opt/emqx/etc/device-ca:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 10 — minio (S3-compatible object storage)       256 MB / 0.25 vCPU
  # ===================================================================================
  minio:
    <<: *restart
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mageride_replica}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?the replica needs a MinIO root password}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?the replica needs a MinIO KMS key for SSE}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }
    networks: [internal]

  minio-init:
    image: minio/minio:latest
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        for b in mageride-documents mageride-proofs mageride-profile mageride-screenshots mageride-backups; do
          mc mb --ignore-existing "local/$$b"
        done
        mc ls local
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mageride_replica}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # migrate — the one-shot schema apply. Everything below waits for it to COMPLETE.
  # ===================================================================================
  migrate:
    build:
      context: ../..
      dockerfile: backend/src/MageRide.Migrations/Dockerfile
    image: mageride/migrate:replica
    environment:
      # Straight to :5432, not through the pooler: DbUp takes an advisory lock for the run and a
      # transaction-mode pooler can hand the next statement to a different backend.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${PG_DATABASE:-mageride};Username=${PG_USER:-postgres};Password=${PG_PASSWORD:-mageride_replica}"
      MIGRATE_WAIT_SECONDS: "120"
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  # ===================================================================================
  # Container 6 — hot-path                                    2 GB / 1.0 vCPU
  # mqtt-bridge + position-processor + persistence-writer + fleet-health, one process.
  # No ports: internal consumers only.
  # ===================================================================================
  hot-path:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
      args:
        SERVICE: HotPath
    image: mageride/hot-path:replica
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      emqx: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      # persistence-writer is the first service in the list and therefore owns 5200. Any of the four
      # answering proves the umbrella host got past start-up; CoLocatedHost exits non-zero if any of
      # them failed, so a running container means all four started.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5200/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 7 — app-services                                3 GB / 1.5 vCPU
  # YARP gateway + the 22 domain services, one process, one published port (5000).
  # ===================================================================================
  app-services:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.appservices
    image: mageride/app-services:replica
    environment:
      # The three clusters that are NOT in this container. Everything co-located here is pointed at
      # its own loopback port by the host itself — see backend/src/AppServices/Container7.cs.
      ReverseProxy__Clusters__fanout-svc__Destinations__primary__Address: http://fanout:5001/
      ReverseProxy__Clusters__fleet-health-svc__Destinations__primary__Address: http://hot-path:5203/
      ReverseProxy__Clusters__voip-svc__Destinations__primary__Address: http://voip:5000/
    volumes:
      # provisioning-svc's embedded step-ca (T-02). A bind mount rather than a named volume because
      # EMQX reads the same certs/ca_chain.crt as its 8883 cacertfile.
      - ../deploy/device-ca:/var/step
    depends_on:
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      emqx: { condition: service_healthy }
      minio: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      redpanda-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health/ready >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      # 23 pipelines compose here, not one.
      start_period: 180s
      retries: 10
    deploy:
      resources:
        limits: { memory: 3G, cpus: "1.5" }
    networks: [internal]

  # ===================================================================================
  # Container 8 — fanout (SignalR WebSocket server)           2 GB / 1.0 vCPU
  # ===================================================================================
  fanout:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.service
      args:
        # backend/src/Fanout/Dockerfile does not exist — docker-compose.dev.yml names it and nothing
        # ever created it. The C124 catalog builds fanout-svc from the shared template, so this does.
        SERVICE: Fanout.Api
    image: mageride/fanout:replica
    depends_on:
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5001/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 2G, cpus: "1.0" }
    networks: [internal]

  # ===================================================================================
  # Container 9 — tcp-adapter (hardware tracker ingest)       512 MB / 0.5 vCPU
  # GT06/JT808/H02 arrive through HAProxy; NMEA is UDP and HAProxy has no UDP forwarder, so 5026
  # is published here directly (infra/CLAUDE.md records that deviation).
  # ===================================================================================
  tcp-adapter:
    <<: [*restart, *app-env]
    build:
      context: ../..
      dockerfile: backend/src/TcpAdapter/Dockerfile
    image: mageride/tcp-adapter:replica
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${ADAPTER_NMEA_UDP_PORT:-5026}:5026/udp"
    volumes:
      - ../deploy/device-ca:/var/step:ro
    depends_on:
      emqx: { condition: service_healthy }
      redis: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    networks: [internal]

  # ===================================================================================
  # Container 1 — haproxy (Edge)                              256 MB / 0.25 vCPU
  # The only container that publishes. TLS termination on 443; L4 passthrough for MQTTS (8883),
  # MQTT-over-WSS (8084) and the three TCP tracker protocols.
  # ===================================================================================
  haproxy:
    <<: *restart
    image: haproxy:2.9-alpine
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_HTTPS_PORT:-443}:443"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_MQTTS_PORT:-8883}:8883"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_MQTT_WSS_PORT:-8084}:8084"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_GT06_PORT:-5023}:5023"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_JT808_PORT:-5024}:5024"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:${HAPROXY_H02_PORT:-5025}:5025"
    volumes:
      - ./haproxy.replica.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ../deploy/certs:/usr/local/etc/haproxy/certs:ro
    depends_on:
      emqx: { condition: service_healthy }
      app-services: { condition: service_healthy }
      fanout: { condition: service_started }
      tcp-adapter: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /usr/local/etc/haproxy/haproxy.cfg >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M, cpus: "0.25" }
    networks: [internal]

  # ===================================================================================
  # OPTIONAL CONTAINERS — compose profiles, not part of the core budget.
  # `--profile voip --profile portals --profile monitoring`
  # ===================================================================================

  # Optional — voip: LiveKit SFU + coturn.                    1 GB / 0.5 vCPU
  # TURN media does NOT go through HAProxy: it is UDP, and HAProxy is L4/L7 TCP/HTTP. 3478/UDP and
  # the relay range are published on the host directly (the spec's own TIP).
  voip:
    <<: *restart
    profiles: [voip]
    image: livekit/livekit-server:latest
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${REPLICA_PUBLIC_IP:-127.0.0.1}"]
    volumes:
      - ./livekit.replica.yaml:/etc/livekit.yaml:ro
    ports:
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:3478:3478/udp"
      - "${REPLICA_EDGE_BIND:-0.0.0.0}:50000-50100:50000-50100/udp"
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 1G, cpus: "0.5" }
    networks: [internal]

  # Optional — admin-portal (admin.mageride.lk, AL-02).       512 MB / 0.25 vCPU
  admin-portal:
    <<: *restart
    profiles: [portals]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
      args:
        PORTAL: admin
        PORT: "3001"
    image: mageride/admin-portal:replica
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${REPLICA_HOSTNAME:-localhost}
    depends_on:
      app-services: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.25" }
    networks: [internal]

  # Optional — fleet-portal (fleet.mageride.lk, AL-03).       512 MB / 0.25 vCPU
  fleet-portal:
    <<: *restart
    profiles: [portals]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.portal
      args:
        PORTAL: fleet
        PORT: "3002"
    image: mageride/fleet-portal:replica
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://${REPLICA_HOSTNAME:-localhost}
    depends_on:
      app-services: { condition: service_healthy }
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.25" }
    networks: [internal]

  # ===================================================================================
  # NOT HERE, and named rather than stubbed:
  #
  #   nominatim   — 8 GB, "Host on separate VPS" (the spec's own instruction). It is deployed by
  #                 infra/replica/nominatim/deploy-nominatim.sh onto its own box; app-services
  #                 reaches it over the network through Transit__NominatimBaseUrl.
  #   osm-pipeline — a weekly one-shot, not steady state. `infra/replica/osm-refresh.sh`.
  #   monitoring   — C119 already owns the whole stack (Prometheus, Alertmanager, Loki, Promtail,
  #                 Tempo, Grafana, OTel Collector, exporters) in infra/observability/. Repeating it
  #                 here would be a second opinion about the same scrape config. `deploy.sh
  #                 --with-monitoring` brings that stack up against this one and counts its ~1.6 GB
  #                 toward the guardrail's budget.
  # ===================================================================================

volumes:
  pgdata:
  redisdata:
  redpandadata:
  emqxdata:
  miniodata:

networks:
  # One bridge network, as the spec's service map says. No container is on the host network.
  internal:
    driver: bridge
