# Rate limit for the viewer's geocode proxy (see the /search location in
# sites-available/tiles.mageride.lk). Must live in the http context, which is why it is a
# conf.d file and not part of the server block.
#
# 2 r/s per client IP with a small burst: a person typing in a search box makes one request
# per submit, so this is generous for a human and useless for a scraper. The geocoder is a
# single 8 GB box that also answers the platform, and it must not be knocked over by whoever
# finds the viewer URL.
limit_req_zone $binary_remote_addr zone=geocode:10m rate=2r/s;
