# =====================================================================================
# nginx site for tiles.mageride.lk — the PMTiles archive, the glyphs, the viewer and the
# geocode proxy. Installed by `infra/replica/tiles/deploy-tiles.sh` (step 6).
#
# THIS FILE IS HTTP-ONLY ON PURPOSE. certbot's nginx plugin adds the `listen 443 ssl`
# block, the certificate paths and the :80 -> :443 redirect on top of a working HTTP server
# block, and that is what step 8 runs. Committing the TLS half would make `nginx -t` fail on
# any box that has no certificate yet — which is every fresh box — and the config would be
# rejected before certbot ever got a chance to issue one.
#
# On a box that already has a certificate, re-running deploy-tiles.sh reinstalls this file
# and certbot puts the TLS half straight back (`--keep-until-expiring` reuses the cert).
#
# There is NO TILE SERVER here. `lk.pmtiles` is one static file and every client reads tiles
# out of it with HTTP range requests, so `Accept-Ranges` — which nginx's static handler sets
# by itself — is the whole serving mechanism.
# =====================================================================================
server {
    listen 80;
    server_name tiles.mageride.lk;
    root /var/www/tiles;

    # CORS — the Android/iOS apps and MapLibre need this
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;

    # Handle preflight
    if ($request_method = OPTIONS) {
        return 204;
    }

    # PMTiles archives. `add_header` does not inherit into a location that sets any
    # of its own, so the CORS set is repeated here rather than relied upon.
    # Accept-Ranges comes from nginx's static handler and is what the PMTiles
    # client depends on: it reads the header, then the directory, then single tiles.
    location ~* \.pmtiles$ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        types { }
        default_type application/octet-stream;
    }

    # SDF glyph PBFs for map labels.
    #
    # `Inter Regular` here is a SYMLINK to `Noto Sans Regular` — see deploy-tiles.sh. Styles
    # shipped inside existing APKs and IPAs name the former, so the symlink is load-bearing
    # for those installs even though nothing upstream ships an Inter glyph set.
    location /fonts/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
        types { }
        default_type application/x-protobuf;
    }

    # --- geocoding, for viewer.html's search box --------------------------------------
    # Proxied to Nominatim over THIS HOST'S LOOPBACK. The ufw rule that denies 8080 to
    # everyone except the replica box (169.58.43.92) is deliberately left untouched:
    # 127.0.0.1 never traverses the INPUT chain's public path, so the geocoder gains no
    # new listener and the platform's own access is unchanged.
    #
    # `location = /search` and GET only. /status, /reverse, /details, /lookup and the rest
    # of the Nominatim API stay unreachable from the internet — this opens one endpoint,
    # not the geocoder.
    #
    # The `geocode` limit_req zone is declared in conf.d/mageride-geocode.conf, because a
    # limit_req_zone must live in the http context and this is a server block.
    location = /search {
        limit_req zone=geocode burst=5 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080/search;
        proxy_set_header Host $host;
        # Nominatim 4.4 answers 406 to a bare `Accept: application/json` — it negotiates
        # only when */* is present, and the response format is chosen by the `format=`
        # QUERY parameter regardless. Normalising here makes the endpoint immune to what
        # any client sends rather than fixing one caller.
        proxy_set_header Accept "*/*";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Access-Control-Allow-Origin "*" always;
        default_type application/json;
    }

    # ES modules. nginx's mime.types has no `.mjs` entry, so these went out as
    # application/octet-stream and a browser REFUSES to execute a module script with a
    # non-JavaScript MIME type ("Failed to load module script … strict MIME type checking
    # is enforced"). maplibre-gl.mjs is loaded by `<script type="module">`, so the viewer
    # is blank without this and nothing in the network tab looks like an error.
    location ~* \.mjs$ {
        types { }
        default_type text/javascript;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        # `$uri/` so a bare / resolves through index.html to the viewer.
        index index.html;
        try_files $uri $uri/ =404;
    }
}
