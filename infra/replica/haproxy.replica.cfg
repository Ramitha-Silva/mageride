# =====================================================================================
# HAProxy 2.9 — MageRide edge, lightweight production replica (C125).
#
# Spec: `lightweight-production-replica.md` "Container 1 — haproxy", D7' §2.1, ADD §12.2.
#
# TLS termination for HTTPS/WSS on 443; L4 TCP passthrough for MQTTS (8883), MQTT-over-WSS (8084)
# and the three per-protocol tracker ports (5023-5025). One instance — SPOF accepted, as the spec
# says; production is 2x HAProxy + Keepalived VRRP (D7' §8).
#
# ------------------------------------------------------------------------------------
# HOW THIS DIFFERS FROM infra/deploy/haproxy.cfg, AND WHY IT IS A SEPARATE FILE
# ------------------------------------------------------------------------------------
# One difference, and it is structural rather than cosmetic: in the dev stack the YARP gateway is
# its OWN container (`api-gateway:5000`), and in the replica it is INSIDE Container 7 with the 22
# domain services (`app-services:5000`) because that is what the spec's Container 7 says. A backend
# cannot be both, and HAProxy 2.9 has no include directive to share the other 200 lines, so the
# file is duplicated deliberately. `deploy.sh` runs `haproxy -c` over both so a syntax error in
# either is caught in the same run.
#
# Everything else is deliberately identical to the dev file, including the two security denies
# below — if they diverge, the dev stack stops resembling the thing being demoed.
#
# ------------------------------------------------------------------------------------
# 5026/UDP IS NOT HERE AND CANNOT BE
# ------------------------------------------------------------------------------------
# The spec's Container 1 table lists `5026 (NMEA UDP)` among HAProxy's ports. HAProxy has no UDP
# forwarder — its only UDP support is syslog and DNS — so the NMEA port is published straight off
# the `tcp-adapter` container. The same spec already states the constraint for TURN media: "HAProxy
# is L4/L7 TCP/HTTP and cannot relay UDP media efficiently".
# =====================================================================================

global
    log stdout format raw local0 info
    maxconn 20000
    # The replica's certificate is self-signed, generated by deploy.sh into infra/deploy/certs/.
    # NOTHING TRUSTS IT, AND NOTHING SHOULD: this stack carries synthetic data and its edge is
    # publicly reachable. A real mageride.lk certificate belongs on the production DOKS ingress,
    # not here.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    tune.ssl.default-dh-param 2048

defaults
    log     global
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s

# Docker's embedded DNS. Without a resolver HAProxy caches the IP a backend had at start-up, so a
# `docker compose restart app-services` silently blackholes the edge.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
    hold nx    1s
    hold other 1s

# -------------------------------------------------------------------------------------
# Operator surface — internal only, never published to the host. The compose file publishes
# 443/8883/8084/5023-5025 and nothing else, so reaching /stats means being inside the network.
# -------------------------------------------------------------------------------------
frontend stats
    bind 0.0.0.0:8404
    mode http
    monitor-uri /healthz
    stats enable
    stats uri /stats
    stats refresh 10s

# =====================================================================================
# 443 — HTTPS + WSS (REST API, SignalR, both portals, presigned object URLs)
# =====================================================================================
frontend https
    # A SINGLE combined pem, named explicitly — not the directory.
    #
    # `crt <dir>` makes HAProxy load every file in it as a certificate and look for `<file>.key`
    # beside each, so a directory holding cert.crt + cert.key + cert.pem fails with "No Private Key
    # found in mageride-dev.crt.key". infra/deploy/haproxy.cfg pointed at the directory and had the
    # same defect from C009: it could never have started, and nothing ever ran it because the dev
    # stack could not come up without the app-services image.
    bind 0.0.0.0:443 ssl crt /usr/local/etc/haproxy/certs/replica.pem alpn h2,http/1.1
    mode http
    option httplog
    option forwardfor
    http-request set-header X-Forwarded-Proto https

    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # --- Never publish the internal operator endpoints (C008 handoff) -----------------
    # MageRide.Shared maps /health/live, /health/ready and /metrics anonymously on every service,
    # which is right for an internal service and wrong for a public edge: /health/ready names every
    # dependency it probes and /metrics is the whole internal topology. 404 rather than 403 — a 403
    # confirms the path exists.
    #
    # This matters MORE here than in dev: the replica's edge is reachable from the internet.
    http-request deny deny_status 404 if { path -i -m beg /health/ /metrics }
    http-request deny deny_status 404 if { path -i /health }

    # --- /v1/internal/** is mTLS-only (D3' §0) ----------------------------------------
    # The gateway refuses these too (C008 decision 3); refusing at the edge as well means a
    # misconfigured gateway route cannot expose them.
    http-request deny deny_status 404 if { path -i -m beg /v1/internal/ }

    acl host_admin hdr(host) -i -m beg admin.
    acl host_fleet hdr(host) -i -m beg fleet.
    acl host_www   hdr(host) -i -m beg www.
    acl host_s3    hdr(host) -i -m beg s3.
    acl is_hub     path -i -m beg /hubs/

    # --- the apex 301 (MCS-34 / C134 · S21's mr-ingress-apex, without an object model) ----
    # In DOKS this is a FOURTH Ingress object, because ingress-nginx annotations are
    # object-scoped and `permanent-redirect` on the shared portals object would 301 the admin
    # console to the marketing site. HAProxy has no equivalent object model, so the same
    # decision is an explicit rule — and the same hazard applies, one line lower down.
    #
    # **EXACT match on the bare apex, and every part of that is load-bearing here.** A prefix
    # match would be wrong twice: `-m beg mageride.lk` catches nothing useful, and the obvious
    # `-m end mageride.lk` would catch `admin.`, `fleet.`, `www.` AND the replica's own default
    # host — which is `replica.mageride.lk` and routes to `api_gateway` by `default_backend`.
    # A redirect there would 301 every API call in `smoke.sh` to the marketing site. So the
    # port is stripped and the whole remaining host must equal `mageride.lk` and nothing else.
    #
    # It is above the `use_backend` lines because `http-request redirect` is evaluated in
    # order and has to fire before a backend is chosen. `smoke.sh` §10 asserts both halves:
    # that the apex redirects, and that the other four hosts do not.
    acl host_apex req.hdr(host),lower,field(1,:) -m str mageride.lk
    http-request redirect location https://www.mageride.lk%[capture.req.uri] code 301 if host_apex

    use_backend admin_portal if host_admin
    use_backend fleet_portal if host_fleet
    use_backend www_site     if host_www
    use_backend object_store if host_s3
    use_backend fanout       if is_hub
    default_backend api_gateway

# --- REST API — Container 7's gateway ------------------------------------------------
# `app-services:5000`, NOT `api-gateway:5000`: the replica co-locates the YARP gateway with the 22
# domain services in one process (spec Container 7). This is the one line that differs from the dev
# config, and backend/src/AppServices/Container7.cs is what makes it true.
backend api_gateway
    mode http
    balance roundrobin
    option httpchk GET /health/ready
    http-check expect status 200
    # `init-addr none`: the server starts DOWN at 0.0.0.0 and the resolver above brings it up within
    # a second of the container appearing. With `libc` HAProxy blocks on a synchronous getaddrinfo
    # per unresolvable name before it binds a single port — which on a cold `up` is every backend.
    server gw app-services:5000 check resolvers docker init-addr none

# --- SignalR (R-06 geocell groups, Mode B entitlement, proxy booking) -----------------
backend fanout
    mode http
    balance roundrobin
    # A live-map socket is quiet between position pushes; the default 60 s server timeout would drop
    # it. `timeout tunnel` governs the connection once it has been upgraded.
    timeout tunnel 1h
    option httpchk GET /health/ready
    http-check expect status 200
    server fanout fanout:5001 check resolvers docker init-addr none

# --- Admin Portal (AL-02) — optional container, `--profile portals` -------------------
backend admin_portal
    mode http
    server admin admin-portal:3001 check resolvers docker init-addr none

# --- Fleet Portal (AL-03) — optional container, `--profile portals` -------------------
backend fleet_portal
    mode http
    server fleet fleet-portal:3002 check resolvers docker init-addr none

# --- www-site (MCS-34) — optional container, `--profile portals` ----------------------
# No `option httpchk` on this one, unlike `api_gateway` and `fanout` above: those probe
# `/health/ready`, and this surface has no health endpoint because it has nothing to report on
# — no upstream, no database, no session store. A plain TCP `check` is the honest test of a
# static site: the process is either listening or it is not. `/` would work as a probe (it
# answers 307 to the negotiated locale, and HAProxy would accept that), but a check that
# exercises Accept-Language negotiation to decide whether a container is alive is testing the
# wrong thing.
backend www_site
    mode http
    server www www-site:3004 check resolvers docker init-addr none

# --- MinIO / S3 ----------------------------------------------------------------------
# A vhost on 443 rather than a new port. The spec's Container 10 says MinIO's API is "behind HAProxy
# passthrough" while Container 1's port list has no entry for it; presigned upload and download URLs
# for driver documents and proof-of-delivery photos are handed to a phone, so the object store has
# to be reachable from outside the docker network or the documents flow only works from inside it.
# Production swaps this backend for R2/Wasabi and the vhost disappears.
backend object_store
    mode http
    server minio minio:9000 check resolvers docker init-addr none

# =====================================================================================
# 8883 — MQTTS, L4 passthrough to EMQX (hardware trackers; EMQX terminates TLS itself with the
# device CA chain, which is why this is passthrough and not re-encryption).
# =====================================================================================
frontend mqtts
    bind 0.0.0.0:8883
    mode tcp
    option tcplog
    # A tracker on a rural GSM link can idle far longer than a browser.
    timeout client 4h
    default_backend emqx_mqtts

backend emqx_mqtts
    mode tcp
    timeout server 4h
    server emqx emqx:8883 check resolvers docker init-addr none

# =====================================================================================
# 8084 — MQTT over WSS for mobile clients that cannot open raw TCP/8883.
# A dedicated port rather than ALPN/SNI multiplexing on 443, "for simpler routing" (Container 1).
# =====================================================================================
frontend mqtt_wss
    bind 0.0.0.0:8084
    mode tcp
    option tcplog
    timeout client 1h
    default_backend emqx_wss

backend emqx_wss
    mode tcp
    timeout server 1h
    server emqx emqx:8084 check resolvers docker init-addr none

# =====================================================================================
# 5023-5025 — hardware tracker protocol ports, L4 passthrough to tcp-adapter (T-01).
# Persistent device sockets, not request/response, hence the 4 h timeouts.
# 5026 (NMEA/UDP) is published directly by tcp-adapter — see the header.
# =====================================================================================
frontend tracker_gt06
    bind 0.0.0.0:5023
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_gt06

backend adapter_gt06
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5023 check resolvers docker init-addr none

frontend tracker_jt808
    bind 0.0.0.0:5024
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_jt808

backend adapter_jt808
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5024 check resolvers docker init-addr none

frontend tracker_h02
    bind 0.0.0.0:5025
    mode tcp
    option tcplog
    timeout client 4h
    default_backend adapter_h02

backend adapter_h02
    mode tcp
    timeout server 4h
    server adapter tcp-adapter:5025 check resolvers docker init-addr none
