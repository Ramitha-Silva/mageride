# MageRide — Build Manifest
# Produced by C0 (build planner). Source of truth = specs/ ; this file is the build plan only.
#
# Waves
#   0  Foundation ....... repo scaffold, shared kernel, PostgreSQL DDL (core + Timescale),
#                         OpenAPI conversion, YARP gateway, Docker Compose dev, CI skeleton
#   1  KMP shared module . models, API client, auth, domain, geo/realtime, local DB, test kit
#   2  Core backend ..... walking-skeleton milestone (C020-C025) then the 14 core services
#   3  Business backend . wallet/fee/fare/notify/safety/support/ocr/content/voip/transit/
#                         fleet/admin-bff/public-bff/analytics
#   4a Android apps ..... Driver + Passenger (shell + 8 screen groups each)
#   4b iOS apps ......... parity-fenced to 4a; every verify_cmd runs on macOS
#   4c Portals .......... Tailwind preset, Admin Portal, Fleet Portal, Web Passenger subview
#   5  Integration ...... contract tests, observability, E2E flows, CI/CD, replica deploy,
#                         day-0 GTFS full-feed load
#   6  Hardening ........ security/ASVS, anti-spoof, load, chaos, SG acceptance, DOKS readiness
#
# Rules encoded in every prompt:
#   - Specs win over code. Deviating from a spec or a wireframe requires a micro-change-set first.
#   - ride-svc (Mode C) != trip-state-svc (Mode A/B). Never cross the R-01 fence.
#   - Dapper over Npgsql only. Any EF Core / DbContext / LINQ-to-SQL in generated code is a bug (AL-53).
#   - Tailwind CSS is the sole styling system on every web surface (AL-52).
#   - Money is integer minor units; all user-facing strings are Si/Ta/En resources.
#   - Wireframes are the team-approved structural/functional baseline for every screen.

