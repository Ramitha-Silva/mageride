# =====================================================================================
# MageRide CI (C010) — D7' §7.
#
# The entry point only. Full CD — ArgoCD, image promotion by SHA tag, rollback — is C124.
#
# Jobs, and the component verify each one runs (see .github/workflows/README.md):
#   build (backend)   C001 C002 C008 C010   dotnet build + test + the container templates
#   build (android)   C001 C011-C019        gradle; grows as the KMP modules land
#   build (ios)       C085-C102             macos-14 ONLY; never on Linux. **ADVISORY** — see
#                                           the matrix entry: 67 uncompiled Swift errors, needs a Mac
#   build (portal)    C001 C103-C117        npm ci + build + lint
#   contracts         C007                  spectral lint over backend/contracts/*.yaml
#   migrations        C003-C006             apply twice; a non-no-op second run fails
#   compose           C009                  slim stack healthy + the EMQX/topic assertions
# =====================================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: >-
          Also build the iOS leg. Off by default: it runs on macos-14, which GitHub bills at a
          10x multiplier, and it is known to fail (see the `plan` job's summary).
        type: boolean
        default: false

# A second push to the same branch supersedes the first. main is excluded: every commit
# there is a release candidate and must have its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  # D-38: business dates settle in Asia/Colombo, so a runner in UTC must not be the thing
  # that makes a date test pass.
  TZ: Asia/Colombo

jobs:
  # ===================================================================================
  # Which legs run. Only ios is ever in question, and only because of what it costs.
  #
  # A job-level `if` cannot reference the `matrix` context, so a leg cannot be skipped by
  # condition once it is in the matrix — GitHub provisions the runner and starts billing before
  # any step is evaluated. The only way not to pay for a macOS runner is for the matrix not to
  # name it, which is why this job exists rather than an `if:` on the leg.
  # ===================================================================================
  plan:
    name: which legs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - name: pick the legs
        id: pick
        run: |
          set -euo pipefail
          legs='[{"target":"backend","runner":"ubuntu-latest","advisory":false},
                 {"target":"android","runner":"ubuntu-latest","advisory":false},
                 {"target":"portal","runner":"ubuntu-latest","advisory":false}]'

          # Requested by hand, or by putting the `run-ios` label on a pull request. NOT on a
          # schedule and NOT on push: the leg's answer is currently known ("fails"), so paying
          # 10x for it on every commit buys nothing.
          #
          # When it IS requested it is BINDING, not advisory. The only reason to ask for it is to
          # find out whether the Swift compiles, and an advisory leg answers that question with a
          # green tick.
          if [ "$DISPATCH_IOS" = "true" ] || [ "$HAS_LABEL" = "true" ]; then
            legs=$(printf '%s' "$legs" | sed 's/\]$/,{"target":"ios","runner":"macos-14","advisory":false}]/')
            echo "::notice::the ios leg is included and is binding"
          else
            {
              echo "### iOS leg not built"
              echo
              echo "\`apps/driver-ios/\` has **67 unique Swift compile errors across 15 files**"
              echo "(C085-C102's Swift was authored on a host that cannot compile it). The leg runs"
              echo "on \`macos-14\`, which GitHub bills at a **10x multiplier** for ~15 minutes, and"
              echo "its answer does not change between commits — so it is off by default."
              echo
              echo "To run it: the **\`run-ios\`** label on a pull request, or"
              echo "**Run workflow** with \`ios: true\`. It is binding when requested."
              echo
              echo "Closing it needs a Mac session: fix the 67 errors, commit \`Package.resolved\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          printf 'targets={"include":%s}\n' "$(printf '%s' "$legs" | tr -d '\n ')" >> "$GITHUB_OUTPUT"
        env:
          DISPATCH_IOS: ${{ github.event_name == 'workflow_dispatch' && inputs.ios }}
          HAS_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-ios') }}


  # ===================================================================================
  # D7' §7's matrix. `runs-on` is a literal per leg rather than the spec's inline
  # `${{ matrix.target == 'ios' && 'macos-14' || 'ubuntu-latest' }}` conditional: the iOS
  # toolchain cannot run on Linux at all, and a literal cannot be silently broken by an
  # expression change. See the C010 handoff.
  # ===================================================================================
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # One value for every leg rather than a per-leg expression: `timeout-minutes` accepts
    # the matrix context, but a wrong timeout is a flaky red build hours later and the
    # slowest leg (ios, Xcode archive) is the only one that needs the headroom.
    timeout-minutes: 45

    # PER-LEG, and it has to be: `continue-on-error: true` written plainly here would apply to
    # every leg and quietly stop backend, android and portal failures from failing the build.
    # `advisory` is declared on every entry the `plan` job emits, so a reader can see which legs
    # are binding. As of Δ 2026-08-11 none of them are advisory — see below.
    continue-on-error: ${{ matrix.advisory }}
    needs: plan
    strategy:
      fail-fast: false
      # Computed, not literal: the `plan` job decides whether `ios` is here at all. `macos-14`
      # is still a literal inside that job's JSON and must stay one — see the iOS fence below.
      #
      # --- why ios is not in the default matrix ---------------------------------------
      # `apps/driver-ios/` has 67 unique compile errors across 15 files of MageRide's own Swift.
      # The headline class: `BusinessDate` is a Kotlin `typealias` in :shared, and a Kotlin
      # typealias does NOT survive into an XCFramework's Obj-C/Swift interop — Swift never sees
      # that name. C085-C102's code was authored on a host that cannot compile Swift (root
      # CLAUDE.md; apps/driver-ios/CLAUDE.md sets SWIFT_STRICT_CONCURRENCY minimal for the same
      # reason), so nothing ever told the author.
      #
      # It was `advisory: true` for one day. That kept CI green, which was the point, but it also
      # ran a macos-14 runner for ~15 minutes on every push — billed at a 10x multiplier — to
      # re-answer a question whose answer had not changed, and it emitted a warning no one could
      # act on without a Mac. ~1690 billed minutes in a day, for no information after the first
      # run. On-demand costs nothing per push and loses nothing: the errors are tracked, and the
      # leg still resolves the SPM graph and would still notice the Firebase pin drifting past
      # 11.11.0 whenever it is asked to.
      #
      # WHAT CLOSES THIS: a Mac session that fixes the 67 errors and commits a Package.resolved.
      # Then put `ios` back in the default list in `plan`. It is already binding when requested,
      # so nothing else needs flipping.
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      # --- iOS fence (root CLAUDE.md, C010 prompt) ---------------------------------
      # iOS and KMP-iOS targets do not compile on Linux. If this leg is ever scheduled
      # somewhere without Xcode the job must stop here, loudly, rather than "succeed" by
      # skipping every step that matters.
      - name: assert the ios leg is on macOS
        if: matrix.target == 'ios'
        run: |
          test "$RUNNER_OS" = "macOS" \
            || { echo "::error::the ios leg must run on macos-14, not $RUNNER_OS"; exit 1; }
          xcodebuild -version

      # --- backend -------------------------------------------------------------------
      - name: setup .NET
        if: matrix.target == 'backend'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # C054: ocr-svc's redaction pass is native. `tesseract` is D6' §7.5's fallback AND the
      # source of ADD §12.5's ID-number bounding boxes; libgtk-3/libatomic1 are what OpenCV's
      # native library links; opencv-data ships the Haar face cascade. Without them the service
      # fails CLOSED — it starts, extracts on-prem and sends nothing to Gemini — so the suite
      # would still pass, having proved the degraded path twice and the D-36 pre-pass never.
      # See backend/src/Ocr.Api/CLAUDE.md.
      - name: backend — native OCR dependencies
        if: matrix.target == 'backend'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr libgtk-3-0t64 libatomic1 opencv-data
          tesseract --version

      - name: backend — restore and build
        if: matrix.target == 'backend'
        run: dotnet build backend/MageRide.sln -c Release

      # Pull the fixtures' images HERE rather than letting Testcontainers do it inline, for two
      # reasons that are both about what the failure looks like.
      #
      # Testcontainers pulls on first use and, when the pull yields nothing, the daemon answers
      # the *create* call — so the error is `No such image: timescale/timescaledb-ha:pg16` and
      # the reason the pull failed is nowhere in the log. That is what took 136 tests down on
      # PR #1: every collection fixture that needs Postgres, one indistinguishable message, and
      # no way to tell throttling from a disk that filled. Pulling in its own step puts the
      # daemon's own words on the screen.
      #
      # And it retries. timescaledb-ha:pg16 is ~3.4 GB and these are anonymous Docker Hub pulls
      # from a shared runner address, which is exactly the shape of a transient 429.
      #
      # The list is `MageRide.TestKit/*Fixture.cs`, and it has to stay that way — a fixture
      # whose image is missing from here still works, just without the retry and the clear
      # error, which is the failure this step exists to prevent.
      - name: backend — pre-pull the test fixtures' images
        if: matrix.target == 'backend'
        run: |
          set -uo pipefail
          images="timescale/timescaledb-ha:pg16 redis:7-alpine redpandadata/redpanda:v24.2.26 emqx/emqx:5.8 minio/minio:latest"
          df -h / | tail -1
          for image in $images; do
            for attempt in 1 2 3; do
              if docker pull --quiet "$image"; then
                echo "::notice::pulled $image"
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::could not pull $image after 3 attempts — the integration tests cannot run"
                exit 1
              fi
              echo "attempt $attempt failed, retrying in 30s"
              sleep 30
            done
          done
          echo "--- disk and images after pulling ---"
          df -h / | tail -1
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: backend — test
        if: matrix.target == 'backend'
        # Containers are mandatory here. Without this the Testcontainers fixtures fall back
        # to Assert.Skip when the daemon is unreachable, and a runner with a broken Docker
        # would report a green build having run none of the integration tests.
        env:
          MAGERIDE_REQUIRE_CONTAINERS: "1"
        run: dotnet test backend/MageRide.sln -c Release --no-build --logger "console;verbosity=normal"

      # D7' §7 builds one image per service in a shell loop. Only three .NET projects exist
      # in wave 0, so the loop is over what the repository actually has; wave 2 adds
      # AppServices / HotPath / Fanout / TcpAdapter and they join it automatically.
      - name: backend — container templates
        if: matrix.target == 'backend'
        run: |
          set -euo pipefail
          # The tag is quoted at every use (SC2086). `${GITHUB_SHA::7}` cannot word-split in
          # practice — a commit SHA is hex — but an unquoted expansion in a `-t` argument is the
          # habit that breaks the day a variable holds something else, and `k8s-validate.yml` runs
          # actionlint with shellcheck over every workflow, so it is also a red build.
          docker build -f infra/docker/Dockerfile.service \
            --build-arg SERVICE=ApiGateway -t "mageride/api-gateway:${GITHUB_SHA::7}" .
          docker build -f infra/docker/Dockerfile.worker \
            --build-arg SERVICE=MageRide.Migrations --build-arg HEALTH_PORT=none \
            -t "mageride/migrate:${GITHUB_SHA::7}" .
          # Structural assertions the templates promise: non-root, and a healthcheck.
          for image in mageride/api-gateway mageride/migrate; do
            user=$(docker image inspect "$image:${GITHUB_SHA::7}" --format '{{.Config.User}}')
            test "$user" = "app" || { echo "::error::$image runs as '${user:-root}', not app"; exit 1; }
          done
          hc=$(docker image inspect "mageride/api-gateway:${GITHUB_SHA::7}" --format '{{json .Config.Healthcheck}}')
          test "$hc" != "null" || { echo "::error::the service image has no HEALTHCHECK"; exit 1; }

      # --- android -------------------------------------------------------------------
      - name: setup JDK
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: setup Gradle
        if: matrix.target == 'android'
        uses: gradle/actions/setup-gradle@v4

      # C010's handoff flagged this for C011: from wave 1 on, `:shared` applies the Android
      # Gradle Plugin and needs a real SDK. The runner image ships one, but which platforms
      # and build-tools it carries rotates with the image, and AGP 9 will not silently
      # download a missing platform. Install exactly what gradle/libs.versions.toml pins so
      # the leg cannot go red because GitHub refreshed ubuntu-latest.
      - name: android — SDK packages
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "::error::the runner has no Android SDK"; exit 1; }
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::no sdkmanager at $sdkmanager"; exit 1; }
          # `yes |` dies of SIGPIPE once sdkmanager stops reading, which pipefail would treat
          # as a failure; the install below is what actually has to succeed.
          yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # `projects` is the wave-0 command (C001: the modules are declared in
      # settings.gradle.kts but carry no build script yet, which is why this needs no Android
      # SDK). The probe is the build FILE, not the project list — `projects` already prints
      # ':shared' and ':apps:driver-android', so probing the list would run wave-1 tasks that
      # do not exist. The job grows with the repository instead of being edited in C011/C067.
      - name: android — gradle
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon projects
          if [ -f shared/kmp/build.gradle.kts ]; then
            ./gradlew --no-daemon :shared:testDebugUnitTest detekt ktlintCheck
          else
            echo "::notice::':shared' has no build script yet (C011) — wave-1 verify skipped"
          fi
          if [ -f apps/driver-android/build.gradle.kts ]; then
            ./gradlew --no-daemon :apps:driver-android:assembleRelease :apps:passenger-android:assembleRelease
          else
            echo "::notice::the Android app modules have no build scripts yet (C067/C076)"
          fi

      # --- ios -----------------------------------------------------------------------
      - name: setup JDK (KMP)
        if: matrix.target == 'ios'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Same build-file probe as the android leg. D7' §6: KMP XCFramework, then xcodebuild.
      - name: ios — XCFramework and archive
        if: matrix.target == 'ios'
        run: |
          set -euo pipefail
          if [ ! -f shared/kmp/build.gradle.kts ]; then
            echo "::notice::':shared' has no build script yet (C011) — nothing to assemble"
            exit 0
          fi
          ./gradlew --no-daemon :shared:assembleXCFramework
          for app in driver:DriverApp passenger:PassengerApp; do
            dir="apps/${app%%:*}-ios"
            scheme="${app##*:}"
            if [ -f "$dir/$scheme.xcodeproj/project.pbxproj" ]; then
              xcodebuild -project "$dir/$scheme.xcodeproj" -scheme "$scheme" \
                -destination 'generic/platform=iOS' archive \
                -archivePath "build/$scheme.xcarchive" CODE_SIGNING_ALLOWED=NO
            else
              echo "::notice::$scheme has no Xcode project yet (C085/C094)"
            fi
          done

      # This leg only runs when somebody asked for it, so the summary's job is no longer to stop a
      # silent red X being ignored — it is to say what was learned, since the asking cost 10x.
      - name: ios — what this run established
        if: ${{ always() && matrix.target == 'ios' }}
        run: |
          set -euo pipefail
          if [ "${{ job.status }}" = "success" ]; then
            echo "::notice::the ios archive succeeded — put ios back in the default matrix in the plan job"
            {
              echo "### ios: archive succeeded"
              echo ""
              echo "This is the outcome that closes the debt. Add"
              echo "\`{\"target\":\"ios\",\"runner\":\"macos-14\",\"advisory\":false}\` to the default"
              echo "\`legs\` list in the \`plan\` job of \`.github/workflows/ci.yml\` so it runs on every"
              echo "push again, and commit the \`Package.resolved\` this run resolved."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the ios archive FAILED. This leg was requested, so it is binding and blocks this run."
            {
              echo "### ios: archive failed"
              echo ""
              echo "C085-C102's Swift has never compiled: it was authored on a Linux host that"
              echo "cannot build it (root \`CLAUDE.md\`). At the last count that is **67 unique compile"
              echo "errors across 15 files** under \`apps/driver-ios/\`, the largest class being"
              echo "\`cannot find type 'BusinessDate'\` — a Kotlin \`typealias\` in \`:shared\`, which does"
              echo "not survive into the XCFramework's Obj-C/Swift interop."
              echo ""
              echo "**This is not the Firebase pin** — that is fixed, and the SDK compiles."
              echo ""
              echo "This leg is not in the default matrix, so this failure does not affect any other"
              echo "branch or push. Fix the errors on a Mac and commit a \`Package.resolved\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # --- portal --------------------------------------------------------------------
      - name: setup Node
        if: matrix.target == 'portal'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: portals/package-lock.json

      - name: portal — install, lint, build
        if: matrix.target == 'portal'
        run: |
          set -euo pipefail
          npm --prefix portals ci
          npm --prefix portals run lint
          npm --prefix portals run build

  # ===================================================================================
  # C007 — the OpenAPI contracts are the source of truth for 262 operations and for the
  # gateway route table, so they are linted on their own rather than inside a matrix leg.
  # ===================================================================================
  contracts:
    name: contracts (spectral)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # C007's handoff: this fetches @stoplight/spectral-cli from the registry, so the job
      # needs network. Pinned rather than floating — a ruleset that lints clean today must
      # not start failing because the linter moved.
      - name: spectral lint
        run: |
          npx --yes @stoplight/spectral-cli@6.16.2 lint 'backend/contracts/*.yaml' \
            --ruleset backend/contracts/.spectral.yaml

  # ===================================================================================
  # C003-C006 — the migration gate.
  #
  # migrate-verify.sh runs three passes against a throwaway timescaledb-ha:pg16 and FAILS
  # if pass 2 applies anything: "expected the second run to apply 0 scripts". Pass 3
  # re-executes every script with the journal disabled, which is what proves the DDL
  # itself is idempotent rather than only proving DbUp remembers. It then asserts the
  # objects C003-C006 promised (187 checks).
  #
  # Schema changes are versioned .sql applied twice — never `dotnet ef` (AL-53, D7' §1).
  # ===================================================================================
  migrations:
    name: migrations (apply twice)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # AL-53 is a stack rule, not a preference: the whole data-access layer is Dapper over
      # Npgsql and the schema is versioned .sql. The patterns match real declarations only —
      # a `using`, a package reference, a `: DbContext` base type, an invocation of the tool —
      # because both Directory.*.props carry comments that say "no EF Core", and a grep for
      # the bare words fails on the very files that forbid it.
      - name: no EF Core anywhere
        run: |
          set -uo pipefail
          found=0
          if grep -rInE '^[[:space:]]*(global[[:space:]]+)?using[[:space:]]+Microsoft\.EntityFrameworkCore' \
               --include='*.cs' backend/; then found=1; fi
          if grep -rInE '<Package(Reference|Version)[^>]*Include="Microsoft\.EntityFrameworkCore' \
               --include='*.csproj' --include='*.props' backend/; then found=1; fi
          if grep -rInE ':[[:space:]]*DbContext\b|\bIDbContextFactory\b' --include='*.cs' backend/; then found=1; fi
          if grep -rInE '(^|[^[:alnum:]_-])dotnet[[:space:]]+ef[[:space:]]' \
               --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.ps1' \
               backend/ infra/ .github/ db/; then found=1; fi
          if [ "$found" -ne 0 ]; then
            echo "::error::EF Core is forbidden (AL-53). Data access is Dapper over Npgsql; migrations are DbUp .sql scripts."
            exit 1
          fi
          echo "no EF Core references found"

      - name: apply, re-apply, and assert the schema
        run: bash infra/scripts/migrate-verify.sh

  # ===================================================================================
  # C009 — the dev stack every later component's verify runs against. Wave 0's gate
  # includes "slim compose healthy", so it is checked here rather than being left to
  # whoever next runs dev-up locally.
  #
  # Heavier than the other jobs: it pulls postgres/redpanda/emqx/minio (~5 GB) and takes
  # about three minutes on a hosted runner.
  # ===================================================================================
  compose:
    name: compose (slim stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: slim stack — config, healthy, EMQX ACL, topics, env templates
        run: bash infra/scripts/slim-verify.sh
