# =====================================================================================
# Continuous delivery (C124) — the whole path from a commit on main to a running staging.
#
# D7' §7's `deploy` job, decomposed so each stage is a gate rather than a step:
#
#   ci.yml (must already be green)  ->  images  ->  deploy dev  ->  deploy staging
#                                        build      migration       migration gate
#                                        sign       gate           promote by SHA
#                                        SBOM       promote        verify
#
# Production is NOT here. It is `promote.yml`, which takes a SHA that already reached staging and
# waits for a reviewer in the GitHub `production` environment.
#
# --- "a commit to main produces signed images and a staging deploy without manual steps" ----
# That is C124's first definition-of-done item, and this file is it. The only human action in the
# path is merging the pull request. Everything after that — build, sign, attest, gate the
# migration, write the image tag, verify — happens here, and the deploy itself is ArgoCD
# reconciling the commit this workflow pushed.
#
# --- Why it waits for ci.yml rather than repeating it -----------------------------------
# `workflow_run` fires when ci.yml completes on main, and this workflow refuses to start unless
# that run SUCCEEDED. Re-running the tests here would double the cost and, worse, would let a
# commit deploy on a second opinion — two runs of a flaky test where the first was red.
# =====================================================================================

name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # By hand, for a commit whose CI was green before this workflow existed, or to re-drive a
  # deploy after fixing something outside the repository (a registry outage, a Vault policy).
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deliver (defaults to the tip of main)
        required: false
        type: string

concurrency:
  # NOT cancel-in-progress. Every commit on main is a release candidate and each one's images
  # must exist — cancelling the first would leave a tag nothing built, and a later rollback to
  # that SHA would find no image.
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ===================================================================================
  # Which commit are we delivering, and is it allowed to be delivered?
  # ===================================================================================
  gate:
    name: ci was green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      proceed: ${{ steps.resolve.outputs.proceed }}
    steps:
      - name: resolve the commit
        id: resolve
        # DECLINING IS NOT FAILING. This job used to `exit 1` when ci was red, which skipped every
        # downstream job correctly but marked the whole `cd` run as failed — so a red ci produced
        # TWO red runs, and the second one was a lie: nothing was broken, delivery simply had
        # nothing to deliver. On a repository where ci is red, that noise is what stops people
        # reading either result. It now sets an output and every downstream job is gated on it, so
        # the run reports success with skipped jobs and the only red is the one worth fixing.
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_run" ] && [ "$CONCLUSION" != "success" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "::notice::ci concluded '$CONCLUSION' for $RUN_SHA — nothing is delivered. \
            Fix ci first; this run is not a delivery failure."
            exit 0
          fi
          if [ "$EVENT" = "workflow_run" ]; then
            sha="$RUN_SHA"
          else
            sha="${INPUT_SHA:-$GITHUB_SHA}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::delivering $sha"
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}

  # ===================================================================================
  # Build, push, sign every image at sha-<7>.
  # ===================================================================================
  images:
    name: images
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/images.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
      push: true
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    secrets: inherit

  # ===================================================================================
  # dev first. Same manifests, same images, one node — so a manifest that only breaks on a
  # real cluster breaks here and not in staging.
  # ===================================================================================
  dev:
    name: dev
    needs: [gate, images]
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      sha: ${{ needs.gate.outputs.sha }}
      reason: automatic on main
    permissions:
      contents: write
      # The callee promotes through a PR (it cannot push to main — `Protect main` forbids it and
      # the Actions app cannot be a bypass actor on a personal repo), so it opens and merges one.
      # A reusable workflow may not request MORE than its caller grants: without this the run ends
      # in `startup_failure` before a single job is scheduled, which is what happened on 29410da.
      pull-requests: write
    secrets: inherit

  # ===================================================================================
  # staging. The last stop a commit reaches on its own.
  #
  # `needs: dev` makes it sequential on purpose: promoting both at once would mean a broken
  # manifest lands in two environments before anybody sees the first failure, and the two
  # promotion commits would race for the same branch.
  # ===================================================================================
  staging:
    name: staging
    needs: [gate, images, dev]
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      sha: ${{ needs.gate.outputs.sha }}
      reason: automatic on main
    permissions:
      contents: write
      # The callee promotes through a PR (it cannot push to main — `Protect main` forbids it and
      # the Actions app cannot be a bypass actor on a personal repo), so it opens and merges one.
      # A reusable workflow may not request MORE than its caller grants: without this the run ends
      # in `startup_failure` before a single job is scheduled, which is what happened on 29410da.
      pull-requests: write
    secrets: inherit

  # ===================================================================================
  # The lightweight replica's own images (Δ MCS-10).
  #
  # `images` above builds the ~24 per-service images the DOKS split needs. It does NOT build
  # the composed `app-services` / `hot-path` the single-VPS replica runs, so until now nothing
  # in this pipeline produced an artefact that box could consume. See replica-images.yml.
  #
  # Parallel to `dev`/`staging` rather than behind them: those two promote a GitOps tag for a
  # cluster that does not exist yet (their own verify step logs "there is no dev environment"),
  # and the replica is the one environment that actually serves traffic. Gating a real deploy
  # on two no-op ones would only mean the replica breaks when a manifest does.
  # ===================================================================================
  replica-images:
    name: replica images
    needs: [gate, images]
    if: needs.gate.outputs.proceed == 'true'
    uses: ./.github/workflows/replica-images.yml
    with:
      sha: ${{ needs.gate.outputs.sha }}
      push: true
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ===================================================================================
  # Deliver to the Contabo replica — api.mageride.lk, the only environment on the platform
  # that currently resolves and serves.
  #
  # THIS CYCLES A LIVE BOX. `infra/replica/pull-deploy.sh` pulls the CI-built images and
  # restarts the containers; api.mageride.lk is down for the length of that restart. It does
  # NOT build on the box and does NOT touch secrets or certificates — both are deploy.sh's,
  # and a job that could rewrite `.env.replica` unattended could lock everyone out of the
  # database.
  #
  # `continue-on-error` is deliberate and narrow: a replica that fails to come up must not
  # retro-actively mark a delivery red whose images built and signed correctly. The job's own
  # red X is the signal; `ready-for-production` below still reports what is on staging.
  # ===================================================================================
  replica:
    name: replica (contabo)
    needs: [gate, replica-images]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: is the replica wired up?
        id: configured
        # DECLINING IS NOT FAILING, the same rule `gate` above records. A fork, or this repo
        # before the deploy key is installed, has no REPLICA_SSH_KEY — and a delivery that goes
        # red for a secret it was never given is noise, not a finding.
        run: |
          if [ -z "${REPLICA_SSH_KEY:-}" ] || [ -z "${REPLICA_HOST:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REPLICA_SSH_KEY / REPLICA_HOST are not set — skipping the replica deploy"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPLICA_SSH_KEY: ${{ secrets.REPLICA_SSH_KEY }}
          REPLICA_HOST: ${{ secrets.REPLICA_HOST }}

      - name: ssh key
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$REPLICA_SSH_KEY" > ~/.ssh/replica
          chmod 600 ~/.ssh/replica
          # Pinned, not TOFU: `StrictHostKeyChecking=accept-new` on a runner accepts whatever
          # answers on that IP, which is the whole of what a deploy key's protection rests on.
          echo "$REPLICA_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
        env:
          REPLICA_SSH_KEY: ${{ secrets.REPLICA_SSH_KEY }}
          REPLICA_HOST_KEY: ${{ secrets.REPLICA_HOST_KEY }}

      - name: pull and cycle
        if: steps.configured.outputs.configured == 'true'
        run: |
          set -euo pipefail
          tag="sha-${SHA::7}"
          echo "::notice::deploying $tag to $REPLICA_HOST"
          remote="REPLICA_TAG='$tag' REPLICA_COMMIT='$SHA'"
          remote="$remote REPLICA_REGISTRY='ghcr.io/$IMAGE_NAMESPACE'"
          remote="$remote bash /root/mageride/infra/replica/pull-deploy.sh"
          ssh -i ~/.ssh/replica -o BatchMode=yes -o ConnectTimeout=20 \
            "$REPLICA_USER@$REPLICA_HOST" "$remote"
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          REPLICA_HOST: ${{ secrets.REPLICA_HOST }}
          REPLICA_USER: ${{ vars.REPLICA_USER || 'root' }}
          IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || 'ramitha-silva' }}

      - name: summary
        if: always() && steps.configured.outputs.configured == 'true'
        run: |
          {
            echo "### replica — sha-${SHA::7}"
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "api.mageride.lk is serving sha-${SHA::7}. Smoke passed."
            else
              echo "The replica did NOT reach sha-${SHA::7}. It is still running whatever it"
              echo "was on — the deploy either failed to pull or failed to come up healthy."
              echo
              echo "To drive it by hand:"
              echo '```bash'
              echo "ssh root@<replica-host>"
              echo "cd /root/mageride && REPLICA_TAG=sha-${SHA::7} bash infra/replica/pull-deploy.sh"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ needs.gate.outputs.sha }}
          OUTCOME: ${{ job.status }}

  # ===================================================================================
  # What a person needs in order to decide about production.
  # ===================================================================================
  ready-for-production:
    name: ready for production
    needs: [gate, staging]
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: summary
        run: |
          {
            echo "### \`${SHA::7}\` is on staging"
            echo
            echo "Images are signed (cosign keyless, over the digest) and carry an SBOM and"
            echo "build provenance. Verification command: \`.github/workflows/README.md\`."
            echo
            echo "**To promote to production** — needs an approval in the \`production\` environment:"
            echo
            echo '```bash'
            echo "gh workflow run promote.yml -f sha=$SHA"
            echo '```'
            echo
            echo "Run the acceptance suites against staging first if this touches money, safety"
            echo "or the tracker plane: \`gh workflow run nightly.yml -f environment=staging\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SHA: ${{ needs.gate.outputs.sha }}
