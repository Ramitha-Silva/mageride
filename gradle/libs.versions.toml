# MageRide — Gradle version catalogue.
#
# This file is the single home for every Gradle-side version. Never inline a version
# in a build script; add it here and reference it with `libs.` / `libs.plugins.`.
#
# Ownership (build/manifest.yaml):
#   C001 repo-scaffold        — the toolchain block, the Android platform levels, the plugin aliases.
#   C011 kmp-module-scaffold  — appends Ktor, kotlinx.serialization / coroutines / datetime, Koin,
#                               multiplatform-settings, H3, SQLDelight, Turbine, kotlin-test.
#   C067 / C076 app shells    — append the Android UI, MapLibre, HiveMQ and SignalR entries.
#   C025 ws-e2e-android-slice — took the SignalR, HiveMQ and androidx-UI entries early: the
#                               walking skeleton needs a real socket and a real broker client
#                               before either app shell exists. MapLibre is deliberately NOT
#                               here — the skeleton's map is a list, and C077 owns the real one.
# Appending is expected; renaming or removing an existing alias is a breaking change.

[versions]

# ---- toolchain --------------------------------------------------------------------
# `gradle` mirrors gradle/wrapper/gradle-wrapper.properties — the wrapper is authoritative,
# this entry exists so the version is discoverable alongside the rest of the toolchain.
gradle = "9.6.1"
kotlin = "2.4.10"
agp = "9.3.1"

# Build host runs OpenJDK 17 and AGP 9.3.1 ships Java-17 bytecode, so 17 is the floor for
# the whole Gradle side. Raise it only together with the CI image (C010) and the build host.
jvmToolchain = "17"

# ---- Android platform -------------------------------------------------------------
# minSdk is a requirement, not a preference: URD NFR-22 — "Minimum Android version:
# Android 8.0 (API 26)". Do not raise it without a micro-change-set.
androidMinSdk = "26"
# compile/target are the newest fully-released platform at scaffold time (2026-07-27).
# C067 confirms them against the SDK actually installed on the build host.
androidCompileSdk = "36"
androidTargetSdk = "36"

# ---- Android UI -------------------------------------------------------------------
# Kotlin 2.x compiles Compose through the `kotlin-compose` plugin below (versioned with
# Kotlin itself); the BOM pins the androidx.compose artifacts.
composeBom = "2026.06.01"
# C025. Not covered by the Compose BOM — these are the activity/lifecycle host the two app
# shells put a composable in, and androidx.core for the manifest-level basics.
androidxCore = "1.18.0"      # newest whose AAR metadata still says minCompileSdk=36; 1.19.0 demands 37, which is unreleased
androidxActivity = "1.11.0"
androidxLifecycle = "2.10.0"

# ---- App shell (C067) --------------------------------------------------------------
# D2' §0.1: "a screen = a Compose @Composable route inside a NavHost/Scaffold". 2.9.8 is the
# newest STABLE line — 2.10.0-beta01 is the only newer release and a beta navigation library
# under eight screen groups is a bad trade.
androidxNavigation = "2.9.8"
# The foreground service's fix source (D6' §3, D5' §5). Google Maven, not Central.
playServicesLocation = "21.4.0"
# E-01's ride pushes. The BOM pins firebase-messaging; the `google-services` Gradle plugin is
# deliberately NOT applied — it hard-fails without a `google-services.json`, and the Firebase
# project is C124's (D7' §13 secrets). See the C067 handoff.
firebaseBom = "34.17.0"
# Koin's Android bindings — `androidContext()`, `androidLogger()`, `koinViewModel()`. Same
# version line as the koin-core the shared module already carries.
# (versioned by `koin` above)

# ---- Map (C067) ---------------------------------------------------------------------
# D2' §0.1/§0.3: "Maps are MapLibre GL Native (Android/iOS SDK) over self-served PMTiles on
# Cloudflare R2 — no Google Maps". PMTiles is native from MapLibre Native 11 (the `pmtiles://`
# file source is in the shipped .so).
#
# **The `-opengl` flavour, not the default `android-sdk`.** From 13.x the default artifact
# declares `<uses-feature android:name="android.hardware.vulkan.version" android:required="true">`,
# which Play uses to filter devices — on the URD NFR-22 floor (Android 8.0) that would cut off
# exactly the budget handsets this platform is for. The OpenGL ES flavour carries the same
# `org.maplibre.android` API. Do not swap it back without a micro-change-set.
maplibre = "13.4.1"

# ---- Realtime clients (C025) ---------------------------------------------------------
# D6' §5: "Client = SignalR Java client (Android) / SignalR Swift client (iOS)". Microsoft
# versions this artifact with ASP.NET Core, so 10.0.x is the line that matches the .NET 10
# fanout-svc. JVM/Android only; the iOS half is C094's Swift client.
signalr = "10.0.9"
# D6' §3: "Driver App client = HiveMQ (Android) / CocoaMQTT (iOS) in a native foreground
# service". Same artifact on plain JVM, which is what lets the e2e harness publish exactly
# what the driver app publishes.
hivemqMqtt = "1.3.17"

# C025, e2e harness only — NOT an app dependency and never will be. `offer.created` carries the
# `offerId` a driver needs to accept, and it exists on `dispatch.events` and nowhere else: no REST
# response returns it (see the C025 handoff, contract gap (a)). Until notification-svc (C051) and
# the fanout push (C041) land, reading the topic is the only way a scripted driver can accept an
# offer, and it is what those services will do too.
kafkaClients = "4.3.1"

# ---- KMP shared module (C011) -------------------------------------------------------
# ADD §18.2 "KMP Shared Libraries" names the concern; the version is the newest stable
# release that works with Kotlin 2.4.10 at scaffold time.
ktor = "3.5.1"                    # HTTP client — C013 builds the API client on it
kotlinxSerialization = "1.11.0"   # JSON/CBOR for REST + MQTT payloads
kotlinxCoroutines = "1.11.0"      # async/concurrency model
kotlinxDatetime = "0.8.0"         # multiplatform date handling (D-38 business dates)
koin = "4.2.2"                    # DI
# Declared but deliberately NOT wired. C011 reserved it for C014; C014 did not take it. The
# session layer stores tokens, and both of this library's app-side backends are plain settings
# (`SharedPreferencesSettings`, `NSUserDefaultsSettings`) — exactly what C014's DoD forbids. Its
# Apple `KeychainSettings` would have done, but half a store from here and half hand-rolled is
# worse than one hand-rolled pair. Free for a later component that needs *non-secret* KV storage.
multiplatformSettings = "1.3.0"   # key-value storage abstraction — unused, see the note above
sqldelight = "2.3.2"              # on-device SQL — the plugin is applied by C018
turbine = "1.2.1"                 # Flow assertions in commonTest
# androidHostTest only (C019). The test kit's contract checks read `backend/contracts/*.yaml`
# and compare every fake response against the OpenAPI schema it claims to satisfy; that needs a
# real YAML parser rather than the line scanner C013 uses to find operation ids. Never reaches a
# main source set, so no YAML library ships in the XCFramework or an app.
snakeyaml = "2.6"                 # OpenAPI reader for the C019 contract tests

# Play Integrity — the Android half of D-30 (ADD §12.6). androidMain only; the iOS half is
# App Attest from the DeviceCheck framework, which ships with Kotlin/Native's platform libs and
# needs no coordinate. C014.
playIntegrity = "1.6.0"

# H3 geocell computation (ADD §18.2, §7.5). NOTE: `com.uber:h3` is JNI, not Kotlin
# Multiplatform — its jar carries android-arm/android-arm64/linux/darwin natives and no
# Kotlin/Native klib. It is therefore an **androidMain/JVM** dependency; the iOS side needs
# cinterop against the H3 C library. C017 owns that expect/actual. See the C011 handoff.
h3 = "4.4.0"

# SQLCipher — the Android half of `mobile_db_schema.md` §0.4 ("the database file SHOULD be
# encrypted at rest with SQLCipher; the key is wrapped by the hardware keystore"). androidMain
# only: it is an AAR with per-ABI native libraries and has no Kotlin/Native counterpart. iOS gets
# NSFileProtection instead — §0.4 allows "SQLCipher or GRDB encryption" there. C018.
#
# It also raises the SQLite the app runs on: SQLCipher bundles its own build (3.4x), where the
# platform SQLite on the API-26 floor is 3.19. The schema and migrations are still written to the
# 3.19 floor, because an unencrypted debug build falls back to the platform engine.
sqlcipher = "4.17.0"

# ---- static analysis (C011) ---------------------------------------------------------
# `ktlint` is the engine version the Gradle plugin drives; pin both so a plugin bump cannot
# silently change what is considered formatted.
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlint = "1.8.0"

# ---- test (C067) --------------------------------------------------------------------
# The last JUnit 4 release. AGP's local unit tests run on JUnit 4, and this is only here so
# `kotlin-test` can resolve its `-junit` variant — no test imports `org.junit` directly.
junit = "4.13.2"

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
android-library      = { id = "com.android.library",                       version.ref = "agp" }
# AGP 9 refuses `com.android.library` in a Kotlin Multiplatform project; this is its
# replacement and the only way :shared can carry an Android target. C011.
android-kmp-library  = { id = "com.android.kotlin.multiplatform.library",  version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
# C025 — the e2e harness is a plain JVM program, not an Android or multiplatform one.
kotlin-jvm           = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
detekt               = { id = "io.gitlab.arturbosch.detekt",               version.ref = "detekt" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint",             version.ref = "ktlintGradle" }
# Applied by C018 (kmp-local-db) — applying it with no `.sq` file configures nothing.
sqldelight           = { id = "app.cash.sqldelight",                       version.ref = "sqldelight" }

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }

# ---- Android UI (C025 app shells) -------------------------------------------------------
# Versionless: the BOM above pins every androidx.compose artifact, so a version here would
# silently override it for that one module.
compose-ui                 = { module = "androidx.compose.ui:ui" }
compose-ui-graphics        = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3          = { module = "androidx.compose.material3:material3" }
androidx-core-ktx          = { module = "androidx.core:core-ktx",                              version.ref = "androidxCore" }
androidx-activity-compose  = { module = "androidx.activity:activity-compose",                  version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# ---- App shell (C067) ---------------------------------------------------------------------
# Versionless where the Compose BOM covers it; pinned where it does not.
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-ui-tooling             = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4         = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-navigation-compose    = { module = "androidx.navigation:navigation-compose",  version.ref = "androidxNavigation" }
androidx-lifecycle-service     = { module = "androidx.lifecycle:lifecycle-service",    version.ref = "androidxLifecycle" }
androidx-lifecycle-process     = { module = "androidx.lifecycle:lifecycle-process",    version.ref = "androidxLifecycle" }
# Koin's Android bindings. Same version line as koin-core, which `:shared` already exports.
koin-android                   = { module = "io.insert-koin:koin-android",             version.ref = "koin" }
koin-androidx-compose          = { module = "io.insert-koin:koin-androidx-compose",    version.ref = "koin" }
# FusedLocationProviderClient — the foreground service's fix source.
play-services-location         = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
# FCM. The BOM pins the version; see the `firebaseBom` note on the missing google-services plugin.
firebase-bom                   = { module = "com.google.firebase:firebase-bom",        version.ref = "firebaseBom" }
firebase-messaging             = { module = "com.google.firebase:firebase-messaging" }

# ---- Map (C067) ---------------------------------------------------------------------------
# The OpenGL ES flavour — see the `maplibre` version note on why not the default artifact.
maplibre-android    = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }

# ---- Realtime clients (C025) -------------------------------------------------------------
# JVM/Android only. See the version comments: the iOS halves are C094's Swift clients.
signalr     = { module = "com.microsoft.signalr:signalr",       version.ref = "signalr" }
hivemq-mqtt = { module = "com.hivemq:hivemq-mqtt-client",       version.ref = "hivemqMqtt" }
# e2e harness only — see the `kafkaClients` version comment.
kafka-clients = { module = "org.apache.kafka:kafka-clients",    version.ref = "kafkaClients" }

# ---- Ktor -----------------------------------------------------------------------------
# commonMain gets the engine-agnostic pieces; each platform source set gets its engine.
ktor-client-core                = { module = "io.ktor:ktor-client-core",                 version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-client-logging             = { module = "io.ktor:ktor-client-logging",              version.ref = "ktor" }
ktor-client-auth                = { module = "io.ktor:ktor-client-auth",                 version.ref = "ktor" }
ktor-serialization-json         = { module = "io.ktor:ktor-serialization-kotlinx-json",  version.ref = "ktor" }
ktor-client-okhttp              = { module = "io.ktor:ktor-client-okhttp",               version.ref = "ktor" }
ktor-client-darwin              = { module = "io.ktor:ktor-client-darwin",               version.ref = "ktor" }
ktor-client-mock                = { module = "io.ktor:ktor-client-mock",                 version.ref = "ktor" }

# ---- kotlinx --------------------------------------------------------------------------
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",    version.ref = "kotlinxCoroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version.ref = "kotlinxDatetime" }

# ---- DI, storage, geo -------------------------------------------------------------------
koin-core                    = { module = "io.insert-koin:koin-core",                     version.ref = "koin" }
koin-test                    = { module = "io.insert-koin:koin-test",                     version.ref = "koin" }
multiplatform-settings       = { module = "com.russhwolf:multiplatform-settings",         version.ref = "multiplatformSettings" }
multiplatform-settings-test  = { module = "com.russhwolf:multiplatform-settings-test",    version.ref = "multiplatformSettings" }
# androidMain / JVM only — see the `h3` version comment.
h3                           = { module = "com.uber:h3",                                  version.ref = "h3" }
# androidMain only. Brings com.google.android.gms:play-services-tasks transitively (compile
# scope), which is where the `Task` the API answers with comes from.
play-integrity               = { module = "com.google.android.play:integrity",             version.ref = "playIntegrity" }

# ---- SQLDelight (applied by C018) ------------------------------------------------------
sqldelight-runtime               = { module = "app.cash.sqldelight:runtime",                version.ref = "sqldelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions",  version.ref = "sqldelight" }
# `INTEGER AS Int` needs an explicit ColumnAdapter — SQLDelight 2.x dropped the implicit
# primitive mappings for everything except Boolean, which the SQLite dialect still handles
# natively. This artifact is where IntColumnAdapter lives.
sqldelight-primitive-adapters    = { module = "app.cash.sqldelight:primitive-adapters",     version.ref = "sqldelight" }
sqldelight-android-driver        = { module = "app.cash.sqldelight:android-driver",         version.ref = "sqldelight" }
sqldelight-native-driver         = { module = "app.cash.sqldelight:native-driver",          version.ref = "sqldelight" }
# JVM/JDBC driver — androidHostTest only. It is a REAL SQLite (xerial), so the schema, the
# migration and every query in this module are exercised against the engine that ships on a
# handset rather than against a mock.
sqldelight-sqlite-driver         = { module = "app.cash.sqldelight:sqlite-driver",          version.ref = "sqldelight" }
# androidMain only — see the `sqlcipher` version comment.
sqlcipher-android                = { module = "net.zetetic:sqlcipher-android",              version.ref = "sqlcipher" }

# ---- test ---------------------------------------------------------------------------
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# C067. `kotlin-test`'s Gradle metadata picks a framework variant from an attribute the Kotlin
# Gradle Plugin sets — and AGP 9's BUILT-IN Kotlin support does not set it, so in an
# `com.android.application` module plain `kotlin-test` resolves to no variant and `kotlin.test.Test`
# does not exist. Naming the JUnit 4 variant outright is the fix; `junit` itself is what it needs
# on the classpath. No test imports `org.junit` directly.
# Named `kotlin-testjunit`, not `kotlin-test-junit`: the latter would make `kotlin-test` a GROUP
# prefix as well as a leaf, and `libs.kotlin.test.get()` (shared/kmp's testKitElements) stops
# resolving. A sibling alias keeps both usable.
kotlin-testjunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit       = { module = "junit:junit",                      version.ref = "junit" }
turbine     = { module = "app.cash.turbine:turbine",         version.ref = "turbine" }
# androidHostTest only — see the `snakeyaml` version comment.
snakeyaml   = { module = "org.yaml:snakeyaml",               version.ref = "snakeyaml" }
