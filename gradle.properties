# MageRide — Gradle daemon and build settings (C001 repo-scaffold).

# The build host is the same 24 GB Contabo VPS that hosts the lightweight production
# replica (see CLAUDE.md "Build Host"). Keep the daemon heap modest so a Gradle build and
# the slim dev compose stack can coexist.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is intentionally left off at scaffold time; turn it on once the
# module build scripts exist and are known to be compatible (C011 / C067 / C076).
# org.gradle.configuration-cache=true

kotlin.code.style=official

# Kotlin/Native can produce Apple *klibs* on a Linux host even though it cannot link a
# framework or run a simulator test there. With this on, `./gradlew :shared:compileKotlinIosArm64`
# type-checks src/iosMain on this build box, so a wave-1 component that writes an iOS
# `actual` finds its compile error now instead of in wave 4b. It does NOT make iOS verified:
# linking, XCFramework assembly and iosTest still need macOS (see CLAUDE.md "Build Host").
# Costs a one-off ~1 GB Kotlin/Native distribution download into ~/.konan. (C011)
kotlin.native.enableKlibsCrossCompilation=true

android.useAndroidX=true
android.nonTransitiveRClass=true
