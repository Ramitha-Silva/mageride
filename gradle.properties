# MageRide — Gradle daemon and build settings (C001 repo-scaffold).

# The build host is the same 24 GB Contabo VPS that hosts the lightweight production
# replica (see CLAUDE.md "Build Host"). Keep the daemon heap modest so a Gradle build and
# the slim dev compose stack can coexist.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Configuration cache is intentionally left off at scaffold time; turn it on once the
# module build scripts exist and are known to be compatible (C011 / C067 / C076).
# org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
