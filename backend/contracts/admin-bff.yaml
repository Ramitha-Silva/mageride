  # -------------------------------------------------------------------------------------------
  # Configuration
  # -------------------------------------------------------------------------------------------
  /v1/admin/fares/tariffs:
    put:
      operationId: updateFareTariffs
      summary: Configure Mode C tariffs and the peak/night windows.
      description: |
        US-14.4. **Tariffs are versioned by `effectiveFrom`, never mutated** — a completed ride
        must stay reconcilable against the rate that priced it (C005). Peak and night windows are
        local Asia/Colombo wall-clock and **may wrap midnight** (night 22:00–05:00), so
        `endLocal < startLocal` is legal and fare-svc handles it.

        There is no Mode B fare here — that is per-vehicle and per-subscriber (Epic 23).
        Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariffs]
              properties:
                effectiveFrom:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                tariffs:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Tariff'
                peakWindows:
                  type: array
                  items:
                    $ref: '#/components/schemas/PeakWindow'
      responses:
        '200':
          description: New tariff version published.
          content:
            application/json:
              schema:
                type: object
                required: [effectiveFrom, tariffs]
                properties:
                  effectiveFrom:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
                  tariffs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tariff'
