openapi: 3.1.0

# =============================================================================================
# admin-bff — Admin Portal (admin.mageride.lk), plus the pdpa-svc surface it fronts
# Source: specs/D3_mageride_api_contracts.md "admin-bff — operator console (/v1/admin)"
#         + "pdpa-svc (via admin-bff) — data rights (/v1/pdpa)"
#         + Δ 2026-06-28 AL-38 (dashboard stats), AL-39 (verification split + document viewer),
#           AL-40 (passenger directory), AL-41 (driver directory), AL-42 (vehicle directory)
#         + ADD Appendix C admin-bff / pdpa-svc / safety-svc admin queue
#
# REMOVED / SUPERSEDED, do not re-add:
#   GET   /v1/admin/onboarding/queue                              — SUPERSEDED BY AL-39
#   POST  /v1/admin/onboarding/{id}/fields/{key}/confirm          — SUPERSEDED BY AL-39
#   PATCH /v1/admin/onboarding/{id}/fields/{key}                  — SUPERSEDED BY AL-39
#   POST  /v1/admin/vehicles/{id}/approve  ·  /reject             — SUPERSEDED BY AL-39
#     AL-39 (Δ 2026-06-28 item 8) replaces the single combined onboarding queue with three
#     subject-typed verification queues and states the write endpoints as
#     `PUT /admin/verification/{id}/fields/{key}`, `/approve`, `/reject`. That spelling is the
#     only one that also covers the **fleet-org** subject AL-49 needs an officer to approve, so
#     it is canonical here and the `/admin/onboarding/*` + `/admin/vehicles/{id}/approve|reject`
#     forms are absent. The semantics D3' Part 2 attached to the old routes are preserved on the
#     new ones (approval blocked while any field is
#     `pending`, US-2.10a). Raised as a micro-change-set in the C007 handoff.
#   GET /v1/admin/drivers/level-1  (ADD Appendix C)               — SUPERSEDED BY AL-41
#     `GET /v1/admin/drivers?level=1` is the driver directory's own filter, and a literal
#     `level-1` segment would be ambiguous against `GET /v1/admin/drivers/{driverId}`.
#   GET /v1/admin/users  (ADD Appendix C)                         — SUPERSEDED BY AL-40/41/42
#     The three typed directories replace the untyped user search.
#   POST /v1/admin/auth/mfa/verify                                — REMOVED BY AL-37 (see iam.yaml)
# =============================================================================================

info:
  title: MageRide admin-bff
  version: 1.0.0
  summary: Operator console — verification, directories, moderation, finance, config, audit, PDPA.
  description: |
    **Every mutation passes an audit interceptor** into `audit.events` (D-35, US-19.3), and every
    `/v1/admin/*` read is RBAC-gated deny-by-default (AL-06). Directory detail reads emit a
    `PII_READ` event; document reads emit `DOC_VIEW` (AL-39/AL-40). List responses carry
    **role-masked** phone numbers — the clear number requires the audited detail read.

    Sign-in is Password or Google with **no MFA/TOTP step** (AL-37) — see `iam.yaml`.

    Money is integer minor units throughout.
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: admin-session
    description: The post-sign-in bootstrap and the role-scoped menu manifest (Δ C062, URD §2.2).
  - name: admin-dashboard
    description: Platform metrics and the period-filtered statistics view (AL-38).
  - name: admin-verification
    description: Verification queues, subject detail, field decisions and the document viewer (AL-39).
  - name: admin-directories
    description: Passenger, driver and vehicle directories (AL-40/41/42).
  - name: admin-moderation
    description: Suspensions, vehicle reports and support tickets.
  - name: admin-config
    description: Tariffs, cities, trains and announcements.
  - name: admin-finance
    description: Fee reversal — Finance only.
  - name: admin-audit
    description: The audit log.
  - name: pdpa
    description: Data-subject export and erasure (E-06).

paths:

  # -------------------------------------------------------------------------------------------
  # Session (Δ C062)
  # -------------------------------------------------------------------------------------------
  /v1/admin/session:
    get:
      operationId: getAdminSession
      summary: Identity, effective permissions and the role-scoped menu manifest.
      description: |
        **Δ C062.** What the Admin Portal fetches the moment sign-in completes. URD §2.2 requires
        the console to be "rendered from the same permission model the API enforces server-side"
        and each role to see "only the menus and records its permissions allow"; nothing in D3'
        gives that manifest a route, so the portal would otherwise have to keep its own copy of
        URD §2.3 — a third transcription of the matrix, drifting from the two that exist.

        **Sign-in itself is `iam.yaml`'s `POST /v1/admin/auth/login`** (AL-07), and `mfaRequired`
        is always `false`: AL-37 removed the second factor, and D3' §0 and D7' §4.2 still carry
        the pre-AL-37 wording, so a client built from those would wait for a challenge that never
        comes. Answering the question explicitly is what stops that.

        Authenticated-internal rather than gated on a feature area — every internal role may ask
        what it is allowed to do, and a role with no menu needs to be told so rather than shown a
        blank console.
      tags: [admin-session]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # Dashboard
  # -------------------------------------------------------------------------------------------
  /v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Platform-wide metrics.
      description: US-14.6. The unfiltered landing view; the period filter is `/dashboard/stats` (AL-38).
      tags: [admin-dashboard]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform metrics.
          content:
            application/json:
              schema:
                type: object
                required: [kpis, live]
                properties:
                  kpis:
                    $ref: '#/components/schemas/DashboardKpis'
                  live:
                    $ref: '#/components/schemas/DashboardLive'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/dashboard/stats:
    get:
      operationId: getAdminDashboardStats
      summary: Period-filtered KPIs with previous-period deltas.
      description: |
        AL-38, US-24.7. Periods are evaluated in **Asia/Colombo** and served from the analytics
        read-model (`analytics.daily_metrics` rollups). The `live` block — online drivers, pending
        verifications, open tickets — stays real-time rather than coming from the rollup.
      tags: [admin-dashboard]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: Filtered statistics.
          content:
            application/json:
              schema:
                type: object
                required: [period, range, kpis, deltaVsPrev, live]
                properties:
                  period:
                    type: string
                    enum: [today, week, month, custom]
                  range:
                    type: object
                    required: [from, to]
                    properties:
                      from:
                        $ref: './_shared.yaml#/components/schemas/BusinessDate'
                      to:
                        $ref: './_shared.yaml#/components/schemas/BusinessDate'
                  kpis:
                    $ref: '#/components/schemas/DashboardKpis'
                  deltaVsPrev:
                    $ref: '#/components/schemas/DashboardDeltas'
                  live:
                    $ref: '#/components/schemas/DashboardLive'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/dashboard/stats.csv:
    get:
      operationId: exportAdminDashboardStats
      summary: CSV export of the filtered statistics.
      description: AL-38. Exactly the figures `/dashboard/stats` returns for the same query, as a download.
      tags: [admin-dashboard]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StatsPeriod'
        - $ref: '#/components/parameters/StatsFrom'
        - $ref: '#/components/parameters/StatsTo'
      responses:
        '200':
          description: CSV export.
          content:
            text/csv:
              schema:
                type: string
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # Verification (AL-39)
  # -------------------------------------------------------------------------------------------
  /v1/admin/verification/queues/driving-license:
    get:
      operationId: listDrivingLicenseQueue
      summary: Drivers awaiting licence verification.
      description: |
        AL-39, SCR-AP-003. `flaggedFields` are the values that came back doubtful, driver-entered
        or mismatched (AL-29/AL-30) — the reason the driver is in this queue at all.

        **Δ C063: membership is "has a `registry.document_fields` row still `pending`".** That is
        AL-27's fence stated as the query it is — an auto-verified document produces no such row
        and therefore cannot appear, rather than being filtered out by something that could stop
        filtering. `status` is the *subject's* own registration status, which is what the
        SCR-AP-003 filter filters on: a renewal flagged on an already-approved applicant reads
        `APPROVED`, and a resubmission after a refusal reads `REJECTED`.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationSearch'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriverQueueRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/verification/queues/vehicle-registration:
    get:
      operationId: listVehicleRegistrationQueue
      summary: Vehicles awaiting registration verification.
      description: |
        AL-39, SCR-AP-003. Vehicles held by at least one flagged field.

        **Δ C063: Mode C and fleet vehicles alike.** AL-50 reuses AL-29's extraction pipeline in as
        many words, so a Fleet Portal document slot writes the same `registry.documents` /
        `document_fields` pair a wizard step does and the officer's queue does not need to know
        which surface uploaded them. What differs is who owns the decision, which is read from the
        vehicle's mode when the officer acts. `DEACTIVATED` registrations are excluded — a retired
        vehicle is not an application.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationSearch'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/VehicleQueueRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/verification/queues/fleet-org:
    get:
      operationId: listFleetOrgQueue
      summary: Fleet organisations awaiting KYC verification.
      description: |
        AL-39. Also the queue where an org's **payout profile** is approved or rejected — AL-49
        adds the payout documents to the org's `documents[]`.

        **Δ C063: forwarded to fleet-svc's `GET /v1/internal/fleets/queue`, which has no cursor.**
        That plane answers a flat capped list and its own file says why, so `cursor` is `null` and
        `hasMore` is `false` here rather than invented. `search` is applied by admin-bff for the
        same reason. `vehicleCount` is counted from `registry.fleet_vehicles` on this side: the
        field is on `OrgQueueRow` and fleet-svc's internal row does not carry it.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationSearch'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/OrgQueueRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  # ---------------------------------------------------------------------------------------
  # Δ C063 (AL-58 / AL-59) — the driver's bank & payout profile.
  #
  # The ADD (§1.18 AL-58) has this decided "through the existing AL-39 queue, whose subject-agnostic
  # routes already take a driver id". The queue FAMILY is reused — same officer, same RBAC row, same
  # audited lightbox — but three things could not be:
  #
  #   1. The queue predicate. The other tabs are "has a flagged registry.document_fields row", which
  #      is AL-27's fence as a query. Nothing extracts fields from a bank statement (the org tab
  #      says so for the identical table), so membership here is the profile's own status. Without
  #      this tab a driver approved in March who changes banks in September appears in NO queue and
  #      is never paid — the gap these routes exist to close.
  #   2. The verdict route. A driver id already resolves to the IDENTITY subject, so sharing
  #      POST /verification/{subjectId}/approve would make one button decide two unrelated
  #      questions — and a refusal aimed at an illegible bank statement would refuse the driver's
  #      LICENCE and stop them driving.
  #   3. The audit action. PAYOUT_PROFILE_APPROVED is its own claim: "I checked this statement
  #      against this account number and authorised money to be sent there" is not "I checked a
  #      photograph of a licence".
  #
  # Micro-change-set; recorded in the C063 handoff in build/progress.md.
  # ---------------------------------------------------------------------------------------
  /v1/admin/verification/queues/driver-payout:
    get:
      operationId: listDriverPayoutQueue
      summary: Drivers awaiting a bank & payout decision (AL-58, AL-59).
      description: |
        The fourth SCR-AP-003 tab. Membership is
        `registry.driver_payout_profiles.status = 'pending_verification'` — the partial index
        `ix_driver_payout_pending` (migration 0316) exists to serve it.

        `status` is the driver's **identity** verdict, as on the other tabs: every row here is by
        construction awaiting a payout decision, so repeating that would say nothing. What the
        officer needs is whether this is somebody they already approved changing their bank.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VerificationSearch'
        - $ref: '#/components/parameters/VerificationStatus'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriverPayoutQueueRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/verification/payout/{driverId}:
    get:
      operationId: getDriverPayoutVerification
      summary: A driver's bank details and payout evidence (AL-58, AL-59).
      description: |
        What the officer decides on. `documents[]` carries the proof of account and the driver's own
        LankaQR image, each as a `thumbUrl`/`fullUrl` pointing at `GET /v1/admin/documents/{docId}` —
        the audited viewer, so every look is a `DOC_VIEW` row (AL-39).

        `approvable` means "there is a version awaiting a decision", not "the evidence is
        sufficient". Whether a statement really shows this account is the judgement the officer is
        there to make.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
      responses:
        '200':
          description: The payout profile and its evidence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutVerification'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, payout-profile-not-found]

  /v1/admin/verification/payout/{driverId}/approve:
    post:
      operationId: approveDriverPayoutProfile
      summary: Verify where a driver's swept earnings go (AL-58).
      description: |
        **This is the last gate between a driver submitting bank details and being paid.** Until a
        row is `verified`, payout-svc's weekly sweep skips them — the wallet accrues and nothing is
        lost, but nothing is paid either. It also puts their own LankaQR on the ride pay sheet
        (AL-59).

        Forwarded to registry-svc's `POST /v1/internal/drivers/{driverId}/payout-profile/approve`,
        which supersedes the incumbent and verifies the replacement in one transaction and in that
        order — `ux_driver_payout_verified` admits exactly one verified row per driver.

        **Idempotent.** With nothing pending the current version is returned unchanged: a second
        Approve must not rewrite `verified_at` or who decided it.

        Audited as `PAYOUT_PROFILE_APPROVED` on `driver_payout_profile` — **not** as
        `VERIFICATION_APPROVED` on `driver`, which is the identity decision.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutDecision'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, payout-profile-not-found, conflict]

  /v1/admin/verification/payout/{driverId}/reject:
    post:
      operationId: rejectDriverPayoutProfile
      summary: Refuse a driver's bank details, with a reason (AL-58).
      description: |
        **The incumbent is never disturbed.** A mismatched account-holder name is a reason to refuse
        the *edit*, not a reason to stop paying a driver into details an officer already approved —
        so a driver who mistypes on Friday is still paid on Sunday.

        `reason` is mandatory and is shown verbatim on SCR-DA-022a: "rejected" with nothing to read
        leaves a driver unable to fix the one thing standing between them and their money.

        Only a version awaiting verification can be refused — unlike Approve this is a `409` rather
        than a no-op, because writing a refusal onto an already-decided version would stop an
        approved driver's payouts by a mis-click.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
                  description: Shown verbatim to the driver.
      responses:
        '200':
          description: The verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-error, unauthorized, forbidden, payout-profile-not-found, conflict]

  /v1/admin/verification/org/{orgId}:
    get:
      operationId: getOrgVerification
      summary: Fleet-org verification detail.
      description: |
        AL-39. KYC fields plus every attached document — including the AL-49 payout documents
        (`bank_statement`, `passbook_first_page`, `lankaqr_code`). Approving here is what sets
        `payout_profiles.status = 'verified'`, which in turn unlocks Paid classification (BR-31.1).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: Org verification detail.
          content:
            application/json:
              schema:
                type: object
                required: [kyc, documents]
                properties:
                  kyc:
                    type: object
                    additionalProperties: true
                  payoutProfileStatus:
                    type: string
                    enum: [pending_verification, verified, rejected]
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentRef'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/verification/{subjectId}:
    get:
      operationId: getVerificationSubject
      summary: Verification detail for a driver, vehicle or org.
      description: |
        AL-39, SCR-AP-003a/003c. One subject-agnostic detail read: the flagged fields with their
        `source`, `confidence` and `verifyStatus`, plus the attached documents with **short-lived
        signed** thumbnail and full URLs (US-24.8).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectId'
      responses:
        '200':
          description: Verification detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDetail'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/verification/{subjectId}/fields/{fieldKey}:
    put:
      operationId: decideVerificationField
      summary: Confirm a flagged field, optionally correcting its value.
      description: |
        AL-39, US-2.4a/2.10a. **Omit `value` to confirm the extracted value as is; supply `value`
        to edit and confirm.** Either way the field becomes `verifyStatus='confirmed'` and the
        decision is audited (D-35).

        When no field of a step remains `pending`, the step becomes `VERIFIED`; when every step is
        verified the subject may be approved (US-2.10a).

        This single PUT replaces the two D3' Part 2 routes it supersedes — `POST
        /admin/onboarding/{id}/fields/{key}/confirm` (confirm as is) and `PATCH
        /admin/onboarding/{id}/fields/{key}` (edit and confirm).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - name: fieldKey
          in: path
          required: true
          schema:
            type: string
            maxLength: 60
          example: nicNo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                  maxLength: 500
                  description: Omit to confirm the extracted value unchanged.
      responses:
        '200':
          description: Field decided; the step and subject status are recomputed.
          content:
            application/json:
              schema:
                type: object
                required: [field, stepStatus]
                properties:
                  field:
                    $ref: './_shared.yaml#/components/schemas/ExtractedField'
                  stepStatus:
                    type: string
                    enum: [VERIFIED, PENDING_REVIEW, PENDING_INPUT]
                  approvable:
                    type: boolean
                    description: True once no field of the subject is still `pending`.
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/admin/verification/{subjectId}/approve:
    post:
      operationId: approveVerificationSubject
      summary: Approve a driver, vehicle or fleet org.
      description: |
        US-2.9. **Approval is blocked while any field is `verifyStatus='pending'`** (US-2.10a) —
        that is `409 conflict`, not a silent partial approval.

        For a vehicle this sets `status='APPROVED'`. Per AL-50 a fleet vehicle is not approvable
        until `registration` + `insurance` + `revenue_license` — **plus `permit` for Mode A** — are
        all verified. For an org this also sets the payout profile to `verified` (AL-49). Audited
        (D-35).

        **Δ AL-57: there is no OnePay merchant bind and `merchantBound` is always `false`.** D-11 is
        retired — OnePay supports one merchant account per merchant, so the per-driver sub-account
        this used to trigger never existed, and `POST /v1/internal/vehicles/{id}/merchant` is gone.
        The field is kept so a portal built against the earlier contract still parses; it is
        `deprecated` and nothing sets it.

        **For a driver this decides their IDENTITY only.** Where their money goes is a separate
        decision on a separate route — `POST /v1/admin/verification/payout/{driverId}/approve` —
        because refusing an illegible bank statement must not refuse somebody's licence.

        **Δ C063: approving a REJECTED subject withdraws the refusal first**, because registry-svc
        declines to auto-approve one ("a Verification Officer's decision that four green steps do
        not overturn") and a resubmission could otherwise never be approved. That reopening is its
        own `VERIFICATION_REOPENED` audit row, and it can answer `409 registration-exists` when the
        plate the rejection freed has since been claimed (D-37).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDecision'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found, conflict, registration-exists]

  /v1/admin/verification/{subjectId}/reject:
    post:
      operationId: rejectVerificationSubject
      summary: Reject a driver, vehicle or fleet org, with a reason.
      description: |
        US-2.15. The reason is mandatory and is surfaced verbatim to the applicant at
        `GET /v1/vehicles/{vehicleId}/status`. Rejecting a vehicle also frees its registration
        number from the D-37 active-set uniqueness index. Audited (D-35).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/SubjectId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

  /v1/admin/documents/{docId}:
    get:
      operationId: viewDocument
      summary: Open a document in the full-size viewer.
      description: |
        AL-39, SCR-AP-003b, US-24.8. Redirects to a **short-lived signed** object-storage URL and
        **emits a `DOC_VIEW` audit event** — looking at someone's licence is itself an auditable
        act.

        **Δ C063: this is the only way to fetch a document, and one view is one row.** Both links on
        `DocumentRef` come here, so opening the grid of thumbnails records a view per thumbnail and
        opening the lightbox records another — each is a look at somebody's document. `docId` names
        either a `registry.documents` row (an onboarding document) or a `docs.uploads` row (an AL-49
        payout document, which has no `registry.documents` row at all); the viewer resolves both.
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: docId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: variant
          in: query
          required: false
          description: '**Δ C063.** Which rendition the caller is opening. Recorded on the `DOC_VIEW` row.'
          schema:
            type: string
            enum: [thumb, full]
            default: full
      responses:
        '302':
          description: Redirect to the signed URL.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  # -------------------------------------------------------------------------------------------
  # Directories (AL-40/41/42)
  # -------------------------------------------------------------------------------------------
  /v1/admin/passengers:
    get:
      operationId: searchPassengers
      summary: Search the passenger directory.
      description: |
        AL-40, US-24.9. Multi-criteria, and the criteria combine with **AND**. Phone numbers are
        **masked** in the list for every caller; the clear value requires the detail read, which
        emits `PII_READ`.

        **Δ C064 — gated on URD §2.3's Support row, held platform-wide**, which is the row whose
        cells are exactly `[support|admin|auditor]` once `◐ own org` (Fleet Owner) and
        `◐ financial` (Finance) are fenced, and the row that describes the job: URD §2.4 gives the
        Support CSR "support ticket queue; **trip/user read-only lookup**; investigate disputes".
        Not the Passenger row, whose passenger cell is ✅ — gating an operator console on it would
        let any passenger list every passenger.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QName'
        - $ref: '#/components/parameters/QMobile'
        - $ref: '#/components/parameters/QId'
        - name: email
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Passenger page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/PassengerRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/passengers/{passengerId}:
    get:
      operationId: getPassengerDetail
      summary: Passenger profile with tabbed activity.
      description: |
        AL-40, US-24.9. **Emits a `PII_READ` audit event** — exactly one per open, carrying whether
        the contact details were actually revealed. Read-only: trips, payments, packages and disputes
        are joined read-models, and refunds still route to Finance.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - name: passengerId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: Passenger detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerDetail'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/drivers:
    get:
      operationId: searchDrivers
      summary: Search the driver directory.
      description: |
        AL-41, US-24.10. Multi-criteria, **defaulting to verified drivers**. `level=1` is how the
        Level-1 list ADD Appendix C asked for is obtained.

        **Δ C064 — gated on URD §2.3's Driver wallet & credit transfers row, held platform-wide.**
        It is the only row whose cells are exactly `[support|admin|finance|auditor]`, and Finance has
        to be there: BR-28.8 names them, and half of SCR-AP-013 is the wallet ledger, the daily fee
        and the credit transfers. Not the Driver-app row, which gives Finance ➖. The driver's own
        `◐ own` cell is "your own wallet in the Driver App" and is fenced out here.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/QName'
        - $ref: '#/components/parameters/QMobile'
        - $ref: '#/components/parameters/QId'
        - name: nic
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: regNo
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: level
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [verified, pending, suspended, all]
            default: verified
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Driver page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/DriverRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/drivers/{driverId}:
    get:
      operationId: getDriverDetail
      summary: Driver profile with wallet, level and tabbed activity.
      description: |
        AL-41, US-24.10. **Emits a `PII_READ` audit event** — exactly one per open, carrying whether
        the contact details were actually revealed. Reversals stay Finance-only through
        `POST /v1/admin/drivers/wallet/{driverId}/reverse-fee`; nothing here moves money.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Driver detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDetail'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/vehicles:
    get:
      operationId: searchVehicles
      summary: Search the vehicle directory.
      description: |
        AL-42, US-24.11. Mode A/B rows also show the owning fleet organisation.

        **Δ C064 — gated on URD §2.3's Fleet live-map & per-vehicle analytics row, held
        platform-wide**: cells exactly `[support|admin|finance|auditor]`, and per-vehicle analytics
        is what the detail's Trips / Earnings / Daily-fee tabs are. Not the Fleet-operations row
        (onboarding, assignment, scheduling), which is the Fleet Portal's write surface and gives
        Finance ➖. A Fleet Owner's `◐ own org` is not a platform-wide registry and is fenced out.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - name: regNo
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - $ref: '#/components/parameters/QId'
        - name: type
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/VehicleType'
        - name: mode
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/OperatingMode'
        - name: ownerMobile
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
        - name: fleetOrg
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Vehicle page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/VehicleRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/vehicles/{vehicleId}:
    get:
      operationId: getVehicleDetail
      summary: Vehicle detail with documents and tabbed activity.
      description: |
        AL-42, US-24.11. Registration, insurance and revenue-licence expiries, tracker binding,
        document thumbnails (which open the AL-39 viewer), and the trips / earnings / daily-fee /
        reports tabs.

        **Δ C064: this emits a `PII_READ` event too.** `server_db_schema.md` §23 introduces the
        action as "passenger/driver directory detail opened", but URD §2.3's privacy clause is
        broader in as many words — "All passenger/driver/**vehicle** directory lookups … write a
        read-access audit entry" — and a vehicle detail resolves to a named owner and an
        organisation. A second action for the third subject would split one auditor question across
        two filters; `entityType` already says which kind of record was opened. Micro-change-set.
      tags: [admin-directories]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminVehicleDetail'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, vehicle-not-found]

  # -------------------------------------------------------------------------------------------
  # Moderation
  # -------------------------------------------------------------------------------------------
  /v1/admin/vehicles/{vehicleId}/suspend:
    post:
      operationId: suspendVehicle
      summary: Suspend a vehicle.
      description: US-14.3. Removes it from dispatch and the public map immediately. Audited (D-35).
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, vehicle-not-found]

  /v1/admin/drivers/{driverId}/suspend:
    post:
      operationId: suspendDriver
      summary: Suspend a driver.
      description: |
        US-14.3. Ends any live session and blocks new dispatch. An in-flight ride is left to
        complete — cancelling it is a separate, deliberate act. Audited (D-35).
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Suspended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModerationResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/admin/reports/queue:
    get:
      operationId: listReportQueue
      summary: Pending vehicle reports.
      description: ADD Appendix C. The moderation inbox behind `safety-svc`'s `POST /v1/reports/vehicle`.
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Report queue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ReportRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/reports/{reportId}/resolve:
    post:
      operationId: resolveReport
      summary: Confirm or dismiss a vehicle report.
      description: |
        US-12.6. **Three confirmed reports auto-delist the vehicle** — the third confirmation is
        what removes it, not a separate admin action. Audited (D-35).
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [CONFIRMED, DISMISSED]
                note:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                required: [reportId, status]
                properties:
                  reportId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  status:
                    type: string
                    enum: [PENDING, CONFIRMED, DISMISSED]
                  confirmedCount:
                    type: integer
                    format: int32
                    minimum: 0
                  vehicleDelisted:
                    type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

  /v1/admin/support/tickets:
    get:
      operationId: listSupportTicketQueue
      summary: The support ticket queue.
      description: US-16.3. Agent-facing; users read their own tickets through support-svc.
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, IN_PROGRESS, RESOLVED]
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Ticket queue.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TicketRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/support/tickets/{ticketId}/resolve:
    post:
      operationId: resolveSupportTicket
      summary: Resolve a support ticket.
      description: |
        US-16.3. The response text is shown verbatim to the user at
        `GET /v1/support/tickets/{userId}/{ticketId}`. Audited (D-35).
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: ticketId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                response:
                  type: string
                  maxLength: 4000
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  # -------------------------------------------------------------------------------------------
  # Configuration
  # -------------------------------------------------------------------------------------------
  /v1/admin/fares/tariffs:
    put:
      operationId: updateFareTariffs
      summary: Configure Mode C tariffs and the peak/night windows.
      description: |
        US-14.4. **Tariffs are versioned by `effectiveFrom`, never mutated** — a completed ride
        must stay reconcilable against the rate that priced it (C005). Peak and night windows are
        local Asia/Colombo wall-clock and **may wrap midnight** (night 22:00–05:00), so
        `endLocal < startLocal` is legal and fare-svc handles it.

        There is no Mode B fare here — that is per-vehicle and per-subscriber (Epic 23).
        Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariffs]
              properties:
                effectiveFrom:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                tariffs:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Tariff'
                peakWindows:
                  type: array
                  items:
                    $ref: '#/components/schemas/PeakWindow'
      responses:
        '200':
          description: New tariff version published.
          content:
            application/json:
              schema:
                type: object
                required: [effectiveFrom, tariffs]
                properties:
                  effectiveFrom:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
                  tariffs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tariff'
                  peakWindows:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeakWindow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/config/cities:
    post:
      operationId: createOperatingCity
      summary: Add a launch city.
      description: |
        Writes `config.operating_cities`, which `GET /v1/config/cities` serves publicly — **launching
        a city needs no app release**. All three language names are required (D-26). Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatingCityInput'
      responses:
        '201':
          description: City created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingCity'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, conflict]

  /v1/admin/config/cities/{cityCode}:
    patch:
      operationId: updateOperatingCity
      summary: Edit or deactivate a launch city.
      description: |
        Deactivating a city hides it from the first-run picker; users who already chose it keep
        their `operatingCityCode`. Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - name: cityCode
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_]{1,40}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nameEn:
                  type: string
                nameSi:
                  type: string
                nameTa:
                  type: string
                centroid:
                  $ref: './_shared.yaml#/components/schemas/GeoPoint'
                sortOrder:
                  type: integer
                  format: int32
                active:
                  type: boolean
      responses:
        '200':
          description: City updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatingCity'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/admin/config/feature-flags:
    get:
      operationId: listFeatureFlags
      summary: Every platform feature flag and its current state.
      description: |
        **Δ C062.** URD §2.3 gives feature flags a whole matrix row — "Platform config — Driver
        Level params, feature flags, system settings", Super Admin ✅, Admin ◐ subset, Auditor 👁 —
        and US-14.12 makes them an Admin Portal Config surface, but no contract had a route and no
        spec printed the table. `config.feature_flags` is migration 0202; both are raised as
        micro-change-sets in the C062 handoff.
      tags: [admin-config]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every flag, by key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeatureFlag'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/config/feature-flags/{key}:
    put:
      operationId: setFeatureFlag
      summary: Turn a platform feature flag on or off.
      description: |
        **Δ C062.** An upsert: a flag's first appearance and its next change are the same operator
        action, and a `PUT` that 404'd on a key the running deploy has started reading would leave
        nobody able to turn on the thing the release shipped. Omitting `description` keeps the one
        already stored. Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z][a-z0-9_.-]{1,80}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                description:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: The flag as it now stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/trains:
    post:
      operationId: createTrain
      summary: Register a train.
      description: |
        US-2.17. **Admin-only Mode A** — trains are never onboarded by a driver or a fleet, which
        is why `train` is excluded from every app-facing vehicle-type enum. Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainInput'
      responses:
        '201':
          description: Train created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Train'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, registration-exists]

  /v1/admin/trains/{trainId}:
    put:
      operationId: updateTrain
      summary: Edit a train.
      description: US-2.18. Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrainId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainInput'
      responses:
        '200':
          description: Train updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Train'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]
    delete:
      operationId: deleteTrain
      summary: Retire a train.
      description: US-2.18. Soft-retires it; historical trips keep their reference. Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TrainId'
      responses:
        '204':
          description: Retired.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/announcements:
    post:
      operationId: publishAnnouncement
      summary: Publish a broadcast announcement.
      description: |
        US-14.8. In-app banner plus push. **All three languages are mandatory** — the
        `ck_broadcasts_trilingual` constraint makes the platform's trilingual rule a schema
        invariant (D-26, C005 decision 7). Audited (D-35).
      tags: [admin-config]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messageByLang, startsAt]
              properties:
                messageByLang:
                  type: object
                  required: [si, ta, en]
                  properties:
                    si:
                      type: string
                    ta:
                      type: string
                    en:
                      type: string
                startsAt:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                endsAt:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                push:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema:
                type: object
                required: [broadcastId]
                properties:
                  broadcastId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # Finance & audit
  # -------------------------------------------------------------------------------------------
  /v1/admin/drivers/wallet/{driverId}/reverse-fee:
    post:
      operationId: reverseDriverFee
      summary: Reverse a daily-fee deduction.
      description: |
        US-14.11, **Finance only** (AL-41 keeps reversals off every other role). Posts a balanced
        compensating journal entry rather than editing the original — the ledger is append-only.
        Audited (D-35).
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeDate, vehicleId, reason]
              properties:
                feeDate:
                  $ref: './_shared.yaml#/components/schemas/BusinessDate'
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Defaults to the full charged amount.
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Reversal posted.
          content:
            application/json:
              schema:
                type: object
                required: [entryId, amountMinor, currency]
                properties:
                  entryId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  amountMinor:
                    type: integer
                    format: int64
                    minimum: 0
                  currency:
                    $ref: './_shared.yaml#/components/schemas/Currency'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-amount, unauthorized, forbidden, not-found, conflict]

  /v1/admin/audit-log:
    get:
      operationId: listAuditLog
      summary: Read the audit log.
      description: |
        US-19.3, D-35. Every admin mutation plus the `PII_READ` and `DOC_VIEW` events the
        directories and document viewer emit. Append-only — there is no write route here.
      tags: [admin-audit]
      security:
        - bearerAuth: []
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - name: subjectId
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Timestamp'
        - name: to
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Timestamp'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # PDPA (E-06) — pdpa-svc, surfaced through admin-bff
  # -------------------------------------------------------------------------------------------
  /v1/pdpa/export:
    post:
      operationId: requestDataExport
      summary: Request a copy of your data.
      description: |
        E-06, US-1.8. Accepted asynchronously; `dueBy` is the 30-day statutory deadline. The
        fulfilled export is a signed download on `GET /v1/pdpa/{requestId}`.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, dueBy]
                properties:
                  requestId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  dueBy:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, conflict]

  /v1/pdpa/erasure:
    post:
      operationId: requestDataErasure
      summary: Request erasure of your data.
      description: |
        E-06. `holdReasons` names any statutory hold that prevents full erasure — an unsettled
        payment, an open dispute, a retention obligation. A request under hold is fulfilled as
        `FulfilledHold` and **must carry a reason** (`ck_pdpa_hold_reason`, C005).
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, dueBy, holdReasons]
                properties:
                  requestId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  dueBy:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
                  holdReasons:
                    type: array
                    items:
                      type: string
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, conflict]

  /v1/pdpa/{requestId}:
    get:
      operationId: getPdpaRequest
      summary: Status of a PDPA request.
      description: Includes the signed download URL once the request is fulfilled.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
      responses:
        '200':
          description: Request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/pdpa/{requestId}/fulfill:
    post:
      operationId: fulfillPdpaRequest
      summary: Mark a PDPA request fulfilled.
      description: |
        Admin fulfilment. `FulfilledHold` records that some data was retained under a statutory
        hold and **requires `holdReason`**. Audited (D-35).
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                outcome:
                  type: string
                  enum: [Fulfilled, FulfilledHold]
                holdReason:
                  type: string
                  maxLength: 1000
                  description: Required when `outcome` is `FulfilledHold`.
                artifactUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Fulfilled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

  /v1/admin/pdpa/{requestId}/reject:
    post:
      operationId: rejectPdpaRequest
      summary: Reject a PDPA request with a reason.
      description: Used where a statutory hold blocks the request outright. Audited (D-35).
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: A driver, vehicle or fleet-org id — the verification family is subject-agnostic (AL-39).
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    VerificationSearch:
      name: search
      in: query
      required: false
      description: |
        **Δ C063.** SCR-AP-003's search box, which D2 requires on all three tabs and which the AL-39
        shape did not give a parameter. Case-insensitive substring over the name (driver, org) or
        the registration number and driver name (vehicle), and over the subject id.
      schema:
        type: string
        maxLength: 100
    VerificationStatus:
      name: status
      in: query
      required: false
      description: |
        **Δ C063.** SCR-AP-003's status filter, over the **subject's own** registration status —
        queue membership is always "a field is still flagged" (AL-27).
      schema:
        type: string
        enum: [PENDING, APPROVED, REJECTED]
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    TrainId:
      name: trainId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    PdpaRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    StatsPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [today, week, month, custom]
        default: today
    StatsFrom:
      name: from
      in: query
      required: false
      description: Required when `period=custom`.
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    StatsTo:
      name: to
      in: query
      required: false
      description: Required when `period=custom`.
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    QName:
      name: name
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    QMobile:
      name: mobile
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    QId:
      name: id
      in: query
      required: false
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000

    DashboardKpis:
      type: object
      required: [completedTrips, grossFareMinor, newRiders, newDrivers, dailyFeeRevenueMinor]
      properties:
        completedTrips:
          type: integer
          format: int64
          minimum: 0
        grossFareMinor:
          type: integer
          format: int64
          minimum: 0
        newRiders:
          type: integer
          format: int64
          minimum: 0
        newDrivers:
          type: integer
          format: int64
          minimum: 0
        dailyFeeRevenueMinor:
          type: integer
          format: int64
          minimum: 0

    DashboardDeltas:
      type: object
      description: Percentage change against the immediately preceding period of the same length.
      properties:
        completedTripsPct:
          type: number
          format: double
        grossFarePct:
          type: number
          format: double
        newRidersPct:
          type: number
          format: double
        newDriversPct:
          type: number
          format: double
        dailyFeeRevenuePct:
          type: number
          format: double

    DashboardLive:
      type: object
      description: Real-time cards; not served from the analytics rollup.
      required: [onlineDrivers, pendingVerifications, openTickets]
      properties:
        onlineDrivers:
          type: integer
          format: int32
          minimum: 0
        pendingVerifications:
          type: integer
          format: int32
          minimum: 0
        openTickets:
          type: integer
          format: int32
          minimum: 0

    DriverQueueRow:
      type: object
      required: [driverId, name, submittedAt, flaggedFields, status]
      properties:
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        submittedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        flaggedFields:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    VehicleQueueRow:
      type: object
      required: [vehicleId, regNo, flaggedFields, status]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        ownerDriverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        submittedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        flaggedFields:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    DriverPayoutQueueRow:
      type: object
      required: [driverId, name, bank, accountNo, submittedAt, hasProof, hasLankaQr, status]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        name: { type: string }
        bank: { type: string }
        accountNo: { type: string }
        submittedAt: { type: string, format: date-time }
        hasProof:
          type: boolean
          description: Whether a bank statement or passbook page is attached to open.
        hasLankaQr:
          type: boolean
          description: AL-59 — whether the driver's own bank-app QR is attached.
        status:
          type: string
          description: The driver's IDENTITY verdict, not this profile's. See the queue route.
          enum: [PENDING, APPROVED, REJECTED]

    DriverPayoutVerification:
      type: object
      required: [driverId, name, bank, branch, accountNo, accountHolderName, status, documents, approvable]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        name: { type: string }
        bank: { type: string }
        branch: { type: string }
        accountNo: { type: string }
        accountHolderName: { type: string }
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        rejectionReason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        approvable:
          type: boolean
          description: There is a version awaiting a decision — not a judgement about the evidence.

    DriverPayoutDecision:
      type: object
      required: [driverId, status]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        reason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }

    OrgQueueRow:
      type: object
      required: [orgId, name, kycStatus, vehicleCount, status]
      properties:
        orgId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        kycStatus:
          type: string
          description: |
            **Δ C063.** Whether there is US-13.A7 evidence to read at all — `complete` once the
            organisation carries a business registration and a contact number, `incomplete` until
            it does. The payout profile's own state is `payoutProfileStatus`: the two are separate
            decisions and one field could not carry both.
          enum: [complete, incomplete]
        vehicleCount:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        payoutProfileStatus:
          type: string
          description: '**Δ C063.** The AL-49 version awaiting this officer, when there is one.'
          enum: [pending_verification, verified, rejected]

    DocumentRef:
      type: object
      description: |
        **Δ C063: both links point at `GET /v1/admin/documents/{docId}`, not at the bucket.**
        AL-39 asks for two things at once — reads use short-lived signed object-storage URLs *and*
        every read emits `DOC_VIEW`. A pre-signed bucket URL handed out here would satisfy the first
        and silently break the second: the officer's browser would fetch somebody's licence straight
        from storage and nothing would record it. The audited route mints the signed URL per view
        and `302`s to it, so the signed URL is where it always was and every fetch passes the row
        that records it.
      required: [docId, kind]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
        thumbUrl:
          type: string
          description: '`/v1/admin/documents/{docId}?variant=thumb` — audited, and redirects to the signed URL.'
        fullUrl:
          type: string
          description: '`/v1/admin/documents/{docId}?variant=full`.'
        capturedVia:
          type: string
          description: '`drag_crop` for the AL-43 in-app scanner, `upload` otherwise.'
          enum: [drag_crop, upload]

    VerificationDetail:
      type: object
      required: [subject, fields, documents, steps]
      properties:
        subject:
          type: object
          required: [id, type]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            type:
              type: string
              enum: [driver, vehicle, org]
            displayName:
              type: string
        fields:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/ExtractedField'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        steps:
          type: array
          description: |
            **Δ C063.** SCR-AP-003a's decision rail: the per-step Verified/Pending breakdown D2
            requires beside the Approve button, which the AL-39 shape omitted.

            Two vocabularies, because there are two onboarding surfaces. A Mode C vehicle has
            AL-30's four saved `registry.onboarding_steps` and they are authoritative — registry-svc
            recomputes them and admin-bff must not derive a second opinion. A fleet vehicle has
            none at all, so its rail is AL-50's named slots (`registration`, `insurance`,
            `revenue_license`, `permit`) under their own names — which is what SCR-FP-004 showed the
            operator who uploaded them. A driver's licence is the single synthetic step `profile`;
            an organisation's is `kyc`.
          items:
            $ref: '#/components/schemas/VerificationStep'
        approvable:
          type: boolean
          description: False while any field is still `pending` (US-2.10a).

    VerificationStep:
      type: object
      description: One row of SCR-AP-003a's decision rail (Δ C063).
      required: [step, status]
      properties:
        step:
          type: string
          example: insurance
        status:
          type: string
          enum: [VERIFIED, PENDING_REVIEW, PENDING_INPUT]

    VerificationDecision:
      type: object
      required: [subjectId, status]
      properties:
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
        merchantBound:
          deprecated: true
          type: boolean
          description: |
            **Δ AL-57 — always `false`.** D-11 is retired and the bind it named no longer exists.

    MaskablePhone:
      description: |
        **Δ C064.** An MSISDN a directory *detail* may render either way. The clear `PhoneE164` for
        a caller who holds URD §2.3's End-user account management row as **write, unscoped** (Admin,
        Super Admin); the `PhoneMasked` form for everybody else — a Support CSR is `◐ on tickets` and
        a Verification Officer is `◐ verification`, and neither qualifier describes browsing the
        directory. The mask is applied server-side and the clear value is not in the payload beside
        it.

        A **list** row is never this: it is always `PhoneMasked`, so every clear number this surface
        has emitted has a `PII_READ` row behind it.
      oneOf:
        - $ref: './_shared.yaml#/components/schemas/PhoneE164'
        - $ref: './_shared.yaml#/components/schemas/PhoneMasked'

    PassengerRow:
      type: object
      required: [passengerId, name, mobileMasked, trips, joinedAt, status]
      properties:
        passengerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        mobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        trips:
          type: integer
          format: int32
          minimum: 0
          description: Rides that reached a terminal successful state (R-05). Deliveries are counted too.
        joinedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        status:
          type: string
          description: |
            **Δ C064: `deleted` is never answered yet.** A PDPA erasure is C065's and no column
            records one; answering `active` for an account nobody erased is the honest value.
          enum: [active, blocked, deleted]

    PassengerDetail:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [passengerId, name, mobile, joinedAt, defaultPay, status]
          properties:
            passengerId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            name:
              type: string
            mobile:
              $ref: '#/components/schemas/MaskablePhone'
            email:
              type: string
              format: email
              description: |
                **Δ C064.** Masked as `a***@domain` for a caller without the grant — still a valid
                address, because a mask that broke `format: email` would make a schema-validating
                client reject the whole response.
            joinedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            rating:
              type: number
              format: double
              minimum: 0
              maximum: 5
              description: What drivers rated them (`driver_to_passenger`, US-18.2). Absent until somebody has.
            defaultPay:
              type: string
              enum: [cash, lankaqr, onepay]
            status:
              type: string
              enum: [active, blocked, deleted]
            sosContacts:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                  phone:
                    $ref: '#/components/schemas/MaskablePhone'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPayment'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPackage'
        disputes:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryDispute'

    DirectoryTrip:
      type: object
      description: |
        **Δ C064.** One journey, from either surface: `kind: ride` is a Mode C booking
        (`rides.rides`, R-01) and `kind: session` is a Mode A/B journey (`trips.sessions`, D-03).
        Both appear because a directory is not mode-aware — the ride-svc / trip-state-svc boundary is
        about who writes the row, not about what an operator may read back. A session carries no fare.
      required: [tripId, kind, state, startedAt]
      properties:
        tripId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [ride, session]
        state:
          type: string
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        counterpartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyName:
          type: string
          description: The driver on a passenger's tab, the passenger on a driver's.
        fareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        startedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        endedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryPayment:
      type: object
      description: '**Δ C064.** One attempt of D-10''s payment state machine; retries are their own rows.'
      required: [paymentId, rideId, method, state, amountMinor, currency, attemptNo, createdAt]
      properties:
        paymentId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        method:
          type: string
          enum: [cash, lankaqr, onepay, cod, scan_driver_qr, wallet]
        state:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        surchargeMinor:
          type: integer
          format: int64
          minimum: 0
        tipMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        attemptNo:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryPackage:
      type: object
      description: '**Δ C064.** A `kind = 2` ride (P-06). The recipient''s number is masked by the same rule as the passenger''s own.'
      required: [rideId, state, createdAt]
      properties:
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        state:
          type: string
        packageSize:
          type: string
          enum: [S, M, L]
        description:
          type: string
        recipientName:
          type: string
        recipientMobile:
          $ref: '#/components/schemas/MaskablePhone'
        fareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        completedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryDispute:
      type: object
      description: |
        **Δ C064.** One `support.tickets` row. The whole ticket list rather than a "disputes"
        subset — the `category` column is free text and US-9.23's daily-fee refund request rides in
        it, so a server-side filter on a vocabulary nobody has fixed would silently hide tickets.
      required: [ticketId, category, status, createdAt, updatedAt]
      properties:
        ticketId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        category:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED]
        description:
          type: string
        response:
          type: string
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DriverRow:
      type: object
      required: [driverId, name, mobileMasked, vehicles, level, trips, status]
      properties:
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        mobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        vehicles:
          type: array
          items:
            type: string
            description: Registration numbers.
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          description: '**Δ C064.** `dispatch.driver_levels.level`, defaulting to 3 — the column''s own default — for a driver nobody has scored.'
        trips:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          description: |
            **Δ C064: derived, not stored.** Verified when `registry.driver_profiles.verified_at` is
            set, suspended when `iam.users.is_blocked` is, pending otherwise. Suspended wins over
            verified — it is the later fact and the one the row was opened to find.
          enum: [verified, pending, suspended]

    DriverDetail:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [driverId, name, mobile, joinedAt, walletMinor, currency, level, points, status]
          properties:
            driverId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            name:
              type: string
            mobile:
              $ref: '#/components/schemas/MaskablePhone'
            nic:
              type: string
              description: |
                **Δ C064.** Masked to its last two characters for a caller without the grant. Harder
                than a phone number, deliberately: an NIC's leading digits are the holder's year of
                birth and day of year, so a prefix is not a hint — it is a date of birth.
            joinedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            rating:
              type: number
              format: double
              minimum: 0
              maximum: 5
            walletMinor:
              type: integer
              format: int64
              minimum: 0
            currency:
              $ref: './_shared.yaml#/components/schemas/Currency'
            level:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
            points:
              type: integer
              format: int32
            status:
              type: string
              enum: [verified, pending, suspended]
            verifiedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/LinkedVehicle'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        walletLedger:
          type: array
          items:
            $ref: '#/components/schemas/WalletLedgerEntry'
        dailyFee:
          type: array
          items:
            $ref: '#/components/schemas/DailyFeeCharge'
        creditTransfers:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryCreditTransfer'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryVehicleReport'

    LinkedVehicle:
      type: object
      description: |
        **Δ C064.** A vehicle chip on SCR-AP-013 — owned *or* assigned. A Mode C driver owns their
        vehicle; a fleet's driver owns nothing and drives what `registry.fleet_assignments` gives
        them (AL-03), and both are "linked vehicles" (US-24.10).
      required: [vehicleId, regNo, type, mode, status, dispatchState, owned, link]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        type:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          $ref: './_shared.yaml#/components/schemas/OperatingMode'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
        dispatchState:
          type: string
          enum: [ACTIVE, DISPATCH_SUSPENDED]
        owned:
          type: boolean
        link:
          type: string
          description: '`/v1/admin/vehicles/{vehicleId}` — the detail this chip jumps to.'

    WalletLedgerEntry:
      type: object
      description: '**Δ C064.** One `billing.wallet_transactions` row (D-09 §10). Signed: a debit is negative.'
      required: [entryNo, kind, amountMinor, balanceAfterMinor, ts]
      properties:
        entryNo:
          type: integer
          format: int64
        kind:
          type: string
        amountMinor:
          type: integer
          format: int64
        balanceAfterMinor:
          type: integer
          format: int64
        description:
          type: string
        ts:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DailyFeeCharge:
      type: object
      description: '**Δ C064.** One D-13 charge. `feeDate` is the Asia/Colombo business date (D-38).'
      required: [feeDate, driverId, vehicleId, amountMinor, currency, tripsThatDay, status, chargedAt]
      properties:
        feeDate:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        tripsThatDay:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [PAID, WAIVED_FIRST_TRIP]
        chargedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryCreditTransfer:
      type: object
      description: |
        **Δ C064.** One `billing.credit_transfers` row (US-9.13/9.21). Exact value, no commission
        (AL-01). `direction` is computed against the driver whose detail this is; `initiation` is the
        stored column — who started it — and they answer different questions.
      required: [transferId, direction, initiation, counterpartyId, amountMinor, currency, status, createdAt]
      properties:
        transferId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        direction:
          type: string
          enum: [in, out]
        initiation:
          type: string
          enum: [REQUESTED, DIRECT]
        counterpartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyName:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryVehicleReport:
      type: object
      description: '**Δ C064.** One `safety.vehicle_reports` row. The third CONFIRMED one delists the vehicle (US-12.6).'
      required: [reportId, vehicleId, reason, status, createdAt]
      properties:
        reportId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, DISMISSED]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    VehicleRow:
      type: object
      required: [vehicleId, type, mode, regNo, trips, status]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        type:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          $ref: './_shared.yaml#/components/schemas/OperatingMode'
        owner:
          type: string
        fleetOrg:
          type: string
          description: Present for Mode A/B vehicles owned by a fleet.
        regNo:
          type: string
        trips:
          type: integer
          format: int32
          minimum: 0
          description: '**Δ C064.** Completed Mode C rides **plus** completed Mode A/B sessions — a bus has no rides.'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]

    AdminVehicleDetail:
      type: object
      required: [info]
      properties:
        info:
          type: object
          required: [vehicleId, type, regNo, mode, ownerId, status, dispatchState, onboardingStatus, registeredAt]
          properties:
            vehicleId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            type:
              $ref: './_shared.yaml#/components/schemas/VehicleType'
            regNo:
              type: string
            mode:
              $ref: './_shared.yaml#/components/schemas/OperatingMode'
            ownerId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            owner:
              type: string
            fleetId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            fleetOrg:
              type: string
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
            dispatchState:
              type: string
              description: '`DISPATCH_SUSPENDED` is E-03''s "do not offer rides to it" and is not the end of a registration.'
              enum: [ACTIVE, DISPATCH_SUSPENDED]
            onboardingStatus:
              type: string
              enum: [incomplete, approved]
            insuranceExpiry:
              type: string
              format: date
              description: '**Δ C064.** The newest certificate''s expiry, as an Asia/Colombo calendar date (D-38).'
            revenueLicenceExpiry:
              type: string
              format: date
            registeredAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            tracker:
              type: object
              description: '**Δ C064.** The bound tracker (T-08), absent where the vehicle has none.'
              required: [imei, online, state]
              properties:
                imei:
                  type: string
                online:
                  type: boolean
                  description: |
                    Pinged inside US-3.13's 30-minute silence window — the same threshold
                    fleet-health (C044) uses, so the two screens cannot disagree about one device.
                state:
                  type: string
                  enum: [ACTIVE, QUARANTINED, REVOKED]
                lastSeen:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        earnings:
          type: array
          items:
            $ref: '#/components/schemas/VehicleEarningsDay'
        dailyFee:
          type: array
          items:
            $ref: '#/components/schemas/DailyFeeCharge'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryVehicleReport'

    VehicleEarningsDay:
      type: object
      description: |
        **Δ C064.** One Asia/Colombo business day (D-38) of settled fare on this vehicle's rides.
        Derived from `fares.ride_payments` rather than read from `fares.driver_earnings`: that rollup
        is keyed `(driver_id, earn_date)` and a vehicle two drivers shared on one day appears in it
        twice under neither of them.
      required: [earnDate, trips, grossMinor, currency]
      properties:
        earnDate:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        trips:
          type: integer
          format: int32
          minimum: 0
        grossMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    ModerationResult:
      type: object
      required: [subjectId, status]
      properties:
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [SUSPENDED, ACTIVE]
        reason:
          type: string

    ReportRow:
      type: object
      required: [reportId, vehicleId, reason, status, createdAt]
      properties:
        reportId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        reporterId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, DISMISSED]
        confirmedCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    TicketRow:
      type: object
      required: [ticketId, userId, category, status, createdAt]
      properties:
        ticketId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        category:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED]
        description:
          type: string
        response:
          type: string
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        resolvedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Tariff:
      type: object
      required: [vehicleType, firstKmMinor, perKmMinor, currency]
      properties:
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        firstKmMinor:
          type: integer
          format: int64
          minimum: 0
        perKmMinor:
          type: integer
          format: int64
          minimum: 0
        peakSurchargePct:
          type: integer
          format: int32
          minimum: 0
          default: 20
        nightSurchargePct:
          type: integer
          format: int32
          minimum: 0
          default: 15
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    PeakWindow:
      type: object
      description: |
        Local Asia/Colombo wall-clock. `endLocal` may be **earlier** than `startLocal` — the night
        window wraps midnight, and no constraint enforces ordering for exactly that reason (C005).
      required: [kind, startLocal, endLocal, multiplierPct]
      properties:
        kind:
          type: string
          enum: [peak, night]
        startLocal:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '22:00'
        endLocal:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '05:00'
        multiplierPct:
          type: integer
          format: int32
          minimum: 0

    OperatingCityInput:
      type: object
      required: [code, nameEn, nameSi, nameTa, centroid]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,40}$'
        nameEn:
          type: string
        nameSi:
          type: string
        nameTa:
          type: string
        centroid:
          $ref: './_shared.yaml#/components/schemas/GeoPoint'
        sortOrder:
          type: integer
          format: int32
          default: 0

    OperatingCity:
      allOf:
        - $ref: '#/components/schemas/OperatingCityInput'
        - type: object
          required: [active]
          properties:
            active:
              type: boolean

    TrainInput:
      type: object
      required: [name, trainNumber]
      properties:
        name:
          type: string
          maxLength: 200
        trainNumber:
          type: string
          maxLength: 32
        routeId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        active:
          type: boolean
          default: true

    Train:
      allOf:
        - $ref: '#/components/schemas/TrainInput'
        - type: object
          required: [trainId]
          properties:
            trainId:
              $ref: './_shared.yaml#/components/schemas/Ulid'

    AuditEvent:
      type: object
      description: |
        One row of the immutable log. **Δ C062:** `before` and `after` join `detail`, because the
        D-35 deliverable is "actor, action, target, **before/after**, ip" and the schema had
        nowhere to put the pair. They are different facts and are kept apart: `before`/`after` are
        what the handler knows about the **entity**, `detail` is what the interceptor knows about
        the **request** (method, path, the caller's whole role union, the idempotency key). One
        field holding both would make "what changed" unreadable.
      required: [eventId, actorId, action, occurredAt]
      properties:
        eventId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        actorId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        actorRole:
          $ref: './_shared.yaml#/components/schemas/Role'
        action:
          type: string
          example: PII_READ
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        subjectType:
          type: string
        before:
          type: [object, 'null']
          additionalProperties: true
          description: State before, or `null` where nothing existed — a creation, or a read event.
        after:
          type: [object, 'null']
          additionalProperties: true
          description: State after, or the observation itself.
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
        occurredAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    FeatureFlag:
      type: object
      description: One row of `config.feature_flags` (Δ C062, migration 0202, US-14.12).
      required: [key, enabled, updatedAt]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,80}$'
        enabled:
          type: boolean
        description:
          type: string
          description: What flipping it does, in the operator's words. Shown beside the toggle.
        updatedBy:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    AdminSession:
      type: object
      description: |
        Δ C062. The post-sign-in bootstrap (URD §2.2). `permissions` is the caller's row of
        URD §2.3 as the server evaluated it; `menu` is the same evaluation projected onto the nav,
        so the console cannot offer a screen the API would refuse.
      required: [userId, roles, permissions, menu, mfaRequired]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        roles:
          type: array
          description: Every canonical role held. Effective permissions are their union (AL-06).
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermission'
        menu:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuGroup'
        mfaRequired:
          type: boolean
          const: false
          description: |
            **Always false (AL-37).** There is no second factor for internal roles; the
            compensating controls are the failed-attempt lock-out and the optional IP allow-list,
            both iam-svc's. Present precisely because D3' §0 and D7' §4.2 still say otherwise.

    AdminPermission:
      type: object
      description: One URD §2.3 row as this caller holds it.
      required: [featureArea, label, symbol, grants, ownScope]
      properties:
        featureArea:
          type: string
          description: Stable kebab key of the row, e.g. `platform-settings`.
          example: moderation
        label:
          type: string
          description: The row's URD §2.3 wording.
        symbol:
          type: string
          description: The cell rendered in the spec's own legend — `✅`, `◐ own org`, `⚙ rates`.
          example: ✅
        grants:
          type: array
          items:
            type: string
            enum: [read, write, configure, raise]
        qualifier:
          type: string
          description: The scope note the cell carries, when anything is scope-limited.
          example: temp on reports
        ownScope:
          type: boolean
          description: |
            True when at least one capability here is available **only** within the caller's own
            records or organisation. A fence, not an answer — the owning service must bound it.

    AdminMenuGroup:
      type: object
      required: [key, labelKey, items]
      properties:
        key:
          type: string
        labelKey:
          type: string
          description: |
            A resource key, never a label. D-26 makes every user-facing string trilingual and the
            Admin Portal owns the Si/Ta/En bundles.
          example: nav.group.configuration
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuItem'

    AdminMenuItem:
      type: object
      required: [key, labelKey, path, ownedBy]
      properties:
        key:
          type: string
        labelKey:
          type: string
        path:
          type: string
          description: The Admin Portal route. The gateway decides which process answers its API.
        ownedBy:
          type: string
          description: |
            Which service answers this item's API. Several Configuration entries are **not**
            admin-bff's — the GTFS manager is transit-svc's (AL-54), the daily-fee rates and
            voucher tiers subscription-svc's, the Driver-Level parameters dispatch-svc's, RBAC
            provisioning iam-svc's — because each is owned by the service that owns the table it
            writes. The console is one console; the writers are not one writer.
          example: transit-svc

    PdpaRequest:
      type: object
      required: [requestId, kind, status, dueBy]
      properties:
        requestId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [export, erasure]
        status:
          type: string
          description: Matches the `pdpa.requests.status` CHECK (C005).
          enum: [Received, InProgress, FulfilledHold, Fulfilled, Rejected]
        holdReason:
          type: string
          description: Always present when `status` is `FulfilledHold`.
        dueBy:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        downloadUrl:
          type: string
          format: uri
          description: Short-lived signed URL of the export archive.
