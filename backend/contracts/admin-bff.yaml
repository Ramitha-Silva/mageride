      x-error-codes: [validation-failed, unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # Finance & audit
  # -------------------------------------------------------------------------------------------
  /v1/admin/finance/reconciliation:
    get:
      operationId: getSettlementReconciliation
      summary: OnePay/LankaQR settlement against the ledger, per rail per day.
      description: |
        **Δ C065.** D6' §7.1/§7.2 gives wallet-svc "OnePay/LankaQR gateway settlement reconciliation
        … (exceptions → Finance queue in Admin Portal)" and SCR-AP-006 draws the screen; no route in
        D3' serves it. `settledMinor` is what the gateway confirmed, `postedMinor` what reached the
        ledger's own credit leg, and `varianceMinor` is the difference — zero is the whole point of
        the screen.

        **`billing.topups` is the whole of "gateway settlement" on this platform**, and that follows
        from AL-57 rather than being a simplification: `onepay` and platform-merchant `lankaqr` were
        removed as *ride* payment methods, so what the two rails settle is wallet top-ups.
        `?method=` therefore admits exactly `onepay` and `lankaqr` — **there is no bank-transfer
        rail to reconcile (AL-05)** and asking for one is a 400, not an empty page.

        Gated on **Finance · Read** (ADM 👁, S.ADM ✅, FIN ✅, AUD 👁; CSR and Verification Officer
        ➖). Default window is the last 30 Asia/Colombo business days (D-38); the maximum is 366.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
        - name: to
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
        - name: method
          in: query
          required: false
          schema:
            type: string
            enum: [onepay, lankaqr]
      responses:
        '200':
          description: The window, its rails and the totals under them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementSummary'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/finance/reconciliation/exceptions:
    get:
      operationId: listSettlementExceptions
      summary: Gateway sessions that need a human.
      description: |
        **Δ C065.** D6' §7.2's "exceptions → Finance queue". Four kinds, **derived from the row
        rather than stored on it** — wallet-svc records no exception column, so a session that
        resolves itself leaves the queue with nobody having to close it:

        | `kind` | What happened |
        |---|---|
        | `amount-mismatch` | Settled and posted, and the ledger's credit leg is not the amount the gateway confirmed. The one no retry will fix |
        | `settled-not-posted` | Settled with no journal entry — money the payer parted with and no wallet moved |
        | `unsettled` | Still open past `AdminBff:Finance:SettlementGracePeriod`: a lost callback, or an amount mismatch wallet-svc refused to credit and left `Pending` |
        | `gateway-failed` | The gateway reported FAILED after issuing a transaction id of its own |

        Oldest first, because the queue is worked oldest first and an operator touching a row must
        not move it to the back.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [amount-mismatch, settled-not-posted, unsettled, gateway-failed]
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Open settlement exceptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SettlementException'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/finance/refunds:
    get:
      operationId: listRefundQueue
      summary: The refund queue, including R-19's Overpaid payments.
      description: |
        **Δ C065.** E-05 and ADD §11.14. **Two populations on one screen**, which is the point:
        `source=refund` is a `fares.refunds` row already raised and awaiting settlement;
        `source=overpaid` is a payment §11.14 moved to `Overpaid` that **nobody has raised a refund
        for** — the R-19 failure this queue exists to catch. Showing only the first would hide
        exactly the case that needs an operator.

        Gated on **Refunds · Read**. The Support CSR's cell is `◐ raise/recommend`, so they see the
        queue and cannot execute — which is what the row's other half (`FIN ✅ approve/execute`) is
        written against.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [refund, overpaid]
        - name: status
          in: query
          required: false
          description: A `fares.refunds.status`. Absent means the open ones, plus every unraised Overpaid.
          schema:
            type: string
            enum: [Requested, Submitted, Succeeded, Failed]
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The queue, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RefundQueueRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

    post:
      operationId: issueRefund
      summary: Raise a full, partial or overpaid reversal.
      description: |
        **Δ C065.** E-05. **Forwarded to fare-svc's `POST /v1/admin/fare/refund`**, which owns
        `fares.refunds`, the balanced `payment_refund` / `overpaid_reversal` journal entry and the
        gateway reverse call. The operator's own bearer is forwarded — that route is role-gated, not
        an `/v1/internal/**` plane — and in the deployed topology the gateway sends
        `/v1/admin/fare/**` straight to fare-svc at Order 20. What admin-bff adds is the queue the
        decision is made from and the D-35 row saying a human made it: **two rows for one refund is
        the right failure**, since only fare-svc's survives this route being renamed and only this
        one survives the refund row being purged.

        `amountMinor` may be omitted on a `full` or `overpaid_reversal` refund and means the whole
        payment; a `partial` must say how much. Gated on **Refunds · Write**.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentId, kind, reasonCode]
              properties:
                paymentId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                kind:
                  type: string
                  enum: [full, partial, overpaid_reversal]
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                reasonCode:
                  type: string
                  maxLength: 60
      responses:
        '200':
          description: Refund raised.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes:
        [validation-failed, invalid-amount, unauthorized, forbidden, not-found, conflict,
         payment-already-settled, dependency-unavailable]

  /v1/admin/finance/transactions:
    get:
      operationId: listWalletTransactions
      summary: Top-ups, daily fees, voucher purchases and credit transfers.
      description: |
        **Δ C065.** US-9A.15's "view all wallet transactions" and SCR-AP-006's first tab. Exactly
        four `billing.journal_entries.kind` values — the ledger admits twelve, and a report that
        showed all of them would put a trip payment, a penalty settlement and a weekly payout under
        column headings that describe none of the three.

        **Read from the journal, not from `billing.wallet_transactions`.** The projection is one row
        per *account leg*, so a driver-to-driver transfer appears twice and a report that summed it
        would double the platform's transfer volume. One entry, two parties, named by the sign of
        their leg: a top-up is platform → driver, a daily fee is driver → platform, a voucher
        purchase is platform → buyer, a transfer is sender → recipient.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionsFrom'
        - $ref: '#/components/parameters/TransactionsTo'
        - $ref: '#/components/parameters/TransactionsKind'
        - $ref: '#/components/parameters/TransactionsParty'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The window that was applied, and the rows under it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsReport'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/finance/transactions.csv:
    get:
      operationId: exportWalletTransactionsCsv
      summary: The same rows as a CSV download.
      description: |
        **Δ C065.** Byte-for-byte the rows `listWalletTransactions` returns for the same query —
        one query, three renderings, so "the export matches the screen" is structural. The file
        carries a `#` preamble naming the window, the timezone, the kinds, the row count and the
        money unit, because a figure with no stated window is unfalsifiable once the request that
        produced it is gone. Money stays in integer minor units.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionsFrom'
        - $ref: '#/components/parameters/TransactionsTo'
        - $ref: '#/components/parameters/TransactionsKind'
        - $ref: '#/components/parameters/TransactionsParty'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: CSV, UTF-8 with a BOM.
          content:
            text/csv:
              schema:
                type: string
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/finance/transactions.pdf:
    get:
      operationId: exportWalletTransactionsPdf
      summary: The same rows as a paginated PDF table.
      description: |
        **Δ C065.** The same rows again, laid out as an A4 table in one of the base-14 fonts every
        conforming reader is required to have — so nothing is embedded and no rendering library is
        on the platform's dependency list. The `entryId` column is dropped (a page of UUIDs is a
        page nobody reads); the CSV is the machine-readable rendering and keeps it.

        **Not for anything trilingual.** WinAnsi cannot draw Sinhala or Tamil, so this renderer is
        for a finance table of ids, integers and contract identifiers and must not be extended to
        fake a script it has no glyphs for (D-26).
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransactionsFrom'
        - $ref: '#/components/parameters/TransactionsTo'
        - $ref: '#/components/parameters/TransactionsKind'
        - $ref: '#/components/parameters/TransactionsParty'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: PDF 1.4.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/documents/expiring:
    get:
      operationId: listDocumentExpiryQueue
      summary: Documents inside E-03's notice horizon, or already expired.
      description: |
        **Δ C065.** ADD §6 lists a **document-expiry queue** among admin-bff's functions and no spec
        gives it a route. Gated on **Onboarding/Verification · Read**, not Finance: an expiring
        insurance certificate is a document review, and E-03's expiry is what AL-10's approval gate
        turns on.

        **Only the current document of each (subject, kind).** A renewal supersedes rather than
        replaces, so the superseded row stays behind with a date in the past; a queue that listed
        every expired row would show a backlog that has already been dealt with. `REJECTED`
        documents are C063's queue and are excluded — one upload must not appear on two officers'
        screens under two different verbs.

        `lastNoticeDays` is the tightest E-03 reminder already sent (30 / 7 / 1 / 0), which is the
        difference between chasing the holder and apologising to them. `thumbUrl`/`fullUrl` are
        C063's audited viewer and never a bucket URL (AL-39).
      tags: [admin-verification]
      security:
        - bearerAuth: []
      parameters:
        - name: withinDays
          in: query
          required: false
          description: Horizon, 0–365. Defaults to 30 — E-03's own outermost reminder. 0 lists only what has expired.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 365
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [driving_license, registration, permit, insurance, revenue_license]
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Documents by expiry, soonest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentExpiryRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/fraud/queue:
    get:
      operationId: listFraudReviewQueue
      summary: E-07 anti-collusion signals awaiting review.
      description: |
        **Δ C065.** ADD §6 lists a **fraud-review queue** among admin-bff's functions.
        reputation-svc owns `reputation.fraud_flags` and both `GET /v1/admin/reputation/flags` and
        the `/resolve` that moves a flag off `open`; the gateway routes those there at Order 20.
        What that surface cannot do is put a **name** beside a subject id — reputation-svc holds no
        identity — and a queue of bare UUIDs is a queue nobody can work. So the list is joined here,
        exactly as the three directories join five other services' tables, and `resolveUrl` points
        the decision back at reputation-svc. **One reader, one writer.**

        Gated on **Moderation · Read**, because what a confirmed signal leads to is a suspension.
        `detail` is re-emitted as the JSON the detector stored: E-07's heuristics are expected to
        grow (migration 0802) and a typed shape here would drop every field a new detector adds.
      tags: [admin-moderation]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `open` — a review queue's job is what has not been reviewed.
          schema:
            type: string
            enum: [open, dismissed, actioned]
        - name: kind
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Flags, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FraudFlagRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/drivers/wallet/{driverId}/reverse-fee:
    post:
      operationId: reverseDriverFee
      summary: Reverse a daily-fee deduction.
      description: |
        US-14.11. Posts a balanced compensating journal entry rather than editing the original — the
        ledger is append-only. Audited (D-35).

        **Δ C065: gated on `Driver wallet adjustments / reversals` · Write**, which is the one URD
        §2.3 row that exists for this button and whose cells are ✅ for exactly **Super Admin and
        Finance** (Admin 👁, Auditor 👁, everybody else ➖). So the fence "reversals are
        Finance/Super-Admin only" is not a role list written into this route — it is what the matrix
        already says, and there is no ◐ in the row to fence.

        **The entry is posted by wallet-svc**, the only writer of `billing.journal_postings`, whose
        own file names admin-bff as the caller entitled to `kind='adjustment'`. The ledger key is
        `adjustment:fee_reversal:{driverId}:{vehicleId}:{feeDate}` — composed from the business fact,
        so a double click collides in the ledger and answers `replayed: true` with the original
        entry rather than crediting twice. That means **one reversal per charge, ever**; a second
        correction on the same day is an adjustment somebody has to argue for.

        `amountMinor` defaults to the full charged amount and may not exceed it. A day whose fee was
        waived under D-13's first-trip rule moved no money and is a `409`.
      tags: [admin-finance]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [feeDate, vehicleId, reason]
              properties:
                feeDate:
                  $ref: './_shared.yaml#/components/schemas/BusinessDate'
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Defaults to the full charged amount.
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Reversal posted, or replayed from the ledger when the key was already used.
          content:
            application/json:
              schema:
                type: object
                required: [entryId, amountMinor, currency, balanceAfterMinor, replayed]
                properties:
                  entryId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  amountMinor:
                    type: integer
                    format: int64
                    minimum: 0
                  currency:
                    $ref: './_shared.yaml#/components/schemas/Currency'
                  balanceAfterMinor:
                    description: The driver's wallet after the credit. Signed — a wallet may be negative (US-9A.7).
                    type: integer
                    format: int64
                  replayed:
                    description: |
                      **Δ C065.** True when the ledger key had already been used — a double click,
                      answered with the original entry rather than a second credit. On the wire
                      because an operator who pressed twice deserves to be told the second press
                      did nothing.
                    type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes:
        [validation-failed, invalid-amount, unauthorized, forbidden, not-found, conflict,
         dependency-unavailable]

  /v1/admin/audit-log:
    get:
      operationId: listAuditLog
      summary: Read the audit log.
      description: |
        US-19.3, D-35. Every admin mutation plus the `PII_READ` and `DOC_VIEW` events the
        directories and document viewer emit. Append-only — there is no write route here.
      tags: [admin-audit]
      security:
        - bearerAuth: []
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: action
          in: query
          required: false
          schema:
            type: string
            maxLength: 60
        - name: subjectId
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Timestamp'
        - name: to
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Timestamp'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditEvent'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  # -------------------------------------------------------------------------------------------
  # PDPA (E-06) — pdpa-svc, surfaced through admin-bff
  #
  # Δ C065 — `/v1/pdpa` is the ONE prefix on this service that is not `/v1/admin`, and it is a named
  # exception rather than a widening of AL-02. D3' heads the family "pdpa-svc (via admin-bff) — data
  # rights (`/v1/pdpa`)" and marks all three routes Bearer; C008's gateway-routes.json already sends
  # the prefix to this cluster; iam-svc's `DELETE /v1/users/me` answers 202 with
  # `Location: /v1/pdpa/{requestId}`, a URL a passenger's app follows. AL-02 forbids a driver- or
  # passenger-facing CONSOLE; three routes by which a person exercises a statutory right over their
  # own record are not one. `AdminBffApplication.GuardTheSurface` names the prefix, so a fourth
  # family still fails to start.
  #
  # The three subject routes are authenticated and NOT feature-gated: URD §2.3's End-user account
  # management row gives PAX and DRV ➖ — correctly, since it is about operating on OTHER people's
  # accounts — and gating an own-account right on it would refuse every data subject their own data.
  # They are scoped in the handler by the `sub` claim, and a request that is not yours is a 404 (not
  # a 403), because telling the two apart would make the route an oracle over other people's live
  # erasure requests.
  # -------------------------------------------------------------------------------------------
  /v1/pdpa/export:
    post:
      operationId: requestDataExport
      summary: Request a copy of your data.
      description: |
        E-06, US-1.8. Accepted asynchronously; `dueBy` is the 30-day statutory deadline, which is
        `pdpa.requests.due_by`'s own column default (migration 1306) rather than something computed
        per request. The fulfilled export is a signed download on `GET /v1/pdpa/{requestId}`.

        A second request while one is open is a **409**: two 30-day clocks against one obligation
        leave whichever is not fulfilled permanently overdue in the SLA queue. iam-svc's
        `DELETE /v1/users/me` makes the same call for the same reason.

        **Δ C065: audited.** The request writes a `PDPA_REQUESTED` row into `audit.events` with the
        data subject as the actor — the one action on this surface an end user's own request
        records. A statutory clock that starts when somebody presses a button in the Passenger App
        needs the press in the same immutable log the fulfilment lands in, or the platform can prove
        it acted and cannot prove when it was asked.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, dueBy]
                properties:
                  requestId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  dueBy:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, conflict]

  /v1/pdpa/erasure:
    post:
      operationId: requestDataErasure
      summary: Request erasure of your data.
      description: |
        E-06. Erasure is a **soft anonymisation**: the account row survives so that every ride,
        payment, ledger posting and audit event referencing it keeps resolving, and what is removed
        is the identity on it.

        `holdReasons` is a **preview and not a promise** — what would be held if the request were
        fulfilled now. **Δ C065: two kinds of hold, and conflating them is the mistake the field
        exists to prevent.**

        | Code | Blocking | What it means |
        |---|:-:|---|
        | `active-ride` | yes | A ride or tracking session that has not reached a terminal state |
        | `open-dispute` | yes | A `support.tickets` row nobody has answered |
        | `unsettled-payment` | yes | A payment attempt or refund in flight (E-05) |
        | `wallet-balance` | yes | Money still in the wallet — the driver has to be paid before they can vanish |
        | `financial-records` | no | Ledger postings. Retained: financial records outlive the account (D-09) |
        | `audit-trail` | no | `audit.events`. Retained and never rewritten (D-35) |

        A **blocking** hold is a live operation that anonymising the account would break and answers
        `409` at fulfilment — it lifts on its own. A **retention** hold is a record a statute
        requires be kept, and is what turns `Fulfilled` into `FulfilledHold` (which **must** carry a
        reason — `ck_pdpa_requests_hold`, C005). Treating them alike would either refuse every
        erasure for ever — every account has a ledger — or anonymise somebody who is in a car right
        now.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId, dueBy, holdReasons]
                properties:
                  requestId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  dueBy:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
                  holdReasons:
                    type: array
                    items:
                      $ref: '#/components/schemas/PdpaHoldCode'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, conflict]

  /v1/pdpa/{requestId}:
    get:
      operationId: getPdpaRequest
      summary: Status of a PDPA request.
      description: |
        Includes the signed download URL once an export is fulfilled. The URL is minted fresh on
        every read and expires (`AdminBff:Pdpa:ArtifactUrlTtl`, 15 min) — an export archive is a
        copy of everything the platform holds about one person, so a subject who is too slow simply
        asks again.

        **A request that is not the caller's own is a 404**, never a 403.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
      responses:
        '200':
          description: Request status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-found]

  /v1/admin/pdpa/queue:
    get:
      operationId: listPdpaQueue
      summary: Open data-rights requests by statutory deadline, or the decided history.
      description: |
        **Δ C065.** D3' gives fulfilment two routes and no queue to work them from. Open requests
        come back **by deadline** (`ix_pdpa_requests_due`), because the 30-day SLA is the whole point
        of that list; a `?status=` filter returns the decided history newest first
        (`ix_pdpa_requests_decided`, migration 1314).

        An **open erasure carries its live hold list**, because that is what the operator has to
        decide about — pressing Fulfil on a request whose subject is mid-ride is refused, and being
        shown that before pressing is the difference between a queue and a lottery.

        Gated on **End-user account management · Read, held platform-wide**. The row's two ◐ cells
        name who is bounded — `◐ verification` for the Verification Officer, `◐ on tickets` for the
        Support CSR — and neither qualifier is "read every data-rights request on the platform".
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Absent means the two open statuses.
          schema:
            type: string
            enum: [Received, InProgress, FulfilledHold, Fulfilled, Rejected]
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PdpaRequest'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/admin/pdpa/{requestId}/fulfill:
    post:
      operationId: fulfillPdpaRequest
      summary: Mark a PDPA request fulfilled.
      description: |
        Admin fulfilment. `FulfilledHold` records that some data was retained under a statutory hold
        and **requires `holdReason`**. Audited (D-35), and gated on **End-user account management ·
        Write, held platform-wide**.

        **Δ C065 — what this route actually does.**

        For an **export**, it assembles the archive (fourteen datasets as JSON plus a manifest and a
        README), stores it under `ephemeral/` in the D-36 bucket so the bucket's own lifecycle rule
        deletes it — an export must not become a permanent second copy of somebody's life — and
        records a `pdpa.fulfillment_artifacts` row with the SHA-256 of what was delivered. Supplying
        `artifactUrl` records a pointer produced out of band instead; there is no hash then, because
        this process never saw the bytes.

        For an **erasure**, it recomputes the statutory hold list **under the request's row lock**
        and then: any *blocking* hold answers `409` naming it (a live operation is not something a
        statute forces — it lifts on its own, and recording the obligation as met while a passenger
        is in a car would be a false compliance claim); otherwise the identifying columns are
        overwritten, `iam.emergency_contacts`, `iam.saved_addresses` and `iam.phone_lookups` are
        deleted, live sessions are revoked, and `iam.users.anonymised_at` (migration 0110) records
        that it happened. **`audit.events` is never touched** — a right-to-erasure that deleted the
        record of the erasure would leave the platform unable to prove it complied — and the
        financial ledger is retained under D-09. Both appear in `holdReason`.

        **`outcome` is optional and is derived when omitted**, and the derivation wins over
        `Fulfilled`: anything retained under a statute *is* a `FulfilledHold` whatever the button
        said. A request that has already been decided is a `409` rather than an idempotent no-op —
        fulfilling an already-rejected erasure would anonymise an account whose owner was told their
        request was refused.
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  description: Omit to let the retained-hold list decide. Δ C065.
                  type: string
                  enum: [Fulfilled, FulfilledHold]
                holdReason:
                  type: string
                  maxLength: 1000
                  description: |
                    Required when the outcome is `FulfilledHold`. Omitted, the derived list of
                    retained hold codes is stored — which is the falsifiable version.
                artifactUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Fulfilled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

  /v1/admin/pdpa/{requestId}/reject:
    post:
      operationId: rejectPdpaRequest
      summary: Reject a PDPA request with a reason.
      description: Used where a statutory hold blocks the request outright. Audited (D-35).
      tags: [pdpa]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PdpaRequestId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonBody'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PdpaRequest'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found, conflict]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

  parameters:
    SubjectId:
      name: subjectId
      in: path
      required: true
      description: A driver, vehicle or fleet-org id — the verification family is subject-agnostic (AL-39).
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    VerificationSearch:
      name: search
      in: query
      required: false
      description: |
        **Δ C063.** SCR-AP-003's search box, which D2 requires on all three tabs and which the AL-39
        shape did not give a parameter. Case-insensitive substring over the name (driver, org) or
        the registration number and driver name (vehicle), and over the subject id.
      schema:
        type: string
        maxLength: 100
    VerificationStatus:
      name: status
      in: query
      required: false
      description: |
        **Δ C063.** SCR-AP-003's status filter, over the **subject's own** registration status —
        queue membership is always "a field is still flagged" (AL-27).
      schema:
        type: string
        enum: [PENDING, APPROVED, REJECTED]
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    TrainId:
      name: trainId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    PdpaRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    # Δ C065. Shared by the JSON route and both exports, so the three cannot drift into answering
    # for different windows — which is the one way "the export matches the screen" stops being true.
    TransactionsFrom:
      name: from
      in: query
      required: false
      description: Inclusive Asia/Colombo business date. Defaults to 29 days before `to`; the window may not exceed 366 days.
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    TransactionsTo:
      name: to
      in: query
      required: false
      description: Inclusive. Defaults to today in Asia/Colombo (D-38).
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    TransactionsKind:
      name: kind
      in: query
      required: false
      description: One of the four kinds. Absent includes all four.
      schema:
        type: string
        enum: [topup, daily_fee, voucher_purchase, driver_transfer]
    TransactionsParty:
      name: partyId
      in: query
      required: false
      description: A driver, passenger or fleet id on either leg of the entry.
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    StatsPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [today, week, month, custom]
        default: today
    StatsFrom:
      name: from
      in: query
      required: false
      description: Required when `period=custom`.
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    StatsTo:
      name: to
      in: query
      required: false
      description: Required when `period=custom`.
      schema:
        $ref: './_shared.yaml#/components/schemas/BusinessDate'
    QName:
      name: name
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    QMobile:
      name: mobile
      in: query
      required: false
      schema:
        type: string
        maxLength: 20
    QId:
      name: id
      in: query
      required: false
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    ReasonBody:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000

    DashboardKpis:
      type: object
      required: [completedTrips, grossFareMinor, newRiders, newDrivers, dailyFeeRevenueMinor]
      properties:
        completedTrips:
          type: integer
          format: int64
          minimum: 0
        grossFareMinor:
          type: integer
          format: int64
          minimum: 0
        newRiders:
          type: integer
          format: int64
          minimum: 0
        newDrivers:
          type: integer
          format: int64
          minimum: 0
        dailyFeeRevenueMinor:
          type: integer
          format: int64
          minimum: 0

    DashboardDeltas:
      type: object
      description: Percentage change against the immediately preceding period of the same length.
      properties:
        completedTripsPct:
          type: number
          format: double
        grossFarePct:
          type: number
          format: double
        newRidersPct:
          type: number
          format: double
        newDriversPct:
          type: number
          format: double
        dailyFeeRevenuePct:
          type: number
          format: double

    DashboardLive:
      type: object
      description: Real-time cards; not served from the analytics rollup.
      required: [onlineDrivers, pendingVerifications, openTickets]
      properties:
        onlineDrivers:
          type: integer
          format: int32
          minimum: 0
        pendingVerifications:
          type: integer
          format: int32
          minimum: 0
        openTickets:
          type: integer
          format: int32
          minimum: 0

    DriverQueueRow:
      type: object
      required: [driverId, name, submittedAt, flaggedFields, status]
      properties:
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        submittedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        flaggedFields:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    VehicleQueueRow:
      type: object
      required: [vehicleId, regNo, flaggedFields, status]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        ownerDriverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        submittedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        flaggedFields:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]

    DriverPayoutQueueRow:
      type: object
      required: [driverId, name, bank, accountNo, submittedAt, hasProof, hasLankaQr, status]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        name: { type: string }
        bank: { type: string }
        accountNo: { type: string }
        submittedAt: { type: string, format: date-time }
        hasProof:
          type: boolean
          description: Whether a bank statement or passbook page is attached to open.
        hasLankaQr:
          type: boolean
          description: AL-59 — whether the driver's own bank-app QR is attached.
        status:
          type: string
          description: The driver's IDENTITY verdict, not this profile's. See the queue route.
          enum: [PENDING, APPROVED, REJECTED]

    DriverPayoutVerification:
      type: object
      required: [driverId, name, bank, branch, accountNo, accountHolderName, status, documents, approvable]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        name: { type: string }
        bank: { type: string }
        branch: { type: string }
        accountNo: { type: string }
        accountHolderName: { type: string }
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        rejectionReason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        approvable:
          type: boolean
          description: There is a version awaiting a decision — not a judgement about the evidence.

    DriverPayoutDecision:
      type: object
      required: [driverId, status]
      properties:
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        reason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }

    OrgQueueRow:
      type: object
      required: [orgId, name, kycStatus, vehicleCount, status]
      properties:
        orgId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        kycStatus:
          type: string
          description: |
            **Δ C063.** Whether there is US-13.A7 evidence to read at all — `complete` once the
            organisation carries a business registration and a contact number, `incomplete` until
            it does. The payout profile's own state is `payoutProfileStatus`: the two are separate
            decisions and one field could not carry both.
          enum: [complete, incomplete]
        vehicleCount:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        payoutProfileStatus:
          type: string
          description: '**Δ C063.** The AL-49 version awaiting this officer, when there is one.'
          enum: [pending_verification, verified, rejected]

    DocumentRef:
      type: object
      description: |
        **Δ C063: both links point at `GET /v1/admin/documents/{docId}`, not at the bucket.**
        AL-39 asks for two things at once — reads use short-lived signed object-storage URLs *and*
        every read emits `DOC_VIEW`. A pre-signed bucket URL handed out here would satisfy the first
        and silently break the second: the officer's browser would fetch somebody's licence straight
        from storage and nothing would record it. The audited route mints the signed URL per view
        and `302`s to it, so the signed URL is where it always was and every fetch passes the row
        that records it.
      required: [docId, kind]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
        thumbUrl:
          type: string
          description: '`/v1/admin/documents/{docId}?variant=thumb` — audited, and redirects to the signed URL.'
        fullUrl:
          type: string
          description: '`/v1/admin/documents/{docId}?variant=full`.'
        capturedVia:
          type: string
          description: '`drag_crop` for the AL-43 in-app scanner, `upload` otherwise.'
          enum: [drag_crop, upload]

    VerificationDetail:
      type: object
      required: [subject, fields, documents, steps]
      properties:
        subject:
          type: object
          required: [id, type]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            type:
              type: string
              enum: [driver, vehicle, org]
            displayName:
              type: string
        fields:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/ExtractedField'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        steps:
          type: array
          description: |
            **Δ C063.** SCR-AP-003a's decision rail: the per-step Verified/Pending breakdown D2
            requires beside the Approve button, which the AL-39 shape omitted.

            Two vocabularies, because there are two onboarding surfaces. A Mode C vehicle has
            AL-30's four saved `registry.onboarding_steps` and they are authoritative — registry-svc
            recomputes them and admin-bff must not derive a second opinion. A fleet vehicle has
            none at all, so its rail is AL-50's named slots (`registration`, `insurance`,
            `revenue_license`, `permit`) under their own names — which is what SCR-FP-004 showed the
            operator who uploaded them. A driver's licence is the single synthetic step `profile`;
            an organisation's is `kyc`.
          items:
            $ref: '#/components/schemas/VerificationStep'
        approvable:
          type: boolean
          description: False while any field is still `pending` (US-2.10a).

    VerificationStep:
      type: object
      description: One row of SCR-AP-003a's decision rail (Δ C063).
      required: [step, status]
      properties:
        step:
          type: string
          example: insurance
        status:
          type: string
          enum: [VERIFIED, PENDING_REVIEW, PENDING_INPUT]

    VerificationDecision:
      type: object
      required: [subjectId, status]
      properties:
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [APPROVED, REJECTED]
        reason:
          type: string
        merchantBound:
          deprecated: true
          type: boolean
          description: |
            **Δ AL-57 — always `false`.** D-11 is retired and the bind it named no longer exists.

    MaskablePhone:
      description: |
        **Δ C064.** An MSISDN a directory *detail* may render either way. The clear `PhoneE164` for
        a caller who holds URD §2.3's End-user account management row as **write, unscoped** (Admin,
        Super Admin); the `PhoneMasked` form for everybody else — a Support CSR is `◐ on tickets` and
        a Verification Officer is `◐ verification`, and neither qualifier describes browsing the
        directory. The mask is applied server-side and the clear value is not in the payload beside
        it.

        A **list** row is never this: it is always `PhoneMasked`, so every clear number this surface
        has emitted has a `PII_READ` row behind it.
      oneOf:
        - $ref: './_shared.yaml#/components/schemas/PhoneE164'
        - $ref: './_shared.yaml#/components/schemas/PhoneMasked'

    PassengerRow:
      type: object
      required: [passengerId, name, mobileMasked, trips, joinedAt, status]
      properties:
        passengerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        mobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        trips:
          type: integer
          format: int32
          minimum: 0
          description: Rides that reached a terminal successful state (R-05). Deliveries are counted too.
        joinedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        status:
          type: string
          description: |
            **Δ C064: `deleted` is never answered yet.** A PDPA erasure is C065's and no column
            records one; answering `active` for an account nobody erased is the honest value.
          enum: [active, blocked, deleted]

    PassengerDetail:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [passengerId, name, mobile, joinedAt, defaultPay, status]
          properties:
            passengerId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            name:
              type: string
            mobile:
              $ref: '#/components/schemas/MaskablePhone'
            email:
              type: string
              format: email
              description: |
                **Δ C064.** Masked as `a***@domain` for a caller without the grant — still a valid
                address, because a mask that broke `format: email` would make a schema-validating
                client reject the whole response.
            joinedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            rating:
              type: number
              format: double
              minimum: 0
              maximum: 5
              description: What drivers rated them (`driver_to_passenger`, US-18.2). Absent until somebody has.
            defaultPay:
              type: string
              enum: [cash, lankaqr, onepay]
            status:
              type: string
              enum: [active, blocked, deleted]
            sosContacts:
              type: array
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                  phone:
                    $ref: '#/components/schemas/MaskablePhone'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        payments:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPayment'
        packages:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPackage'
        disputes:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryDispute'

    DirectoryTrip:
      type: object
      description: |
        **Δ C064.** One journey, from either surface: `kind: ride` is a Mode C booking
        (`rides.rides`, R-01) and `kind: session` is a Mode A/B journey (`trips.sessions`, D-03).
        Both appear because a directory is not mode-aware — the ride-svc / trip-state-svc boundary is
        about who writes the row, not about what an operator may read back. A session carries no fare.
      required: [tripId, kind, state, startedAt]
      properties:
        tripId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [ride, session]
        state:
          type: string
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        counterpartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyName:
          type: string
          description: The driver on a passenger's tab, the passenger on a driver's.
        fareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        startedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        endedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryPayment:
      type: object
      description: '**Δ C064.** One attempt of D-10''s payment state machine; retries are their own rows.'
      required: [paymentId, rideId, method, state, amountMinor, currency, attemptNo, createdAt]
      properties:
        paymentId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        method:
          type: string
          enum: [cash, lankaqr, onepay, cod, scan_driver_qr, wallet]
        state:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        surchargeMinor:
          type: integer
          format: int64
          minimum: 0
        tipMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        attemptNo:
          type: integer
          format: int32
          minimum: 1
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryPackage:
      type: object
      description: '**Δ C064.** A `kind = 2` ride (P-06). The recipient''s number is masked by the same rule as the passenger''s own.'
      required: [rideId, state, createdAt]
      properties:
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        state:
          type: string
        packageSize:
          type: string
          enum: [S, M, L]
        description:
          type: string
        recipientName:
          type: string
        recipientMobile:
          $ref: '#/components/schemas/MaskablePhone'
        fareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        completedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryDispute:
      type: object
      description: |
        **Δ C064.** One `support.tickets` row. The whole ticket list rather than a "disputes"
        subset — the `category` column is free text and US-9.23's daily-fee refund request rides in
        it, so a server-side filter on a vocabulary nobody has fixed would silently hide tickets.
      required: [ticketId, category, status, createdAt, updatedAt]
      properties:
        ticketId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        category:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED]
        description:
          type: string
        response:
          type: string
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DriverRow:
      type: object
      required: [driverId, name, mobileMasked, vehicles, level, trips, status]
      properties:
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        mobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        vehicles:
          type: array
          items:
            type: string
            description: Registration numbers.
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          description: '**Δ C064.** `dispatch.driver_levels.level`, defaulting to 3 — the column''s own default — for a driver nobody has scored.'
        trips:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          description: |
            **Δ C064: derived, not stored.** Verified when `registry.driver_profiles.verified_at` is
            set, suspended when `iam.users.is_blocked` is, pending otherwise. Suspended wins over
            verified — it is the later fact and the one the row was opened to find.
          enum: [verified, pending, suspended]

    DriverDetail:
      type: object
      required: [profile]
      properties:
        profile:
          type: object
          required: [driverId, name, mobile, joinedAt, walletMinor, currency, level, points, status]
          properties:
            driverId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            name:
              type: string
            mobile:
              $ref: '#/components/schemas/MaskablePhone'
            nic:
              type: string
              description: |
                **Δ C064.** Masked to its last two characters for a caller without the grant. Harder
                than a phone number, deliberately: an NIC's leading digits are the holder's year of
                birth and day of year, so a prefix is not a hint — it is a date of birth.
            joinedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            rating:
              type: number
              format: double
              minimum: 0
              maximum: 5
            walletMinor:
              type: integer
              format: int64
              minimum: 0
            currency:
              $ref: './_shared.yaml#/components/schemas/Currency'
            level:
              type: integer
              format: int32
              minimum: 1
              maximum: 3
            points:
              type: integer
              format: int32
            status:
              type: string
              enum: [verified, pending, suspended]
            verifiedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/LinkedVehicle'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        walletLedger:
          type: array
          items:
            $ref: '#/components/schemas/WalletLedgerEntry'
        dailyFee:
          type: array
          items:
            $ref: '#/components/schemas/DailyFeeCharge'
        creditTransfers:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryCreditTransfer'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryVehicleReport'

    LinkedVehicle:
      type: object
      description: |
        **Δ C064.** A vehicle chip on SCR-AP-013 — owned *or* assigned. A Mode C driver owns their
        vehicle; a fleet's driver owns nothing and drives what `registry.fleet_assignments` gives
        them (AL-03), and both are "linked vehicles" (US-24.10).
      required: [vehicleId, regNo, type, mode, status, dispatchState, owned, link]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        type:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          $ref: './_shared.yaml#/components/schemas/OperatingMode'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
        dispatchState:
          type: string
          enum: [ACTIVE, DISPATCH_SUSPENDED]
        owned:
          type: boolean
        link:
          type: string
          description: '`/v1/admin/vehicles/{vehicleId}` — the detail this chip jumps to.'

    WalletLedgerEntry:
      type: object
      description: '**Δ C064.** One `billing.wallet_transactions` row (D-09 §10). Signed: a debit is negative.'
      required: [entryNo, kind, amountMinor, balanceAfterMinor, ts]
      properties:
        entryNo:
          type: integer
          format: int64
        kind:
          type: string
        amountMinor:
          type: integer
          format: int64
        balanceAfterMinor:
          type: integer
          format: int64
        description:
          type: string
        ts:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DailyFeeCharge:
      type: object
      description: '**Δ C064.** One D-13 charge. `feeDate` is the Asia/Colombo business date (D-38).'
      required: [feeDate, driverId, vehicleId, amountMinor, currency, tripsThatDay, status, chargedAt]
      properties:
        feeDate:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        tripsThatDay:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [PAID, WAIVED_FIRST_TRIP]
        chargedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryCreditTransfer:
      type: object
      description: |
        **Δ C064.** One `billing.credit_transfers` row (US-9.13/9.21). Exact value, no commission
        (AL-01). `direction` is computed against the driver whose detail this is; `initiation` is the
        stored column — who started it — and they answer different questions.
      required: [transferId, direction, initiation, counterpartyId, amountMinor, currency, status, createdAt]
      properties:
        transferId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        direction:
          type: string
          enum: [in, out]
        initiation:
          type: string
          enum: [REQUESTED, DIRECT]
        counterpartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyName:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DirectoryVehicleReport:
      type: object
      description: '**Δ C064.** One `safety.vehicle_reports` row. The third CONFIRMED one delists the vehicle (US-12.6).'
      required: [reportId, vehicleId, reason, status, createdAt]
      properties:
        reportId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, DISMISSED]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    VehicleRow:
      type: object
      required: [vehicleId, type, mode, regNo, trips, status]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        type:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          $ref: './_shared.yaml#/components/schemas/OperatingMode'
        owner:
          type: string
        fleetOrg:
          type: string
          description: Present for Mode A/B vehicles owned by a fleet.
        regNo:
          type: string
        trips:
          type: integer
          format: int32
          minimum: 0
          description: '**Δ C064.** Completed Mode C rides **plus** completed Mode A/B sessions — a bus has no rides.'
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]

    AdminVehicleDetail:
      type: object
      required: [info]
      properties:
        info:
          type: object
          required: [vehicleId, type, regNo, mode, ownerId, status, dispatchState, onboardingStatus, registeredAt]
          properties:
            vehicleId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            type:
              $ref: './_shared.yaml#/components/schemas/VehicleType'
            regNo:
              type: string
            mode:
              $ref: './_shared.yaml#/components/schemas/OperatingMode'
            ownerId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            owner:
              type: string
            fleetId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            fleetOrg:
              type: string
            status:
              type: string
              enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
            dispatchState:
              type: string
              description: '`DISPATCH_SUSPENDED` is E-03''s "do not offer rides to it" and is not the end of a registration.'
              enum: [ACTIVE, DISPATCH_SUSPENDED]
            onboardingStatus:
              type: string
              enum: [incomplete, approved]
            insuranceExpiry:
              type: string
              format: date
              description: '**Δ C064.** The newest certificate''s expiry, as an Asia/Colombo calendar date (D-38).'
            revenueLicenceExpiry:
              type: string
              format: date
            registeredAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            tracker:
              type: object
              description: '**Δ C064.** The bound tracker (T-08), absent where the vehicle has none.'
              required: [imei, online, state]
              properties:
                imei:
                  type: string
                online:
                  type: boolean
                  description: |
                    Pinged inside US-3.13's 30-minute silence window — the same threshold
                    fleet-health (C044) uses, so the two screens cannot disagree about one device.
                state:
                  type: string
                  enum: [ACTIVE, QUARANTINED, REVOKED]
                lastSeen:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/DocumentRef'
        trips:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryTrip'
        earnings:
          type: array
          items:
            $ref: '#/components/schemas/VehicleEarningsDay'
        dailyFee:
          type: array
          items:
            $ref: '#/components/schemas/DailyFeeCharge'
        reports:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryVehicleReport'

    VehicleEarningsDay:
      type: object
      description: |
        **Δ C064.** One Asia/Colombo business day (D-38) of settled fare on this vehicle's rides.
        Derived from `fares.ride_payments` rather than read from `fares.driver_earnings`: that rollup
        is keyed `(driver_id, earn_date)` and a vehicle two drivers shared on one day appears in it
        twice under neither of them.
      required: [earnDate, trips, grossMinor, currency]
      properties:
        earnDate:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        trips:
          type: integer
          format: int32
          minimum: 0
        grossMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    ModerationResult:
      type: object
      required: [subjectId, status]
      properties:
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [SUSPENDED, ACTIVE]
        reason:
          type: string

    ReportRow:
      type: object
      required: [reportId, vehicleId, reason, status, createdAt]
      properties:
        reportId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        reporterId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        reason:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, DISMISSED]
        confirmedCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    TicketRow:
      type: object
      required: [ticketId, userId, category, status, createdAt]
      properties:
        ticketId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        category:
          type: string
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED]
        description:
          type: string
        response:
          type: string
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        resolvedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Tariff:
      type: object
      required: [vehicleType, firstKmMinor, perKmMinor, currency]
      properties:
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        firstKmMinor:
          type: integer
          format: int64
          minimum: 0
        perKmMinor:
          type: integer
          format: int64
          minimum: 0
        peakSurchargePct:
          type: integer
          format: int32
          minimum: 0
          default: 20
        nightSurchargePct:
          type: integer
          format: int32
          minimum: 0
          default: 15
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    PeakWindow:
      type: object
      description: |
        Local Asia/Colombo wall-clock. `endLocal` may be **earlier** than `startLocal` — the night
        window wraps midnight, and no constraint enforces ordering for exactly that reason (C005).
      required: [kind, startLocal, endLocal, multiplierPct]
      properties:
        kind:
          type: string
          enum: [peak, night]
        startLocal:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '22:00'
        endLocal:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '05:00'
        multiplierPct:
          type: integer
          format: int32
          minimum: 0

    OperatingCityInput:
      type: object
      required: [code, nameEn, nameSi, nameTa, centroid]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,40}$'
        nameEn:
          type: string
        nameSi:
          type: string
        nameTa:
          type: string
        centroid:
          $ref: './_shared.yaml#/components/schemas/GeoPoint'
        sortOrder:
          type: integer
          format: int32
          default: 0

    OperatingCity:
      allOf:
        - $ref: '#/components/schemas/OperatingCityInput'
        - type: object
          required: [active]
          properties:
            active:
              type: boolean

    TrainInput:
      type: object
      required: [name, trainNumber]
      properties:
        name:
          type: string
          maxLength: 200
        trainNumber:
          type: string
          maxLength: 32
        routeId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        active:
          type: boolean
          default: true

    Train:
      allOf:
        - $ref: '#/components/schemas/TrainInput'
        - type: object
          required: [trainId]
          properties:
            trainId:
              $ref: './_shared.yaml#/components/schemas/Ulid'

    AuditEvent:
      type: object
      description: |
        One row of the immutable log. **Δ C062:** `before` and `after` join `detail`, because the
        D-35 deliverable is "actor, action, target, **before/after**, ip" and the schema had
        nowhere to put the pair. They are different facts and are kept apart: `before`/`after` are
        what the handler knows about the **entity**, `detail` is what the interceptor knows about
        the **request** (method, path, the caller's whole role union, the idempotency key). One
        field holding both would make "what changed" unreadable.
      required: [eventId, actorId, action, occurredAt]
      properties:
        eventId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        actorId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        actorRole:
          $ref: './_shared.yaml#/components/schemas/Role'
        action:
          type: string
          example: PII_READ
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        subjectType:
          type: string
        before:
          type: [object, 'null']
          additionalProperties: true
          description: State before, or `null` where nothing existed — a creation, or a read event.
        after:
          type: [object, 'null']
          additionalProperties: true
          description: State after, or the observation itself.
        detail:
          type: object
          additionalProperties: true
        ip:
          type: string
        occurredAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    FeatureFlag:
      type: object
      description: One row of `config.feature_flags` (Δ C062, migration 0202, US-14.12).
      required: [key, enabled, updatedAt]
      properties:
        key:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,80}$'
        enabled:
          type: boolean
        description:
          type: string
          description: What flipping it does, in the operator's words. Shown beside the toggle.
        updatedBy:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    AdminSession:
      type: object
      description: |
        Δ C062. The post-sign-in bootstrap (URD §2.2). `permissions` is the caller's row of
        URD §2.3 as the server evaluated it; `menu` is the same evaluation projected onto the nav,
        so the console cannot offer a screen the API would refuse.
      required: [userId, roles, permissions, menu, mfaRequired]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        roles:
          type: array
          description: Every canonical role held. Effective permissions are their union (AL-06).
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/AdminPermission'
        menu:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuGroup'
        mfaRequired:
          type: boolean
          const: false
          description: |
            **Always false (AL-37).** There is no second factor for internal roles; the
            compensating controls are the failed-attempt lock-out and the optional IP allow-list,
            both iam-svc's. Present precisely because D3' §0 and D7' §4.2 still say otherwise.

    AdminPermission:
      type: object
      description: One URD §2.3 row as this caller holds it.
      required: [featureArea, label, symbol, grants, ownScope]
      properties:
        featureArea:
          type: string
          description: Stable kebab key of the row, e.g. `platform-settings`.
          example: moderation
        label:
          type: string
          description: The row's URD §2.3 wording.
        symbol:
          type: string
          description: The cell rendered in the spec's own legend — `✅`, `◐ own org`, `⚙ rates`.
          example: ✅
        grants:
          type: array
          items:
            type: string
            enum: [read, write, configure, raise]
        qualifier:
          type: string
          description: The scope note the cell carries, when anything is scope-limited.
          example: temp on reports
        ownScope:
          type: boolean
          description: |
            True when at least one capability here is available **only** within the caller's own
            records or organisation. A fence, not an answer — the owning service must bound it.

    AdminMenuGroup:
      type: object
      required: [key, labelKey, items]
      properties:
        key:
          type: string
        labelKey:
          type: string
          description: |
            A resource key, never a label. D-26 makes every user-facing string trilingual and the
            Admin Portal owns the Si/Ta/En bundles.
          example: nav.group.configuration
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminMenuItem'

    AdminMenuItem:
      type: object
      required: [key, labelKey, path, ownedBy]
      properties:
        key:
          type: string
        labelKey:
          type: string
        path:
          type: string
          description: The Admin Portal route. The gateway decides which process answers its API.
        ownedBy:
          type: string
          description: |
            Which service answers this item's API. Several Configuration entries are **not**
            admin-bff's — the GTFS manager is transit-svc's (AL-54), the daily-fee rates and
            voucher tiers subscription-svc's, the Driver-Level parameters dispatch-svc's, RBAC
            provisioning iam-svc's — because each is owned by the service that owns the table it
            writes. The console is one console; the writers are not one writer.
          example: transit-svc

    PdpaRequest:
      type: object
      required: [requestId, kind, status, subjectId, requestedAt, dueBy, holds]
      properties:
        requestId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [export, erasure]
        status:
          type: string
          description: Matches the `pdpa.requests.status` CHECK (C005).
          enum: [Received, InProgress, FulfilledHold, Fulfilled, Rejected]
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        requestedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        dueBy:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        fulfilledAt:
          description: When the request stopped being open — a fulfilment or a refusal. Δ C065.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/Timestamp'
        holdReason:
          type: string
          description: Always present when `status` is `FulfilledHold`. What a statute forced to be retained.
        rejectionReason:
          type: string
          description: |
            **Δ C065.** Why a request was refused, shown to the data subject (E-06). Its own column
            (`pdpa.requests.decision_reason`, migration 1314) and **not** `holdReason`, which names
            what an erasure that otherwise succeeded had to keep — one field could not carry both,
            and the SLA queue could not then tell a partial fulfilment from a denial.
        holds:
          description: |
            **Δ C065.** The live statutory hold list, present on an **open erasure** — the queue's
            reason for existing. Empty on an export, on a decided request, and on a subject's own
            read of a request that is not an open erasure.
          type: array
          items:
            $ref: '#/components/schemas/PdpaHold'
        downloadUrl:
          type: string
          format: uri
          description: Short-lived signed URL of the export archive. Minted fresh on every read.
        downloadExpiresAt:
          description: When `downloadUrl` stops working. Δ C065.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/Timestamp'

    PdpaHoldCode:
      type: string
      description: |
        **Δ C065.** A stable machine code, never a sentence: every string this platform shows a user
        is trilingual (D-26) and the apps own the Si/Ta/En bundles. The code is what a client looks
        a message up by, and what `pdpa.requests.hold_reason` stores.
      enum:
        [active-ride, open-dispute, unsettled-payment, wallet-balance, financial-records, audit-trail]

    PdpaHold:
      type: object
      required: [code, blocking, count]
      properties:
        code:
          $ref: '#/components/schemas/PdpaHoldCode'
        blocking:
          description: |
            True when the hold stops the erasure happening at all — a live operation that lifts on
            its own. False when it merely bounds it: the erasure proceeds and a statutorily-retained
            subset survives, which is what `FulfilledHold` means.
          type: boolean
        count:
          description: How many records the hold is about, so an operator can see whether it is one or a thousand.
          type: integer
          format: int32
          minimum: 1

    # -----------------------------------------------------------------------------------------
    # Finance (Δ C065)
    # -----------------------------------------------------------------------------------------

    SettlementSummary:
      type: object
      required: [from, to, settledMinor, postedMinor, varianceMinor, exceptionCount, days]
      properties:
        from:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        to:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        settledMinor:
          description: What the gateway confirmed across the window.
          type: integer
          format: int64
        postedMinor:
          description: What reached the ledger. Read off the credit leg, never off the session twice.
          type: integer
          format: int64
        varianceMinor:
          description: '`settledMinor − postedMinor`. Zero is what "reconciled" means.'
          type: integer
          format: int64
        exceptionCount:
          description: How many sessions are in the exception queue right now — SCR-AP-006's tab badge.
          type: integer
          format: int32
          minimum: 0
        days:
          type: array
          items:
            $ref: '#/components/schemas/SettlementDay'

    SettlementDay:
      type: object
      required:
        [businessDate, method, openedCount, settledCount, failedCount, pendingCount,
         settledMinor, postedMinor, varianceMinor, currency]
      properties:
        businessDate:
          description: Asia/Colombo (D-38), computed in the database from the session's own instant.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/BusinessDate'
        method:
          type: string
          enum: [onepay, lankaqr]
        openedCount:
          type: integer
          format: int32
        settledCount:
          type: integer
          format: int32
        failedCount:
          type: integer
          format: int32
        pendingCount:
          type: integer
          format: int32
        settledMinor:
          type: integer
          format: int64
        postedMinor:
          type: integer
          format: int64
        varianceMinor:
          type: integer
          format: int64
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    SettlementException:
      type: object
      required: [topupId, kind, method, state, driverId, amountMinor, currency, createdAt]
      properties:
        topupId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [amount-mismatch, settled-not-posted, unsettled, gateway-failed]
        method:
          type: string
          enum: [onepay, lankaqr]
        state:
          description: The `billing.topups.state` the session is actually in.
          type: string
          enum: [Pending, Succeeded, Failed]
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        driverName:
          type: string
        amountMinor:
          description: What the session was opened for.
          type: integer
          format: int64
        postedMinor:
          description: What the ledger holds, where anything was posted. Absent is itself the exception on a settled session.
          type: integer
          format: int64
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        providerTransactionId:
          type: string
        providerOrderId:
          type: string
        failureReason:
          type: string
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        settledAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    RefundQueueRow:
      type: object
      required:
        [source, paymentId, rideId, paymentState, method, amountMinor, paymentAmountMinor,
         currency, requestedAt]
      properties:
        refundId:
          description: Absent on an `overpaid` row — that is the point of it.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/Ulid'
        source:
          type: string
          enum: [refund, overpaid]
        paymentId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        rideId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        paymentState:
          description: The `fares.ride_payments.state` the attempt is in.
          type: string
        method:
          type: string
        kind:
          type: string
          enum: [full, partial, overpaid_reversal]
        status:
          type: string
          enum: [Requested, Submitted, Succeeded, Failed]
        amountMinor:
          description: The refund's amount where one was raised; the payment's otherwise.
          type: integer
          format: int64
        paymentAmountMinor:
          description: What the payment attempt collected — the ceiling a refund cannot exceed.
          type: integer
          format: int64
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        reasonCode:
          type: string
        providerRefundId:
          type: string
        passengerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        passengerName:
          type: string
        requestedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        settledAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Refund:
      type: object
      required: [refundId, status, amountMinor, currency]
      properties:
        refundId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [Requested, Submitted, Succeeded, Failed]
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    TransactionsReport:
      type: object
      required: [from, to, totalMinor, items]
      properties:
        from:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        to:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        kind:
          description: The single kind that was filtered on, absent when all four are included.
          type: string
          enum: [topup, daily_fee, voucher_purchase, driver_transfer]
        totalMinor:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRow'

    TransactionRow:
      type: object
      required: [entryId, kind, amountMinor, currency, fromAccountType, toAccountType, ts]
      description: |
        One money **event**, not one account leg. `fromParty` owns the negative leg and `toParty` the
        positive one: a top-up is platform → driver, a daily fee is driver → platform, a voucher
        purchase is platform → buyer, a transfer is sender → recipient.
      properties:
        entryId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [topup, daily_fee, voucher_purchase, driver_transfer]
        amountMinor:
          description: Unsigned — the magnitude that moved. The two party fields say which way.
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        fromPartyId:
          description: Absent for the platform's two singleton accounts, which have no owner by CHECK.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/Ulid'
        fromName:
          type: string
        fromAccountType:
          type: string
          enum: [passenger, driver, fleet, platform, suspense]
        toPartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        toName:
          type: string
        toAccountType:
          type: string
          enum: [passenger, driver, fleet, platform, suspense]
        description:
          type: string
        ts:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DocumentExpiryRow:
      type: object
      required: [docId, kind, status, expiresAt, daysRemaining, thumbUrl, fullUrl]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [driving_license, registration, permit, insurance, revenue_license]
        status:
          type: string
          enum: [VALID, EXPIRING, EXPIRED]
        expiresAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        daysRemaining:
          description: Negative once expired, which is what sorts the queue.
          type: integer
          format: int32
        lastNoticeDays:
          description: |
            The tightest E-03 reminder already emitted (30 / 7 / 1 / 0), absent where none has been.
            The difference between chasing the holder and apologising to them.
          type: integer
          format: int32
          enum: [30, 7, 1, 0]
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        driverName:
          type: string
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        fleetName:
          type: string
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        regNo:
          type: string
        dispatchState:
          description: E-03 suspends dispatch on expiry, so this is what the queue is trying to prevent.
          type: string
        thumbUrl:
          description: C063's audited viewer, never a bucket URL — one look is one `DOC_VIEW` row (AL-39).
          type: string
        fullUrl:
          type: string

    FraudFlagRow:
      type: object
      required: [flagId, kind, status, ts, resolveUrl]
      properties:
        flagId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          description: Open by design — E-07's heuristics are expected to grow (migration 0802).
          type: string
        status:
          type: string
          enum: [open, dismissed, actioned]
        subjectId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        subjectType:
          type: string
          enum: [driver, passenger, vehicle]
        subjectName:
          description: What reputation-svc cannot supply — it holds no identity. The reason this queue is joined here.
          type: string
        relatedId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        relatedName:
          type: string
        windowKey:
          description: The detection window. With `ux_fraud_flags_window` it is what bounds the queue.
          type: string
        detail:
          description: Re-emitted as the detector stored it, so a new heuristic's fields survive.
          type: object
          additionalProperties: true
        resolvedBy:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        resolvedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        ts:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        resolveUrl:
          description: |
            reputation-svc's own decision route. Named here rather than left to the portal because
            the decision belongs to the service that owns the flag, and a queue pointing anywhere
            else would be inviting a second writer.
          type: string
