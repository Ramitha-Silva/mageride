openapi: 3.1.0

# =============================================================================================
# registry-svc — driver profile, vehicles, Mode-C onboarding, Mode B sharing, device binding
# Source: specs/D3_mageride_api_contracts.md "registry-svc — vehicles, sharing, device binding,
#         merchant (/v1/vehicles)" + ADD Appendix C registry-svc
#
# Scope fence: the Driver App onboards **Mode C only**. Mode A/B vehicles, route permits and
# fleet documents are onboarded in the Fleet Portal (fleet.yaml, SCR-FP-004); a Mode A/B body
# here is `403 mode-not-allowed`.
# =============================================================================================

info:
  title: MageRide registry-svc
  version: 1.0.0
  summary: Driver identity, vehicle registration and the Mode-C onboarding state machine.
  description: |
    Two separate flows, split by Change 6/22:

    1. **Profile Setup** (`PUT /v1/drivers/profile`, SCR-DA/DI-003a) — driver identity: name,
       photo, driving licence. Precedes Home and needs no vehicle.
    2. **Mode-C vehicle onboarding** (`POST /v1/vehicles` then `PUT /v1/vehicles/{id}/onboarding/{step}`,
       SCR-DA/DI-004 → 004c) — a **persisted four-step state machine** (AL-30). Each step is
       saved individually and re-opening the wizard resumes at the first non-verified step, not
       at step 1.

    A step is `PENDING_REVIEW` when any of its fields is doubtful (low OCR confidence),
    driver-entered, or — on the photos step — the plate OCR does not match the entered
    registration number (AL-29/AL-30). When all four steps are `VERIFIED` the service
    **auto-approves**: `status=APPROVED`, `onboardingStatus=approved`, with no Verification
    Officer step (user decision 6/22). Anything `PENDING_REVIEW` puts the vehicle in the officer
    queue and it stays Incomplete (US-2.10/2.10a).

    Registration numbers are unique **within the active set** (D-37) — a rejected registration
    frees its plate.
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: drivers
    description: Driver identity and profile setup.
  - name: vehicles
    description: Vehicle registration, onboarding steps, lifecycle.
  - name: sharing
    description: Mode B share grants and subscriber management (D-22/D-23).

paths:

  # -------------------------------------------------------------------------------------------
  # Driver identity
  # -------------------------------------------------------------------------------------------
  /v1/drivers/profile:
    get:
      operationId: getDriverProfile
      summary: This driver's identity profile, or `null` when Profile Setup has not been done.
      description: |
        **Δ MCS-05.** SCR-DA/DI-001's boot router asks one question — *has this person completed
        driver Profile Setup?* — and until this operation existed there was nothing to ask. Both
        apps asked iam-svc instead, reading `iam.users.first_name` off `GET /v1/users/me`.

        That is the **passenger** app's question and it is the wrong one on this surface. Profile
        Setup writes `registry.driver_profiles` and never touches `iam.users` — registry-svc holds
        no reference to that table and emits no event iam-svc consumes — so the two failure modes
        were mirror images and both were wrong:

        * a driver who *had* completed Profile Setup still read as incomplete, and was sent back to
          the form on every cold start;
        * a **passenger** who already had a name from the other app read as complete, skipped
          driver onboarding altogether and reached Home without ever submitting a driving licence.

        **`null` is a `200`, not a `404`.** The same shape `getActiveDriverRide` uses and for the
        same reason its handler gives: this is a cold-start read, and a `404` is something an app
        puts in front of a driver as an error.

        The profile **row** only. The AL-29 extracted fields belong to the licence documents and
        come back from `PUT /v1/drivers/profile`, which is the screen that has something to do
        with them.
      tags: [drivers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The driver's profile, or `null` when they have none.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DriverProfileSummary'
                  - type: 'null'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

    put:
      operationId: upsertDriverProfile
      summary: Profile Setup — driver name, photo and driving licence.
      description: |
        SCR-DA/DI-003a. Writes `registry.driver_profiles` and a vehicle-less
        `registry.documents(kind='driving_license')`, then queues Gemini Flash 3.0 extraction of
        **licenceNo, expiry, nicNo and allowedVehicleTypes** (AL-29).

        Any value the driver supplies because the scan was unclear (`nicNo`,
        `allowedVehicleTypes`) is stored `source='manual'`, `verifyStatus='pending'` and routes
        to the Verification Officer queue (US-2.4a). **The profile photo is required.**
      tags: [drivers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverName, profilePhotoFileId, licenseFrontFileId, licenseBackFileId]
              properties:
                driverName:
                  type: string
                  maxLength: 200
                profilePhotoFileId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                licenseFrontFileId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                licenseBackFileId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                # Δ MCS-02 — the two the C068 handoff recorded as unsendable. SCR-DA/DI-003a
                # draws a ✎ on the licence number and its expiry, and AL-29's manual path exists
                # for exactly the unreadable scan; only `nicNo` and `allowedVehicleTypes` could
                # be corrected, so the other two rows were read-only for no reason but omission.
                licenceNo:
                  type: string
                licenceExpiry:
                  type: string
                  format: date
                nicNo:
                  type: string
                  maxLength: 20
                  description: Driver-supplied only when the scan was unclear; stored `manual`/`pending`.
                allowedVehicleTypes:
                  type: array
                  items:
                    $ref: './_shared.yaml#/components/schemas/VehicleType'
          # Δ MCS-01. The images themselves, in the same request as the fields — the arm
          # `saveVehicleOnboardingStep` has always declared, for the one screen that could not
          # use it. Before this, `docs.uploads` had no writer for an onboarding document at all
          # (the only one in registry-svc was the AL-58 payout store), so the JSON arm above
          # required three ids nothing on the platform could mint and SCR-DA/DI-003a could not
          # be completed against a real gateway.
          #
          # `capturedVia` is per part and required (AL-43): the driver scans the licence with
          # SCR-DA/DI-005 and picks the avatar out of the gallery in one submission, and a
          # gallery pick is the fraud signal the Verification-Officer queue sorts on. One value
          # for the whole form would be wrong about one of them.
          multipart/form-data:
            schema:
              type: object
              required:
                - driverName
                - photo
                - photoCapturedVia
                - licenseFront
                - licenseFrontCapturedVia
                - licenseBack
                - licenseBackCapturedVia
              properties:
                driverName:
                  type: string
                  maxLength: 200
                photo:
                  type: string
                  format: binary
                  description: Profile photo. Required — it is what a passenger recognises the driver by (US-2.12).
                photoCapturedVia:
                  $ref: '#/components/schemas/CaptureSource'
                licenseFront:
                  type: string
                  format: binary
                licenseFrontCapturedVia:
                  $ref: '#/components/schemas/CaptureSource'
                licenseBack:
                  type: string
                  format: binary
                licenseBackCapturedVia:
                  $ref: '#/components/schemas/CaptureSource'
                nicNo:
                  type: string
                  maxLength: 20
                allowedVehicleTypes:
                  type: array
                  items:
                    $ref: './_shared.yaml#/components/schemas/VehicleType'
                  description: >-
                    Repeated field, or one field carrying a comma-separated list. `multipart/form-data`
                    has no array type and both forms are written in the wild.
      responses:
        '200':
          description: Profile stored; OCR queued.
          content:
            application/json:
              schema:
                type: object
                required: [driverId, status, displayName, allowedVehicleTypes, fields]
                properties:
                  driverId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  # Δ C029. The screen that follows Profile Setup shows the driver their own
                  # name and photo back; without these it would have to guess that the values
                  # it sent are the values that were stored, which is untrue whenever OCR
                  # supplied a NIC or a licence class the request did not carry.
                  displayName:
                    type: string
                  photoUrl:
                    type: string
                    format: uri
                    description: >-
                      Δ MCS-25 — a **relative, signed, expiring** URL onto `getDriverProfilePhoto`, not the stored `s3://` / `file://` pointer. Resolve it against the gateway origin and follow it as given; it changes between reads and needs no bearer token.
                  nicNo:
                    type: string
                  allowedVehicleTypes:
                    type: array
                    items:
                      $ref: './_shared.yaml#/components/schemas/VehicleType'
                  fields:
                    type: array
                    items:
                      $ref: './_shared.yaml#/components/schemas/ExtractedField'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/drivers/documents:
    get:
      operationId: listDriverDocuments
      summary: Every document this driver may look at, each with a signed link to its image.
      description: |
        **Δ MCS-28.** `VehicleDocument` has carried `docId`, `kind`, `status` and `expiresAt` since
        C029 and **no URL at all**, so SCR-DA/DI-026 could tell a driver their insurance expired in
        March and had no way to show it to them, and SCR-DA/DI-029 could not show a driver the
        licence they had uploaded.

        The driver's own identity documents (`vehicleId` absent) and the documents of every vehicle
        they own or are assigned to. **The entitlement is a join, not a filter:** it goes through
        `registry.driver_eligible_vehicles`, which is what "may operate" already means for
        `select-live`, for dispatch's standby gate and for trip-state-svc.

        Driver-scoped in its own SQL, so a document belonging to somebody else is **absent** rather
        than refused — telling the two apart would leak whose vehicle a document id names.
      tags: [drivers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The documents, oldest vehicle-less first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DriverDocument'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  /v1/drivers/documents/{documentId}/image:
    get:
      operationId: getDriverDocumentImage
      summary: The bytes behind one document's signed link.
      description: |
        **Δ MCS-28.** Same arrangement as `getDriverProfilePhoto` and for the same reason: the caller
        is an image view, which carries no bearer token, and an access token in a query string is an
        access token in every proxy log on the way.

        **Unlike the avatar, the signature is not the only lock.** The read is entitlement-scoped in
        its own SQL, so a signing key that ever leaked would still not open a document belonging to
        somebody else. An avatar is a face; these are an NIC and a driving licence number, and the
        difference is worth a second check.

        Every refusal is the same `403` — a forged or expired signature, a document that does not
        exist, and one that is not this driver's.
      tags: [drivers]
      security: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - name: d
          in: query
          required: true
          description: The driver the link was minted for; the signature covers it.
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - name: v
          in: query
          required: true
          description: >-
            Opaque stand-in for WHICH image the link was minted for. A re-uploaded document changes
            it, which is what lets caches let go of the old one.
          schema:
            type: string
        - name: expires
          in: query
          required: true
          description: Unix seconds at which the signature stops verifying.
          schema:
            type: string
        - name: signature
          in: query
          required: true
          description: Lower-case hex HMAC-SHA256 issued by registry-svc.
          schema:
            type: string
      responses:
        '200':
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '302':
          description: |
            The object store can serve the bytes directly, so the caller is redirected to a
            short-lived presigned URL (D-36).
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404':
          description: The link verified but the bytes are gone — a filesystem store whose pod was replaced.
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [forbidden]

  /v1/drivers/{driverId}/profile-photo:
    get:
      operationId: getDriverProfilePhoto
      summary: The bytes behind the `photoUrl` a driver profile read handed back.
      description: |
        **Δ MCS-25.** `photoUrl` used to be the value `registry.driver_profiles.photo_url` holds,
        which is an `s3://bucket/key` or `file://…` pointer — this service's to resolve, and not
        something a client can fetch. Both driver apps therefore drew a placeholder where the
        wireframes draw an avatar, and the photograph AL-27 *requires* a driver to upload was never
        shown back to them.

        The reads now hand back a **relative, signed, expiring** URL that resolves to this
        operation, which is the same shape `TicketDetail.screenshotUrl` has carried since C053 and
        is chosen for the same reason: the caller is an image loader.

        **No bearer token, deliberately.** An image loader does not carry one, and putting an access
        token in a query string puts it in every proxy log the request passes through. The
        `signature` is the credential — unguessable, scoped to one driver, and expiring.

        **Every refusal is the same refusal.** A malformed id, a forged or expired signature, a
        driver who does not exist and a driver with no photo all answer `403`. Telling them apart
        would let somebody holding a link they cannot use learn which driver ids are real.

        The link is minted fresh on each profile read, so it changes between reads; clients should
        follow the URL they were given rather than storing one.
      tags: [drivers]
      security: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - name: v
          in: query
          required: true
          description: >-
            Opaque stand-in for WHICH photo the link was minted for. Replacing a photo changes it,
            which is what lets caches let go of the old one; a link naming a superseded photo is
            refused rather than quietly serving the new one.
          schema:
            type: string
        - name: expires
          in: query
          required: true
          description: Unix seconds at which the signature stops verifying.
          schema:
            type: string
        - name: signature
          in: query
          required: true
          description: Lower-case hex HMAC-SHA256 issued by registry-svc.
          schema:
            type: string
      responses:
        '200':
          description: The image bytes.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '302':
          description: |
            The object store can serve the bytes directly, so the caller is redirected to a
            short-lived presigned URL (D-36). Only ever issued to a caller that already proved the
            signature.
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404':
          description: The link verified but the bytes are gone — a filesystem store whose pod was replaced.
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [forbidden]

  # -------------------------------------------------------------------------------------------
  # Vehicles
  # -------------------------------------------------------------------------------------------
  /v1/vehicles:
    post:
      operationId: registerVehicle
      summary: Start onboarding the driver's own Mode C standby vehicle.
      description: |
        SCR-DA/DI-004 → 004c. Creates the vehicle and queues OCR for each of the four documents;
        emits `vehicle.registered`. Per-document verdicts: insurance (expiry), revenue licence
        (number + expiry), photos (plate matches `registrationNumber`), vehicle details (entered).

        When all four come back `VERIFIED` the vehicle is auto-approved with no officer step
        (Change 6/22). Once a vehicle is `approved`, calling this again starts a **new** vehicle
        at step 1/4 (AL-30).

        Mode A/B and train are rejected `403 mode-not-allowed` — they belong to the Fleet Portal
        and admin-bff.
      tags: [vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleRegistration'
      responses:
        '201':
          description: Vehicle created; OCR queued.
          content:
            application/json:
              schema:
                type: object
                # Δ C029. `ocrJobId` left `required` in D3' even though a registration that
                # carried no documents queues no extraction; inventing an identifier no service
                # recognises would leave a client polling it forever. See the C029 handoff.
                required: [vehicleId, status, registrationNumber, verification, onboardingStatus, createdAt]
                properties:
                  vehicleId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  ocrJobId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  registrationNumber:
                    type: string
                  verification:
                    type: object
                    required: [vehicleDetails, insurance, revenueLicense, photos]
                    properties:
                      vehicleDetails:
                        $ref: '#/components/schemas/StepVerdict'
                      insurance:
                        $ref: '#/components/schemas/StepVerdict'
                      revenueLicense:
                        $ref: '#/components/schemas/StepVerdict'
                      photos:
                        $ref: '#/components/schemas/StepVerdict'
                  onboardingStatus:
                    $ref: '#/components/schemas/OnboardingStatus'
                  # Δ C029. Registration saves Step 1/4 — this request carries exactly the type
                  # and registration number the `details` step stores — so a fresh vehicle
                  # resumes at `insurance`, and the client should not have to ask.
                  nextStep:
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingStep'
                      - type: 'null'
                  createdAt:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-vehicle-type, attestation-failed, mode-not-allowed, registration-exists]

  /v1/vehicles/mine:
    get:
      operationId: listMyVehicles
      summary: List the caller's vehicles.
      description: US-2.8. Renders My Vehicles as Incomplete / Approved per vehicle (AL-30).
      tags: [vehicles]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Vehicle summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    description: Everything the caller may operate, their own registrations first.
                    items:
                      $ref: '#/components/schemas/VehicleSummary'
                  assigned:
                    type: array
                    description: |
                      Δ C028. US-13.9's "Temporarily assigned to me" group — the subset of
                      `items` a fleet has lent the caller, split out so the app renders the
                      group header without filtering. Empty for a driver with no assignments.
                    items:
                      $ref: '#/components/schemas/VehicleSummary'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  /v1/vehicles/{vehicleId}:
    get:
      operationId: getVehicle
      summary: Read a vehicle with its driver profile and registration status.
      description: Visible to the owner, an assigned driver, and internal roles.
      tags: [vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Vehicle detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetail'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-owner, vehicle-not-found]

  /v1/vehicles/{vehicleId}/status:
    get:
      operationId: getVehicleStatus
      summary: Read registration status and rejection reason.
      description: US-2.13/2.15 — the poll the app uses while a submission is being reviewed.
      tags: [vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  rejectionReason:
                    type: string
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-owner, vehicle-not-found]

  /v1/vehicles/{vehicleId}/onboarding-status:
    get:
      operationId: getVehicleOnboardingStatus
      summary: Per-step onboarding verdicts and the step to resume at.
      description: |
        SCR-DA/DI-006. `nextStep` drives resume — the wizard opens the first step that is not
        `VERIFIED` (AL-30), never step 1. `fields` carries per-field `source`, `confidence` and
        `verifyStatus`, which is what the Verification Officer screen renders.
      tags: [vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Onboarding state.
          content:
            application/json:
              schema:
                type: object
                required: [status, onboardingStatus, steps, fields]
                properties:
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  onboardingStatus:
                    $ref: '#/components/schemas/OnboardingStatus'
                  nextStep:
                    description: '`null` when every step is VERIFIED.'
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingStep'
                      - type: 'null'
                  steps:
                    type: object
                    required: [details, insurance, revenue, photos]
                    properties:
                      details:
                        $ref: '#/components/schemas/StepVerdict'
                      insurance:
                        $ref: '#/components/schemas/StepVerdict'
                      revenue:
                        $ref: '#/components/schemas/StepVerdict'
                      photos:
                        $ref: '#/components/schemas/StepVerdict'
                  fields:
                    type: array
                    items:
                      $ref: './_shared.yaml#/components/schemas/ExtractedField'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-owner, vehicle-not-found]

  /v1/vehicles/{vehicleId}/onboarding/{step}:
    put:
      operationId: saveVehicleOnboardingStep
      summary: Save one onboarding step.
      description: |
        Persists `registry.onboarding_steps` for this step alone (AL-30, US-2.26/2.27). The
        multipart form is the same contract the AL-43 drag-crop scanner posts to — that change
        only improved the client-side capture, not this shape.

        A doubtful or driver-entered field, or a plate OCR that does not match the entered
        registration number on the `photos` step, makes the step `PENDING_REVIEW`.
      tags: [vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - name: step
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OnboardingStep'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepInput'
          # Δ MCS-01 — this arm is now implemented. It was declared from the start and registry-svc
          # bound JSON only, so a client posting a form (which the KMP `uploadVehicleOnboardingStep`
          # has always done) reached a handler that saw no fields at all.
          multipart/form-data:
            schema:
              type: object
              properties:
                registrationNumber:
                  type: string
                vehicleType:
                  $ref: './_shared.yaml#/components/schemas/VehicleType'
                file:
                  type: string
                  format: binary
                  description: Perspective-corrected document or photo capture (AL-43).
                fileCapturedVia:
                  $ref: '#/components/schemas/CaptureSource'
                fileBack:
                  type: string
                  format: binary
                  description: Step 4/4 only — one photo cannot show a vehicle's front and back plates.
                fileBackCapturedVia:
                  $ref: '#/components/schemas/CaptureSource'
                # Δ MCS-02 — driver corrections. SCR-DA/DI-004a and 004b draw a ✎ on every
                # extracted value and BR-25.3 is built around the driver editing one ("any element
                # doubtful OR EDITED → this step's status is Pending"), but this arm carried no
                # way to send it and the JSON arm needs a `fileId` no response on this surface
                # returns. Named parts rather than a free map: `DocumentFieldKeys.AcceptedFor`
                # already fixes the accepted set per kind and side, so the contract can say it too.
                #
                # `file` is NOT required when a correction is sent on a step that already saved
                # its document — re-photographing a licence to retype its expiry is not a thing to
                # ask of a driver on a roadside. Each correction lands `source='manual'`,
                # `verifyStatus='pending'` and routes to the Verification Officer (AL-29).
                insuranceExpiry:
                  type: string
                  format: date
                  description: Step 2/4. Corrects a doubtful or unread `insurance_expiry`.
                insurancePolicyNo:
                  type: string
                revenueNo:
                  type: string
                  description: Step 3/4. Corrects a doubtful or unread `revenue_no`.
                revenueExpiry:
                  type: string
                  format: date
      responses:
        '200':
          description: Step saved; verdict and resume point.
          content:
            application/json:
              schema:
                type: object
                required: [stepStatus, onboardingStatus, status]
                properties:
                  stepStatus:
                    $ref: '#/components/schemas/StepVerdict'
                  onboardingStatus:
                    $ref: '#/components/schemas/OnboardingStatus'
                  nextStep:
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingStep'
                      - type: 'null'
                  # Δ C029. Saving the fourth verified step auto-approves the vehicle (AL-27),
                  # so the response that caused it says so rather than making the app poll.
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  ocrJobId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '413': { $ref: './_shared.yaml#/components/responses/PayloadTooLarge' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-owner, vehicle-not-found, payload-too-large]

