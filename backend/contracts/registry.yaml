  /v1/vehicles/{vehicleId}/share/{grantId}/accept:
    post:
      operationId: acceptShareGrant
      summary: Sharee accepts a Mode B grant.
      description: US-4.3b. Visibility begins here, not at grant creation.
      tags: [sharing]
      security:
