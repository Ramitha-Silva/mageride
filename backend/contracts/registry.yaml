        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, vehicle-not-found, conflict]

  # -------------------------------------------------------------------------------------------
  # Driver bank & payout profile (Δ AL-58/AL-59) — replaces the retired D-11 merchant binding
  # -------------------------------------------------------------------------------------------
  /v1/drivers/payout-profile:
    get:
      operationId: getDriverPayoutProfile
      summary: Where this driver's swept earnings are sent, and their own LankaQR.
      description: |
        **AL-58/AL-59.** Shaped exactly like the Fleet Portal's `GET /v1/fleets/{id}/payout-profile`
        and for the same reason: the platform never holds a payee's bank details in more than one
        shape. `lankaqrUploadId` is the driver's **own** bank-app QR — what a passenger scans to pay
        them (`scan_driver_qr`), and what makes AL-59's "the money never passes through MageRide"
        true for that rail.
      tags: [drivers]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current profile version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutProfile'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]
    put:
      operationId: upsertDriverPayoutProfile
      summary: Set or change the driver's bank details.
      description: |
        **AL-58.** Any edit re-enters `pending_verification` and a **new version row is inserted** —
        the incumbent `verified` row keeps paying until an officer approves the change, exactly as
        BR-31.1 requires for a fleet. Approved by a Verification Officer through the SCR-AP-003
        driving-licence queue: AL-39's routes are subject-agnostic and already take a driver id.

        **Payouts do not run until the profile is `verified`.** Earnings accrue on the wallet and
        are never lost; the driver simply is not swept.
      tags: [drivers]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, branch, accountNo, accountHolderName]
              properties:
                bank:
                  type: string
                  maxLength: 120
                branch:
                  type: string
                  maxLength: 120
                accountNo:
                  type: string
                  maxLength: 40
                accountHolderName:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Stored; pending verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/drivers/payout-profile/documents:
    post:
      operationId: uploadDriverPayoutDocument
      summary: Attach proof of account, or the driver's own LankaQR image.
      description: |
        **AL-58/AL-59.** Multipart. A document is an edit too — uploading against a `verified`
        profile forks a new pending version carrying the other slot forward, because replacing the
        bank statement behind an approved account is exactly the change an officer would want to see
        again.
      tags: [drivers]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [bank_statement, passbook_first_page, lankaqr_code]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required: [docId, kind]
                properties:
                  docId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  kind:
                    type: string
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '413': { $ref: './_shared.yaml#/components/responses/PayloadTooLarge' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, payload-too-large]

  # -------------------------------------------------------------------------------------------
  # Internal
  # -------------------------------------------------------------------------------------------
  # Δ AL-57 — REMOVED, do not re-add:
  #   POST /v1/internal/vehicles/{vehicleId}/merchant   — D-11 RETIRED. OnePay supports one merchant
  #     account per merchant; per-driver sub-accounts do not exist, so this route could only ever
  #     store MageRide's own id against every driver. Where a driver's money goes is now
  #     `GET · PUT /v1/drivers/payout-profile` (AL-58) and the weekly payout run (payout.yaml).

  # Δ C029 — not in D3'; see the C029 handoff.
  # ---------------------------------------------------------------------------------------
  # Δ C063 (AL-58 / AL-59) — the Verification Officer's decision on a driver's payout profile.
  #
  # WHY HERE AND NOT IN admin-bff. That BFF writes registry.driver_profiles.verified_at itself,
  # because an identity verdict is one column and no service exposes a route for it. This is not
  # that: approving a payout profile is BR-31.1's versioning transition — supersede the incumbent,
  # THEN verify the replacement, in one transaction and in that order, because
  # ux_driver_payout_verified (migration 0316) admits exactly one verified row per driver. That
  # invariant belongs to the service that owns the table, and its other half already lives in this
  # service's DriverPayoutProfileService. fleet-svc made the same call for the fleet's identical
  # table and its /v1/internal/fleets/** plane exists for this same caller.
  #
  # Micro-change-set; recorded in the C063 handoff in build/progress.md.
  # ---------------------------------------------------------------------------------------
  /v1/internal/drivers/{driverId}/payout-profile/approve:
    post:
      operationId: approveDriverPayoutProfile
      summary: Verify a driver's bank & payout profile (AL-58).
      description: |
        Called by admin-bff on behalf of a Verification Officer (AL-39). **This is the last gate
        between a driver submitting bank details and being paid** — until a row is `verified`,
        payout-svc's weekly sweep skips them, their wallet accrues and nothing is lost, but nothing
        is paid either. It also puts their own LankaQR on the ride pay sheet (AL-59).

        Supersedes the incumbent and verifies the replacement in one transaction, in that order.

        **Idempotent.** With nothing pending the current version is returned unchanged — a second
        Approve must not rewrite `verified_at` or `verified_by`.

        `officerId` comes in the body because this plane has no bearer: the caller is a service. The
        audit trail proper is admin-bff's `audit.events` row (D-35), written where the human's token
        actually is; `verified_by` is this service's own record of who decided.
      tags: [drivers]
      security:
        - mtls: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId]
              properties:
                officerId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
      responses:
        '200':
          description: The version the decision landed on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, payout-profile-not-found, conflict]

  /v1/internal/drivers/{driverId}/payout-profile/reject:
    post:
      operationId: rejectDriverPayoutProfile
      summary: Refuse a driver's bank & payout profile, with a reason (AL-58).
      description: |
        **The incumbent is never disturbed.** A mismatched account-holder name is a reason to refuse
        the *edit*, not a reason to stop paying a driver into details an officer already approved.

        `reason` is mandatory and is shown verbatim on SCR-DA-022a.

        Only a version awaiting verification can be refused — unlike Approve this is a `409` rather
        than a no-op, because writing a refusal onto an already-decided version would stop an
        approved driver's payouts by a mis-click.
      tags: [drivers]
      security:
        - mtls: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId, reason]
              properties:
                officerId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
                reason:
                  type: string
                  maxLength: 1000
                  description: Shown verbatim to the driver.
      responses:
        '200':
          description: The version the decision landed on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPayoutDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, payout-profile-not-found, conflict]

  /v1/internal/vehicles/{vehicleId}/onboarding/recompute:
    post:
      operationId: recomputeVehicleOnboarding
      summary: Re-derive the onboarding state after a Verification Officer confirmed a field.
      description: |
        Internal, mTLS only. AL-30 says "Approve unlocks only when all Pending fields are
        confirmed", and admin-bff is what confirms them — it writes
        `registry.document_fields.verify_status='confirmed'` and then has no way to tell
        registry-svc, so a vehicle whose last doubtful field was just cleared would sit at
        `PENDING_REVIEW` until the driver happened to re-save a step.

        Takes no input and re-derives from what is stored, so it is idempotent.
      tags: [vehicles]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/VehicleId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The re-derived onboarding state.
          content:
            application/json:
              schema:
                type: object
                required: [status, onboardingStatus, steps, fields]
                properties:
                  status:
                    $ref: '#/components/schemas/RegistrationStatus'
                  onboardingStatus:
                    $ref: '#/components/schemas/OnboardingStatus'
                  nextStep:
                    oneOf:
                      - $ref: '#/components/schemas/OnboardingStep'
                      - type: 'null'
                  steps:
                    type: object
                    required: [details, insurance, revenue, photos]
                    properties:
                      details:
                        $ref: '#/components/schemas/StepVerdict'
                      insurance:
                        $ref: '#/components/schemas/StepVerdict'
                      revenue:
                        $ref: '#/components/schemas/StepVerdict'
                      photos:
                        $ref: '#/components/schemas/StepVerdict'
                  fields:
                    type: array
                    items:
                      $ref: './_shared.yaml#/components/schemas/ExtractedField'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, vehicle-not-found]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
    mtls:
      $ref: './_shared.yaml#/components/securitySchemes/mtls'

  parameters:
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    DriverPayoutDecision:
      type: object
      description: One version of a driver's payout profile, after an officer decided on it.
      required: [profileId, driverId, bank, branch, accountNo, accountHolderName, status]
      properties:
        profileId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        driverId: { $ref: './_shared.yaml#/components/schemas/Ulid' }
        bank: { type: string }
        branch: { type: string }
        accountNo: { type: string }
        accountHolderName: { type: string }
        proofDocId: { type: string, nullable: true }
        lankaqrDocId: { type: string, nullable: true }
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        rejectionReason: { type: string, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }

    DriverDocument:
      type: object
      required: [docId, kind, status, imageUrl]
      description: >-
        Δ MCS-28. `VehicleDocument` with the one thing it has never carried — a way to see the
        document.
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [driving_license, registration, permit, insurance, revenue_license]
        status:
          type: string
          enum: [VALID, EXPIRING, EXPIRED, REJECTED]
        expiresAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        imageUrl:
          type: string
          format: uri
          description: >-
            A relative, signed, expiring link onto `getDriverDocumentImage`. Resolve it against the
            gateway origin and follow it as given; it changes between reads and needs no bearer.

    DriverProfileSummary:
      type: object
      description: |
        **Δ MCS-05.** One `registry.driver_profiles` row — what Profile Setup wrote, read back.

        `status` is the same derivation `PUT /v1/drivers/profile` returns: `PENDING` while any
        identity field is still waiting on a Verification Officer, `APPROVED` once none is. D3'
        types it as a `RegistrationStatus`, which is the vehicle vocabulary; for a driver it reads
        as *"has this identity been checked"*.
      required: [driverId, status, displayName]
      properties:
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        displayName:
          type: string
        photoUrl:
          type: string
          format: uri
          description: >-
            Δ MCS-25 — a **relative, signed, expiring** URL onto `getDriverProfilePhoto`, not the stored `s3://` / `file://` pointer. Resolve it against the gateway origin and follow it as given; it changes between reads and needs no bearer token.
        nicNo:
          type: string
        allowedVehicleTypes:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/VehicleType'

    DriverPayoutProfile:
      type: object
      description: '**Δ AL-58/AL-59.** One version of a driver''s bank & payout details.'
      required: [bank, branch, accountNo, accountHolderName, status]
      properties:
        bank:
          type: string
        branch:
          type: string
        accountNo:
          type: string
        accountHolderName:
          type: string
        proofDocId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        lankaqrDocId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [pending_verification, verified, rejected, superseded]
        rejectionReason:
          type: string
        verifiedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Imei:
      type: string
      description: 15-digit IMEI.
      pattern: '^\d{15}$'

    RegistrationStatus:
      type: string
      description: Matches the `registry.vehicles.status` CHECK (C003).
      enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]

    OnboardingStatus:
      type: string
      description: |
        Derived from the four steps (AL-30): `incomplete` while any step is not verified or
        confirmed, `approved` once all four are. Only `approved` Mode-C vehicles are go-live
        eligible.
      enum: [incomplete, approved]

    CaptureSource:
      type: string
      description: |
        **Δ MCS-01.** Where one uploaded image came from (AL-43), stored on
        `docs.uploads.captured_via`. Required on every onboarding upload and declared per file
        part, never per request: a driver scans the licence through SCR-DA/DI-005 and picks the
        avatar out of the gallery in one submission.

        `gallery` is permitted and **flagged** — it is a file that was already on the handset,
        which is how a document belonging to somebody else arrives, and it is what the
        Verification-Officer queue sorts on. It is not defaulted: defaulting to `camera_dragcrop`
        would record a scan that did not happen, and defaulting to `gallery` would flag every
        honest capture from a client that forgot the field.

        The column's third value, `other`, is the Fleet Portal's desktop file picker (AL-50) and
        is not accepted here.
      enum: [camera_dragcrop, gallery]

    OnboardingStep:
      type: string
      enum: [details, insurance, revenue, photos]

    StepVerdict:
      type: string
      description: |
        `PENDING_INPUT` = not yet saved. `PENDING_REVIEW` = saved but holding a doubtful,
        driver-entered or plate-mismatched field, so it sits in the officer queue.
      enum: [VERIFIED, PENDING_REVIEW, PENDING_INPUT]

    VehicleRegistration:
      type: object
      # Δ C029. The four document ids were `required` here and AL-30 in the same specification
      # has the wizard entry point "create a NEW vehicle at Step 1/4" (US-2.27) — a vehicle that
      # must arrive with four documents has no Step 2/4 to walk to. Supplied, they are onboarded
      # in one shot; absent, `PUT /v1/vehicles/{vehicleId}/onboarding/{step}` saves each step.
      # See the C029 handoff.
      required:
        - registrationNumber
        - vehicleType
        - mode
      properties:
        registrationNumber:
          type: string
          maxLength: 32
          description: Unique within the active set (D-37).
        vehicleType:
          description: |
            Mode-C driver-app types only. `bus` and `train` are Mode A and are rejected here
            (AL-09).
          allOf:
            - $ref: './_shared.yaml#/components/schemas/RideVehicleType'
        mode:
          type: string
          description: The Driver App onboards Mode C only; A/B go to the Fleet Portal.
          const: C
        insuranceFileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        revenueLicenseFileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehiclePhotoFrontFileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehiclePhotoBackFileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        driverName:
          type: string
          maxLength: 200
          description: Defaults from `registry.driver_profiles` (Profile Setup).
        driverPhotoFileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'

    OnboardingStepInput:
      type: object
      description: |
        The step's fields. `details` carries `registrationNumber` + `vehicleType`; the document
        steps carry the uploaded file ids for that step.
      properties:
        registrationNumber:
          type: string
          maxLength: 32
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/RideVehicleType'
        fileId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        fileIdBack:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        fields:
          type: object
          description: Driver-entered corrections; each lands `source='manual'`, `verifyStatus='pending'`.
          additionalProperties:
            type: string

    VehicleSummary:
      type: object
      required: [vehicleId, registrationNumber, vehicleType, mode, status, onboardingStatus]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        registrationNumber:
          type: string
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          $ref: './_shared.yaml#/components/schemas/OperatingMode'
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        # Δ MCS-02 — SCR-DA/DI-026's "Temporarily assigned to me" group prints
        # "Lanka Fleet (Pvt) Ltd · until 30 Jun" (US-13.9) and this schema could say neither.
        # Both are absent on an owned vehicle; `assignedUntil` is also absent on an open-ended
        # assignment, which is a different fact the screen renders the same way.
        fleetName:
          type: string
          description: The assigning fleet's display name.
        assignedUntil:
          description: |
            When the assignment lapses. US-13.9's auto-expiry needs no sweep — the eligibility
            view stops returning the vehicle the moment this passes (migration 0314) — so this
            is for display, not for a client-side check.
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        onboardingStatus:
          $ref: '#/components/schemas/OnboardingStatus'
        modeBBilling:
          type: string
          description: '"Service payment" (AL-51). Null for Mode A and Mode C.'
          enum: [paid, free]
        defaultMonthlyFareMinor:
          type: integer
          format: int64
          minimum: 0
        # Δ C028. US-13.9 puts the vehicles a fleet has lent a driver in a separate
        # "Temporarily assigned to me" group, and US-9.6 marks the one that is currently
        # selected — neither is expressible in the shape above, so a client could not render
        # My Vehicles from it. See the C028 handoff.
        source:
          type: string
          description: |
            How the caller came by this vehicle. `owned` is their own registration;
            `assigned` is a fleet's, lent to them and revocable (US-13.9, AL-23).
          enum: [owned, assigned]
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        isSelected:
          type: boolean
          description: The one vehicle the driver may go live on right now (US-9.6, US-9.7).
        isGoLiveEligible:
          type: boolean
          description: |
            APPROVED and not E-03 document-suspended. Whether `select-live` would accept it —
            answered by `registry.driver_eligible_vehicles` so registry, dispatch and
            trip-state cannot derive the rule differently.

    VehicleDetail:
      allOf:
        - $ref: '#/components/schemas/VehicleSummary'
        - type: object
          properties:
            dispatchState:
              type: string
              description: E-03 document-expiry auto-suspend.
              enum: [ACTIVE, DISPATCH_SUSPENDED]
            rejectionReason:
              type: string
            fleetId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            driver:
              type: object
              properties:
                driverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                name:
                  type: string
                photoUrl:
                  type: string
                  format: uri
            documents:
              type: array
              items:
                $ref: '#/components/schemas/VehicleDocument'
            createdAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'

    VehicleDocument:
      type: object
      required: [docId, kind, status]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          description: Matches the `registry.documents.kind` CHECK (C003).
          enum: [driving_license, registration, permit, insurance, revenue_license]
        status:
          type: string
          enum: [VALID, EXPIRING, EXPIRED, REJECTED]
        expiresAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Subscriber:
      type: object
      required: [userId, status]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        phoneMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        status:
          type: string
          description: Matches the `subscription.grants.status` CHECK (C005).
          enum: [active, unsubscribed]
        grantedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
