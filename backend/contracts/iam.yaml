openapi: 3.1.0

# =============================================================================================
# iam-svc — auth, profile, session, saved addresses
# Source: specs/D3_mageride_api_contracts.md "iam-svc — auth, profile, token"
#         + Δ 2026-06-21 "iam-svc (items 7, 1, 10)"
#         + Δ 2026-06-28 "iam-svc — Admin login MFA removed (item 5, AL-37)"
#
# REMOVED, do not re-add:
#   POST /v1/admin/auth/mfa/verify  and the TOTP enrolment pair  — REMOVED BY AL-37
#     (Δ 2026-06-28 item 5, ADD §1.11). Internal-role sign-in completes on password or Google
#     alone. Compensating controls are failed-attempt lock-out, session binding and an optional
#     IP allow-list — none of which is an endpoint. D3' §0 and D7' §4.2 still carry pre-AL-37
#     "+ MFA" wording; AL-37 is later and wins (planner finding 3).
# =============================================================================================

info:
  title: MageRide iam-svc
  version: 1.0.0
  summary: Phone-OTP, portal and service sign-in; user profile; saved addresses.
  description: |
    Sign-in is **by surface** (AL-07):

    | Surface | Methods |
    |---|---|
    | Passenger / Driver apps | Phone OTP only |
    | Admin Portal `admin.mageride.lk` | Password or Google — **no MFA/TOTP** (AL-37) |
    | Fleet Portal `fleet.mageride.lk` | Email+Password / Google / Apple |

    Tokens are RS256 access (30 min) plus an opaque rotating single-use refresh token held in
    `iam.sessions` + Redis `refresh:{jti}` (D-29). **One active device per `app` claim** — a
    new-device login revokes only that app's prior session, so a driver and a passenger session
    on the same handset coexist (AL-08, US-1.12, enforced by the C003 partial unique index).

    Gateway edge headers (`X-App-Version`, `X-Platform`) and the shared conventions are described
    in `_shared.yaml`.
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: auth
    description: OTP, portal sign-in, token lifecycle, MQTT session tokens.
  - name: users
    description: Profile read/update, internal lookup, account deletion.
  - name: saved-addresses
    description: Passenger Home/Work and free-form saved places (AL-26, US-22.x).
  - name: emergency-contacts
    description: Driver SOS contacts, fanned out by safety-svc (AL-13, US-12.1/12.9).
  - name: rbac
    description: |
      The nine-role deny-by-default permission model (AL-06). The matrix is URD §2.3 compiled
      into the service — the same model the portals render their menus from (URD §2.2).

paths:

  # -------------------------------------------------------------------------------------------
  # Auth
  # -------------------------------------------------------------------------------------------
  /v1/auth/otp/request:
    post:
      operationId: requestOtp
      summary: Start login and send an OTP over SMS.
      description: |
        Public. Mints an OTP and sends it via the Notify.lk SMS gateway; creates
        `iam.auth_attempts`. Apps only — `role` is `passenger` or `driver`; "reseller" is neither
        a role nor a capability (AL-01). Rate limited by Redis token-bucket, 60 s resend /
        5 per hour (D-32).
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, deviceId]
              properties:
                phone:
                  $ref: './_shared.yaml#/components/schemas/PhoneE164'
                deviceId:
                  type: string
                  maxLength: 128
                  description: Stable per-install device identifier; binds the session (AL-08).
                fcmToken:
                  type: string
                  maxLength: 512
                role:
                  type: string
                  enum: [passenger, driver]
                  description: Which app is signing in. Portals do not use this endpoint.
      responses:
        '200':
          description: OTP dispatched.
          content:
            application/json:
              schema:
                type: object
                required: [authId, attemptsRemaining, cooldownSeconds, isBlocked]
                properties:
                  authId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  attemptsRemaining:
                    type: integer
                    format: int32
                    minimum: 0
                  cooldownSeconds:
                    type: integer
                    format: int32
                    default: 60
                  isBlocked:
                    type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '426': { $ref: './_shared.yaml#/components/responses/UpgradeRequired' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-phone, attestation-failed, user-blocked, upgrade-required, otp-rate-limited]

  /v1/auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify an OTP and issue a session.
      description: |
        Public. On success persists `iam.sessions` (refresh jti) + Redis `refresh:{jti}`, binds
        the device, and **revokes the caller's prior session for this `app` only** (US-1.11,
        AL-08). Replaying the `Idempotency-Key` replays the issued token pair rather than minting
        a second session.
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authId, otp, deviceId]
              properties:
                authId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                otp:
                  type: string
                  pattern: '^\d{6}$'
                deviceId:
                  type: string
                  maxLength: 128
                  description: Must match the `deviceId` sent to `/v1/auth/otp/request`.
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/TokenPair'
                  - type: object
                    required: [user, isNewUser]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
                      isNewUser:
                        type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '423': { $ref: './_shared.yaml#/components/responses/Locked' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [otp-expired, invalid-otp, attestation-failed, auth-not-found, device-mismatch, otp-locked, otp-rate-limited]

  /v1/auth/otp/resend:
    post:
      operationId: resendOtp
      summary: Re-send the OTP for an in-flight auth attempt.
      description: 60-second cooldown; counts against the same 5-per-hour budget (D-32).
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authId]
              properties:
                authId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: OTP re-sent.
          content:
            application/json:
              schema:
                type: object
                required: [attemptsRemaining, cooldownSeconds]
                properties:
                  attemptsRemaining:
                    type: integer
                    format: int32
                    minimum: 0
                  cooldownSeconds:
                    type: integer
                    format: int32
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [auth-not-found, otp-rate-limited]

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and mint a new access token.
      description: |
        The presented refresh token is single-use; a successful call rotates the `jti` (D-29).
        Presenting a spent token revokes the whole session family — a replayed
        `Idempotency-Key`, by contrast, replays the original rotation result.
      tags: [auth]
      security:
        - refreshToken: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Rotated token pair.
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/TokenPair'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, validation-failed]

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the caller's refresh token.
      description: Revokes `iam.sessions` + `refresh:{jti}` for this device only (US-1.7).
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Session revoked. Already-revoked sessions also answer 204.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Sign in with a Google ID token (Admin and Fleet portals only).
      description: |
        **Portals only** (AL-07) — the passenger and driver apps are Phone OTP only and the
        gateway rejects this route for an app `X-Platform`. No MFA challenge follows (AL-37).
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Google OIDC ID token, verified against Google's JWKS.
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/TokenPair'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Sign in with an Apple ID token (Fleet Portal only).
      description: '**Fleet Portal only** (AL-07).'
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: Apple `id_token`, verified against Apple's JWKS.
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/TokenPair'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/auth/password:
    post:
      operationId: signInWithPassword
      summary: Email + password sign-in (Admin and Fleet portals).
      description: |
        Returns a token pair directly — **there is no MFA challenge step** (AL-37). Failed
        attempts count toward the lock-out that replaced the second factor.
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordLogin'
      responses:
        '200':
          description: Session issued.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/TokenPair'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '423': { $ref: './_shared.yaml#/components/responses/Locked' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, otp-locked]

  /v1/admin/auth/login:
    post:
      operationId: adminLogin
      summary: Admin Portal sign-in — password or Google OIDC code.
      description: |
        Δ 2026-06-28 item 5 (AL-37). The Admin Portal's own sign-in surface: `{email, password}`
        **or** a Google OIDC authorization code. **No `mfaChallenge` step**; the TOTP enrolment
        and `/v1/admin/auth/mfa/verify` endpoints are removed. Compensating controls are
        failed-attempt lock-out, session binding and an optional IP allow-list on internal roles
        — enforced in the handler, not as extra round-trips (US-24.5).
      tags: [auth]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PasswordLogin'
                - type: object
                  required: [googleAuthCode]
                  properties:
                    googleAuthCode:
                      type: string
                      description: Authorization code from the Google OIDC redirect.
                    redirectUri:
                      type: string
                      format: uri
      responses:
        '200':
          description: Session issued for an internal role.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/TokenPair'
                  - type: object
                    required: [user]
                    properties:
                      user:
                        $ref: '#/components/schemas/UserProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '423': { $ref: './_shared.yaml#/components/responses/Locked' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, otp-locked]

  /v1/auth/mqtt-token:
    post:
      operationId: issueMqttToken
      summary: Mint the device's MQTT session JWT.
      description: |
        The MQTT session JWT is **decoupled from the API access token** (E-02, D-21): TTL is
        `max(active ride + 2 h, 4 h)` and it is bound to `(vehicleId, deviceId, rideId?)`, so a
        mid-trip API refresh failure in poor coverage does not drop position publishing. EMQX
        validates it against a locally cached JWKS (15-minute TTL, JIT lookup on miss).
      tags: [auth]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, deviceId]
              properties:
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                deviceId:
                  type: string
                  maxLength: 128
                rideId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: MQTT session token minted.
          content:
            application/json:
              schema:
                type: object
                required: [mqttJwt, expiresIn]
                properties:
                  mqttJwt:
                    type: string
                  expiresIn:
                    type: integer
                    format: int32
                    description: Seconds; never less than 14400 (4 h).
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-owner, vehicle-not-found]

  # -------------------------------------------------------------------------------------------
  # Users
  # -------------------------------------------------------------------------------------------
  /v1/users/me:
    get:
      operationId: getMyProfile
      summary: Read the signed-in user's profile.
      description: |
        Returns the union of every granted role (AL-06) plus the language and default payment
        method the apps key their UI off. Portal identities also carry `email`.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]
    put:
      operationId: updateMyProfile
      summary: Update name, photo, language or notification preferences.
      description: US-1.5. `language` is one of Si/Ta/En and drives every server-rendered string (D-26).
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  maxLength: 120
                photoUrl:
                  type: string
                  format: uri
                language:
                  $ref: './_shared.yaml#/components/schemas/LanguageCode'
                notifPrefs:
                  type: object
                  additionalProperties:
                    type: boolean
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]
    delete:
      operationId: deleteMyAccount
      summary: Request account deletion.
      description: |
        Accepted, not immediate — the request is handed to pdpa-svc as an erasure request and
        may be held by a statutory hold (US-1.8, E-06). Poll `GET /v1/pdpa/{requestId}`.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Erasure request accepted.
          content:
            application/json:
              schema:
                type: object
                required: [requestId]
                properties:
                  requestId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, conflict]

  /v1/users/lookup:
    get:
      operationId: lookupUserByPhone
      summary: Resolve whether a phone number belongs to a registered user.
      description: |
        Internal, mTLS only. Backs the proxy-booking rider lookup (P-03) — ride-svc calls it to
        decide between an in-app FCM location request and the SMS `pickup_confirm` web path.
        Returns no PII beyond the answer itself.
      tags: [users]
      security:
        - mtls: []
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/PhoneE164'
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema:
                type: object
                required: [registered]
                properties:
                  registered:
                    type: boolean
                  userId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-phone, unauthorized]

  # -------------------------------------------------------------------------------------------
  # Saved addresses & preferences (Δ 2026-06-21 items 7, 1, 10)
  # -------------------------------------------------------------------------------------------
  /v1/me/saved-addresses:
    get:
      operationId: listSavedAddresses
      summary: List the caller's saved addresses.
      description: |
        Backs the passenger Settings > Saved Addresses screen and the booking screen's
        Home/Work shortcuts (US-22.x, AL-26).
      tags: [saved-addresses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved addresses, Home and Work first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedAddress'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]
    post:
      operationId: createSavedAddress
      summary: Save an address.
      description: |
        At most one Home and one Work per user — the C003 partial unique indexes reject a second
        (AL-26). `label` remains addressable for free-form places.
      tags: [saved-addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedAddressInput'
      responses:
        '201':
          description: Address saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, conflict]

  /v1/me/saved-addresses/{addressId}:
    put:
      operationId: updateSavedAddress
      summary: Edit a saved address.
      description: |
        Full replacement of the stored row. Moving the Home or Work flag to this address clears
        it from whichever address held it, so the at-most-one invariant survives an edit.
      tags: [saved-addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedAddressInput'
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedAddress'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-found, conflict]
    delete:
      operationId: deleteSavedAddress
      summary: Delete a saved address.
      description: Hard delete. Rides already booked against it keep their captured coordinates.
      tags: [saved-addresses]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressId'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-found]

  /v1/me/prefs/language:
    put:
      operationId: setLanguagePreference
      summary: Set the caller's UI language.
      description: |
        Reachable from first-run onboarding and Settings only (Δ 2026-06-21 items 1/10). Writes
        `iam.users.language`; there is no `iam.user_prefs` table despite ADD §9.1 naming one
        (C003 note (d)).
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  $ref: './_shared.yaml#/components/schemas/LanguageCode'
      responses:
        '200':
          description: Preference stored.
          content:
            application/json:
              schema:
                type: object
                required: [language]
                properties:
                  language:
                    $ref: './_shared.yaml#/components/schemas/LanguageCode'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  /v1/me/prefs/payment-method:
    put:
      operationId: setDefaultPaymentMethod
      summary: Set the caller's default payment method.
      description: |
        US-22.4 / AL-14. Cash is the platform default; `lankaqr` and `onepay` are the two
        gateway-backed methods (AL-15). Writes `iam.users.default_payment_method`, which
        ride-svc reads as the pre-selected method when a booking names none.

        Δ **Not in D3'.** AL-14 puts a default payment method on the passenger profile and D2
        SCR-PA-027 draws the picker, but no route sets it — `PUT /v1/users/me` carries only
        name, photo, language and notification switches. Raised in the C027 handoff.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [defaultPaymentMethod]
              properties:
                defaultPaymentMethod:
                  $ref: '#/components/schemas/DefaultPaymentMethod'
      responses:
        '200':
          description: Preference stored.
          content:
            application/json:
              schema:
                type: object
                required: [defaultPaymentMethod]
                properties:
                  defaultPaymentMethod:
                    $ref: '#/components/schemas/DefaultPaymentMethod'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  /v1/me/prefs/operating-city:
    put:
      operationId: setOperatingCity
      summary: Set the caller's launch city.
      description: |
        AL-27 / US-1.3a. The code chosen on the first-run language/city screen
        (SCR-DA/DI-002); it keys `config.operating_cities` and seeds the map centroid. An
        unknown or deactivated code is `400 validation-failed` — a city the platform does not
        operate in is not a preference, it is a client working from a stale list.

        Δ **Not in D3'.** AL-27 moved launch cities out of the app into
        `config.operating_cities` and persists the choice on `iam.users.operating_city_code`,
        but only the read side (`GET /v1/config/cities`, content-svc) was given a route.
      tags: [users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operatingCityCode]
              properties:
                operatingCityCode:
                  type: string
                  maxLength: 60
                  example: colombo
      responses:
        '200':
          description: Preference stored.
          content:
            application/json:
              schema:
                type: object
                required: [operatingCityCode]
                properties:
                  operatingCityCode:
                    type: string
                    example: colombo
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  # -------------------------------------------------------------------------------------------
  # Emergency contacts (AL-13)
  #
  # Δ **Not in D3'.** AL-13 stores a driver emergency contact "consumed by safety-svc SOS
  # fan-out", D2 SCR-PA/PI-027b draws the add/edit list, and `POST /v1/sos` answers
  # `400 no-emergency-contact` when there is none — but no route ever puts one on file. C003
  # landed `iam.emergency_contacts` for the list and `iam.users.emergency_contact_name/phone`
  # for the D-33 SOS fast path; these four routes are what write them. C027 handoff.
  # -------------------------------------------------------------------------------------------
  /v1/me/emergency-contacts:
    get:
      operationId: listEmergencyContacts
      summary: List the caller's SOS contacts.
      description: Primary first — the one denormalised onto `iam.users` for the D-33 fast path.
      tags: [emergency-contacts]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Emergency contacts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmergencyContact'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]
    post:
      operationId: createEmergencyContact
      summary: Add an SOS contact.
      description: |
        The first contact added becomes the primary and is copied onto
        `iam.users.emergency_contact_name/phone`, which is what `POST /v1/sos` reads inside its
        5-second budget (D-33) rather than joining.
      tags: [emergency-contacts]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactInput'
      responses:
        '201':
          description: Contact saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, invalid-phone, unauthorized, conflict]

  /v1/me/emergency-contacts/{contactId}:
    put:
      operationId: updateEmergencyContact
      summary: Edit an SOS contact.
      description: |
        Full replacement of the row. Editing the primary contact rewrites the denormalised copy
        on `iam.users` in the same transaction, so the SOS fast path and the list never disagree.
      tags: [emergency-contacts]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactInput'
      responses:
        '200':
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContact'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, invalid-phone, unauthorized, not-found]
    delete:
      operationId: deleteEmergencyContact
      summary: Remove an SOS contact.
      description: |
        Deleting the primary promotes the next contact into
        `iam.users.emergency_contact_name/phone`; deleting the last one clears both columns, and
        `POST /v1/sos` goes back to `400 no-emergency-contact`.
      tags: [emergency-contacts]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '204':
          description: Deleted.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-found]

  # -------------------------------------------------------------------------------------------
  # Eager-fetch login payload (AL-14, US-1.14/1.15, NFR-51)
  # -------------------------------------------------------------------------------------------
  /v1/me/bootstrap:
    get:
      operationId: getLoginBootstrap
      summary: The whole eager-fetch set, in one round trip.
      description: |
        AL-14's login payload and US-1.15's six items: profile, saved addresses,
        payment-method metadata, the **active trip**, the driver's shift and today's earnings,
        and app config. Nothing here is unbounded — trip history, earnings breakdowns and
        receipts are lazy-fetched per screen (US-1.16, NFR-51).

        The active trip is always present when there is one, because a driver who switches
        handsets mid-trip restores state from this call alone (US-1.14). `driver` is absent for
        an account that holds no driver role.

        Δ **Not in D3'.** AL-14 specifies the payload and NFR-51 bounds it, but no route
        returns it; a client assembling it from `/v1/users/me`, `/v1/me/saved-addresses`,
        `/v1/rides/*/active` and `/v1/config/cities` makes four round trips on a Sri Lankan
        mobile network and cannot satisfy "restores trip state instantly". C027 handoff.
      tags: [users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The eager-fetch set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginBootstrap'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  # -------------------------------------------------------------------------------------------
  # RBAC — the URD §2.3 permission model (AL-06)
  # -------------------------------------------------------------------------------------------
  /v1/me/permissions:
    get:
      operationId: getMyPermissions
      summary: The caller's effective permissions.
      description: |
        The union of every granted role, bounded by the URD §2.3 matrix and narrowed by the
        org-scoped fleet sub-role (AL-03: Owner = full org control + billing, Manager = no
        billing, Viewer = read-only). URD §2.2 requires the portal menus to be rendered from
        the same model the API enforces — this is that model.

        Δ **Not in D3'.** C027 handoff.
      tags: [rbac]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Effective permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissions'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  /v1/admin/rbac/matrix:
    get:
      operationId: getPermissionMatrix
      summary: The whole URD §2.3 feature-permission matrix.
      description: |
        Read-only, and deliberately so: the matrix is a specification, not configuration. A
        Super Admin who could edit it could grant themselves something URD §2.3 forbids, which
        is the one thing the matrix exists to prevent. Changing it is a spec change followed by
        a deploy.

        Δ **Not in D3'.** C027 handoff.
      tags: [rbac]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Every (feature area, role) cell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionMatrix'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/rbac/roles:
    get:
      operationId: listRoles
      summary: The nine canonical roles.
      description: '`iam.roles`. Internal roles (4–9) are provisioned by a Super Admin only (AL-06).'
      tags: [rbac]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Role catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleCatalogEntry'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/admin/rbac/users/{userId}:
    get:
      operationId: getUserRoleGrants
      summary: A user's role grants, fleet membership and effective permissions.
      description: |
        What a Super Admin sees before changing anything, and what an Auditor may read and not
        change. The effective set is resolved the same way the request path resolves it, so the
        console cannot show a permission the API would refuse.
      tags: [rbac]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleGrants'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/admin/rbac/users/{userId}/roles:
    post:
      operationId: grantRole
      summary: Grant a canonical role.
      description: |
        Super Admin only — URD §2.3's "User & role management (RBAC)" row grants ✅ to
        `super_admin` and 👁 to `auditor`, and ➖ to everybody else including `admin` ("**No**
        RBAC/role management", URD §2.4). Idempotent: `iam.user_roles`' primary key settles a
        repeat, and the granting Super Admin is recorded in `granted_by`.
      tags: [rbac]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: './_shared.yaml#/components/schemas/Role'
      responses:
        '200':
          description: Grants after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleGrants'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/admin/rbac/users/{userId}/roles/{role}:
    delete:
      operationId: revokeRole
      summary: Revoke a canonical role.
      description: |
        Super Admin only. Two refusals, both `409`: the account's **primary** role
        (`iam.users.role`) cannot be revoked as a grant, because the union in
        `IUserRepository.RolesAsync` would keep handing it back; and a Super Admin cannot
        revoke their own `super_admin`, because AL-06 makes them the only principal who can
        grant it back.
      tags: [rbac]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: role
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Role'
      responses:
        '200':
          description: Grants after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleGrants'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found, conflict]

components:
  # Re-declared by $ref so this document is self-contained for tooling that validates
  # `security` against a local `components.securitySchemes` (Spectral, most codegens).
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
    refreshToken:
      $ref: './_shared.yaml#/components/securitySchemes/refreshToken'
    mtls:
      $ref: './_shared.yaml#/components/securitySchemes/mtls'

  parameters:
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    UserProfile:
      type: object
      required: [userId, phone, role]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        phone:
          $ref: './_shared.yaml#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
          description: Portal identities only; app users sign in by phone.
        firstName:
          type: string
          maxLength: 120
        photoUrl:
          type: string
          format: uri
        role:
          $ref: './_shared.yaml#/components/schemas/Role'
        roles:
          type: array
          description: Every granted role; effective permissions are their union (AL-06).
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        fleetRole:
          $ref: './_shared.yaml#/components/schemas/FleetRole'
        language:
          $ref: './_shared.yaml#/components/schemas/LanguageCode'
        operatingCityCode:
          type: string
          description: Chosen on the first-run city screen; keys `config.operating_cities`.
          example: colombo
        defaultPaymentMethod:
          type: string
          enum: [cash, lankaqr, onepay]
        notifPrefs:
          type: object
          additionalProperties:
            type: boolean
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    PasswordLogin:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12

    SavedAddressInput:
      type: object
      required: [label, line1, lat, lng]
      properties:
        label:
          type: string
          maxLength: 60
        line1:
          type: string
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        line3:
          type: string
          maxLength: 200
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        isHome:
          type: boolean
          default: false
        isWork:
          type: boolean
          default: false

    SavedAddress:
      allOf:
        - type: object
          required: [addressId]
          properties:
            addressId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
        - $ref: '#/components/schemas/SavedAddressInput'

    DefaultPaymentMethod:
      type: string
      description: |
        Cash is the platform default (US-22.4). `lankaqr` opens the AL-15 Pay deep link and
        `onepay` the hosted gateway; the driver-QR method is a *settlement* choice made during
        a ride, not a stored preference.
      enum: [cash, lankaqr, onepay]
      default: cash

    EmergencyContactInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          $ref: './_shared.yaml#/components/schemas/PhoneE164'

    EmergencyContact:
      allOf:
        - type: object
          required: [contactId, isPrimary]
          properties:
            contactId:
              $ref: './_shared.yaml#/components/schemas/Ulid'
            isPrimary:
              type: boolean
              description: |
                The contact denormalised onto `iam.users.emergency_contact_name/phone` for the
                D-33 SOS fast path. Exactly one per account that has any.
        - $ref: '#/components/schemas/EmergencyContactInput'

    # Mirrors content.yaml#/components/schemas/OperatingCity. Duplicated rather than $ref'd
    # across service documents on purpose — the eager-fetch payload exists to save a round trip
    # to content-svc, not to couple the two contracts. The two shapes must stay identical.
    OperatingCity:
      type: object
      required: [code, nameEn, nameSi, nameTa, centroid, sortOrder]
      properties:
        code:
          type: string
          example: colombo
        nameEn:
          type: string
        nameSi:
          type: string
          example: කොළඹ
        nameTa:
          type: string
          example: கொழும்பු
        centroid:
          $ref: './_shared.yaml#/components/schemas/GeoPoint'
        sortOrder:
          type: integer
          format: int32

    ActiveTrip:
      type: object
      description: |
        The non-terminal journey the caller is part of, whichever plane it lives on — a Mode C
        `rides.rides` row (ride-svc) or a Mode A/B `trips.sessions` row (trip-state-svc). Always
        part of the eager set so a mid-trip device switch restores state (US-1.14).
      required: [tripId, kind, role, state, startedAt]
      properties:
        tripId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          description: '`ride` = Mode C booking; `session` = Mode A/B tracking session (R-01).'
          enum: [ride, session]
        role:
          type: string
          description: Which end of the trip the caller is on.
          enum: [passenger, driver]
        state:
          type: string
          description: '`rides.rides.state` or `trips.sessions.state`, verbatim.'
        mode:
          type: string
          enum: [A, B, C]
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        pickup:
          $ref: './_shared.yaml#/components/schemas/GeoPoint'
        dropoff:
          $ref: './_shared.yaml#/components/schemas/GeoPoint'
        startedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    DriverShift:
      type: object
      description: |
        US-1.15 item 5 — shift/online status and today's earnings summary. `todayTrips`,
        `todayGross` and `todayDailyFee` come from the `fares.driver_earnings` rollup for the
        current **Asia/Colombo** business day (D-38), never from aggregating the ledger.
      required: [isOnline, todayTrips, todayGross, todayDailyFee]
      properties:
        isOnline:
          type: boolean
        activeSessionId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        activeVehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        businessDate:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        todayTrips:
          type: integer
          format: int32
          minimum: 0
        todayGross:
          $ref: './_shared.yaml#/components/schemas/Money'
        todayDailyFee:
          $ref: './_shared.yaml#/components/schemas/Money'

    AppConfig:
      type: object
      description: US-1.15 item 6 — app config and feature flags.
      required: [cities, featureFlags]
      properties:
        cities:
          type: array
          description: Active launch cities, `sortOrder` first (AL-27).
          items:
            $ref: '#/components/schemas/OperatingCity'
        featureFlags:
          type: object
          description: |
            Server-driven flags. Empty until a store exists — ADD §1.12 gives Super Admin
            "feature flags" but no spec models a table for them (C027 handoff).
          additionalProperties:
            type: boolean

    LoginBootstrap:
      type: object
      required: [profile, savedAddresses, emergencyContacts, defaultPaymentMethod, paymentMethods, config, permissions]
      properties:
        profile:
          $ref: '#/components/schemas/UserProfile'
        savedAddresses:
          type: array
          items:
            $ref: '#/components/schemas/SavedAddress'
        emergencyContacts:
          type: array
          items:
            $ref: '#/components/schemas/EmergencyContact'
        defaultPaymentMethod:
          $ref: '#/components/schemas/DefaultPaymentMethod'
        paymentMethods:
          type: array
          description: Payment-method *metadata* (US-1.15 item 3) — what this account may pay with.
          items:
            $ref: '#/components/schemas/DefaultPaymentMethod'
        activeTrip:
          $ref: '#/components/schemas/ActiveTrip'
        driver:
          $ref: '#/components/schemas/DriverShift'
        config:
          $ref: '#/components/schemas/AppConfig'
        permissions:
          $ref: '#/components/schemas/EffectivePermissions'

    PermissionGrant:
      type: string
      description: |
        One capability from the URD §2.3 legend. A cell holds a set of these:
        ✅ Full = `read`+`write`, ⚙ Configure = `read`+`configure`, 👁 Read-only = `read`,
        ◐ Own-scope = the same set plus `ownScope`, "raise"/"report" = `raise`, ➖ = empty.
      enum: [read, write, configure, raise, ownScope]

    PermissionEntry:
      type: object
      required: [featureArea, label, grants, scopedGrants, symbol]
      properties:
        featureArea:
          type: string
          description: Stable key for a URD §2.3 row, e.g. `driver-wallet-adjustments`.
          example: end-user-account-management
        label:
          type: string
          description: The row's URD §2.3 wording.
        grants:
          type: array
          description: Every capability the caller holds here, from any role.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        scopedGrants:
          type: array
          description: |
            The subset of `grants` available **only** within the caller's own records or
            organisation — what `qualifier` describes. Empty when nothing is scope-limited.
            Per capability rather than per cell, because a caller who is both an Admin (👁
            platform-wide) and a Fleet Owner (◐ own org) may read everything and write only
            their own organisation.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        symbol:
          type: string
          description: The URD §2.3 cell verbatim, qualifier included.
          example: ◐ on tickets
        qualifier:
          type: string
          description: The scope note the cell carries, if any — `own`, `own org`, `financial`, `rates`.

    EffectivePermissions:
      type: object
      required: [userId, roles, permissions]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        roles:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        fleetRole:
          $ref: './_shared.yaml#/components/schemas/FleetRole'
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        permissions:
          type: array
          description: One entry per URD §2.3 feature area. Areas with no grant are present and empty.
          items:
            $ref: '#/components/schemas/PermissionEntry'

    PermissionMatrix:
      type: object
      required: [roles, areas]
      properties:
        roles:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        areas:
          type: array
          items:
            type: object
            required: [featureArea, label, cells]
            properties:
              featureArea:
                type: string
              label:
                type: string
              cells:
                type: object
                description: Role to cell. Every one of the nine roles is present — there is no default.
                additionalProperties:
                  $ref: '#/components/schemas/PermissionEntry'

    RoleCatalogEntry:
      type: object
      required: [role, label, isInternal]
      properties:
        role:
          $ref: './_shared.yaml#/components/schemas/Role'
        label:
          type: string
        isInternal:
          type: boolean
          description: Roles 4–9, provisioned only by a Super Admin (AL-06).

    UserRoleGrants:
      type: object
      required: [userId, primaryRole, roles, permissions]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        primaryRole:
          $ref: './_shared.yaml#/components/schemas/Role'
        roles:
          type: array
          description: The union that decides permissions — grants plus the primary role (AL-06).
          items:
            $ref: './_shared.yaml#/components/schemas/Role'
        fleetRole:
          $ref: './_shared.yaml#/components/schemas/FleetRole'
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        permissions:
          $ref: '#/components/schemas/EffectivePermissions'
