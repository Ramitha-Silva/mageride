openapi: 3.1.0

# =============================================================================================
# wallet-svc — driver wallet balance, top-up, ledger view, credit transfer history
# Source: specs/D3_mageride_api_contracts.md "wallet-svc — balance, top-up, ledger (/v1/wallet)"
#         + ADD Appendix C wallet-svc
#
# REMOVED, do not re-add:
#   POST /v1/wallet/topup/bank-transfer        — REMOVED BY AL-05
#   GET/PUT /v1/wallet/admin/*bank-transfer*   — REMOVED BY AL-05
#     Bank transfer is **not a top-up method**. Top-up is OnePay or LankaQR only; the LankaQR
#     route returns a "Pay" deep link into the bank app with the QR as fallback (AL-15).
#   POST /v1/wallet/topup/card                 — consolidated into /v1/wallet/topup/onepay.
#     ADD Appendix C lists both; D3' Part 2 lists only the OnePay route, and card payment *is*
#     the OnePay rail. One endpoint, not two.
#
# Δ C046 — seven operations, and one reversal of a C007 decision:
#   POST /v1/wallet/voucher/purchase            the money side of the bulk voucher (US-9.19)
#   POST /v1/wallet/credit-transfer/request     US-9.10 — ask a holder for credit, by Driver ID
#   GET  /v1/wallet/credit-transfer/pending     US-9A.10 — the holder's approval inbox
#   POST /v1/wallet/credit-transfer/{id}/approve  US-9.13 — exact value, no commission
#   POST /v1/wallet/credit-transfer/{id}/reject   US-9.12
#   GET  /v1/wallet/topup/{topupId}             the state a client polls when it lost the webhook race
#   POST /v1/internal/wallet/{driverId}/debit | /credit   the ledger seam for the services that
#                                               move a driver's money and do not own the ledger
#
# Δ C060 (fleet-billing-svc), raised in its handoff:
#   POST /v1/internal/wallet/fleet/{fleetId}/debit | /credit | /account
#                                               the same seam for a fleet's `owner_type='fleet'`
#                                               wallet (AL-03). ADD §6 gives fleet-billing-svc
#                                               "posts to the same `billing` ledger with
#                                               owner_type='fleet'", and the only thing it needs
#                                               that the driver routes cannot give it is an account
#                                               resolved by *fleet* id. `/account` moves no money:
#                                               it exists because the account is created lazily by
#                                               the first posting, which leaves a top-up session
#                                               with no `account_id` to record until the
#                                               organisation has already been invoiced once.
#   ~ LedgerAccount schema                      the shape `/account` returns.
#
# **The voucher purchase and the request/approve/reject flow are here, not in subscription-svc.**
# C007 left them out of this file because D3' Part 2 prints them under `/v1/vouchers` and
# `/v1/subscriptions/credit-transfer`. Two things overrule that placement:
#   * `billing.*` is one bounded context with one writer. The discount arithmetic, the balance
#     check and the two-leg posting are the same ledger operation whichever path is called, and a
#     second implementation of a *balanced entry* is the one duplication this platform cannot
#     afford (D-09).
#   * ADD §11.6 draws the flow that way: subscription-svc holds the request/approve *workflow* and
#     calls **wallet-svc** to check the holder's balance and to move the money.
# So subscription-svc keeps its D3' route table and forwards the caller's bearer to these routes
# (C047/C048). Recorded in the C046 handoff; D3' should name one owner per operation.
#
# REMOVED, do not re-add (second list): POST /v1/wallet/topup/card — consolidated into
# /v1/wallet/topup/onepay, which *is* the card rail (D6' §7.1). ADD Appendix C lists both.
# =============================================================================================

info:
  title: MageRide wallet-svc
  version: 1.0.0
  summary: Passenger and driver wallet — balance, OnePay/LankaQR top-up, transaction history, credit sends.
  description: |
    Balances are a **projection of the double-entry ledger** (D-09): `billing.journal_entries`
    plus its balanced `billing.postings` legs are the truth, and every entry is asserted balanced
    by a database trigger at COMMIT (C005 decision 2). Nothing in this service moves money without
    writing a balanced entry.

    A credit changes dispatch behaviour, so `wallet.credited` is emitted to invalidate the 5-second
    balance cache dispatch reads before offering a second trip (D-08).

    **Δ AL-57 — the wallet is the passenger's too, and it is how card acceptance survives.**
    `billing.accounts.owner_type` gains `passenger`. OnePay has one merchant account per merchant,
    so a card *ride* fare could only ever land in MageRide's own account; the `onepay` ride method is
    retired and a card passenger tops up **here** — where MageRide legitimately *is* the payee —
    then pays with `POST /v1/fare/pay {method:"wallet"}`. **A passenger top-up and a driver top-up
    are the same route and the same ledger movement**; only the account the credit leg lands on
    differs, so there is no second top-up surface to keep in step.

    **The driver's wallet is now also the fare accumulation account.** Wallet-paid fares credit it,
    the D-08 daily fee debits it, and the AL-58 weekly payout run sweeps it in full — one account,
    one balance. MageRide therefore holds money it owes drivers; `payout.yaml` is how that is
    discharged.

    The transaction stream is deduped per `(account, entry)` — the ledger event stream is
    at-least-once (C002 decision 3), so a redelivered entry must not append a second history line
    (`ux_wallet_tx_account_entry`, C005).
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: wallet
    description: Balance, transactions and transfer history.
  - name: topup
    description: OnePay and LankaQR top-up plus their provider callbacks.
  - name: wallet-admin
    description: Admin view of the bulk-voucher discount tiers.

paths:

  /v1/wallet/{userId}:
    get:
      operationId: getWallet
      summary: Wallet balance and summary.
      description: |
        US-9.7 — read-only. `availableMinor` is the balance net of any outstanding accrued debt
        (a cross-trip cancellation penalty, D-05), which is what the daily-fee gate actually
        checks.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Wallet summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/wallet/{userId}/transactions:
    get:
      operationId: listWalletTransactions
      summary: Wallet transaction history.
      description: |
        US-9A.19. Cursor-paged. `Accept: text/csv` or `application/pdf` returns the same window as
        a downloadable statement rather than JSON.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
        - name: to
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Transaction page, or a statement when a document media type is requested.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/WalletTransaction'
            text/csv:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

  /v1/wallet/{driverId}/transfers:
    get:
      operationId: listWalletTransfers
      summary: Credit transfers this driver sent and received.
      description: US-9A.11, Driver App. Both directions in one stream, newest first.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - name: driverId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [sent, received, all]
            default: all
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Transfer history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransferRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/wallet/credit-transfer/initiate:
    post:
      operationId: initiateWalletCreditTransfer
      summary: Driver proactively sends credit to another driver.
      description: |
        US-9A.12, Driver App. By **Driver ID**, **exact value, no commission** (AL-01). Posts one
        balanced journal entry immediately — this is the wallet-side entry point for the same
        operation subscription-svc exposes as `POST /v1/transfers/driver`; both write
        `billing.credit_transfers` with `direction='DIRECT'`. Both spellings are in D3' Part 2.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipientDriverId, amountMinor]
              properties:
                recipientDriverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '201':
          description: Sent and posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-amount, attestation-failed, insufficient-wallet, forbidden, not-found]

  /v1/wallet/voucher/discount-tiers:
    get:
      operationId: listVoucherDiscountTiers
      summary: Current bulk-voucher purchase discounts (Driver App).
      description: |
        ADD Appendix C. The driver-facing read of the tiers an admin sets — the app needs it to
        render the "pay Rs 900, get Rs 1,000" ladder before a purchase. Active tiers only.
      tags: [wallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active tiers.
          content:
            application/json:
              schema:
                type: object
                required: [tiers]
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoucherDiscountTier'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized]

  /v1/wallet/voucher/purchase:
    post:
      operationId: purchaseVoucherFromWallet
      summary: Buy bulk credit at the configured per-denomination discount.
      description: |
        **Δ C046.** US-9.19, Driver App. The discount lives entirely in what is **paid**: a Rs 1,000
        voucher on a 10 % tier costs Rs 900 and credits Rs 1,000 to the buyer's own wallet. There is
        no redeem code and no second party — `credited_minor = denomination_minor` is a database
        constraint (C005).

        `denominationMinor` must match an **active** tier exactly; an amount between tiers is
        `validation-failed` rather than rounded, because the discount is per denomination (AL-01)
        and interpolating one would invent a rate no admin set.

        The purchase is one balanced journal entry: the platform account is debited the face value
        and the buyer credited the face value, with the discount recorded on the purchase row. That
        difference **is** the informal reseller's whole margin — there is no per-transfer commission
        anywhere on this platform.

        Payment for the voucher itself rides the same OnePay/LankaQR rail as a top-up; a purchase
        whose `gatewayRef` has already been seen credits nothing twice
        (`ux_voucher_purchases_gateway_ref`, C005).
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [denominationMinor]
              properties:
                denominationMinor:
                  type: integer
                  format: int64
                  minimum: 1
                gatewayRef:
                  type: string
                  maxLength: 128
                  description: The settled gateway reference this purchase was paid with, when there is one.
      responses:
        '201':
          description: Purchased and credited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoucherPurchase'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, invalid-amount, attestation-failed, forbidden, conflict]

  /v1/wallet/credit-transfer/request:
    post:
      operationId: requestWalletCreditTransfer
      summary: Ask another driver for credit, by Driver ID.
      description: |
        **Δ C046.** US-9.10, Driver App. Creates a `PENDING` request against the **holding**
        driver, who approves or rejects it in their own app. **No money moves here** — the balance
        is checked at approval, because the holder's balance at request time says nothing about
        what it will be when they answer.

        **Driver ID only.** SCR-DA/DI-023's QR-scan path was removed by AL-34 and there is no
        field for a scanned payload on this request.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holderDriverId, amountMinor]
              properties:
                holderDriverId:
                  description: The driver holding the credit — the one who will approve.
                  allOf:
                    - $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '201':
          description: Request created and awaiting the holder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, invalid-amount, attestation-failed, forbidden, not-found]

  /v1/wallet/credit-transfer/pending:
    get:
      operationId: listPendingWalletCreditTransfers
      summary: Credit requests waiting on this driver.
      description: |
        **Δ C046.** US-9A.10, Driver App — the holder's approval inbox, newest first. Only requests
        addressed to the caller are visible; a driver cannot read what they were not asked.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Pending requests.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/TransferRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]

  /v1/wallet/credit-transfer/{transferId}/approve:
    post:
      operationId: approveWalletCreditTransfer
      summary: Approve a credit request — debit the exact amount, credit the exact amount.
      description: |
        **Δ C046.** US-9.13. Only the **holding** driver may approve, and only a `PENDING` request.
        Posts one balanced `driver_transfer` entry: the holder is debited `amountMinor` and the
        requester credited `amountMinor`. **No fee leg is ever written** — there is no journal kind
        that could carry one (AL-01, C005).

        `402 insufficient-wallet` when the holder cannot cover it at approval time. Approving twice
        is a `409`; the second call moves nothing.
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      responses:
        '200':
          description: Approved and posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [attestation-failed, insufficient-wallet, forbidden, not-found, conflict]

  /v1/wallet/credit-transfer/{transferId}/reject:
    post:
      operationId: rejectWalletCreditTransfer
      summary: Reject a credit request.
      description: '**Δ C046.** US-9.12. Only the holding driver, only a `PENDING` request. Nothing is posted.'
      tags: [wallet]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TransferId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRow'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found, conflict]

  # -------------------------------------------------------------------------------------------
  # Top-up
  # -------------------------------------------------------------------------------------------
  /v1/wallet/topup/onepay:
    post:
      operationId: topupWithOnepay
      summary: Start a card/OnePay wallet top-up.
      description: |
        US-9.18. Initiates the OnePay session and returns the redirect the app opens. The wallet
        is credited **only** on the webhook, with a balanced double-entry journal credit (D-09),
        which then emits `wallet.credited` and invalidates the dispatch balance cache (D-08).
      tags: [topup]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties:
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                returnUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Top-up initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-amount, attestation-failed, gateway-error, forbidden]

  /v1/wallet/topup/lankaqr:
    post:
      operationId: topupWithLankaqr
      summary: Start a LankaQR wallet top-up.
      description: |
        US-9.18, AL-15. Returns a **"Pay" deep link into the bank app**; the QR payload is the
        fallback for devices where the deep link does not resolve. Bank transfer is not an option
        here and never was after AL-05.
      tags: [topup]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: './_shared.yaml#/components/parameters/XAttestation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties:
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        '200':
          description: Top-up initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-amount, attestation-failed, gateway-error, forbidden]

  /v1/wallet/topup/onepay/webhook:
    post:
      operationId: onepayTopupWebhook
      summary: OnePay top-up confirmation callback.
      description: |
        HMAC-signed. **Idempotent on `provider_transaction_id`** (R-19) — a redelivery credits
        nothing twice. Writes the balanced journal credit and emits `wallet.credited`.
      tags: [topup]
      security:
        - hmacSignature: []
      x-idempotency-exempt: >-
        Provider callback. Deduped on provider_transaction_id per R-19; OnePay does not send an
        Idempotency-Key header. See MageRide.Shared AllowMissingIdempotencyKey (C002 decision 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupCallback'
      responses:
        '200':
          description: Callback accepted (also returned for a redelivery).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-found]

  /v1/wallet/topup/lankaqr/confirm:
    post:
      operationId: lankaqrTopupConfirm
      summary: LankaQR top-up confirmation callback.
      description: HMAC-signed. Idempotent on `provider_transaction_id` (R-19).
      tags: [topup]
      security:
        - hmacSignature: []
      x-idempotency-exempt: >-
        Provider callback. Deduped on provider_transaction_id per R-19; the bank IPG does not send
        an Idempotency-Key header. See MageRide.Shared AllowMissingIdempotencyKey (C002 decision 2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopupCallback'
      responses:
        '200':
          description: Callback accepted (also returned for a redelivery).
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received:
                    type: boolean
                    const: true
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-found]

  /v1/wallet/topup/{topupId}:
    get:
      operationId: getTopup
      summary: The state of one top-up session.
      description: |
        **Δ C046.** What a client polls after returning from the OnePay page: the wallet is credited
        on the **callback**, so the app that comes back from the gateway may arrive before the
        webhook does. D6' §7.1 gives the session a 90-second pending window; this is how the driver's
        screen resolves it without guessing. Only the session's own driver may read it.
      tags: [topup]
      security:
        - bearerAuth: []
      parameters:
        - name: topupId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Topup'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  # -------------------------------------------------------------------------------------------
  # The internal ledger seam (mTLS, D3' §0)
  #
  # Every service that moves a driver's money without owning the ledger comes through here, so
  # `billing.journal_postings` has exactly one writer. The `kind` whitelist is the boundary: a
  # caller may post the kinds a spec names for it and nothing else, which is what stops this
  # becoming a general "write me an entry" API.
  # -------------------------------------------------------------------------------------------
  /v1/internal/wallet/{driverId}/debit:
    post:
      operationId: internalWalletDebit
      summary: Debit a driver's wallet on behalf of another service.
      description: |
        **Δ C046.** Callers and their kinds, each named by a spec:

        | Caller | `kind` | Spec |
        |---|---|---|
        | subscription-svc (C047) | `daily_fee` | D-13, D5' §2.2 — charged before the second trip |
        | fare-svc (C049/C050) | `penalty_settle` | D5' §7.1 — the D-05 cross-trip penalty |
        | fare-svc | `trip_payment` | a wallet-paid fare |

        `idempotencyKey` becomes `billing.journal_entries.idempotency_key`, so it must be composed
        from the business fact and not randomly — a retry has to collide. The daily-fee spelling is
        `daily_fee:{driverId}:{vehicleId}:{feeDate}` (1101).

        `402 insufficient-wallet` when the balance will not cover it: this service refuses rather
        than letting a driver's wallet go negative, because §10 leaves driver non-negativity to the
        application and nothing else enforces it.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerPostingRequest'
      responses:
        '200':
          description: Posted, or replayed from the ledger when the key was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The request body carries its own ledger idempotency key, which is UNIQUE on
        billing.journal_entries and is what makes a retry a no-op; a second header key would be a
        second, weaker guard over the same money.
      x-error-codes: [validation-failed, invalid-amount, insufficient-wallet, not-found]

  /v1/internal/wallet/{driverId}/credit:
    post:
      operationId: internalWalletCredit
      summary: Credit a driver's wallet on behalf of another service.
      description: |
        **Δ C046.** Callers and their kinds:

        | Caller | `kind` | Spec |
        |---|---|---|
        | fare-svc (C050) | `tip_payout` | US-8.13 — a passenger tip reaching the driver |
        | fare-svc | `payment_refund` · `overpaid_reversal` | E-05, D-10 |
        | admin-bff (C065) | `adjustment` | `POST /v1/admin/drivers/wallet/{id}/reverse-fee` |

        Same idempotency rule as the debit: the key is the business fact.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerPostingRequest'
      responses:
        '200':
          description: Posted, or replayed from the ledger when the key was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The request body carries its own ledger idempotency key, which is UNIQUE on
        billing.journal_entries and is what makes a retry a no-op; a second header key would be a
        second, weaker guard over the same money.
      x-error-codes: [validation-failed, invalid-amount, not-found]

  # -------------------------------------------------------------------------------------------
  # The fleet side of the same seam (Δ C060, AL-03). A fleet wallet is `billing.accounts` with
  # `owner_type='fleet'` — the same ledger, the same balanced-entry rule, the same lock ordering.
  # A separate route family rather than an `ownerType` field on the body, because a body field
  # that picks whose wallet is debited is one typo away from taking a month's fleet invoice out of
  # a driver's balance.
  # -------------------------------------------------------------------------------------------
  /v1/internal/wallet/fleet/{fleetId}/debit:
    post:
      operationId: internalFleetWalletDebit
      summary: Debit a fleet organisation's wallet on behalf of fleet-billing-svc.
      description: |
        **Δ C060.** One caller and one kind:

        | Caller | `kind` | Spec |
        |---|---|---|
        | fleet-billing-svc (C060) | `fleet_invoice` | AL-03, US-13.10 — the consolidated monthly
        per-Mode-B-vehicle charge |

        The three driver debit kinds are deliberately absent: a `daily_fee` against an organisation
        is a charge no rule in D5' §2.1 describes, and a fleet has no Mode C vehicles to owe one
        for. `fleet_invoice` was added to `ck_journal_entries_kind` by migration 1108 — before it
        there was no kind a fleet's monthly fee could be posted under, which is why
        `billing.fleet_invoices.journal_entry_id` had existed since 1106 and could never be filled.

        `idempotencyKey` is `fleet_invoice:{invoiceId}` (1108), so two replicas settling one
        invoice at the same instant move the money once.

        `402 insufficient-wallet` when the organisation cannot cover it — which is not an error but
        the ordinary reason an invoice stays open until the wallet is topped up.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerPostingRequest'
      responses:
        '200':
          description: Posted, or replayed from the ledger when the key was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The request body carries its own ledger idempotency key, which is UNIQUE on
        billing.journal_entries and is what makes a retry a no-op; a second header key would be a
        second, weaker guard over the same money.
      x-error-codes: [validation-failed, invalid-amount, insufficient-wallet, not-found]

  /v1/internal/wallet/fleet/{fleetId}/credit:
    post:
      operationId: internalFleetWalletCredit
      summary: Credit a fleet organisation's wallet on behalf of fleet-billing-svc.
      description: |
        **Δ C060.** Callers and their kinds:

        | Caller | `kind` | Spec |
        |---|---|---|
        | fleet-billing-svc (C060) | `topup` | US-13.10b — a settled OnePay/LankaQR fleet top-up |
        | admin-bff (C065) | `adjustment` | a Finance correction against an organisation |

        **`topup` is admitted here and refused on the driver route**, and the asymmetry is
        deliberate. The driver rails live in this service — `billing.topups`, the R-19 provider
        dedupe and the amount check are all here — so a caller posting `topup` through the driver
        seam would bypass them. The *fleet* rails are fleet-billing-svc's, which ADD §6 gives
        "top-up via card/OnePay/LankaQR" outright; the same two guards live there over
        `billing.fleet_topups` (migration 1108), and this service holds no fleet session to check
        against. `idempotencyKey` is `fleet_topup:{topupId}`.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerPostingRequest'
      responses:
        '200':
          description: Posted, or replayed from the ledger when the key was already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The request body carries its own ledger idempotency key, which is UNIQUE on
        billing.journal_entries and is what makes a retry a no-op; a second header key would be a
        second, weaker guard over the same money.
      x-error-codes: [validation-failed, invalid-amount, not-found]

  /v1/internal/wallet/fleet/{fleetId}/account:
    post:
      operationId: internalFleetWalletAccount
      summary: Resolve — creating if needed — a fleet organisation's ledger account.
      description: |
        **Δ C060.** The only operation on this plane that moves no money.

        `billing.accounts` has exactly one writer (D-09) and creates a fleet's row lazily on its
        first posting, which would leave fleet-billing-svc unable to record which wallet a top-up
        session credits until the organisation had already been invoiced once —
        `billing.fleet_topups.account_id` is NOT NULL, because a session that does not know which
        wallet it credits is not a session. The alternatives were both worse: posting a synthetic
        movement to force the row into existence puts a transaction nobody made on a customer's
        statement, and letting a second service `INSERT INTO billing.accounts` gives the ledger a
        second writer for the sake of one row.

        Idempotent by `ux_accounts_owner`.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: The organisation's ledger account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        Creates at most one row, arbitrated by the ux_accounts_owner unique index; there is nothing
        a second header-based guard could add.
      x-error-codes: [validation-failed]

  /v1/internal/wallet/trip-payment:
    post:
      operationId: internalWalletTripPayment
      summary: Move a wallet-paid fare from the passenger's balance to the driver's.
      description: |
        **Δ AL-57.** One balanced `trip_payment` entry with **two wallet legs** — passenger debit,
        driver credit — and no platform leg: MageRide is the custodian of the balance, not a party
        to the fare.

        **Why this is not two calls to the debit/credit seam.** Those post one wallet leg against
        the platform, so a fare would be two entries, and a crash between them either creates money
        or destroys it.

        **The ledger key is composed here, not accepted.** Migration 1101 fixes the spelling
        (`'trip_payment:' || ride_payment_id`); a caller free to choose it is a caller free to pay
        one fare twice. A retry replays and answers `replayed: true`.

        A passenger's balance may not go negative — a short balance is `402 insufficient-wallet`,
        which fare-svc turns into "pay cash or scan the driver's QR", never a silent fallback.
      tags: [wallet]
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ridePaymentId, passengerId, driverId, amountMinor]
              properties:
                ridePaymentId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                passengerId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                driverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                description:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Fare moved, or replayed.
          content:
            application/json:
              schema:
                type: object
                required: [entryId, passengerAccountId, driverAccountId, amountMinor, replayed]
                properties:
                  entryId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  passengerAccountId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  passengerBalanceAfterMinor:
                    type: integer
                    format: int64
                  driverAccountId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  driverBalanceAfterMinor:
                    type: integer
                    format: int64
                  amountMinor:
                    type: integer
                    format: int64
                    minimum: 0
                  replayed:
                    type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The ledger key is composed from ridePaymentId and is UNIQUE in billing.journal_entries; a
        header-based guard over the same money would be weaker and would need its own table.
      x-error-codes: [validation-failed, invalid-amount, insufficient-wallet, conflict]

  /v1/internal/wallet/driver-payout:
    post:
      operationId: internalWalletDriverPayout
      summary: Debit a driver's swept balance for a weekly payout.
      description: |
        **Δ AL-58.** The mirror of a top-up — driver debit, platform credit — because the platform
        account is the counterparty of every movement of real-world cash. This is what discharges
        the liability an AL-57 wallet fare created.

        payout-svc calls this in the same transaction as the `billing.payouts` row it raises: an
        instruction with no debit pays a driver twice on a retry, and a debit with no instruction
        loses their money. The key is `driver_payout:{payoutId}`, composed here.
      tags: [wallet]
      security:
        - mtls: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payoutId, driverId, amountMinor]
              properties:
                payoutId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                driverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                description:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Debited, or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The ledger key is composed from payoutId and is UNIQUE; a retried sweep collides there.
      x-error-codes: [validation-failed, invalid-amount, insufficient-wallet, conflict]

  /v1/internal/wallet/driver-payout/{payoutId}/reverse:
    post:
      operationId: internalWalletDriverPayoutReverse
      summary: Return a failed payout to the driver's wallet.
      description: |
        **Δ AL-58.** A bank rejection puts the money back, exactly once, and the next weekly run
        sweeps it again.

        **A second ledger key rather than a second kind** (`driver_payout_reversal:{payoutId}`): the
        movement is still about that payout and belongs beside it in the driver's history, and the
        sign says which direction it went. Sharing the debit's key would make this a replay of the
        debit and restore nothing — a driver whose transfer bounced would silently lose the week.
      tags: [wallet]
      security:
        - mtls: []
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [driverId, amountMinor]
              properties:
                driverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                failureReason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Returned, or replayed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPostingResult'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-idempotency-exempt: >-
        The ledger key is composed from payoutId and is UNIQUE; a redelivered bank result collides.
      x-error-codes: [validation-failed, invalid-amount, conflict]

  # -------------------------------------------------------------------------------------------
  # Admin
  # -------------------------------------------------------------------------------------------
  /v1/wallet/admin/voucher-discount-tiers:
    get:
      operationId: adminListVoucherDiscountTiers
      summary: List bulk-voucher discount tiers with usage.
      description: |
        US-9A.15, Admin Portal. Adds per-tier purchase counts and value to the tier table, which
        is what makes the reseller margin visible to Finance.
      tags: [wallet-admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tiers with usage.
          content:
            application/json:
              schema:
                type: object
                required: [tiers]
                properties:
                  tiers:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/VoucherDiscountTier'
                        - type: object
                          properties:
                            purchaseCount:
                              type: integer
                              format: int32
                              minimum: 0
                            purchasedValueMinor:
                              type: integer
                              format: int64
                              minimum: 0
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden]
    put:
      operationId: adminUpdateVoucherDiscountTiers
      summary: Set the bulk-voucher discount per denomination.
      description: |
        Admin Portal Config. Functionally identical to subscription-svc's
        `PUT /v1/admin/voucher-discount-tiers`; **both spellings appear in D3' Part 2** and both
        are landed so neither route table is silently dropped. One should be retired — see the
        C007 handoff. Audited (D-35).
      tags: [wallet-admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tiers]
              properties:
                tiers:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/VoucherDiscountTier'
      responses:
        '200':
          description: Tiers after the update.
          content:
            application/json:
              schema:
                type: object
                required: [tiers]
                properties:
                  tiers:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoucherDiscountTier'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
    hmacSignature:
      $ref: './_shared.yaml#/components/securitySchemes/hmacSignature'
    mtls:
      $ref: './_shared.yaml#/components/securitySchemes/mtls'

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    FleetId:
      name: fleetId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

    TransferId:
      name: transferId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    Wallet:
      type: object
      required: [userId, balanceMinor, availableMinor, currency]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        balanceMinor:
          type: integer
          format: int64
          minimum: 0
        availableMinor:
          type: integer
          format: int64
          minimum: 0
          description: Balance net of outstanding accrued debt (cross-trip penalties, D-05).
        outstandingDebtMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    WalletTransaction:
      type: object
      required: [transactionId, entryId, kind, amountMinor, currency, balanceAfterMinor, occurredAt]
      properties:
        transactionId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        entryId:
          description: The `billing.journal_entries` row this line projects; the dedupe key.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          description: Ledger entry kind, e.g. `topup`, `daily_fee`, `credit_transfer`, `tip_payout`.
        amountMinor:
          type: integer
          format: int64
          description: Signed — a debit is negative. This is one of the ledger columns §0 exempts from the non-negative rule.
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        balanceAfterMinor:
          type: integer
          format: int64
          minimum: 0
        reference:
          type: string
          description: Ride, transfer or purchase this line came from.
        occurredAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    TransferRow:
      type: object
      required: [transferId, counterpartyDriverId, amountMinor, currency, direction, status, createdAt]
      properties:
        transferId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyDriverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        counterpartyName:
          type: string
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        direction:
          type: string
          enum: [sent, received]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    Topup:
      type: object
      required: [topupId, state, amountMinor, currency]
      properties:
        topupId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        state:
          type: string
          enum: [Pending, Succeeded, Failed]
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        redirectUrl:
          type: string
          format: uri
          description: OnePay hosted page.
        sessionToken:
          type: string
        paymentLink:
          type: string
          format: uri
          description: LankaQR "Pay" deep link into the bank app (AL-15).
        qrPayload:
          type: string
          description: LankaQR fallback when the deep link does not resolve.

    TopupCallback:
      type: object
      required: [providerTransactionId, status]
      properties:
        providerTransactionId:
          type: string
          maxLength: 128
        topupId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          type: string
          enum: [SUCCESS, FAILED, PENDING]
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        raw:
          type: object
          additionalProperties: true

    VoucherPurchase:
      type: object
      description: |
        What a bulk-credit purchase did. `paidMinor` is the discounted price and `creditedMinor` is
        the face value — the gap is the buyer's margin when they pass the credit on at par (AL-01).
      required: [purchaseId, denominationMinor, discountBps, paidMinor, creditedMinor, currency, balanceAfterMinor, createdAt]
      properties:
        purchaseId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        denominationMinor:
          type: integer
          format: int64
          minimum: 1
        discountBps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
        paidMinor:
          type: integer
          format: int64
          minimum: 0
        creditedMinor:
          type: integer
          format: int64
          minimum: 1
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        balanceAfterMinor:
          type: integer
          format: int64
          minimum: 0
        entryId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    LedgerPostingRequest:
      type: object
      description: |
        One balanced entry, requested by the service that owns the *reason* for it. The amount is
        unsigned — the route says which direction it moves.
      required: [amountMinor, kind, idempotencyKey]
      properties:
        amountMinor:
          type: integer
          format: int64
          minimum: 1
        kind:
          type: string
          description: A `billing.journal_entries.kind` this caller is allowed to post (see the operation).
          enum: [daily_fee, penalty_settle, trip_payment, tip_payout, payment_refund, overpaid_reversal, adjustment]
        idempotencyKey:
          type: string
          maxLength: 200
          description: Composed from the business fact, never random. Becomes the ledger's own unique key.
        description:
          type: string
          maxLength: 500
        reference:
          type: string
          maxLength: 128
          description: Ride, penalty or fee id this posting settles, for the driver's history line.

    LedgerPostingResult:
      type: object
      required: [entryId, accountId, amountMinor, balanceAfterMinor, replayed]
      properties:
        entryId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        accountId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        amountMinor:
          description: Signed as it was posted to this account — a debit is negative.
          type: integer
          format: int64
        balanceAfterMinor:
          type: integer
          format: int64
        replayed:
          type: boolean
          description: True when the idempotency key had already been used and nothing new was posted.

    LedgerAccount:
      type: object
      required: [accountId, ownerId, ownerType, currency, balanceMinor]
      description: |
        A wallet-owning ledger account, resolved or created. **Δ C060.**
      properties:
        accountId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        ownerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        ownerType:
          type: string
          enum: [driver, fleet]
          description: |
            `billing.accounts.owner_type` (§10). There is no `reseller` (AL-01); `platform` and
            `suspense` are the platform's own singletons and are never resolved through this route.
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        balanceMinor:
          type: integer
          format: int64
          description: Signed per §0 — a ledger balance may be negative.

    VoucherDiscountTier:
      type: object
      required: [denominationMinor, discountBps, active]
      properties:
        denominationMinor:
          type: integer
          format: int64
          minimum: 1
        discountBps:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: 'Basis points; `1000` = 10%.'
        active:
          type: boolean
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
