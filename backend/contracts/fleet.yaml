        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-owner, not-found, conflict]

  # -------------------------------------------------------------------------------------------
  # Internal plane — the Verification Officer's decisions, as admin-bff drives them (Δ C058)
  #
  # AL-39 states the officer's routes on admin-bff:
  #   GET  /v1/admin/verification/queues/fleet-org
  #   GET  /v1/admin/verification/org/{orgId}
  #   POST /v1/admin/verification/{subjectId}/approve | /reject
  # admin-bff is a BFF — it holds no fleet tables, and its own description has approving an org
  # "set the payout profile to `verified` (AL-49)", which is a write on
  # `registry.fleet_payout_profiles`. These four are what it forwards to, and they are what make
  # AL-39's fleet-org subject implementable at all.
  #
  # D3' §0 puts the whole `/v1/internal/**` family on service-to-service mTLS and the gateway
  # refuses the prefix at the edge (C008); until the mesh lands (C042) the hop carries a shared
  # secret in `X-MageRide-Internal-Key`, and without it fleet-svc does not map the family at all.
  # No route here checks a `verification_officer` role: it never sees the officer's bearer.
  # admin-bff does, RBAC-gated deny-by-default, and passes the resolved `officerId` on the body —
  # which is also what `audit.events` records (D-35). Same split as registry-svc's
  # `/v1/internal/vehicles/**` and support-svc's `/v1/internal/support/**`.
  # -------------------------------------------------------------------------------------------
  /v1/internal/fleets/{fleetId}/vehicles/{vehicleId}:
    get:
      operationId: getInternalFleetVehicleVerification
      summary: One fleet vehicle and its AL-50 document slots, for the officer's queue detail.
      description: |
        **Δ C059.** AL-50 states the approval gate on registry-svc — "registry-svc blocks
        `status='APPROVED'` until every required doc is verified" — and registry-svc's approval path
        is AL-30's four-step Mode C wizard: it refuses a Mode A/B vehicle outright and derives its
        verdict from `registry.onboarding_steps`, a table a fleet vehicle has no rows in. The
        sentence therefore names a service that structurally cannot hold the gate for the vehicles
        it is about. These three routes are where it lives — same column, same effect, and the same
        split C058 made for the organisation itself.
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: The vehicle and its slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVehicleVerification'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, vehicle-not-found]

  /v1/internal/fleets/{fleetId}/vehicles/{vehicleId}/approve:
    post:
      operationId: approveInternalFleetVehicle
      summary: Approve a fleet vehicle.
      description: |
        **Δ C059.** Refused **`409 documents-incomplete`** while any slot the vehicle's mode requires
        is `missing` or `pending`: registration, insurance and revenue licence for every vehicle,
        plus the route permit for Mode A (US-27.3). The slots are re-derived inside the transaction
        that writes the status, so a permit that lapsed while the queue item sat there stops the
        approval.

        `officerId` is on the body because this service never sees the officer's bearer — admin-bff
        resolves it, and it is what `audit.events` records (D-35).
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId]
              properties:
                officerId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVehicleVerification'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, vehicle-not-found, documents-incomplete]

  /v1/internal/fleets/{fleetId}/vehicles/{vehicleId}/reject:
    post:
      operationId: rejectInternalFleetVehicle
      summary: Reject a fleet vehicle, with a reason.
      description: |
        **Δ C059.** Ungated: an officer refusing a vehicle because its insurance is a photograph of
        a different vehicle must not be told they cannot, on the grounds that the insurance is not
        verified. The reason is required — US-2.15's column exists so the operator can be told what
        to fix.
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId, reason]
              properties:
                officerId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVehicleVerification'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, vehicle-not-found]

  /v1/internal/fleets/queue:
    get:
      operationId: listInternalFleetOrgQueue
      summary: Fleet organisations awaiting verification.
      description: |
        Backs `GET /v1/admin/verification/queues/fleet-org`. Oldest application first — a queue is
        worked in the order people applied. `payoutProfileStatus` is the **latest** version's, not
        "is there a verified one", so an org whose verified profile has just been edited appears
        here as pending, which is the whole of AL-49's "any edit re-triggers verification".
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - name: status
          in: query
          required: false
          description: Defaults to `PENDING`.
          schema:
            $ref: '#/components/schemas/FleetStatus'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Queue page.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetOrgQueueRow'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  /v1/internal/fleets/{fleetId}:
    get:
      operationId: getInternalFleetVerification
      summary: Fleet-org verification detail — KYC, payout profile and evidence.
      description: |
        Backs `GET /v1/admin/verification/org/{orgId}`. `documents[]` carries the AL-49 payout
        uploads (`bank_statement`, `passbook_first_page`, `lankaqr_code`); the **signed** thumbnail
        and full URLs US-24.8 asks for are added by admin-bff, which holds the signing key.
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: Verification detail.
          content:
            application/json:
              schema:
                type: object
                required: [kyc, documents]
                properties:
                  kyc:
                    $ref: '#/components/schemas/Fleet'
                  payoutProfileStatus:
                    $ref: '#/components/schemas/PayoutProfileStatus'
                  payoutProfile:
                    $ref: '#/components/schemas/PayoutProfile'
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayoutDocumentRef'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, fleet-not-found]

  /v1/internal/fleets/{fleetId}/approve:
    post:
      operationId: approveInternalFleetOrg
      summary: Approve the organisation and verify its payout profile.
      description: |
        Backs `POST /v1/admin/verification/{subjectId}/approve` for the fleet-org subject. One
        decision, one transaction, both rows: the org goes `APPROVED` and any
        `pending_verification` payout version becomes `verified`, superseding the incumbent —
        `ux_payout_profile_verified` admits exactly one verified row per org.

        **Not once-only.** An APPROVED organisation whose owner edited a verified payout profile is
        back on the queue with a pending version; approving again leaves the org APPROVED and
        decides the new version. An approve with nothing pending re-stamps nothing.
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId]
              properties:
                officerId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVerificationDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-not-found]

  /v1/internal/fleets/{fleetId}/reject:
    post:
      operationId: rejectInternalFleetOrg
      summary: Reject the organisation, with a reason.
      description: |
        Backs `POST /v1/admin/verification/{subjectId}/reject`. The reason is mandatory and is
        surfaced verbatim to the applicant (US-2.15's rule, applied to the org subject).

        A rejection **never disturbs an incumbent verified payout profile**: BR-31.1's mismatched
        account-holder name is a reason to refuse the *edit*, not a reason to stop an organisation
        collecting against details an officer already approved.
      tags: [fleets]
      security:
        - mtls: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [officerId, reason]
              properties:
                officerId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                reason:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVerificationDecision'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-not-found]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
    mtls:
      $ref: './_shared.yaml#/components/securitySchemes/mtls'

  parameters:
    FleetId:
      name: fleetId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    SubscriberId:
      name: subscriberId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        $ref: './_shared.yaml#/components/schemas/Ulid'

  schemas:
    FleetStatus:
      type: string
      description: |
        `registry.fleets.status` (migration 0301, server_db_schema.md §2). **Δ C058:** `SUSPENDED`
        was removed — the CHECK admits these three only, and nothing in D3', D5' or URD Epic 13
        suspends an *organisation* (the platform suspends vehicles and drivers, US-14.3). A status
        the API could return and the row could not hold is a 500 waiting for the first operator who
        tries it.
      enum: [PENDING, APPROVED, REJECTED]

    FleetMember:
      type: object
      description: |
        A seat in the organisation (`iam.fleet_members`, AL-03). `memberId` is the person's
        `iam.users.id`: the membership has a composite primary key and no surrogate id, and the
        user id is what the token's `sub`, an assignment and an audit row already name them by.
      required: [memberId, fleetRole]
      properties:
        memberId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        email:
          type: string
          format: email
        name:
          type: string
        fleetRole:
          $ref: './_shared.yaml#/components/schemas/FleetRole'

    Fleet:
      type: object
      required: [fleetId, name, status]
      properties:
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        registrationNo:
          type: string
        contactPhone:
          $ref: './_shared.yaml#/components/schemas/PhoneE164'
        contactEmail:
          type: string
          format: email
        address:
          type: string
        status:
          $ref: '#/components/schemas/FleetStatus'
        rejectionReason:
          type: string
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    PayoutProfileStatus:
      type: string
      description: |
        `registry.fleet_payout_profiles.status`. **Δ C058:** `superseded` was added — §26 makes the
        table versioned *and* admits one verified row per org
        (`ux_payout_profile_verified`), so when an officer approves an edit the incumbent has to
        leave `verified` and no printed status could carry it: `rejected` is a decision nobody took
        and `pending_verification` would put a superseded row back on the queue. See migration 0313.
      enum: [pending_verification, verified, rejected, superseded]

    PayoutDocumentRef:
      type: object
      description: One AL-49 evidence upload (`docs.uploads`), as the officer's queue detail lists it.
      required: [docId, kind]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [bank_statement, passbook_first_page, lankaqr_code]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    FleetOrgQueueRow:
      type: object
      description: One organisation waiting on the Verification Officer (AL-39, SCR-AP-003).
      required: [fleetId, name, status]
      properties:
        fleetId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        registrationNo:
          type: string
        contactPhone:
          $ref: './_shared.yaml#/components/schemas/PhoneE164'
        status:
          $ref: '#/components/schemas/FleetStatus'
        payoutProfileStatus:
          $ref: '#/components/schemas/PayoutProfileStatus'
        documentCount:
          type: integer
          format: int32
          minimum: 0
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    FleetVerificationDecision:
      type: object
      description: What an officer's approve or reject produced — the org, and the payout version it decided.
      required: [fleet]
      properties:
        fleet:
          $ref: '#/components/schemas/Fleet'
        payoutProfile:
          $ref: '#/components/schemas/PayoutProfile'

    PayoutProfile:
      type: object
      required: [bank, branch, accountNo, accountHolderName, status]
      properties:
        bank:
          type: string
        branch:
          type: string
        accountNo:
          type: string
        accountHolderName:
          type: string
        lankaqrDocId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        proofDocId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        status:
          $ref: '#/components/schemas/PayoutProfileStatus'
        rejectionReason:
          type: string
        verifiedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    ModeBBilling:
      type: string
      description: |
        "Service payment" in the UI (AL-51); the field name is intentionally unchanged for API
        stability. Matches the `registry.vehicles.mode_b_billing` CHECK (C003).
      enum: [paid, free]

    FleetVehicle:
      type: object
      required: [vehicleId, registrationNumber, vehicleType, mode, status]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        registrationNumber:
          type: string
        vehicleType:
          $ref: './_shared.yaml#/components/schemas/VehicleType'
        mode:
          type: string
          enum: [A, B]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, DEACTIVATED]
        docsStatus:
          type: string
          description: '`docs_pending` is the state a bulk-CSV row starts in (AL-50).'
          enum: [docs_pending, docs_complete]
        modeBBilling:
          $ref: '#/components/schemas/ModeBBilling'
        defaultMonthlyFareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    VehicleDocumentSlot:
      type: object
      required: [kind, status]
      properties:
        docId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          description: Stored kind — matches the `registry.documents.kind` CHECK (C003).
          enum: [registration, insurance, revenue_license, permit]
        required:
          type: boolean
          description: |
            **Δ C059.** Whether AL-50 makes this slot mandatory for *this* vehicle. The route permit
            is required for Mode A and optional for Mode B, so the same slot answers differently on
            two vehicles and a portal cannot derive it from `kind` alone.
        status:
          type: string
          enum: [verified, pending, missing]
        expiresAt:
          type: string
          format: date
        thumbUrl:
          type: string
          format: uri
        fullUrl:
          type: string
          format: uri
        fields:
          type: array
          items:
            $ref: './_shared.yaml#/components/schemas/ExtractedField'

    Assignment:
      type: object
      description: |
        A time-bounded driver assignment (US-13.2, AL-23). **Δ C059:** the driver's name and phone,
        the plate, `revokedAt` and `active` were added — SCR-FP-005 renders all five and a client
        cannot derive `active` without knowing the server's clock.
      required: [assignmentId, driverId, vehicleId, from, active]
      properties:
        assignmentId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        driverId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        driverName:
          type: string
        driverPhone:
          $ref: './_shared.yaml#/components/schemas/PhoneE164'
        registrationNumber:
          type: string
        from:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        to:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        revokedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        active:
          type: boolean
          description: |
            The validity window evaluated by the database at read time. US-13.9's "auto-expires" is
            this going false with nothing having been written and nobody having pressed anything.

    FleetSchedule:
      type: object
      description: |
        A per-vehicle scheduled departure (US-13.11). **Δ C059:** `status` and `alarmRaisedAt` were
        added — SCR-FP-008 has to show which departures were made, which were missed, and whether
        anybody was told.
      required: [scheduleId, vehicleId, departAt, status]
      properties:
        scheduleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        routeId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        departAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        notStartedAlarmMinutes:
          type: integer
          format: int32
          minimum: 1
        status:
          type: string
          description: |
            `MISSED` is terminal for the alarm and not for the journey: a bus that leaves forty
            minutes late still leaves, and the operator has already been told.
          enum: [SCHEDULED, STARTED, MISSED, CANCELLED]
        alarmRaisedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    BulkVehicleJob:
      type: object
      description: '**Δ C059** — one CSV import (US-13.1), and the report it can be read back from.'
      required: [jobId, totalRows, importedRows, failedRows, status]
      properties:
        jobId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        totalRows:
          type: integer
          format: int32
          minimum: 0
        importedRows:
          type: integer
          format: int32
          minimum: 0
        failedRows:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum: [PROCESSING, COMPLETED, FAILED]
        errorReportUrl:
          type: string
          format: uri
          description: Present only when `failedRows` is greater than zero. HMAC-signed and expiring.

    FleetGeofence:
      type: object
      description: '**Δ C059** — one stored operational polygon (`spatial.geofences`, US-13.5).'
      required: [geofenceId, polygon]
      properties:
        geofenceId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        polygon:
          type: array
          minItems: 4
          items:
            $ref: './_shared.yaml#/components/schemas/GeoPoint'

    FleetVehicleVerification:
      type: object
      description: '**Δ C059** — what the Verification Officer reads and decides on, per vehicle.'
      required: [vehicle, docsStatus, documents]
      properties:
        vehicle:
          $ref: '#/components/schemas/FleetVehicle'
        docsStatus:
          type: string
          enum: [docs_pending, docs_complete]
        documents:
          type: array
          items:
            $ref: '#/components/schemas/VehicleDocumentSlot'

    FleetVehiclePosition:
      type: object
      required: [vehicleId, lat, lng, sampleTs]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        registrationNumber:
          type: string
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
        heading:
          type: integer
          format: int32
          minimum: 0
          maximum: 359
        speedMps:
          type: number
          format: double
          minimum: 0
        sampleTs:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    VehicleAnalytics:
      type: object
      required: [vehicleId, tripCount, distanceKm]
      properties:
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        registrationNumber:
          type: string
        tripCount:
          type: integer
          format: int32
          minimum: 0
        distanceKm:
          type: number
          format: double
          minimum: 0
        activeHours:
          type: number
          format: double
          minimum: 0
        utilisationPct:
          type: number
          format: double
          minimum: 0
          maximum: 100
        earningsMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'

    FleetAlert:
      type: object
      required: [alertId, kind, vehicleId, raisedAt]
      properties:
        alertId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        kind:
          type: string
          enum: [route_deviation, geofence_enter, geofence_exit]
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        geofenceName:
          type: string
        raisedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    FleetInvoice:
      type: object
      required: [invoiceId, periodMonth, amountMinor, currency, status]
      properties:
        invoiceId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        periodMonth:
          description: Always the first of the month.
          allOf:
            - $ref: './_shared.yaml#/components/schemas/BusinessDate'
        periodMonthTzAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        vehicleCount:
          type: integer
          format: int32
          minimum: 0
        amountMinor:
          type: integer
          format: int64
          minimum: 0
          description: Zero when `status` is `FREE` — the first month carries no amount (D-13).
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        status:
          type: string
          enum: [FREE, DUE, PAID, OVERDUE]
        dueAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    AccessRequest:
      type: object
      required: [requestId, vehicleId, passengerId, status, createdAt]
      properties:
        requestId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        vehicleId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        passengerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        passengerName:
          type: string
        passengerMobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        status:
          type: string
          enum: [pending, accepted, rejected]
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'

    SubscriberRow:
      type: object
      required: [subscriberId, passengerId, billing, status, muted]
      properties:
        subscriberId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        passengerId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        name:
          type: string
        mobileMasked:
          $ref: './_shared.yaml#/components/schemas/PhoneMasked'
        billing:
          $ref: '#/components/schemas/ModeBBilling'
        monthlyFareMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        cycle:
          type: string
          enum: [month_first, join_anniversary]
        thisMonthStatus:
          type: string
          enum: [paid, unpaid, pending_verification]
        muted:
          type: boolean
        status:
          type: string
          enum: [active, unsubscribed]

    SubscriptionPaymentRow:
      type: object
      required: [paymentId, subscriptionId, method, amountMinor, currency, status, periodMonth]
      properties:
        paymentId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        subscriptionId:
          $ref: './_shared.yaml#/components/schemas/Ulid'
        method:
          type: string
          enum: [lankaqr_deeplink, lankaqr_scan, onepay, online_transfer, cash]
        amountMinor:
          type: integer
          format: int64
          minimum: 0
        currency:
          $ref: './_shared.yaml#/components/schemas/Currency'
        status:
          type: string
          enum: [initiated, pending_verification, paid, failed]
        periodMonth:
          $ref: './_shared.yaml#/components/schemas/BusinessDate'
        slipUrl:
          type: string
          format: uri
        paidAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
