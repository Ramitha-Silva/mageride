openapi: 3.1.0

# =============================================================================================
# fleet-svc — Fleet Portal (fleet.mageride.lk), Phase 1 per AL-03
# Source: specs/D3_mageride_api_contracts.md "fleet-svc (Phase 1, AL-03)"
#         + Δ 2026-06-21 "fleet-svc (Fleet Portal proxies, RLS-scoped to org)"
#         + Δ 2026-07-18 "fleet-svc — org bank & payout profile (AL-49)" and
#           "fleet-svc — per-vehicle document slots (AL-50)"
#         + ADD Appendix C fleet-svc
#
# Bulk **tracker** onboarding (`POST /v1/fleets/{fleetId}/trackers/bulk` and its job poll) belongs
# to provisioning-svc — D3' Part 2 places it there, and this file must not duplicate it. What
# lives here is the single owner-facing `POST /v1/fleets/{fleetId}/trackers/bind` (US-13.12).
#
# `GET /v1/fleets/{fleetId}/health` and the `TrackerHealth` schema **moved to
# `fleet-health.yaml`** (C044). Same reason as the bulk route: D3' attributes the operation to
# fleet-health-svc in the very line that lists it under fleet-svc, and the gateway resolves a
# cluster from the contract that declares an operation — so declaring it here routes it to a
# service that does not implement it. Do not re-add it from an earlier-dated spec line.
#
# Δ C058 (fleet-svc-org), each raised in the build/progress.md handoff:
#   + GET  /v1/fleets/{fleetId}/members          — members could be provisioned and never read back,
#                                                  so SCR-FP-002's team list had no source.
#   + /v1/internal/fleets/**                     — AL-39 states the Verification Officer's routes on
#                                                  admin-bff, which is a BFF and holds no fleet
#                                                  tables; its own description has approving an org
#                                                  set `payout_profiles.status='verified'`, which is
#                                                  a write on registry.fleet_payout_profiles. These
#                                                  four are what it forwards to.
#   ~ FleetStatus lost `SUSPENDED`               — `registry.fleets.status CHECK` (migration 0301,
#                                                  server_db_schema.md §2) admits PENDING, APPROVED
#                                                  and REJECTED only; nothing in D3'/D5'/URD Epic 13
#                                                  suspends an organisation. A status the API could
#                                                  return and the row could not hold is a 500.
#   ~ seven org error codes                      — see `_shared.yaml`'s ErrorCode enum.
#
# Δ C059 (fleet-svc-fleet-ops), each raised in the build/progress.md handoff:
#   + GET  /v1/fleets/{fleetId}/vehicles         — vehicles could be added, classified and removed
#                                                  and never listed, so SCR-FP-004's status table
#                                                  had no source.
#   + GET  …/vehicles/bulk/{jobId}               — the 202 returns a `jobId` and nothing could read
#                                                  it back; a job that survives only inside the
#                                                  response that created it cannot be polled.
#   + GET  …/vehicles/bulk/{jobId}/errors.csv    — the `errorReportUrl` the same 202 promises. There
#                                                  is no object storage in front of this service
#                                                  (C125), so the link is HMAC-signed and served
#                                                  here — provisioning-svc's exact arrangement.
#   + GET  /v1/fleets/{fleetId}/assignments      — SCR-FP-005 renders "assignment history" and the
#                                                  contract had the two writes and no read.
#   + GET  /v1/fleets/{fleetId}/schedules        — the same gap for SCR-FP-008, which also has to
#                                                  show the departures whose alarm has fired.
#   + GET  /v1/fleets/{fleetId}/geofences        — PUT replaced a set nothing could read back.
#   + /v1/internal/fleets/{fleetId}/vehicles/**  — AL-50's approval gate. It states the rule on
#                                                  registry-svc, whose approval path is AL-30's
#                                                  Mode C wizard: that service refuses a Mode A/B
#                                                  vehicle outright and derives its verdict from
#                                                  `registry.onboarding_steps`, which a fleet
#                                                  vehicle has no rows in. These three are where the
#                                                  gate can actually live.
#   ~ assignDriverToVehicle gained `driverPhone` — US-13.2 assigns "by User ID / phone" and the body
#                                                  typed `driverId` alone.
#   ~ Assignment / FleetSchedule / VehicleDocumentSlot gained the fields their screens render.
#   ~ two error codes                            — `driver-not-found`, `documents-incomplete`.
# =============================================================================================

info:
  title: MageRide fleet-svc
  version: 1.0.0
  summary: Fleet organisations, their Mode A/B vehicles, drivers, scheduling, billing and payouts.
  description: |
    Every route is **org-scoped by row-level security** and requires an approved organisation:
    a `PENDING` org may read but not mutate (US-13.A7). The caller's `fleet_role` claim is
    `owner`, `manager` or `viewer`, evaluated deny-by-default (AL-03/AL-06).

    **Fleet vehicles are Mode A/B only — never Mode C.** A driver's own standby vehicle is
    onboarded in the Driver App through registry-svc.

    **Payout profile (AL-49).** Any edit re-triggers verification (`status='pending_verification'`)
    and the profile rides the existing fleet-org verification queue. Classifying a vehicle as
    Paid while the org profile is unverified is **`409 payout-profile-not-verified`** (BR-31.1) —
    that gate is the reason the profile exists.

    **Per-vehicle documents (AL-50).** Required set: `registration` + `insurance` +
    `revenue_license` for all modes, **plus `permit` for Mode A**. registry-svc blocks
    `status='APPROVED'` until every required document is verified (extends AL-10). Vehicles
    created by bulk CSV start `docs_pending`; documents arrive per vehicle afterwards.
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: fleets
    description: Organisation registration, members and payout profile.
  - name: fleet-vehicles
    description: Fleet vehicles, classification, documents and driver assignment.
  - name: fleet-ops
    description: Scheduling, live map, tracker health, analytics and alerts.
  - name: fleet-billing
    description: Monthly invoicing and the fleet wallet.
  - name: fleet-subscriptions
    description: Org-scoped proxies over the Mode B subscription surface (Epic 23).

paths:

  # -------------------------------------------------------------------------------------------
  # Organisation
  # -------------------------------------------------------------------------------------------
  /v1/fleets:
    post:
      operationId: registerFleet
      summary: Register a fleet organisation.
      description: |
        US-13.A7. Creates the org in `PENDING`; a Verification Officer must approve it before any
        non-read operation succeeds. The signing-in user becomes its `owner`.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, registrationNo, contactPhone]
              properties:
                name:
                  type: string
                  maxLength: 200
                registrationNo:
                  type: string
                  maxLength: 64
                  description: Business registration number.
                contactPhone:
                  $ref: './_shared.yaml#/components/schemas/PhoneE164'
                contactEmail:
                  type: string
                  format: email
                address:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Organisation created, pending verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fleet'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, business-registration-exists]

  /v1/fleets/{fleetId}:
    get:
      operationId: getFleet
      summary: Read the organisation.
      description: Any org sub-role may read; the response includes the verification status.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: Organisation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fleet'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-fleet-member, fleet-not-found]

  /v1/fleets/{fleetId}/members:
    get:
      operationId: listFleetMembers
      summary: The organisation's team.
      description: |
        **Δ C058.** US-13.A5 provisions Manager and Viewer sub-users and SCR-FP-002 lists them;
        without this route a member could be created and never read back. Any sub-role may read.
        Ordered Owner, Manager, Viewer — the list renders as an org chart, not as an audit trail.

        No phone number: `iam.fleet_members_fleet` (migration 1806) does not project one. A
        sub-user's mobile is their own, and an org's team list is not a reason to hand it over.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: The organisation's members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetMember'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-fleet-member, fleet-not-found]
    post:
      operationId: addFleetMember
      summary: Provision a Manager or Viewer sub-user.
      description: |
        US-13.A5. Owner only. The invited user signs in on the Fleet Portal with
        Email+Password / Google / Apple (AL-07) and carries the `fleet_role` claim granted here.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fleetRole]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  maxLength: 200
                fleetRole:
                  $ref: './_shared.yaml#/components/schemas/FleetRole'
      responses:
        '201':
          description: Member provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetMember'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-role-insufficient, fleet-member-exists]

  /v1/fleets/{fleetId}/payout-profile:
    get:
      operationId: getPayoutProfile
      summary: Read the org bank and payout profile.
      description: |
        AL-49, SCR-FP-002a. Owner only. `status` gates Paid classification and the passenger pay
        sheet: only a `verified` profile is ever served as `payTo` (subscription-svc).
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: Payout profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutProfile'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, fleet-role-insufficient, payout-profile-not-found]
    put:
      operationId: upsertPayoutProfile
      summary: Create or edit the org bank and payout profile.
      description: |
        AL-49. **Any edit re-triggers verification** — the row is versioned and its status goes
        back to `pending_verification`. Existing Paid subscriptions keep collecting against the
        **last verified snapshot** until the new one is approved, so an edit never silently
        redirects money.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank, branch, accountNo, accountHolderName]
              properties:
                bank:
                  type: string
                  maxLength: 120
                branch:
                  type: string
                  maxLength: 120
                accountNo:
                  type: string
                  maxLength: 40
                accountHolderName:
                  type: string
                  maxLength: 200
      responses:
        '200':
          description: Profile saved, pending verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutProfile'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-role-insufficient, fleet-not-found]

  /v1/fleets/{fleetId}/payout-profile/documents:
    post:
      operationId: uploadPayoutProfileDocument
      summary: Upload a payout-profile document.
      description: |
        AL-49. Lands in `docs.uploads` and appears in the fleet-org verification queue's
        `documents[]` (`GET /v1/admin/verification/org/{orgId}`), where the officer approves or
        rejects the profile.
      tags: [fleets]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [bank_statement, passbook_first_page, lankaqr_code]
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Document stored.
          content:
            application/json:
              schema:
                type: object
                required: [docId, kind]
                properties:
                  docId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  kind:
                    type: string
                    enum: [bank_statement, passbook_first_page, lankaqr_code]
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '413': { $ref: './_shared.yaml#/components/responses/PayloadTooLarge' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-role-insufficient, payout-profile-not-found, payload-too-large]

  # -------------------------------------------------------------------------------------------
  # Vehicles
  # -------------------------------------------------------------------------------------------
  /v1/fleets/{fleetId}/vehicles:
    get:
      operationId: listFleetVehicles
      summary: The organisation's vehicle roster.
      description: |
        **Δ C059.** SCR-FP-004's status table — plate, type, mode, approval status, Service payment
        and the AL-50 `docsStatus`. Any sub-role: a Viewer is defined as read-only monitoring
        (US-13.A5), and a roster is what they monitor.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: The roster.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetVehicle'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, fleet-not-found]
    post:
      operationId: addFleetVehicle
      summary: Add a Mode A or Mode B vehicle to the fleet.
      description: |
        **Mode A/B only — a Mode C body is `403 mode-not-allowed`.** A Mode B vehicle may carry its
        "Service payment" classification and default monthly fare inline (AL-24 item 16b);
        classifying it Paid still requires a verified payout profile (AL-49).
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [registrationNumber, vehicleType, mode]
              properties:
                registrationNumber:
                  type: string
                  maxLength: 32
                vehicleType:
                  $ref: './_shared.yaml#/components/schemas/VehicleType'
                mode:
                  type: string
                  enum: [A, B]
                modeBBilling:
                  $ref: '#/components/schemas/ModeBBilling'
                defaultMonthlyFareMinor:
                  type: integer
                  format: int64
                  minimum: 0
      responses:
        '201':
          description: Vehicle added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVehicle'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-vehicle-type, unauthorized, mode-not-allowed, registration-exists, payout-profile-not-verified]

  /v1/fleets/{fleetId}/vehicles/bulk:
    post:
      operationId: bulkAddFleetVehicles
      summary: Bulk-onboard fleet vehicles from a CSV.
      description: |
        US-13.1. Rows are created **`docs_pending`** — documents arrive per vehicle through
        `POST /v1/fleets/{fleetId}/vehicles/{vehicleId}/documents` (AL-50), and no vehicle is
        approved until its required set is verified.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    `text/csv`, rows `registrationNumber,vehicleType,mode` — plus, **Δ C059**, an
                    optional `modeBBilling` and `defaultMonthlyFareMinor`, because US-13.1b captures
                    the Service payment setting "at onboarding (single & bulk CSV)". A header row is
                    optional and is recognised by content.
      responses:
        '202':
          description: |
            Imported. Every row is either imported or reported: `COMPLETED` with `failedRows > 0` is
            a partial import with a downloadable report, not a failure — `FAILED` is reserved for a
            job that could not be processed at all.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkVehicleJob'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '413': { $ref: './_shared.yaml#/components/responses/PayloadTooLarge' }
        '429': { $ref: './_shared.yaml#/components/responses/TooManyRequests' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [csv-invalid, unauthorized, forbidden, too-many-rows, bulk-in-progress]

  /v1/fleets/{fleetId}/vehicles/bulk/{jobId}:
    get:
      operationId: getBulkVehicleJob
      summary: One bulk import, as it stands.
      description: |
        **Δ C059** — the poll the 202's `Location` points at. `errorReportUrl` is present only when
        rows failed; a link that downloads an empty report is a button an operator learns nothing
        from.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkVehicleJob'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/fleets/{fleetId}/vehicles/bulk/{jobId}/errors.csv:
    get:
      operationId: downloadBulkVehicleErrorReport
      summary: The per-row error report of a bulk import.
      description: |
        **Δ C059** — the `errorReportUrl` the 202 promises, which had no route. `security: []`
        because the HMAC in the query string **is** the credential: that is what lets the Fleet
        Portal hand the link straight to a browser download, and it is the arrangement
        provisioning-svc's tracker `errors.csv` and subscription-svc's signed document links both
        take. A bad or expired signature is `404`, not `403` — the link has not proved the job
        exists, and a 403 would confirm a guessed id.

        Columns: `row,registrationNumber,vehicleType,mode,error,detail`. `error` is the same kebab
        code the single-vehicle `POST` would have raised.
      tags: [fleet-vehicles]
      security: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/JobId'
        - name: expires
          in: query
          required: true
          schema:
            type: string
        - name: signature
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The report.
          content:
            text/csv:
              schema:
                type: string
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [not-found]

  /v1/fleets/{fleetId}/vehicles/{vehicleId}:
    delete:
      operationId: removeFleetVehicle
      summary: Remove a vehicle from the fleet.
      description: |
        Ends any open driver assignment and removes the vehicle from the fleet map. Historical
        trips and telemetry keep their original `fleet_id`, which is correct for an audit trail
        (C006 decision 8).
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '204':
          description: Removed.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, vehicle-not-found, conflict]

  /v1/fleets/{fleetId}/vehicles/{vehicleId}/classification:
    put:
      operationId: setVehicleClassification
      summary: Set "Service payment" — Free or Paid — and the default monthly fare.
      description: |
        AL-24 item 16b. **Gate (BR-31.1, AL-49):** setting `paid` while the org's payout profile
        is not `verified` is **`409 payout-profile-not-verified`**.

        The UI label became "Service payment" in AL-51, but the path and the `modeBBilling` field
        are **intentionally unchanged** — a label rename is not worth a client or database
        migration.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modeBBilling]
              properties:
                modeBBilling:
                  $ref: '#/components/schemas/ModeBBilling'
                defaultMonthlyFareMinor:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Required when `modeBBilling` is `paid`.
      responses:
        '200':
          description: Classification updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetVehicle'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, fleet-not-approved, fleet-role-insufficient, vehicle-not-found, payout-profile-not-verified]

  /v1/fleets/{fleetId}/vehicles/{vehicleId}/documents:
    get:
      operationId: listVehicleDocuments
      summary: Per-vehicle document slots and their status.
      description: |
        AL-50, SCR-FP-004. Named slots with `verified | pending | missing`, expiry and the
        extracted fields. Required: `registration` + `insurance` + `revenue_license`, **plus
        `permit` for Mode A**.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
      responses:
        '200':
          description: Document slots.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleDocumentSlot'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, vehicle-not-found]
    post:
      operationId: uploadVehicleDocument
      summary: Upload a document into a named slot.
      description: |
        AL-50. Queues ocr-svc extraction. `registration_copy` maps to the stored kind
        `registration` and `route_permit` to `permit` — the wire names are the SCR-FP-004 slot
        labels, the stored names are the `registry.documents.kind` CHECK values (C003).

        A document owned by the fleet sets `fleet_id` and **must not also set `driver_id`** —
        `ck_documents_owner` is an XOR (C003 note (b)).
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: '#/components/parameters/VehicleId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind:
                  type: string
                  enum: [registration_copy, insurance, revenue_license, route_permit]
                file:
                  type: string
                  format: binary
                expiresAt:
                  type: string
                  format: date
      responses:
        '201':
          description: Document stored; OCR queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDocumentSlot'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '413': { $ref: './_shared.yaml#/components/responses/PayloadTooLarge' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, vehicle-not-found, payload-too-large]

  /v1/fleets/{fleetId}/assignments:
    post:
      operationId: assignDriverToVehicle
      summary: Assign a driver to a fleet vehicle.
      description: |
        US-13.2. Time-bounded, which is what supports temporarily hired Mode A/B drivers (AL-23).
        A driver may hold only one open assignment per vehicle at a time.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, from]
              description: |
                Exactly one of `driverId` and `driverPhone` names the driver.
              properties:
                driverId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                driverPhone:
                  description: |
                    **Δ C059.** US-13.2 assigns "by User ID / phone" and an operator standing in a
                    depot has the number, not the ULID.
                  allOf:
                    - $ref: './_shared.yaml#/components/schemas/PhoneE164'
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                from:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                to:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
      responses:
        '201':
          description: Assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assignment'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, vehicle-not-found, driver-not-found, conflict]
    get:
      operationId: listFleetAssignments
      summary: The organisation's driver assignments, active first.
      description: |
        **Δ C059.** SCR-FP-005 renders "assign/revoke drivers … assignment history" and the contract
        had the two writes and no read. `active` is the validity window evaluated by the database at
        read time — US-13.9's auto-expiry is that flag going false with nothing having been written.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - name: vehicleId
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '200':
          description: Assignments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, fleet-not-found]

  /v1/fleets/{fleetId}/assignments/{assignmentId}:
    delete:
      operationId: revokeAssignment
      summary: Revoke a driver assignment.
      description: US-13.8. Ends the assignment now; an in-flight session is left to end normally.
      tags: [fleet-vehicles]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - name: assignmentId
          in: path
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '204':
          description: Revoked.
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  # -------------------------------------------------------------------------------------------
  # Operations
  # -------------------------------------------------------------------------------------------
  /v1/fleets/{fleetId}/trackers/bind:
    post:
      operationId: bindFleetTracker
      summary: Bind a tracker to a fleet vehicle and auto-start its session.
      description: |
        US-13.12. Owner/manager. Delegates the credential mint to provisioning-svc (T-02) and, for
        a hardware-tracked Mode A vehicle, arms tracker-driven journey auto-start (AL-32) — a bus
        broadcasts irrespective of any driver app (T-11).

        Bulk IMEI onboarding is provisioning-svc's `POST /v1/fleets/{fleetId}/trackers/bulk`.
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imei, vehicleId]
              properties:
                imei:
                  type: string
                  pattern: '^\d{15}$'
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                autoStartSession:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Bound.
          content:
            application/json:
              schema:
                type: object
                required: [bindingId, imei, vehicleId]
                properties:
                  bindingId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  imei:
                    type: string
                  vehicleId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '409': { $ref: './_shared.yaml#/components/responses/Conflict' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, vehicle-not-found, imei-duplicate]

  /v1/fleets/{fleetId}/schedules:
    get:
      operationId: listFleetSchedules
      summary: The organisation's departures, soonest first.
      description: |
        **Δ C059.** SCR-FP-008 lists per-vehicle scheduled rides and has to show the ones whose
        not-started alarm has fired, which the contract gave it no way to read. Defaults to the last
        day forward, so the departure an operator is asking about is on the screen they open.
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/Timestamp'
      responses:
        '200':
          description: Departures.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetSchedule'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, fleet-not-found]
    post:
      operationId: createFleetSchedule
      summary: Schedule a ride for a fleet vehicle.
      description: |
        US-13.11. Per-vehicle scheduled departure with a **not-started alarm**: if the vehicle has
        not begun its session by the alarm offset, the fleet is notified.
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vehicleId, departAt]
              properties:
                vehicleId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                routeId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
                departAt:
                  $ref: './_shared.yaml#/components/schemas/Timestamp'
                notStartedAlarmMinutes:
                  type: integer
                  format: int32
                  minimum: 1
                  maximum: 120
                  default: 10
      responses:
        '201':
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSchedule'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, vehicle-not-found]

  /v1/fleets/{fleetId}/map:
    get:
      operationId: getFleetMap
      summary: Live positions of the fleet's vehicles.
      description: |
        US-3.24/13.3. Any sub-role. **Scoped in the database, not in the application** — the read
        goes through the `telemetry.positions_fleet` security-barrier view filtered on
        `app.fleet_id`, which is fail-closed: an unscoped connection sees zero rows rather than an
        error a caller might retry unscoped (C006 decision, resolving the RLS/compression conflict).
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: Fleet positions.
          content:
            application/json:
              schema:
                type: object
                required: [vehicles, asOf]
                properties:
                  vehicles:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetVehiclePosition'
                  asOf:
                    $ref: './_shared.yaml#/components/schemas/Timestamp'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/fleets/{fleetId}/analytics:
    get:
      operationId: getFleetAnalytics
      summary: Per-vehicle utilisation, distance and earnings.
      description: US-13.4. Periods are evaluated in **Asia/Colombo** (D-13).
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - name: from
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
        - name: to
          in: query
          required: false
          schema:
            $ref: './_shared.yaml#/components/schemas/BusinessDate'
      responses:
        '200':
          description: Analytics.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VehicleAnalytics'
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  /v1/fleets/{fleetId}/alerts:
    get:
      operationId: listFleetAlerts
      summary: Route-deviation and geofence alerts.
      description: |
        US-13.5. **Phase 3** — the contract is fixed now so the Fleet Portal can render an empty
        state without a later breaking change, but no producer emits these alerts in Phase 1.
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Alert page (empty in Phase 1).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/FleetAlert'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, not-found]

  /v1/fleets/{fleetId}/geofences:
    get:
      operationId: listFleetGeofences
      summary: The organisation's operational geofences.
      description: '**Δ C059** — the PUT replaced a set nothing could read back.'
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      responses:
        '200':
          description: Geofences.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FleetGeofence'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, forbidden, fleet-not-found]
    put:
      operationId: setFleetGeofences
      summary: Define the fleet's operational geofences.
      description: |
        ADD Appendix C. Stored in `spatial.geofences`. Consumed by the Phase 3 alerting path;
        defining them in Phase 1 costs nothing and lets an operator prepare.
      tags: [fleet-ops]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geofences]
              properties:
                geofences:
                  type: array
                  items:
                    type: object
                    required: [name, polygon]
                    properties:
                      name:
                        type: string
                        maxLength: 120
                      polygon:
                        type: array
                        minItems: 4
                        description: Closed ring; the first and last points must match.
                        items:
                          $ref: './_shared.yaml#/components/schemas/GeoPoint'
      responses:
        '200':
          description: Geofences stored.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    format: int32
                    minimum: 0
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, forbidden, not-found]

  # -------------------------------------------------------------------------------------------
  # Billing
  # -------------------------------------------------------------------------------------------
  /v1/fleets/{fleetId}/billing:
    get:
      operationId: getFleetBilling
      summary: Monthly per-Mode-B-vehicle invoices.
      description: |
        US-13.10. One invoice per Colombo month (`periodMonth` is always the first of the month —
        `ck_fleet_invoices_period_month_first`, C005 — otherwise the UNIQUE would admit two rows
        per month and the free period could be re-claimed). The **first month is free** and carries
        no amount (D-13).
      tags: [fleet-billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/Cursor'
        - $ref: './_shared.yaml#/components/parameters/Limit'
      responses:
        '200':
          description: Invoice history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: './_shared.yaml#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/FleetInvoice'
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [unauthorized, not-owner, not-found]

  /v1/fleets/{fleetId}/wallet/topup:
    post:
      operationId: topupFleetWallet
      summary: Top up the fleet wallet.
      description: |
        US-13.10b. OnePay or LankaQR only — bank transfer is not a top-up method anywhere on the
        platform (AL-05). The wallet is credited on the provider callback with a balanced
        double-entry journal credit (D-09).
      tags: [fleet-billing]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FleetId'
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor, method]
              properties:
                amountMinor:
                  type: integer
                  format: int64
                  minimum: 1
                method:
                  type: string
                  enum: [onepay, lankaqr]
                returnUrl:
                  type: string
                  format: uri
      responses:
        '200':
          description: Top-up initiated.
          content:
            application/json:
              schema:
                type: object
                required: [topupId, state, amountMinor, currency]
                properties:
                  topupId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  state:
                    type: string
                    enum: [Pending, Succeeded, Failed]
                  amountMinor:
                    type: integer
                    format: int64
                    minimum: 1
                  currency:
                    $ref: './_shared.yaml#/components/schemas/Currency'
                  redirectUrl:
                    type: string
                    format: uri
                  paymentLink:
                    type: string
                    format: uri
                  qrPayload:
                    type: string
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '402': { $ref: './_shared.yaml#/components/responses/PaymentRequired' }
        '403': { $ref: './_shared.yaml#/components/responses/Forbidden' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [invalid-amount, unauthorized, gateway-error, not-owner, not-found]

  # -------------------------------------------------------------------------------------------
  # Mode B subscription proxies (Δ 2026-06-21 items 15, 16, 17)
  # These proxy subscription-svc, scoped to the org's own vehicles by row-level security.
  # -------------------------------------------------------------------------------------------
  /v1/fleets/{fleetId}/vehicles/{vehicleId}/requests:
    get:
      operationId: listFleetVehicleRequests
      summary: Incoming Mode B access requests for one of the fleet's vehicles.
