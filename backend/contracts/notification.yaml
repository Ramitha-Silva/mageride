openapi: 3.1.0

# =============================================================================================
# notification-svc — push token registry, preferences, internal send
# Source: specs/D3_mageride_api_contracts.md "notification-svc — push (/v1/notify)"
#         + D3 Part 3 push-event list, D6' §7.4 (FCM HTTP v1 + APNs HTTP/2)
#
# notification-svc also mints the AL-44 web share tokens (package_recipient, proxy_rider,
# pickup_confirm) and SMSes them. That is deliberately **not** an endpoint: D3' Δ 2026-07-05
# says "mint-and-SMS, never returned to a client". See public-bff.yaml.
#
# Δ C051 — four changes, each argued at its operation and recorded in the C051 handoff:
#   * POST /v1/notify/ack           — E-01 is unimplementable without it. "3 s no-ack → SMS
#                                     fallback" needs the handset to be able to say it woke up,
#                                     and no document declared a route for it; with none, every
#                                     offer push on the platform falls back to SMS.
#   * send: `notificationType`      — D5' §14.4's Type decides the channel, the priority and
#                                     whether the recipient may mute it. `templateKey` alone
#                                     cannot answer any of the three: a key is wording, a type is
#                                     behaviour.
#   * send: `phones`                — D-33's SOS goes to an emergency contact
#                                     (`iam.users.emergency_contact_phone`, nobody's account) and
#                                     AL-21's package link to an unregistered recipient. A
#                                     recipients-are-user-ids body cannot address either.
#   * send: `audience`              — US-14.8's announcement had a reader (content.broadcasts)
#                                     and no way to reach a handset.
# =============================================================================================

info:
  title: MageRide notification-svc
  version: 1.0.0
  summary: FCM/APNs device tokens, per-type preferences and the internal fan-out entry point.
  description: |
    Push events (D3 Part 3): `RIDE_OFFER` (high-priority/silent, E-01), `DRIVER_ASSIGNED`,
    `DRIVER_ARRIVED`, `RIDE_CANCELLED`, `PAYMENT_CONFIRMED`, `SCHEDULED_REMINDER`,
    `DIRECTIONAL_EXPIRING` (10-minute pre-expiry, DT-08/US-10.14), `LOW_BALANCE`,
    `location_request`, `package_*`, `SOS_*`.

    Copy is resolved through content-svc so every push is delivered in the recipient's language
    (D-26). Delivery is FCM HTTP v1 batch / APNs HTTP/2 (D6' §7.4).
  contact:
    name: MageRide Platform Engineering
    url: https://mageride.lk
  license:
    name: UNLICENSED
    url: https://mageride.lk/legal/terms

servers:
  - url: https://api.mageride.lk
    description: Production gateway (DOKS Singapore)
  - url: http://localhost:8080
    description: Docker Compose dev gateway

tags:
  - name: notify
    description: Device token registration, preferences, internal send.

paths:

  /v1/notify/register-token:
    post:
      operationId: registerPushToken
      summary: Register or refresh this install's FCM/APNs token.
      description: |
        FCM and APNs reissue a token to whichever install currently owns it, so the token is
        globally unique: registering one that another install holds moves it (`ux_notif_tokens_token`,
        C005 decision 8). Without that, a reinstall would leave a dead handle receiving E-01 offers.
      tags: [notify]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform, deviceId]
              properties:
                token:
                  type: string
                  maxLength: 512
                platform:
                  type: string
                  enum: [android, ios]
                deviceId:
                  type: string
                  maxLength: 128
      responses:
        '204':
          description: Token registered.
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  /v1/notify/ack:
    post:
      operationId: acknowledgeNotification
      summary: Confirm that a device woke up on a high-priority push.
      description: |
        **Δ C051.** E-01's other half: an offer push that is not acknowledged within three seconds
        falls back to SMS (D6' §7.4). The driver app calls this from the silent data message's
        handler, with the `notificationId` the push carried in `data`.

        Idempotent by construction — the acknowledgement is a guarded `UPDATE` bound to `Sent`, so a
        repeat matches nothing — and it races a three-second deadline, which is why it is
        idempotency-exempt: answering `400 idempotency-key-required` to a handset that woke up in
        time would fire the fallback for a driver who was there.

        `404` means there was nothing left to acknowledge: the window had already closed and the SMS
        has gone, or the notification belongs to another account.
      tags: [notify]
      security:
        - bearerAuth: []
      x-idempotency-exempt: >-
        Races E-01's 3 s deadline and is idempotent by construction (guarded UPDATE bound to Sent).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationId]
              properties:
                notificationId:
                  $ref: './_shared.yaml#/components/schemas/Ulid'
      responses:
        '204':
          description: Acknowledged; no SMS fallback will be sent for this push.
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-found]

  /v1/notify/preferences:
    put:
      operationId: updateNotificationPreferences
      summary: Set per-type push preferences.
      description: |
        US-10.7. Safety-critical types (`SOS_*`, `RIDE_CANCELLED`) cannot be muted and are
        ignored if present in the body.
      tags: [notify]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              properties:
                preferences:
                  type: object
                  description: |
                    Merged into what is already set, so a client sending one switch does not clear
                    the rest. **The keys are data, not property names** — `SCHEDULED_REMINDER`, not
                    `scheduledReminder` — and are transmitted verbatim in both directions.
                  additionalProperties:
                    type: boolean
                  example:
                    SCHEDULED_REMINDER: true
                    LOW_BALANCE: false
      responses:
        '200':
          description: Effective preferences after the update.
          content:
            application/json:
              schema:
                type: object
                required: [preferences]
                properties:
                  preferences:
                    type: object
                    additionalProperties:
                      type: boolean
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized]

  /v1/internal/notify/send:
    post:
      operationId: sendNotification
      summary: Fan a templated notification out to one or more users.
      description: |
        Internal, mTLS only. Resolves the template per recipient language (D-26), batches to FCM
        HTTP v1 / APNs HTTP/2, and marks dispatch offers high-priority so they wake a backgrounded
        driver app (E-01). Accepted asynchronously — delivery receipts are not part of this call.

        **Δ C051.** `notificationType` is required and `templateKey` is now an override, because
        D5' §14.4's Type is what decides the channel, the priority, whether the recipient may mute
        it (US-10.7) and whether it goes through both SMS gateways in parallel (D-33). `priority`
        and `silent` are gone for the same reason: a caller cannot make a message high-priority, and
        letting one would put E-01's Doze-bypassing budget in the hands of every service on the
        platform.

        At least one of `recipients`, `phones` and `audience` is required.
      tags: [notify]
      security:
        - mtls: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notificationType]
              properties:
                notificationType:
                  type: string
                  description: |
                    D5' §14.4's Type — `RIDE_OFFER`, `DRIVER_ASSIGNED`, `SOS_TRIGGERED`,
                    `location_request`, … The full set is `NotificationCatalogue`.
                  pattern: '^[A-Za-z0-9_]+$'
                templateKey:
                  type: string
                  description: |
                    Overrides the type's own template. Only for a caller that has already resolved
                    the wording — a US-14.8 broadcast carries its own trilingual message.
                  pattern: '^[a-z0-9]+(_[a-z0-9]+)*$'
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                phones:
                  type: array
                  description: |
                    E.164 numbers, for recipients with no account: D-33's emergency contact and
                    AL-21's unregistered package recipient. A number that belongs to an account is
                    resolved to it, so the owner's language and preferences apply.
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: string
                    pattern: '^\+94[0-9]{9}$'
                audience:
                  type: object
                  description: |
                    US-14.8's broadcast. Bounded by `Notification:MaxBroadcastRecipients`, and
                    truncation is logged rather than silent.
                  properties:
                    role:
                      type: string
                      description: Matched against the union of `iam.user_roles` (AL-06).
                data:
                  type: object
                  description: Template substitution values plus the client's data payload.
                  additionalProperties:
                    type: string
      responses:
        '202':
          description: Accepted for delivery.
          content:
            application/json:
              schema:
                type: object
                required: [dispatchId, accepted, suppressed, undeliverable]
                properties:
                  dispatchId:
                    $ref: './_shared.yaml#/components/schemas/Ulid'
                  accepted:
                    type: integer
                    format: int32
                    description: Recipients queued for delivery.
                  suppressed:
                    type: integer
                    format: int32
                    description: Refused by a preference (US-10.7) or a limit (P-12).
                  undeliverable:
                    type: integer
                    format: int32
                    description: Recipients with no account, no number and no device.
                  deliveries:
                    description: |
                      **Δ C052. Present only for a type with a latency SLO** — today `SOS_TRIGGERED`
                      alone, which is dispatched on this request rather than queued (D-33 budgets
                      five seconds from button tap). Absent for everything else.
                    type: array
                    items:
                      type: object
                      required: [notificationId, status, gateways]
                      properties:
                        notificationId:
                          $ref: './_shared.yaml#/components/schemas/Ulid'
                        status:
                          type: string
                          description: |
                            `Sent` when a transport took it. Anything else — `Pending` on a retry
                            schedule, `Failed`, `Suppressed` — is not a dispatch.
                        provider:
                          type: string
                          description: The transport that answered first.
                        gateways:
                          description: |
                            Every SMS gateway the message was handed to — two on a D-33 parallel
                            send, whether or not both answered. "Tried" and "delivered" are
                            different facts and safety-svc records one column for each.
                          type: array
                          items:
                            type: string
                        error:
                          type: string
        '400': { $ref: './_shared.yaml#/components/responses/BadRequest' }
        '401': { $ref: './_shared.yaml#/components/responses/Unauthorized' }
        '404': { $ref: './_shared.yaml#/components/responses/NotFound' }
        '500': { $ref: './_shared.yaml#/components/responses/InternalError' }
      x-error-codes: [validation-failed, unauthorized, not-found]

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
    mtls:
      $ref: './_shared.yaml#/components/securitySchemes/mtls'
